queue_rules:
  - name: main
    queue_conditions:
      - check-success = pr-flow/code-review
      - check-success = pr-flow/security-review
      - check-success = Kilo Code Review
      - check-success = pr-flow/kilo-review
      - check-success = CI / Lint (pull_request)
      - check-success = CI / Security Audit (pull_request)
    merge_conditions:
      - draft = false
merge_queue:
  max_parallel_checks: 1
scopes:
  source:
    files:
      workflows:
        include:
          - .github/actions/*
          - .github/actions/**/*
          - .github/workflows/*
          - .github/workflows/**/*
      other:
        include:
          - "*"
        exclude:
          - .github/actions/*
          - .github/actions/**/*
          - .github/workflows/*
          - .github/workflows/**/*
