name: Issue Triage
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to triage'
        required: true
        type: string

concurrency:
  group: maintenance-${{ github.event.issue.number || github.event.inputs.issue_number || github.sha }}
  cancel-in-progress: false

env:
  MAX_TURNS: 300
  NODE_VERSION: "22.x"
  DISABLE_TELEMETRY: "1"
  API_TIMEOUT_MS: "${{ vars.API_TIMEOUT_MS }}"
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "${{ vars.CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC }}"
  ANTHROPIC_DEFAULT_HAIKU_MODEL: "${{ vars.ANTHROPIC_DEFAULT_HAIKU_MODEL }}"
  ANTHROPIC_DEFAULT_SONNET_MODEL: "${{ vars.ANTHROPIC_DEFAULT_SONNET_MODEL }}"
  ANTHROPIC_DEFAULT_OPUS_MODEL: "${{ vars.ANTHROPIC_DEFAULT_OPUS_MODEL }}"
  CLAUDE_CODE_SUBAGENT_MODEL: "${{ vars.CLAUDE_CODE_SUBAGENT_MODEL }}"
  ANTHROPIC_BASE_URL: "${{ vars.ANTHROPIC_BASE_URL }}"

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      github.event_name == 'issues' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/triage')) ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      issues: write
      id-token: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve issue number
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ github.event.inputs.issue_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/setup-environment
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-gsd: "true"

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ZAI_API_KEY }}
          allowed_bots: "github-actions[bot]"
          track_progress: ${{ github.event_name != 'workflow_dispatch' }}
          claude_args: |
            --model ${{ vars.ANTHROPIC_DEFAULT_HAIKU_MODEL }}
            --max-turns ${{ env.MAX_TURNS }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(./.github/workflows/scripts/gh.sh:*),Bash(./.github/workflows/scripts/edit-issue-labels.sh:*),Bash(gh issue close:*)"
          prompt: |
            /gsd-inbox
            REPO: '${{ github.repository }}'
            ISSUE NUMBER: '${{ steps.resolve.outputs.number }}'
            TITLE: '${{ github.event.issue.title }}'
            BODY: '${{ github.event.issue.body }}'
            AUTHOR: '${{ github.event.issue.user.login }}'

            Triage this new issue:
            1. Classify as bug report, feature request, or question
            2. Assess priority (critical, high, medium, low)
            3. Assign appropriate labels
            4. Check for duplicates against existing issues

            Use ./.github/workflows/scripts/gh.sh to interact with GitHub:
            - `./.github/workflows/scripts/gh.sh issue view [number]` to view the issue
            - `./.github/workflows/scripts/gh.sh search issues "query"` to find similar issues
            - `./.github/workflows/scripts/gh.sh label list` to see available labels

            Add labels using:
            `./.github/workflows/scripts/edit-issue-labels.sh --add-label "label1" --add-label "label2"`
            (the issue number is read automatically from the workflow event)

            If duplicate:
            1. Post a comment: "Duplicate of #[original issue number]. Closing."
            2. Add label "duplicate": `./.github/workflows/scripts/edit-issue-labels.sh --add-label "duplicate"`
            3. Close the issue: `gh issue close ${{ steps.resolve.outputs.number }} --reason "not planned" --comment "Closing as duplicate of #[original issue number]"`

            TURN BUDGET: Max ${{ env.MAX_TURNS }} turns. Finish with a clear deliverable before the limit; if running low, stop exploring and post your best partial result.
          settings: |
            {
              "env": {
                "ANTHROPIC_API_KEY": "${{ secrets.ZAI_API_KEY }}",
                "ANTHROPIC_AUTH_TOKEN": "${{ secrets.ZAI_API_KEY }}"
              }
            }
