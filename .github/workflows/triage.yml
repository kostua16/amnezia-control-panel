name: Issue Triage
on:
  issues:
    types: [opened, reopened]

concurrency:
  group: maintenance-${{ github.event.issue.number || github.sha }}
  cancel-in-progress: true
  
env:
  MAX_TURNS: 105
  NODE_VERSION: "22.x"
  DISABLE_TELEMETRY: "1"
  API_TIMEOUT_MS: "${{ vars.API_TIMEOUT_MS }}"
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "${{ vars.CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC }}"
  ANTHROPIC_DEFAULT_HAIKU_MODEL: "${{ vars.ANTHROPIC_DEFAULT_HAIKU_MODEL }}"
  ANTHROPIC_DEFAULT_SONNET_MODEL: "${{ vars.ANTHROPIC_DEFAULT_SONNET_MODEL }}"
  ANTHROPIC_DEFAULT_OPUS_MODEL: "${{ vars.ANTHROPIC_DEFAULT_OPUS_MODEL }}"
  CLAUDE_CODE_SUBAGENT_MODEL: "${{ vars.CLAUDE_CODE_SUBAGENT_MODEL }}"
  ANTHROPIC_BASE_URL: "${{ vars.ANTHROPIC_BASE_URL }}"

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ZAI_API_KEY }}
          track_progress: true
          claude_args: |
            --model ${{ vars.ANTHROPIC_DEFAULT_SONNET_MODEL }}
            --max-turns ${{ env.MAX_TURNS }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(./.github/workflows/scripts/gh.sh:*),Bash(./.github/workflows/scripts/edit-issue-labels.sh:*)"
          prompt: |
            REPO: '${{ github.repository }}'
            ISSUE NUMBER: '${{ github.event.issue.number }}'
            TITLE: '${{ github.event.issue.title }}'
            BODY: '${{ github.event.issue.body }}'
            AUTHOR: '${{ github.event.issue.user.login }}'

            Analyze this new issue and:
            1. Determine if it's a bug report, feature request, or question
            2. Assess priority (critical, high, medium, low)
            3. Suggest appropriate labels
            4. Check if it duplicates existing issues

            Use ./.github/workflows/scripts/gh.sh to interact with GitHub:
            - `./.github/workflows/scripts/gh.sh issue view [number]` to view the issue
            - `./.github/workflows/scripts/gh.sh search issues "query"` to find similar issues
            - `./.github/workflows/scripts/gh.sh label list` to see available labels

            Based on your analysis, add the appropriate labels using:
            `./.github/workflows/scripts/edit-issue-labels.sh --add-label "label1" --add-label "label2"`
            (the issue number is read automatically from the workflow event)

            If it appears to be a duplicate, post a comment mentioning the original issue.
            Use GSD workflow for audit and review and investigation tasks.
          settings: |
            {
              "env": {
                "ANTHROPIC_API_KEY": "${{ secrets.ZAI_API_KEY }}",
                "ANTHROPIC_AUTH_TOKEN": "${{ secrets.ZAI_API_KEY }}"
              }
            }
