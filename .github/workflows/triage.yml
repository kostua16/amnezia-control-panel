name: Issue Triage
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to triage'
        required: true
        type: string

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: maintenance-${{ github.event.issue.number || github.event.inputs.issue_number || github.sha }}
  cancel-in-progress: false

env:
  MAX_TURNS: 40
  NODE_VERSION: '24.x'

jobs:
  triage:
    runs-on: [self-hosted, big]
    # Keep wall-clock headroom for the 40-turn budget; a tighter cap would
    # clip runs before the extra turns are usable.
    timeout-minutes: 15
    if: |
      github.event_name == 'issues' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/triage')) ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          node-version: ${{ env.NODE_VERSION }}
          install-gsd: 'true'
          install-rtk: 'true'

      - name: Resolve issue number
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ github.event.inputs.issue_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch issue details (dispatch)
        if: github.event_name == 'workflow_dispatch'
        id: issue_details
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ steps.resolve.outputs.number }}
        run: |
          gh api "repos/${{ github.repository }}/issues/$ISSUE_NUM" \
            --jq '{title: .title, body: .body, author: .user.login}' > /tmp/issue.json
          {
            DELIM="GHEOF-$(openssl rand -hex 8)"
            echo "title=$(jq -r .title /tmp/issue.json)"
            echo "body<<$DELIM"
            jq -r .body /tmp/issue.json
            echo "$DELIM"
            echo "author=$(jq -r .author /tmp/issue.json)"
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/run-zai
        with:
          allow-post-inline: 'true'
          api-key: ${{ secrets.ZAI_API_KEY }}
          model: 'haiku'
          max-turns: '${{ env.MAX_TURNS }}'
          track-progress: "${{ github.event_name != 'workflow_dispatch' }}"
          allowed-bots: 'github-actions[bot],kilo-code-bot'
          allowed-tools: 'mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(gh label:*),Bash(./.github/workflows/scripts/gh.sh:*),Bash(./.github/workflows/scripts/edit-issue-labels.sh:*),Bash(gh issue close:*),Bash(rtk:*)'
          additional-permissions: 'issues: write'
          prompt: |
            /gsd:inbox
            REPO: '${{ github.repository }}'
            ISSUE NUMBER: '${{ steps.resolve.outputs.number }}'
            TITLE: '${{ steps.issue_details.outputs.title || github.event.issue.title }}'
            BODY: '${{ steps.issue_details.outputs.body || github.event.issue.body }}'
            AUTHOR: '${{ steps.issue_details.outputs.author || github.event.issue.user.login }}'

            Triage this new issue:
            IMPORTANT SCOPE: This is a TRIAGE-ONLY task. DO NOT attempt to fix, resolve, or implement anything.
            DO NOT read source code files, DO NOT suggest code changes, DO NOT create pull requests.
            STOP after applying labels and posting the summary comment.

            1. Classify as bug report, feature request, or question
            2. Assess priority (critical, high, medium, low)
            3. Assign appropriate labels:
               - Apply EXACTLY ONE priority label matching your assessed priority
                 ("critical", "high", "medium", or "low"). A serious/high-severity
                 issue (e.g. CVSS High) MUST get the "high" label — do not leave
                 priority only in the summary comment.
               - For a dependency-vulnerability issue whose advisory reports
                 fixAvailable:false (no upstream fix released yet), ALSO add "backlog".
            4. Check for duplicates against existing issues
            5. Add the "triaged" label: ./.github/workflows/scripts/edit-issue-labels.sh --add-label "triaged"

            Use ./.github/workflows/scripts/gh.sh for READ-ONLY queries only:
            - `./.github/workflows/scripts/gh.sh issue view [number]` to view the issue
            - `./.github/workflows/scripts/gh.sh search issues "query"` to find similar issues
            - `./.github/workflows/scripts/gh.sh label list` to see available labels

            Add labels using:
            `./.github/workflows/scripts/edit-issue-labels.sh --add-label "label1" --add-label "label2"`
            (the issue number is read automatically from the workflow event)

            If duplicate:
            1. Post a comment: "Duplicate of #[original issue number]. Closing."
            2. Add label "duplicate": `./.github/workflows/scripts/edit-issue-labels.sh --add-label "duplicate"`
            3. Close the issue: `gh issue close ${{ steps.resolve.outputs.number }} --reason "not planned" --comment "Closing as duplicate of #[original issue number]"`

            After completing triage, post a summary comment on issue #${{ steps.resolve.outputs.number }}.
            Use this EXACT format — gh issue comment with a multi-line body:

              gh issue comment ${{ steps.resolve.outputs.number }} --body "## Triage Result
              - **Classification:** <bug/feature/question>
              - **Priority:** <critical/high/medium/low>
              - **Labels applied:** <comma-separated list of labels you added>
              - **Duplicates found:** <none, or #issue numbers>
              - **Notes:** <one sentence if relevant, or omit this line>"

            IMPORTANT: Only list labels YOU added. If a label was already on the issue, do NOT claim you applied it.
            This provides feedback since automated progress tracking is not available for workflow_dispatch triggers.

      - name: Ensure triaged label
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ steps.resolve.outputs.number }}
        run: |
          if gh api "repos/${{ github.repository }}/issues/$ISSUE_NUM/comments" \
             --jq '.[].body' | grep -q "Triage Result"; then
            gh issue edit "$ISSUE_NUM" --add-label "triaged"
            echo "Triaged label applied (triage comment found)"
          else
            echo "No triage summary comment found — skipping triaged label"
          fi

      - name: Close duplicate issues
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ISSUE_NUM: ${{ steps.resolve.outputs.number }}
        run: |
          LABELS=$(gh issue view "$ISSUE_NUM" --json labels --jq '.labels[].name')
          if echo "$LABELS" | grep -qx "duplicate"; then
            STATE=$(gh issue view "$ISSUE_NUM" --json state --jq '.state')
            if [ "$STATE" = "open" ]; then
              gh issue close "$ISSUE_NUM" --reason "not planned" \
                --comment "Closed as duplicate — confirmed by post-triage label check."
            fi
          fi
