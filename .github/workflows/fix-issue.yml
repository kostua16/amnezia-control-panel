name: Fix Issue

on:
  issue_comment:
    types: [created]
  issues:
    types: [labeled]

concurrency:
  group: fix-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24.x'
  MAX_TURNS: '60'

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  authorize:
    if: >-
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request == null &&
        contains(github.event.comment.body, '/fix')
      ) ||
      (
        github.event_name == 'issues' &&
        github.event.issue.pull_request == null &&
        github.event.label.name == 'auto-fix-approved'
      )
    runs-on: self-hosted
    timeout-minutes: 10
    outputs:
      should-run: ${{ steps.gate.outputs.should_run }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          node-version: ${{ env.NODE_VERSION }}

      - name: Evaluate fix trigger
        id: gate
        shell: bash
        run: |
          node .github/workflows/scripts/evaluate-trigger-policy.cjs \
            --mode fix-issue \
            --policy-file .github/workflows/policy.json \
            --event-path "$GITHUB_EVENT_PATH" \
            --event-name "$GITHUB_EVENT_NAME" \
            > /tmp/fix-trigger-policy.json
          echo "should_run=$(jq -r '.should_run' /tmp/fix-trigger-policy.json)" >> "$GITHUB_OUTPUT"

  fix:
    needs: [authorize]
    runs-on: [self-hosted, big]
    timeout-minutes: 10
    if: needs.authorize.outputs.should-run == 'true'
    outputs:
      claude_failed: ${{ steps.claude_run.outputs.claude_failed }}
      claude_failure_reason: ${{ steps.claude_run.outputs.claude_failure_reason }}
      claude_soft_success: ${{ steps.claude_run.outputs.claude_soft_success }}
      claude_soft_success_reason: ${{ steps.claude_run.outputs.claude_soft_success_reason }}
      claude_num_turns: ${{ steps.claude_run.outputs.claude_num_turns }}
      claude_is_error: ${{ steps.claude_run.outputs.claude_is_error }}
      claude_used_attempt: ${{ steps.claude_run.outputs.claude_used_attempt }}
      claude_metrics_json: ${{ steps.claude_run.outputs.claude_metrics_json }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1
          token: ${{ secrets.GH_PAT }}

      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GH_PAT }}
          node-version: ${{ env.NODE_VERSION }}
          install-deps: 'true'
          generate-prisma: 'true'
          install-gsd: 'true'
          install-rtk: 'true'
          install-uv: 'true'

      - name: Ensure labels exist
        uses: ./.github/actions/ensure-workflow-labels
        with:
          github-token: ${{ secrets.GH_PAT }}
          policy-file: .github/workflows/policy.json
          names: auto-fix-approved,auto-fix,fixed,canceled

      - name: Extract fix message
        id: extract
        env:
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
        run: |
          FIX_MSG=$(printf '%s' "$COMMENT_BODY" | sed -n 's|.*/fix[[:space:]]*||p' | head -1)
          echo "message=$FIX_MSG" >> "$GITHUB_OUTPUT"

      - name: Detect umbrella/tracking issue
        id: tracking
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: node .github/workflows/scripts/detect-tracking-issue.cjs >> "$GITHUB_OUTPUT"

      - name: Prepare fix branch
        id: branch
        uses: ./.github/actions/prepare-automation-branch
        with:
          branch-name: claude-fix-issue-${{ github.event.issue.number }}-${{ github.run_id }}
          github-token: ${{ secrets.GH_PAT }}

      - id: claude_run
        uses: ./.github/actions/run-zai
        with:
          api-key: ${{ secrets.ZAI_API_KEY }}
          github-token: ${{ secrets.GH_PAT }}
          max-turns: ${{ env.MAX_TURNS }}
          track-progress: 'true'
          allowed-bots: 'claude[bot],github-actions[bot]'
          allowed-tools: 'Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(ls:*),Bash(cat:*),Bash(grep:*),Bash(find:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(rtk git status:*),Bash(rtk git diff:*),Bash(rtk git log:*),Bash(rtk npm:*),Bash(rtk npx:*),Bash(rtk node:*),Bash(rtk ls:*),Bash(rtk grep:*),Bash(rtk find:*),mcp__plugin_serena_serena__find_symbol,mcp__plugin_serena_serena__get_symbols_overview,mcp__plugin_serena_serena__find_referencing_symbols,mcp__plugin_serena_serena__find_implementations,mcp__plugin_serena_serena__find_declaration,mcp__plugin_serena_serena__search_for_pattern,mcp__plugin_serena_serena__find_file,mcp__plugin_serena_serena__list_dir,mcp__plugin_serena_serena__read_file,mcp__plugin_serena_serena__get_diagnostics_for_file,mcp__plugin_context7_context7__query-docs,mcp__plugin_context7_context7__resolve-library-id,mcp__plugin_typescript-lsp__*'
          plugin-marketplaces: |-
            https://github.com/anthropics/claude-plugins-official.git
            https://github.com/juliusbrussee/caveman.git
          plugins: |-
            typescript-lsp@claude-plugins-official
            serena@claude-plugins-official
            context7@claude-plugins-official
            code-review@claude-plugins-official
            security-guidance@claude-plugins-official
            code-simplifier@claude-plugins-official
            frontend-design@claude-plugins-official
            superpowers@claude-plugins-official
            caveman@caveman
          prompt: |
            /gsd:debug
            Fix the following GitHub issue.

            ISSUE NUMBER: #${{ github.event.issue.number }}
            ISSUE TITLE: ${{ github.event.issue.title }}
            FIX INSTRUCTION: ${{ steps.extract.outputs.message || 'Analyze the issue and implement the appropriate fix based on the description and comments.' }}

            Steps:
            1. Run `gh issue view ${{ github.event.issue.number }}` to read full issue description
            2. Run `gh issue view ${{ github.event.issue.number }} --comments` to read the conversation
            3. Identify the SINGLE root cause that explains the failure — ignore symptoms and downstream errors
            4. Implement a minimal, targeted fix for that ONE root cause only
            5. Run: npm run lint && npx tsc --noEmit
            6. If lint/types fail, fix ONLY the errors you introduced — do not expand scope

            BASH CONSTRAINTS:
            - Avoid bash brace expansion (e.g., `{a,b,c}`) and glob patterns in for loops — the sandbox blocks them.
            - Use the Glob tool or `find` with `-name` flags instead.

            STRICT SCOPE RULES:
            - Do NOT commit or push — the workflow handles that
            - Do NOT fix multiple unrelated issues in one run — one root cause per PR
            - Do NOT refactor, reformat, or touch files unrelated to the root cause
            - If the issue mentions 5 errors, find the ONE underlying cause that produces all of them
            - If the fix is not clear after reading the issue, post a comment explaining what's needed and stop
            - Stop after 60 turns even if incomplete — partial fixes are better than timeouts

            AFTER FIXING:
            - Post a comment on the issue listing any remaining/unresolved issues from the original report
            - Format: "## Fixed\n- [what was fixed]\n## Remaining\n- [unresolved items from the issue]"
            Operate as the `kos-fix-issue` agent: first read `.claude/agents/kos-fix-issue.md` and follow it as your operating contract (it enforces this prompt's rules and adds run-mined failure knowledge), then perform the task.

      - name: Fail on Claude soft failure
        if: always() && steps.claude_run.outputs.claude_failed == 'true'
        run: |
          echo "::error::Claude soft failure: ${{ steps.claude_run.outputs.claude_failure_reason }}"
          exit 1

      - name: Restore composite action files (Claude agent may alter working tree)
        if: steps.claude_run.outputs.claude_changed_files_list != ''
        run: git checkout HEAD -- .github/actions/

      - name: Validate (CI-matching gate)
        id: gate
        if: steps.claude_run.outputs.claude_changed_files_list != ''
        uses: ./.github/actions/validate-pr-gate

      - uses: ./.github/actions/commit-and-push
        id: push
        if: steps.gate.outputs.gate_passed == 'true'
        with:
          branch-name: ${{ steps.branch.outputs.branch_name }}
          # Tracking issues must not receive commit-message closing keywords:
          # merge/rebase merges land the message on main and GitHub would
          # close the whole umbrella for a partial fix.
          commit-message: "${{ steps.tracking.outputs.is_tracking == 'true' && format('fix: partial progress on #{0}', github.event.issue.number) || format('fix: resolve #{0}', github.event.issue.number) }}"
          github-token: ${{ secrets.GH_PAT }}

      - name: Build fix PR body
        if: steps.push.outputs.pushed == 'true'
        id: pr-body
        uses: ./.github/actions/build-automation-pr-body
        with:
          workflow-name: fix-issue
          problem: 'Fix requested for issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}'
          source-issue-url: ${{ github.event.issue.html_url }}
          base-ref: main
          changed-files: ${{ steps.claude_run.outputs.claude_changed_files_list }}
          evidence: |
            Issue title: ${{ github.event.issue.title }}
            Fix instruction: ${{ steps.extract.outputs.message || 'Analyze the issue and implement the appropriate fix based on the description and comments.' }}
            Claude soft success: ${{ steps.claude_run.outputs.claude_soft_success || 'false' }}
            Claude soft success reason: ${{ steps.claude_run.outputs.claude_soft_success_reason || '' }}
          execution-file: ${{ steps.claude_run.outputs.last_execution_file }}
          structured-output: ${{ steps.claude_run.outputs.structured_output }}
          claude-last-output: ${{ steps.claude_run.outputs.claude_last_output }}
          # Umbrella/tracking issues get a non-closing "Part of #N" reference:
          # a partial fix must never auto-close the whole backlog on merge.
          closing-issues: "${{ steps.tracking.outputs.is_tracking != 'true' && github.event.issue.number || '' }}"
          related-issues: "${{ steps.tracking.outputs.is_tracking == 'true' && github.event.issue.number || '' }}"
          review-notes: 'Created from a maintainer-approved fix trigger. Review the diff against the issue description and conversation before merging.'

      - name: Create fix PR
        if: steps.push.outputs.pushed == 'true'
        id: create_pr
        uses: ./.github/actions/upsert-pull-request
        env:
          ISSUE_NUM: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        with:
          github-token: ${{ secrets.GH_PAT }}
          base: main
          branch-name: ${{ steps.branch.outputs.branch_name }}
          # "resolve #N" in a PR title becomes a closing keyword in the squash
          # commit on main — tracking issues get a non-closing "partial" title.
          title: "${{ steps.tracking.outputs.is_tracking == 'true' && format('fix: partial #{0} - {1}', github.event.issue.number, github.event.issue.title) || format('fix: resolve #{0} - {1}', github.event.issue.number, github.event.issue.title) }}"
          body: ${{ steps.pr-body.outputs.body }}
          labels: auto-fix
          draft: 'false'
          allow-update: 'true'
          require-rich-body: 'true'

      - name: Label issue as fixed
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          PR_URL: ${{ steps.create_pr.outputs.pr_url }}
          IS_TRACKING: ${{ steps.tracking.outputs.is_tracking }}
        run: |
          if [ "$IS_TRACKING" = "true" ]; then
            # Umbrella/tracking issue: a PR covers only some of its items, so
            # the issue is not "fixed" and must stay open after the PR merges.
            gh issue comment "$ISSUE_NUM" --body "Partial fix PR created: ${PR_URL} — this umbrella tracking issue stays open. Check off the completed items in the checklist once the PR merges."
          else
            gh issue edit "$ISSUE_NUM" --add-label "fixed"
            gh issue comment "$ISSUE_NUM" --body "Fix PR created: ${PR_URL}"
          fi

      - name: Comment on issue if no changes
        if: steps.push.outputs.pushed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          IS_TRACKING: ${{ steps.tracking.outputs.is_tracking }}
        run: |
          if [ "$IS_TRACKING" = "true" ]; then
            # No `canceled` label here: the catch-up workflow auto-closes
            # canceled issues, which must never happen to an umbrella tracker.
            gh issue comment "$ISSUE_NUM" \
              --body "The auto-fix workflow does not act on umbrella/tracking issues directly, so no changes were made and the issue stays open. Spin off a dedicated issue for a single backlog item (see the issue body) and run /fix there."
          else
            gh issue edit "$ISSUE_NUM" --add-label "canceled"
            gh issue comment "$ISSUE_NUM" \
              --body "The auto-fix workflow ran but could not produce code changes. Manual investigation may be needed."
          fi

  report-failure:
    needs: [fix]
    if: failure()
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          node-version: ${{ env.NODE_VERSION }}

      - uses: ./.github/actions/report-failure
        with:
          mode: 'comment'
          issue-number: ${{ github.event.issue.number }}
          auto-fix-run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          claude-step-outcome: ${{ needs.fix.result }}
          claude-turns: ${{ needs.fix.outputs.claude_num_turns }}
          claude-is-error: ${{ needs.fix.outputs.claude_is_error }}
          claude-used-attempt: ${{ needs.fix.outputs.claude_used_attempt }}
          claude-failure-reason: ${{ needs.fix.outputs.claude_failure_reason }}
          claude-metrics-json: ${{ needs.fix.outputs.claude_metrics_json }}
