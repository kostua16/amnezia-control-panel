name: Fix Issue

on:
  issue_comment:
    types: [created]
  issues:
    types: [labeled]

concurrency:
  group: fix-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22.x"
  MAX_TURNS: "100"

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.gate.outputs.should_run }}
    steps:
      - uses: actions/checkout@v5

      - name: Evaluate fix trigger
        id: gate
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const policy = JSON.parse(fs.readFileSync('.github/workflows/policy.json', 'utf8'));
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const eventName = process.env.GITHUB_EVENT_NAME;

          const isOpenIssue = event.issue?.state !== 'closed' && !event.issue?.pull_request;
          const commentAssociation = event.comment?.author_association ?? '';
          const commentBody = event.comment?.body ?? '';
          const labelName = event.label?.name ?? '';

          const maintainerTriggeredFix =
            eventName === 'issue_comment' &&
            isOpenIssue &&
            commentBody.includes('/fix') &&
            policy.maintainerAssociations.includes(commentAssociation);

          const labelTriggeredFix =
            eventName === 'issues' &&
            isOpenIssue &&
            labelName === policy.fixApprovalLabel;

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `should_run=${maintainerTriggeredFix || labelTriggeredFix}\n`
          );
          NODE

  fix:
    needs: [authorize]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: needs.authorize.outputs.should-run == 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          token: ${{ secrets.GH_PAT }}

      - name: Setup git identity
        run: |
          git config --global user.email "claude[bot]@users.noreply.github.com"
          git config --global user.name "claude[bot]"

      - name: Ensure labels exist
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          node .github/workflows/scripts/ensure-workflow-labels.cjs --policy-file .github/workflows/policy.json --names auto-fix-approved
          for label in fixed canceled; do
            gh label create "$label" --color 0e8a16 --description "Issue resolved by auto-fix" --force 2>/dev/null || true
          done

      - name: Extract fix message
        id: extract
        env:
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
        run: |
          FIX_MSG=$(printf '%s' "$COMMENT_BODY" | sed -n 's|.*/fix[[:space:]]*||p' | head -1)
          echo "message=$FIX_MSG" >> "$GITHUB_OUTPUT"

      - name: Create fix branch
        id: branch
        env:
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          BRANCH_NAME="claude-fix-issue-${ISSUE_NUM}-$(date +%s)"
          git checkout -b "$BRANCH_NAME"
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-environment
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-deps: "true"
          generate-prisma: "true"
          install-gsd: "true"
          install-rtk: "true"

      - uses: ./.github/actions/run-zai
        with:
          api-key: ${{ secrets.ZAI_API_KEY }}
          max-turns: ${{ env.MAX_TURNS }}
          track-progress: "true"
          allowed-bots: "claude[bot],github-actions[bot]"
          allowed-tools: "Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(git:*),Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(ls:*),Bash(cat:*),Bash(grep:*),Bash(find:*),Bash(gh issue view:*),Bash(gh issue list:*)"
          prompt: |
            /gsd-debug
            Fix the following GitHub issue.

            ISSUE NUMBER: #${{ github.event.issue.number }}
            ISSUE TITLE: ${{ github.event.issue.title }}
            FIX INSTRUCTION: ${{ steps.extract.outputs.message || 'Analyze the issue and implement the appropriate fix based on the description and comments.' }}

            Steps:
            1. Run `gh issue view ${{ github.event.issue.number }}` to read full issue description
            2. Run `gh issue view ${{ github.event.issue.number }} --comments` to read the conversation
            3. Identify the SINGLE root cause that explains the failure — ignore symptoms and downstream errors
            4. Implement a minimal, targeted fix for that ONE root cause only
            5. Run: npm run lint && npx tsc --noEmit
            6. If lint/types fail, fix ONLY the errors you introduced — do not expand scope

            STRICT SCOPE RULES:
            - Do NOT commit or push — the workflow handles that
            - Do NOT fix multiple unrelated issues in one run — one root cause per PR
            - Do NOT refactor, reformat, or touch files unrelated to the root cause
            - If the issue mentions 5 errors, find the ONE underlying cause that produces all of them
            - If the fix is not clear after reading the issue, post a comment explaining what's needed and stop
            - Stop after 60 turns even if incomplete — partial fixes are better than timeouts

            AFTER FIXING:
            - Post a comment on the issue listing any remaining/unresolved issues from the original report
            - Format: "## Fixed\n- [what was fixed]\n## Remaining\n- [unresolved items from the issue]"

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet HEAD; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/commit-and-push
        if: steps.changes.outputs.has_changes == 'true'
        with:
          branch-name: ${{ steps.branch.outputs.branch_name }}
          commit-message: "fix: resolve #${{ github.event.issue.number }}"
          token: ${{ secrets.GH_PAT }}

      - name: Create fix PR
        if: steps.changes.outputs.has_changes == 'true'
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          BRANCH_NAME: ${{ steps.branch.outputs.branch_name }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          FIX_MSG: ${{ steps.extract.outputs.message }}
        run: |
          BODY=$(printf 'Fixes #%s\n\n**Issue:** %s\n**Fix instruction:** %s\n\n---\n*Auto-generated by fix-issue workflow from a maintainer-approved fix trigger.*' \
            "$ISSUE_NUM" "$ISSUE_TITLE" "$FIX_MSG")
          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "fix: resolve #${ISSUE_NUM} - ${ISSUE_TITLE}" \
            --body "$BODY" \
            --label "auto-fix" 2>/dev/null || \
          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "fix: resolve #${ISSUE_NUM} - ${ISSUE_TITLE}" \
            --body "$BODY")
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Label issue as fixed
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          PR_URL: ${{ steps.create_pr.outputs.pr_url }}
        run: |
          gh issue edit "$ISSUE_NUM" --add-label "fixed"
          gh issue comment "$ISSUE_NUM" --body "Fix PR created: ${PR_URL}"

      - name: Comment on issue if no changes
        if: steps.changes.outputs.has_changes == 'false'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE_NUM" --add-label "canceled"
          gh issue comment "$ISSUE_NUM" \
            --body "The auto-fix workflow ran but could not produce code changes. Manual investigation may be needed."

  report-failure:
    needs: [fix]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/report-failure
        with:
          mode: "comment"
          issue-number: ${{ github.event.issue.number }}
          auto-fix-run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
