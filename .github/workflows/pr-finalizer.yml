name: PR Finalizer

run-name: "PR #${{ github.event.inputs.pr_number || 'manual' }} @ ${{ github.event.inputs.head_sha || github.sha }}"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to evaluate'
        required: true
        type: string
      head_sha:
        description: 'Expected pull request head SHA'
        required: false
        type: string
      base_ref:
        description: 'Expected pull request base ref'
        required: false
        type: string
      orchestrated:
        description: 'Whether this run was dispatched by PR Orchestrator'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Evaluate without approving, merging, or commenting'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  checks: read
  pull-requests: write
  issues: write
  actions: write
  statuses: write

concurrency:
  group: pr-finalizer-${{ github.event.pull_request.number || github.event.inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  finalize:
    if: |
      github.event_name != 'workflow_run' ||
      toJSON(github.event.workflow_run.pull_requests) != '[]'
    runs-on: self-hosted
    timeout-minutes: 15
    outputs:
      decision: ${{ steps.decision.outputs.decision }}
      apply_status: ${{ steps.apply.outputs.status || 'not_attempted' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure workflow labels exist
        uses: ./.github/actions/ensure-workflow-labels
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          policy-file: .github/workflows/policy.json

      - name: Resolve PR context
        id: resolve
        run: |
          node .github/workflows/scripts/resolve-pr-context.cjs \
            --event-name "${GITHUB_EVENT_NAME}" \
            --event-path "${GITHUB_EVENT_PATH}" \
            --pr-number "${{ github.event.inputs.pr_number || '' }}" \
            > /tmp/pr-context.json
          echo "pr_number=$(jq -r '.pullRequests[0].number // empty' /tmp/pr-context.json)" >> "$GITHUB_OUTPUT"

      - name: Fetch PR metadata
        if: steps.resolve.outputs.pr_number != ''
        id: metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
        run: |
          gh pr view "$PR_NUMBER" \
            --json number,title,url,state,mergedAt,isDraft,headRefName,headRefOid,baseRefName,author,labels,files,isCrossRepository \
            > /tmp/pr.json
          expected_head_sha="${{ github.event.inputs.head_sha || '' }}"
          actual_head_sha=$(jq -r '.headRefOid // ""' /tmp/pr.json)
          pr_state=$(jq -r '.state // ""' /tmp/pr.json)
          merged_at=$(jq -r '.mergedAt // ""' /tmp/pr.json)
          if { [ -n "$expected_head_sha" ] && [ "$expected_head_sha" != "$actual_head_sha" ]; } || { [ "$pr_state" != "OPEN" ] || [ -n "$merged_at" ]; }; then
            {
              echo "head_ref="
              echo "same_repo=false"
              echo "decision_ready=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node .github/workflows/scripts/evaluate-pr-policy.cjs \
            --policy-file .github/workflows/policy.json \
            --pr-file /tmp/pr.json \
            > /tmp/policy-eval.json
          node .github/workflows/scripts/evaluate-pr-finalizer-decision.cjs \
            --config-file .github/pr-flow.json \
            --policy-file /tmp/policy-eval.json \
            --pr-file /tmp/pr.json \
            --event-name "${GITHUB_EVENT_NAME}" \
            --event-path "${GITHUB_EVENT_PATH}" \
            --dry-run "${{ github.event.inputs.dry_run || 'false' }}" \
            > /tmp/finalizer-decision.json
          {
            echo "head_ref=$(jq -r '.head_ref_name' /tmp/policy-eval.json)"
            echo "same_repo=$(jq -r '.same_repo' /tmp/policy-eval.json)"
            echo "decision_ready=true"
          } >> "$GITHUB_OUTPUT"

      - name: Evaluate finalizer decision
        if: steps.resolve.outputs.pr_number != '' && steps.metadata.outputs.decision_ready == 'true'
        id: decision
        run: |
          {
            echo "decision=$(jq -r '.decision' /tmp/finalizer-decision.json)"
            DELIM="EOF-$(openssl rand -hex 8)"
            echo "summary<<$DELIM"
            jq -r '.summary' /tmp/finalizer-decision.json
            echo "$DELIM"
            echo "dry_run=$(jq -r '.dry_run' /tmp/finalizer-decision.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Approve and enable auto-merge
        id: apply
        if: steps.decision.outputs.decision == 'approve_and_enable_automerge' && steps.decision.outputs.dry_run != 'true' && steps.metadata.outputs.same_repo == 'true' && steps.metadata.outputs.head_ref != '' && steps.metadata.outputs.decision_ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
        run: |
          set +e

          approve_output=$(gh pr review "$PR_NUMBER" --approve --body "PR finalizer: required validation and review signals passed." 2>&1)
          approve_exit=$?

          merge_output=$(gh pr merge "$PR_NUMBER" --auto --squash 2>&1)
          merge_exit=$?

          status="success"
          details="Approval submitted and auto-merge enabled."

          if [ "$approve_exit" -ne 0 ] || [ "$merge_exit" -ne 0 ]; then
            status="failed"
            details_parts=()
            if [ "$approve_exit" -ne 0 ]; then
              details_parts+=("approve failed: $(printf '%s' "$approve_output" | tail -1)")
            fi
            if [ "$merge_exit" -ne 0 ]; then
              details_parts+=("auto-merge failed: $(printf '%s' "$merge_output" | tail -1)")
            fi
            details=$(printf '%s; ' "${details_parts[@]}")
            details=${details%; }
          fi

          {
            echo "status=$status"
            DELIM="EOF-$(openssl rand -hex 8)"
            echo "details<<$DELIM"
            printf '%s\n' "$details"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Upsert finalizer status comment
        if: steps.resolve.outputs.pr_number != '' && steps.metadata.outputs.decision_ready == 'true' && steps.decision.outputs.dry_run != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          DECISION: ${{ steps.decision.outputs.decision }}
          SUMMARY: ${{ steps.decision.outputs.summary }}
          APPLY_STATUS: ${{ steps.apply.outputs.status }}
          APPLY_DETAILS: ${{ steps.apply.outputs.details }}
        with:
          script: |
            const issueNumber = Number(process.env.PR_NUMBER);
            const decision = process.env.DECISION;
            const summary = process.env.SUMMARY;
            const applyStatus = process.env.APPLY_STATUS || 'not_requested';
            const applyDetails = process.env.APPLY_DETAILS || '';
            const marker = '<!-- pr-finalizer -->';
            const replaceExistingComment = true;
            const lines = [
              marker,
              '## PR Finalizer',
              '',
              `- Status: **${decision}**`,
              `- Summary: ${summary}`
            ];

            if (decision === 'approve_and_enable_automerge') {
              lines.push(`- Apply result: **${applyStatus}**`);
              if (applyDetails) {
                lines.push(`- Apply details: ${applyDetails}`);
              }
            }

            const body = lines.join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100
            });

            const existing = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker)
            );

            if (!replaceExistingComment && existing?.body === body) {
              core.info('Finalizer comment already up to date.');
              return;
            }

            if (existing) {
              if (replaceExistingComment) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id
                });
              } else {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body
                });
                return;
              }
            }

            await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body
              });

      - name: Fail on finalizer apply error
        if: steps.apply.outputs.status == 'failed'
        run: |
          echo "::error::PR finalizer could not complete approval or auto-merge. See finalizer status comment for details."
          exit 1

  wake-orchestrator:
    needs: [finalize]
    if: >-
      always() &&
      github.event.inputs.orchestrated == 'true' &&
      github.event.inputs.pr_number != '' &&
      needs.finalize.outputs.decision == 'approve_and_enable_automerge' &&
      needs.finalize.outputs.apply_status == 'success'
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wake PR Orchestrator
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
        run: |
          gh workflow run pr-flow.yml \
            --ref main \
            -f pr_number="$PR_NUMBER" \
            -f dry_run=false
