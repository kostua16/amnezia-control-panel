name: PR Finalizer

on:
  workflow_run:
    workflows: ['CI', 'Code Review', 'Dependency Review']
    types: [completed]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to evaluate'
        required: true
        type: string
      dry_run:
        description: 'Evaluate without approving, merging, or commenting'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-finalizer-${{ github.event.workflow_run.id || github.event.pull_request.number || github.event.inputs.pr_number || github.sha }}
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure workflow labels exist
        uses: ./.github/actions/ensure-workflow-labels
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          policy-file: .github/workflows/policy.json

      - name: Resolve PR context
        id: resolve
        run: |
          node .github/workflows/scripts/resolve-pr-context.cjs \
            --event-name "${GITHUB_EVENT_NAME}" \
            --event-path "${GITHUB_EVENT_PATH}" \
            --pr-number "${{ github.event.inputs.pr_number || '' }}" \
            > /tmp/pr-context.json
          echo "pr_number=$(jq -r '.pullRequests[0].number // empty' /tmp/pr-context.json)" >> "$GITHUB_OUTPUT"

      - name: Fetch PR metadata
        if: steps.resolve.outputs.pr_number != ''
        id: metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
        run: |
          gh pr view "$PR_NUMBER" \
            --json number,title,url,isDraft,headRefName,baseRefName,author,labels,files,isCrossRepository \
            > /tmp/pr.json
          node .github/workflows/scripts/evaluate-pr-policy.cjs \
            --policy-file .github/workflows/policy.json \
            --pr-file /tmp/pr.json \
            > /tmp/policy-eval.json
          gh pr checks "$PR_NUMBER" --required --json name,state,bucket,link,workflow 2>/dev/null > /tmp/pr-checks.json || echo "[]" > /tmp/pr-checks.json
          {
            echo "head_ref=$(jq -r '.head_ref_name' /tmp/policy-eval.json)"
            echo "same_repo=$(jq -r '.same_repo' /tmp/policy-eval.json)"
            echo "decision_ready=true"
          } >> "$GITHUB_OUTPUT"

      - name: Evaluate finalizer decision
        if: steps.resolve.outputs.pr_number != ''
        id: decision
        env:
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          policy_eligible=$(jq -r '.eligible' /tmp/policy-eval.json)
          manual_only=$(jq -r '.manual_only' /tmp/policy-eval.json)
          blocked_reason=$(jq -r '.blocked_reason // ""' /tmp/policy-eval.json)
          same_repo=$(jq -r '.same_repo' /tmp/policy-eval.json)
          head_ref=$(jq -r '.head_ref_name // ""' /tmp/policy-eval.json)
          is_draft=$(jq -r '.is_draft' /tmp/policy-eval.json)
          mapfile -t required_labels_arr < <(jq -r '.required_pass_labels[]?' /tmp/policy-eval.json)
          mapfile -t present_labels_arr < <(jq -r '.labels[]?' /tmp/policy-eval.json)
          mapfile -t blocking_labels_arr < <(jq -r '.blocking_labels_present[]?' /tmp/policy-eval.json)

          join_labels() {
            local IFS=', '
            printf '%s' "$*"
          }

          missing_labels_arr=()
          for required_label in "${required_labels_arr[@]}"; do
            label_present="false"
            for present_label in "${present_labels_arr[@]}"; do
              if [ "$present_label" = "$required_label" ]; then
                label_present="true"
                break
              fi
            done
            if [ "$label_present" != "true" ]; then
              missing_labels_arr+=("$required_label")
            fi
          done

          failing_required=$(jq '[.[] | select(((.bucket // "") | ascii_downcase) == "fail" or ((.bucket // "") | ascii_downcase) == "cancel")] | length' /tmp/pr-checks.json)
          pending_required=$(jq '[.[] | select(((.bucket // "") | ascii_downcase) == "pending")] | length' /tmp/pr-checks.json)
          total_checks=$(jq 'length' /tmp/pr-checks.json)

          decision="manual_only"
          summary="PR does not match the trusted auto-finalization policy."

          if [ "$is_draft" = "true" ]; then
            decision="awaiting_checks"
            summary="PR is still draft."
          elif [ "${#blocking_labels_arr[@]}" -gt 0 ]; then
            decision="blocked"
            summary="Blocking labels are present: $(join_labels "${blocking_labels_arr[@]}")"
          elif [ -z "$head_ref" ]; then
            decision="blocked"
            summary="PR metadata is incomplete; skipping auto-finalization."
          elif [ "$manual_only" = "true" ]; then
            decision="manual_only"
            summary="${blocked_reason:-PR is manual-only by policy.}"
          elif [ "$same_repo" != "true" ] || [ "$policy_eligible" != "true" ]; then
            decision="manual_only"
            summary="${blocked_reason:-PR is outside the same-repo trusted scope.}"
          elif [ "${#missing_labels_arr[@]}" -gt 0 ]; then
            decision="awaiting_checks"
            summary="Waiting on review signals: $(join_labels "${missing_labels_arr[@]}")"
          elif [ "$failing_required" -gt 0 ]; then
            decision="blocked"
            summary="Required checks are failing."
          elif [ "$pending_required" -gt 0 ] || [ "$total_checks" -eq 0 ]; then
            decision="awaiting_checks"
            summary="Waiting for required checks to finish."
          else
            decision="approve_and_enable_automerge"
            summary="Trusted PR passed required checks and review signals."
          fi

          {
            echo "decision=$decision"
            DELIM="EOF-$(openssl rand -hex 8)"
            echo "summary<<$DELIM"
            printf '%s\n' "$summary"
            echo "$DELIM"
            echo "dry_run=${DRY_RUN}"
          } >> "$GITHUB_OUTPUT"

      - name: Approve and enable auto-merge
        id: apply
        if: steps.decision.outputs.decision == 'approve_and_enable_automerge' && steps.decision.outputs.dry_run != 'true' && steps.metadata.outputs.same_repo == 'true' && steps.metadata.outputs.head_ref != '' && steps.metadata.outputs.decision_ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
        run: |
          set +e

          approve_output=$(gh pr review "$PR_NUMBER" --approve --body "PR finalizer: required validation and review signals passed." 2>&1)
          approve_exit=$?

          merge_output=$(gh pr merge "$PR_NUMBER" --auto --squash 2>&1)
          merge_exit=$?

          status="success"
          details="Approval submitted and auto-merge enabled."

          if [ "$approve_exit" -ne 0 ] || [ "$merge_exit" -ne 0 ]; then
            status="failed"
            details_parts=()
            if [ "$approve_exit" -ne 0 ]; then
              details_parts+=("approve failed: $(printf '%s' "$approve_output" | tail -1)")
            fi
            if [ "$merge_exit" -ne 0 ]; then
              details_parts+=("auto-merge failed: $(printf '%s' "$merge_output" | tail -1)")
            fi
            details=$(printf '%s; ' "${details_parts[@]}")
            details=${details%; }
          fi

          {
            echo "status=$status"
            DELIM="EOF-$(openssl rand -hex 8)"
            echo "details<<$DELIM"
            printf '%s\n' "$details"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Upsert finalizer status comment
        if: steps.resolve.outputs.pr_number != '' && steps.decision.outputs.dry_run != 'true'
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          DECISION: ${{ steps.decision.outputs.decision }}
          SUMMARY: ${{ steps.decision.outputs.summary }}
          APPLY_STATUS: ${{ steps.apply.outputs.status }}
          APPLY_DETAILS: ${{ steps.apply.outputs.details }}
        with:
          script: |
            const issueNumber = Number(process.env.PR_NUMBER);
            const decision = process.env.DECISION;
            const summary = process.env.SUMMARY;
            const applyStatus = process.env.APPLY_STATUS || 'not_requested';
            const applyDetails = process.env.APPLY_DETAILS || '';
            const marker = '<!-- pr-finalizer -->';
            const lines = [
              marker,
              '## PR Finalizer',
              '',
              `- Status: **${decision}**`,
              `- Summary: ${summary}`
            ];

            if (decision === 'approve_and_enable_automerge') {
              lines.push(`- Apply result: **${applyStatus}**`);
              if (applyDetails) {
                lines.push(`- Apply details: ${applyDetails}`);
              }
            }

            const body = lines.join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100
            });

            const existing = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker)
            );

            if (existing?.body === body) {
              core.info('Finalizer comment already up to date.');
              return;
            }

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body
              });
            }

      - name: Fail on finalizer apply error
        if: steps.apply.outputs.status == 'failed'
        run: |
          echo "::error::PR finalizer could not complete approval or auto-merge. See finalizer status comment for details."
          exit 1
