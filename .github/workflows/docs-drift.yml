name: Documentation Drift Checker

on:
  schedule:
    - cron: "0 3 * * 0" # Weekly on Sundays at 03:00
  workflow_dispatch:

concurrency:
  group: docs-drift-${{ github.sha }}
  cancel-in-progress: false

env:
  MAX_TURNS: 100
  NODE_VERSION: "22.x"

permissions:
  contents: write
  pull-requests: write

jobs:
  docs-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Setup git identity
        run: |
          git config --global user.email "claude[bot]@users.noreply.github.com"
          git config --global user.name "claude[bot]"

      - name: Create docs drift branch
        id: branch
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          BRANCH_NAME="claude-workflow-optimize-docs-drift-${RUN_ID}"
          git checkout -b "$BRANCH_NAME"
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-environment
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-gsd: "true"
          install-rtk: "true"

      - name: Update docs to match implementation
        uses: ./.github/actions/run-zai
        with:
          api-key: ${{ secrets.ZAI_API_KEY }}
          max-turns: "${{ env.MAX_TURNS }}"
          track-progress: "true"
          allowed-bots: "claude[bot],github-actions[bot]"
          allowed-tools: "Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(ls *),Bash(cat *),Bash(grep *),Bash(find *),Bash(head *),Bash(tail *),Bash(sort *),Bash(wc *)"
          prompt: |
            /gsd-docs-update
            Review the codebase against `.planning/` artifacts and standard documentation files.
            Identify any documentation drift between implementation and docs, then update only documentation files to reflect reality.

            Allowed edit scope:
            - `README.md`
            - `docs/**`
            - `.planning/**`
            - `.github/workflows/documentation.md`

            Hard rules:
            - Do NOT edit application source code, tests, package manifests, or workflow logic files other than `.github/workflows/documentation.md`.
            - Do NOT run `git` or `gh`.
            - Do NOT commit, push, merge, or open a PR. The workflow handles that.
            - If there is no meaningful drift, make no file changes.

      - name: Check for documentation changes
        id: changes
        run: |
          if git diff --quiet HEAD; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/commit-and-push
        id: push
        if: steps.changes.outputs.has_changes == 'true'
        with:
          branch-name: ${{ steps.branch.outputs.branch_name }}
          commit-message: "docs: reconcile documentation drift"
          token: ${{ secrets.GH_PAT }}

      - name: Create docs drift PR
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          BRANCH_NAME: ${{ steps.branch.outputs.branch_name }}
        run: |
          BODY=$(cat <<'EOF'
          Automated documentation drift reconciliation.

          This PR was created by the docs-drift workflow and is intentionally manual-only under repository policy.
          EOF
          )
          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "docs: reconcile documentation drift" \
            --body "$BODY" \
            --draft
