name: Documentation Drift Checker

on:
  schedule:
    - cron: '29 3 * * 0' # Weekly on Sundays at 03:29 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  MAX_TURNS: 100
  NODE_VERSION: '22.x'

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  docs-drift:
    runs-on: [self-hosted, big]
    timeout-minutes: 10
    outputs:
      claude_failed: ${{ steps.claude_run.outputs.claude_failed }}
      claude_failure_reason: ${{ steps.claude_run.outputs.claude_failure_reason }}
      claude_num_turns: ${{ steps.claude_run.outputs.claude_num_turns }}
      claude_is_error: ${{ steps.claude_run.outputs.claude_is_error }}
      claude_used_attempt: ${{ steps.claude_run.outputs.claude_used_attempt }}
      claude_metrics_json: ${{ steps.claude_run.outputs.claude_metrics_json }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GH_PAT }}
          node-version: ${{ env.NODE_VERSION }}
          install-gsd: 'true'
          install-rtk: 'true'
          install-uv: 'true'

      - name: Prepare docs drift branch
        id: branch
        uses: ./.github/actions/prepare-automation-branch
        with:
          branch-name: claude-workflow-optimize-docs-drift-${{ github.run_id }}
          github-token: ${{ secrets.GH_PAT }}

      - name: Update docs to match implementation
        id: claude_run
        uses: ./.github/actions/run-zai
        with:
          api-key: ${{ secrets.ZAI_API_KEY }}
          github-token: ${{ secrets.GH_PAT }}
          max-turns: '${{ env.MAX_TURNS }}'
          track-progress: 'true'
          allowed-bots: 'claude[bot],github-actions[bot]'
          allowed-tools: 'Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(ls *),Bash(cat *),Bash(grep *),Bash(find *),Bash(head *),Bash(tail *),Bash(sort *),Bash(wc *),Bash(rtk:*),mcp__plugin_serena_serena__find_symbol,mcp__plugin_serena_serena__get_symbols_overview,mcp__plugin_serena_serena__find_referencing_symbols,mcp__plugin_serena_serena__find_implementations,mcp__plugin_serena_serena__find_declaration,mcp__plugin_serena_serena__search_for_pattern,mcp__plugin_serena_serena__find_file,mcp__plugin_serena_serena__list_dir,mcp__plugin_serena_serena__read_file,mcp__plugin_serena_serena__get_diagnostics_for_file,mcp__plugin_context7_context7__query-docs,mcp__plugin_context7_context7__resolve-library-id'
          plugin-marketplaces: |-
            https://github.com/anthropics/claude-plugins-official.git
            https://github.com/juliusbrussee/caveman.git
          plugins: |-
            context7@claude-plugins-official
            serena@claude-plugins-official
            caveman@caveman
          prompt: |
            /gsd:docs-update
            Review the codebase against `.planning/` artifacts and standard documentation files.
            Identify any documentation drift between implementation and docs, then update only documentation files to reflect reality.

            Allowed edit scope:
            - `README.md`
            - `docs/**`
            - `.planning/**`
            - `.github/workflows/documentation.md`

            Hard rules:
            - Do NOT edit application source code, tests, package manifests, or workflow logic files other than `.github/workflows/documentation.md`.
            - Do NOT run `git` or `gh`.
            - Do NOT commit, push, merge, or open a PR. The workflow handles that.
            - If there is no meaningful drift, make no file changes.

      - name: Fail on Claude soft failure
        if: always() && steps.claude_run.outputs.claude_failed == 'true'
        run: |
          echo "::error::Claude soft failure: ${{ steps.claude_run.outputs.claude_failure_reason }}"
          exit 1

      - uses: ./.github/actions/commit-and-push
        id: push
        with:
          branch-name: ${{ steps.branch.outputs.branch_name }}
          commit-message: 'docs: reconcile documentation drift'

      - name: Log no-changes result
        if: steps.push.outputs.pushed != 'true'
        run: echo "No documentation drift updates were needed."

      - name: Build docs drift PR body
        id: pr-body
        if: steps.push.outputs.pushed == 'true'
        uses: ./.github/actions/build-automation-pr-body
        with:
          workflow-name: docs-drift
          problem: 'Documentation drift check found docs or planning artifacts that no longer matched the implementation.'
          source-run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          base-ref: main
          changed-files: ${{ steps.claude_run.outputs.claude_changed_files_list }}
          execution-file: ${{ steps.claude_run.outputs.last_execution_file }}
          structured-output: ${{ steps.claude_run.outputs.structured_output }}
          claude-last-output: ${{ steps.claude_run.outputs.claude_last_output }}
          review-notes: 'Draft PR. Documentation-only changes are intentionally manual-only under repository policy.'

      - name: Create docs drift PR
        if: steps.push.outputs.pushed == 'true'
        uses: ./.github/actions/upsert-pull-request
        with:
          github-token: ${{ secrets.GH_PAT }}
          base: main
          branch-name: ${{ steps.branch.outputs.branch_name }}
          title: 'docs: reconcile documentation drift'
          body: ${{ steps.pr-body.outputs.body }}
          draft: 'true'
          require-rich-body: 'true'

  report-failure:
    needs: [docs-drift]
    if: failure()
    runs-on: self-hosted
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          node-version: ${{ env.NODE_VERSION }}

      - uses: ./.github/actions/report-failure
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mode: issue
          auto-fix-run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          issue-title: '[docs-drift] Documentation drift checker failed'
          labels: auto-fix,ci-failure
          ensure-labels: auto-fix,ci-failure
          dispatch-triage: 'true'
          claude-step-outcome: ${{ needs.docs-drift.result }}
          claude-turns: ${{ needs.docs-drift.outputs.claude_num_turns }}
          claude-is-error: ${{ needs.docs-drift.outputs.claude_is_error }}
          claude-used-attempt: ${{ needs.docs-drift.outputs.claude_used_attempt }}
          claude-failure-reason: ${{ needs.docs-drift.outputs.claude_failure_reason }}
          claude-metrics-json: ${{ needs.docs-drift.outputs.claude_metrics_json }}
