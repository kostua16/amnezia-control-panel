name: Documentation Drift Checker

on:
  schedule:
    - cron: '29 3 * * 0' # Weekly on Sundays at 03:29 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  MAX_TURNS: 100
  NODE_VERSION: '24.x'

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  fleet-gate:
    name: Fleet back-pressure gate
    runs-on: self-hosted
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.fleet_check.outputs.skip }}
    steps:
      - uses: ./.github/actions/fleet-back-pressure
        id: fleet_check
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  docs-drift:
    needs: [fleet-gate]
    if: needs.fleet-gate.outputs.skip != 'true'
    runs-on: [self-hosted, big]
    timeout-minutes: 10
    outputs:
      claude_failed: ${{ steps.claude_run.outputs.claude_failed }}
      claude_failure_reason: ${{ steps.claude_run.outputs.claude_failure_reason }}
      claude_num_turns: ${{ steps.claude_run.outputs.claude_num_turns }}
      claude_is_error: ${{ steps.claude_run.outputs.claude_is_error }}
      claude_used_attempt: ${{ steps.claude_run.outputs.claude_used_attempt }}
      claude_metrics_json: ${{ steps.claude_run.outputs.claude_metrics_json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GH_PAT }}
          node-version: ${{ env.NODE_VERSION }}
          install-gsd: 'true'
          install-rtk: 'true'
          install-uv: 'true'

      - name: Prepare docs drift branch
        id: branch
        uses: ./.github/actions/prepare-automation-branch
        with:
          branch-name: claude-workflow-optimize-docs-drift-${{ github.run_id }}
          github-token: ${{ secrets.GH_PAT }}

      - name: Update docs to match implementation
        id: claude_run
        uses: ./.github/actions/run-zai
        with:
          api-key: ${{ secrets.ZAI_API_KEY }}
          github-token: ${{ secrets.GH_PAT }}
          max-turns: '${{ env.MAX_TURNS }}'
          track-progress: 'true'
          allowed-bots: 'claude[bot],github-actions[bot]'
          allowed-tools: 'Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(ls *),Bash(cat *),Bash(grep *),Bash(find *),Bash(head *),Bash(tail *),Bash(sort *),Bash(wc *),Bash(rtk:*),mcp__plugin_serena_serena__find_symbol,mcp__plugin_serena_serena__get_symbols_overview,mcp__plugin_serena_serena__find_referencing_symbols,mcp__plugin_serena_serena__find_implementations,mcp__plugin_serena_serena__find_declaration,mcp__plugin_serena_serena__search_for_pattern,mcp__plugin_serena_serena__find_file,mcp__plugin_serena_serena__list_dir,mcp__plugin_serena_serena__read_file,mcp__plugin_serena_serena__get_diagnostics_for_file,mcp__plugin_context7_context7__query-docs,mcp__plugin_context7_context7__resolve-library-id'
          plugin-marketplaces: |-
            https://github.com/anthropics/claude-plugins-official.git
            https://github.com/juliusbrussee/caveman.git
          plugins: |-
            context7@claude-plugins-official
            serena@claude-plugins-official
            caveman@caveman
          prompt: |
            /gsd:docs-update
            Review the codebase against `.planning/` artifacts and standard documentation files.
            Identify any documentation drift between implementation and docs, then update only documentation files to reflect reality.

            Allowed edit scope:
            - `README.md`
            - `docs/**`
            - `.planning/**`
            - `.github/workflows/documentation.md`

            Hard rules:
            - Do NOT edit application source code, tests, package manifests, or workflow logic files other than `.github/workflows/documentation.md`.
            - Do NOT run `git` or `gh`.
            - Do NOT commit, push, merge, or open a PR. The workflow handles that.
            - If there is no meaningful drift, make no file changes.
            Operate as the `kos-docs-drift` agent: first read `.claude/agents/kos-docs-drift.md` and follow it as your operating contract (it enforces this prompt's rules and adds run-mined failure knowledge), then perform the task.

      - name: Fail on Claude soft failure
        if: always() && steps.claude_run.outputs.claude_failed == 'true'
        run: |
          echo "::error::Claude soft failure: ${{ steps.claude_run.outputs.claude_failure_reason }}"
          exit 1

      - uses: ./.github/actions/commit-and-push
        id: push
        with:
          branch-name: ${{ steps.branch.outputs.branch_name }}
          commit-message: 'docs: reconcile documentation drift'
          github-token: ${{ secrets.GH_PAT }}

      - name: Log no-changes result
        if: steps.push.outputs.pushed != 'true'
        run: echo "No documentation drift updates were needed."

      - name: Build docs drift PR body
        id: pr-body
        if: steps.push.outputs.pushed == 'true'
        uses: ./.github/actions/build-automation-pr-body
        with:
          workflow-name: docs-drift
          problem: 'Documentation drift check found docs or planning artifacts that no longer matched the implementation.'
          source-run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          base-ref: main
          changed-files: ${{ steps.claude_run.outputs.claude_changed_files_list }}
          execution-file: ${{ steps.claude_run.outputs.last_execution_file }}
          structured-output: ${{ steps.claude_run.outputs.structured_output }}
          claude-last-output: ${{ steps.claude_run.outputs.claude_last_output }}
          review-notes: 'Draft PR. Documentation-only changes are intentionally manual-only under repository policy.'

      - name: Create docs drift PR
        if: steps.push.outputs.pushed == 'true'
        uses: ./.github/actions/upsert-pull-request
        with:
          github-token: ${{ secrets.GH_PAT }}
          base: main
          branch-name: ${{ steps.branch.outputs.branch_name }}
          title: 'docs: reconcile documentation drift'
          body: ${{ steps.pr-body.outputs.body }}
          draft: 'true'
          require-rich-body: 'true'

      - name: Supersede older docs drift drafts
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          CURRENT_BRANCH: ${{ steps.branch.outputs.branch_name }}
        run: |
          # Each run re-audits the full docs surface, so any older unreviewed
          # draft is stale by construction — close it (branch kept) instead of
          # letting drafts accumulate with no promotion path. Best-effort: a
          # failed list or close must not fail the drift run itself.
          current_pr=$(gh pr list --state open --head "$CURRENT_BRANCH" \
            --json number --jq '.[0].number // empty' 2>/dev/null || true)
          # GitHub's PR-list endpoint can lag briefly after creation or fail
          # transiently. Without a resolved current_pr the self-skip guard in
          # the loop has no anchor and would close the draft this run just
          # opened, so bail out of superseding entirely instead.
          if [ -z "$current_pr" ]; then
            echo "::warning::Could not resolve current docs-drift PR; skipping supersede."
            exit 0
          fi
          # Skip drafts opened in the last day: this job runs weekly with
          # cancel-in-progress: false, so two runs can overlap and open drafts
          # moments apart, and a freshly-opened draft may be under active human
          # review. Older drafts are stale by construction; the branch is kept
          # so a dismissed review stays recoverable.
          cutoff=$(date -u -d '1 day ago' +%s 2>/dev/null || true)
          if [ -z "$cutoff" ]; then
            echo "::warning::Could not compute supersede age cutoff; skipping supersede."
            exit 0
          fi
          # Capture the candidate list before iterating so a transient gh
          # failure cannot bubble through the pipe under `set -eo pipefail`
          # and fail the whole drift job.
          supersede_list=$(gh pr list --state open --limit 100 \
            --json number,isDraft,headRefName,createdAt \
            --jq ".[] | select(.isDraft and (.headRefName | startswith(\"claude-workflow-optimize-docs-drift-\"))) | select(${cutoff} >= (.createdAt | fromdateiso8601)) | .number" 2>/dev/null || true)
          [ -n "$supersede_list" ] || exit 0
          while read -r num; do
            [ -n "$num" ] || continue
            [ "$num" = "$current_pr" ] && continue
            gh pr comment "$num" --body \
              "Superseded by a newer docs-drift report (#$current_pr). Closing this stale draft; the branch is kept." ||
              echo "::warning::Failed to comment on superseded draft #$num"
            gh pr close "$num" ||
              echo "::warning::Failed to close superseded draft #$num"
          done <<< "$supersede_list"

      - name: Close stale docs drift drafts (no new report this run)
        if: steps.push.outputs.pushed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # The supersede step above only runs when this run produced a new
          # report; a no-drift run used to leave old drafts lingering forever.
          # This run just re-audited the full docs surface and found nothing,
          # so a draft older than 7 days describes drift that has since been
          # resolved — or that a future run will re-detect. Close it (branch
          # kept). Best-effort: failures must not fail the drift run.
          cutoff=$(date -u -d '7 days ago' +%s 2>/dev/null || true)
          if [ -z "$cutoff" ]; then
            echo "::warning::Could not compute stale-draft cutoff; skipping cleanup."
            exit 0
          fi
          stale_list=$(gh pr list --state open --limit 100 \
            --json number,isDraft,headRefName,createdAt \
            --jq ".[] | select(.isDraft and (.headRefName | startswith(\"claude-workflow-optimize-docs-drift-\"))) | select(${cutoff} >= (.createdAt | fromdateiso8601)) | .number" 2>/dev/null || true)
          [ -n "$stale_list" ] || { echo "No stale docs-drift drafts."; exit 0; }
          while read -r num; do
            [ -n "$num" ] || continue
            gh pr comment "$num" --body \
              "Stale docs-drift draft: a newer run re-audited the docs surface without producing a report, so this drift is resolved or will be re-detected. Closing; the branch is kept." ||
              echo "::warning::Failed to comment on stale draft #$num"
            gh pr close "$num" ||
              echo "::warning::Failed to close stale draft #$num"
          done <<< "$stale_list"

  report-failure:
    needs: [docs-drift]
    if: ${{ always() && needs.docs-drift.result != 'success' && needs.docs-drift.result != 'skipped' }}
    runs-on: self-hosted
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          node-version: ${{ env.NODE_VERSION }}

      - uses: ./.github/actions/report-failure
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mode: issue
          auto-fix-run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          issue-title: '[docs-drift] Documentation drift checker failed'
          labels: auto-fix,ci-failure
          ensure-labels: auto-fix,ci-failure
          dispatch-triage: 'true'
          claude-step-outcome: ${{ needs.docs-drift.result }}
          claude-turns: ${{ needs.docs-drift.outputs.claude_num_turns }}
          claude-is-error: ${{ needs.docs-drift.outputs.claude_is_error }}
          claude-used-attempt: ${{ needs.docs-drift.outputs.claude_used_attempt }}
          claude-failure-reason: ${{ needs.docs-drift.outputs.claude_failure_reason }}
          claude-metrics-json: ${{ needs.docs-drift.outputs.claude_metrics_json }}
