name: Daily Maintenance
on:
  schedule:
    - cron: '41 6,18 * * *' # Twice daily at 06:41 and 18:41 UTC
  workflow_dispatch: # Manual trigger option

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  MAX_TURNS: 30
  NODE_VERSION: '24.x'

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  maintenance:
    runs-on: [self-hosted, big]
    timeout-minutes: 10
    outputs:
      claude_failed: ${{ steps.claude_run.outputs.claude_failed }}
      claude_failure_reason: ${{ steps.claude_run.outputs.claude_failure_reason }}
      claude_num_turns: ${{ steps.claude_run.outputs.claude_num_turns }}
      claude_is_error: ${{ steps.claude_run.outputs.claude_is_error }}
      claude_used_attempt: ${{ steps.claude_run.outputs.claude_used_attempt }}
      claude_metrics_json: ${{ steps.claude_run.outputs.claude_metrics_json }}
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - id: setup_env
        uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GH_PAT }}
          node-version: ${{ env.NODE_VERSION }}
          install-deps: 'true'
          install-gsd: 'true'
          install-rtk: 'true'

      - id: ensure_labels
        name: Ensure maintenance labels exist
        uses: ./.github/actions/ensure-workflow-labels
        with:
          github-token: ${{ secrets.GH_PAT }}
          policy-file: .github/workflows/policy.json
          names: maintenance,security,ci-failure,observability

      - id: branch
        name: Prepare maintenance branch
        uses: ./.github/actions/prepare-automation-branch
        with:
          branch-name: claude-maintenance-${{ github.run_id }}
          github-token: ${{ secrets.GH_PAT }}

      - id: claude_run
        continue-on-error: true
        uses: ./.github/actions/run-zai
        with:
          api-key: ${{ secrets.ZAI_API_KEY }}
          github-token: ${{ secrets.GH_PAT }}
          max-turns: '${{ env.MAX_TURNS }}'
          track-progress: 'false'
          allowed-tools: 'mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(npm *),Bash(gh issue:*),Bash(git *),Bash(rtk:*)'
          prompt: |
            /gsd:health && /gsd:stats
            REPO: ${{ github.repository }}

            Perform daily repository maintenance:

            1. Run /gsd:health to diagnose planning directory status
            2. Run /ck:security-scan for dependency vulnerabilities (npm audit)
            3. Run /gsd:progress to summarize phase completion status
            4. Check for TODO/FIXME comments in recent commits (last 12h): `git log --since="12 hours ago" --grep="TODO\|FIXME" --oneline`
            5. Review open issues older than 90 days with /gsd:inbox — skip issues labeled `stale` (owned by stale.yml's 60d-inactivity lifecycle) and issues with exempt labels (`keep-open`, `backlog`, `in-progress`). Only report issues that are old AND still actively worked or recently triaged but unresolved.
            6. Clean up stale resolved debug docs: find .planning/debug/*.md files with frontmatter `status: resolved`. Delete only files whose `updated` frontmatter field is present and parseable as a date older than 30 days; skip files where `updated` is missing or malformed. If any were deleted, commit with message "chore: prune stale resolved debug docs (maintenance)"
            7. Runner health self-check (MNT-E08): run `node .github/workflows/scripts/runner-health-check.cjs --repo ${{ github.repository }} --since 6h`. If the output shows saturated pools or high queue latency, create an issue: `gh issue create --title "Runner health: [summary]" --label "maintenance,observability" --body "[full output]"`. Skip if all pools healthy.

            For EACH category where findings exist, create a NEW GitHub issue:
            - Security findings: `gh issue create --title "Security: [summary of vulnerabilities]" --label "security" --body "[detailed findings]"`
            - Stale issues (older than 90 days): `gh issue create --title "Maintenance: stale issues review" --label "maintenance" --body "[list of stale issues]"`
            - TODO/FIXME findings: `gh issue create --title "Maintenance: unresolved TODOs" --label "maintenance" --body "[list of TODOs with commit references]"`
            - Runner health issues: `gh issue create --title "Runner health: [summary]" --label "maintenance,observability" --body "[full runner-health-check output]"`

            Do NOT create issues if no findings exist in that category.
            If critical security issues (HIGH/CRITICAL severity) are found, comment only on open PRs that modify dependency manifests (package.json, package-lock.json, yarn.lock). Skip workflow-only, doc-only, and src-only PRs — security advisories on non-dependency PRs trigger fix-review loops with no actionable fix.
            Do NOT push or open a PR. The workflow persists any maintenance commits by validating the prepared branch, pushing it, and opening a review PR.
            BUDGET: 30 turns, 10-minute timeout. Skip categories with zero findings immediately — do not burn turns on clean sections.
            Operate as the `kos-maintenance` agent: first read `.claude/agents/kos-maintenance.md` and follow it as your operating contract (it enforces this prompt's rules and adds run-mined failure knowledge), then perform the task.

      - name: Fail workflow on Claude failure
        if: steps.claude_run.outcome == 'failure' || steps.claude_run.outputs.claude_failed == 'true'
        run: |
          echo "::error::Claude failure: ${{ steps.claude_run.outputs.claude_failure_reason || 'claude-code-action step failed' }}"
          exit 1

      - id: detect_changes
        name: Detect maintenance branch changes
        shell: bash
        run: |
          {
            git diff --name-only origin/main...HEAD
            git diff --name-only
            git diff --cached --name-only
          } | sort -u > "${RUNNER_TEMP}/maintenance-changed-files.txt"
          if [ -s "${RUNNER_TEMP}/maintenance-changed-files.txt" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "changed_files<<EOF"
              cat "${RUNNER_TEMP}/maintenance-changed-files.txt"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "changed_files=" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate maintenance changes
        id: gate
        if: steps.detect_changes.outputs.changed == 'true'
        uses: ./.github/actions/validate-pr-gate
        with:
          run-build: 'false'

      # The gate action runs every check with continue-on-error and only emits
      # gate_passed, so a failed gate never fails this job on its own. Without
      # this step, gate_passed=false would silently skip the push and leave the
      # maintenance job green, dropping the agent's changes with no PR, issue,
      # or comment. Failing here surfaces it via the report-failure job below.
      - name: Fail when maintenance changes fail the validation gate
        if: steps.detect_changes.outputs.changed == 'true' && steps.gate.outputs.gate_passed != 'true'
        shell: bash
        run: |
          echo "::error::Maintenance produced changes but the validation gate did not pass (gate_passed=${{ steps.gate.outputs.gate_passed }}). Changes will not be pushed."
          exit 1

      - name: Detect duplicate maintenance PR
        id: duplicate
        if: steps.detect_changes.outputs.changed == 'true' && steps.gate.outputs.gate_passed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          node .github/workflows/scripts/find-duplicate-automation-pr.cjs \
            --repo "${{ github.repository }}" \
            --base-ref main \
            --exclude-head "${{ steps.branch.outputs.branch_name }}" \
            --title-prefix "chore: persist daily maintenance" \
            --github-output "$GITHUB_OUTPUT"

      - name: Log duplicate maintenance result
        if: steps.duplicate.outputs.duplicate_found == 'true'
        run: |
          echo "Skipping duplicate maintenance PR."
          echo "Existing PR: #${{ steps.duplicate.outputs.duplicate_pr_number }} ${{ steps.duplicate.outputs.duplicate_pr_url }}"
          echo "Reason: ${{ steps.duplicate.outputs.duplicate_reason }}"

      - uses: ./.github/actions/commit-and-push
        id: push
        if: steps.detect_changes.outputs.changed == 'true' && steps.gate.outputs.gate_passed == 'true' && steps.duplicate.outputs.duplicate_found != 'true'
        with:
          branch-name: ${{ steps.branch.outputs.branch_name }}
          commit-message: 'chore: persist daily maintenance changes'
          github-token: ${{ secrets.GH_PAT }}

      - name: Build maintenance PR body
        id: pr-body
        if: steps.push.outputs.pushed == 'true'
        uses: ./.github/actions/build-automation-pr-body
        with:
          workflow-name: maintenance
          problem: 'Daily maintenance produced repository changes that must persist through review.'
          source-run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          base-ref: main
          changed-files: ${{ steps.detect_changes.outputs.changed_files }}
          evidence: |
            Maintenance report:
            ${{ steps.claude_run.outputs.claude_last_output }}
          execution-file: ${{ steps.claude_run.outputs.last_execution_file }}
          structured-output: ${{ steps.claude_run.outputs.structured_output }}
          claude-last-output: ${{ steps.claude_run.outputs.claude_last_output }}
          review-notes: 'Created from the scheduled maintenance workflow after the shared validation gate passed.'

      - name: Create maintenance PR
        if: steps.push.outputs.pushed == 'true'
        uses: ./.github/actions/upsert-pull-request
        with:
          github-token: ${{ secrets.GH_PAT }}
          base: main
          branch-name: ${{ steps.branch.outputs.branch_name }}
          title: 'chore: persist daily maintenance changes'
          body: ${{ steps.pr-body.outputs.body }}
          labels: maintenance,needs-review
          draft: 'false'
          require-rich-body: 'true'

  report-failure:
    needs: [maintenance]
    if: ${{ always() && needs.maintenance.result != 'success' && needs.maintenance.result != 'skipped' }}
    runs-on: self-hosted
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          node-version: ${{ env.NODE_VERSION }}

      - uses: ./.github/actions/report-failure
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mode: issue
          auto-fix-run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          issue-title: '[maintenance] Daily maintenance failed'
          labels: maintenance,ci-failure
          ensure-labels: maintenance,ci-failure
          dispatch-triage: 'true'
          claude-step-outcome: ${{ needs.maintenance.result }}
          claude-turns: ${{ needs.maintenance.outputs.claude_num_turns }}
          claude-is-error: ${{ needs.maintenance.outputs.claude_is_error }}
          claude-used-attempt: ${{ needs.maintenance.outputs.claude_used_attempt }}
          claude-failure-reason: ${{ needs.maintenance.outputs.claude_failure_reason }}
          claude-metrics-json: ${{ needs.maintenance.outputs.claude_metrics_json }}
