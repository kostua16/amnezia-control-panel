name: Daily Maintenance
on:
  schedule:
    - cron: "0 6,18 * * *" # Twice daily at 06:00 and 18:00 UTC
  workflow_dispatch: # Manual trigger option

concurrency:
  group: maintenance-${{ github.sha }}
  cancel-in-progress: false

env:
  MAX_TURNS: 100
  NODE_VERSION: "22.x"

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-environment
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-gsd: "true"

      - id: claude_run
        continue-on-error: true
        uses: ./.github/actions/run-claude
        with:
          max-turns: "${{ env.MAX_TURNS }}"
          track-progress: "false"
          allowed-tools: "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(npm *),Bash(gh issue:*),Bash(git *)"
          prompt: |
            /gsd-health && /gsd-stats
            REPO: ${{ github.repository }}

            Perform daily repository maintenance:

            1. Run /gsd-health to diagnose planning directory status
            2. Run /ck:security-scan for dependency vulnerabilities (npm audit)
            3. Run /gsd-progress to summarize phase completion status
            4. Check for TODO/FIXME comments in recent commits (last 12h): `git log --since="12 hours ago" --grep="TODO\|FIXME" --oneline`
            5. Review open issues older than 90 days with /gsd-inbox

            For EACH category where findings exist, create a NEW GitHub issue:
            - Security findings: `gh issue create --title "Security: [summary of vulnerabilities]" --label "security" --body "[detailed findings]"`
            - Stale issues (older than 90 days): `gh issue create --title "Maintenance: stale issues review" --label "maintenance" --body "[list of stale issues]"`
            - TODO/FIXME findings: `gh issue create --title "Maintenance: unresolved TODOs" --label "maintenance" --body "[list of TODOs with commit references]"`

            Do NOT create issues if no findings exist in that category.
            If critical security issues (HIGH/CRITICAL severity) are found, also comment on all open PRs.

      - id: detect_failure
        name: Detect claude execution failure
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const stepOutcome = '${{ steps.claude_run.outcome }}';

            let numTurns = null;
            let isError = null;
            let parseError = null;

            try {
              const raw = fs.readFileSync('/home/runner/work/_temp/claude-execution-output.json', 'utf8');
              const data = JSON.parse(raw);
              numTurns = data.num_turns ?? null;
              isError = data.is_error ?? null;
            } catch (e) {
              parseError = e.message;
            }

            const failed =
              stepOutcome === 'failure' ||
              isError === true ||
              numTurns === 0 ||
              parseError !== null;

            core.setOutput('failed', String(failed));

            if (!failed) {
              core.info(`Maintenance succeeded: ${numTurns} turns`);
              return;
            }

            const reason = stepOutcome === 'failure'
              ? 'claude-code-action step failed'
              : isError
              ? 'claude reported is_error=true'
              : numTurns === 0
              ? 'claude completed 0 turns (model returned nothing)'
              : `execution output unreadable: ${parseError}`;

            const runUrl = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const model = '${{ vars.ANTHROPIC_DEFAULT_SONNET_MODEL }}';

            const body = [
              `## Daily Maintenance Failure`,
              ``,
              `**Run:** ${runUrl}`,
              `**Reason:** ${reason}`,
              `**Model:** ${model}`,
              `**Turns:** ${numTurns ?? 'unknown'}`,
              `**Step outcome:** ${stepOutcome}`,
            ].join('\n');

            for (const [name, color] of [['maintenance', '0075ca'], ['ci-failure', 'd73a4a']]) {
              try {
                await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name });
              } catch (e) {
                if (e.status === 404) {
                  await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name, color });
                }
              }
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[maintenance] Daily maintenance failed',
              body,
              labels: ['maintenance', 'ci-failure'],
            });

            core.warning(`Issue created: ${reason}`);

      - name: Fail workflow on claude failure
        if: steps.claude_run.outcome == 'failure' || steps.detect_failure.outputs.failed == 'true'
        run: exit 1
