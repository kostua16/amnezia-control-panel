name: Daily Maintenance
on:
  schedule:
    - cron: '41 6,18 * * *' # Twice daily at 06:41 and 18:41 UTC
  workflow_dispatch: # Manual trigger option

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  MAX_TURNS: 30
  NODE_VERSION: '24.x'

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      claude_failed: ${{ steps.claude_run.outputs.claude_failed }}
      claude_failure_reason: ${{ steps.claude_run.outputs.claude_failure_reason }}
      claude_num_turns: ${{ steps.claude_run.outputs.claude_num_turns }}
      claude_is_error: ${{ steps.claude_run.outputs.claude_is_error }}
      claude_used_attempt: ${{ steps.claude_run.outputs.claude_used_attempt }}
      claude_metrics_json: ${{ steps.claude_run.outputs.claude_metrics_json }}
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - id: setup_env
        uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GH_PAT }}
          node-version: ${{ env.NODE_VERSION }}
          install-deps: 'true'
          install-gsd: 'true'
          install-rtk: 'true'

      - id: ensure_labels
        name: Ensure maintenance labels exist
        uses: ./.github/actions/ensure-workflow-labels
        with:
          github-token: ${{ secrets.GH_PAT }}
          policy-file: .github/workflows/policy.json
          names: maintenance,security,ci-failure,observability

      - id: schedule_drift
        name: Detect schedule drift
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        shell: bash
        run: |
          drift_json="${RUNNER_TEMP}/schedule-drift.json"
          drift_summary="${RUNNER_TEMP}/schedule-drift-summary.md"
          node .github/workflows/scripts/detect-schedule-drift.cjs \
            --repo "${{ github.repository }}" \
            --since 7d \
            --threshold-hours 2 \
            --json > "$drift_json"

          node - "$drift_json" "$drift_summary" <<'NODE'
          const fs = require('fs');
          const findings = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const summaryPath = process.argv[3];
          const chronic = findings.filter((finding) => finding.chronic);
          const summary = [];

          summary.push('## Schedule-drift report', '');
          if (findings.length === 0) {
            summary.push('No scheduled workflows had schedule-triggered runs in the look-back window.');
          } else if (chronic.length === 0) {
            summary.push(`All ${findings.length} scheduled workflow(s) are within the 2h median drift threshold.`);
          } else {
            summary.push(`Chronic drift detected in ${chronic.length} scheduled workflow(s):`, '');
            for (const finding of chronic) {
              const medianHours = (finding.medianDriftMinutes / 60).toFixed(1);
              const maxHours = (finding.maxDriftMinutes / 60).toFixed(1);
              summary.push(`- ${finding.workflow} (${finding.file}): median ${medianHours}h, max ${maxHours}h across ${finding.runsAnalyzed} run(s)`);
              console.log(`::warning title=Schedule drift detected::${finding.workflow} median drift is ${medianHours}h over ${finding.runsAnalyzed} scheduled run(s).`);
            }
          }
          fs.writeFileSync(summaryPath, `${summary.join('\n')}\n`);
          NODE
          cat "$drift_summary" >> "$GITHUB_STEP_SUMMARY"

      - id: branch
        name: Prepare maintenance branch
        uses: ./.github/actions/prepare-automation-branch
        with:
          branch-name: claude-maintenance-${{ github.run_id }}
          github-token: ${{ secrets.GH_PAT }}

      - id: claude_run
        continue-on-error: true
        uses: ./.github/actions/run-zai
        with:
          api-key: ${{ secrets.ZAI_API_KEY }}
          github-token: ${{ secrets.GH_PAT }}
          model: 'sonnet'
          max-turns: '${{ env.MAX_TURNS }}'
          user-settings-only: 'true'
          allowed-tools: 'Read,Glob,Grep,Bash(node:*),Bash(gh issue:*),Bash(gh pr:*),Bash(npm audit:*),Bash(git log:*),Bash(df:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(echo:*),Bash(rtk node:*),Bash(rtk gh issue:*),Bash(rtk gh pr:*),Bash(rtk npm audit:*),Bash(rtk git log:*)'
          json-schema: '{"type":"object","additionalProperties":false,"required":["summary","categories","issues_created","critical_pr_comments"],"properties":{"summary":{"type":"string"},"categories":{"type":"object","additionalProperties":false,"required":["planning-health","security-audit","progress","todo-fixme","stale-issues"],"properties":{"planning-health":{"type":"object","additionalProperties":false,"required":["findings_count","issue_created"],"properties":{"findings_count":{"type":"integer","minimum":0},"issue_created":{"type":"boolean"},"skip_reason":{"type":"string","enum":["no-findings","duplicate","error"]}}},"security-audit":{"type":"object","additionalProperties":false,"required":["findings_count","issue_created"],"properties":{"findings_count":{"type":"integer","minimum":0},"issue_created":{"type":"boolean"},"skip_reason":{"type":"string","enum":["no-findings","duplicate","error"]}}},"progress":{"type":"object","additionalProperties":false,"required":["findings_count","issue_created"],"properties":{"findings_count":{"type":"integer","minimum":0},"issue_created":{"type":"boolean"},"skip_reason":{"type":"string","enum":["no-findings","duplicate","error"]}}},"todo-fixme":{"type":"object","additionalProperties":false,"required":["findings_count","issue_created"],"properties":{"findings_count":{"type":"integer","minimum":0},"issue_created":{"type":"boolean"},"skip_reason":{"type":"string","enum":["no-findings","duplicate","error"]}}},"stale-issues":{"type":"object","additionalProperties":false,"required":["findings_count","issue_created"],"properties":{"findings_count":{"type":"integer","minimum":0},"issue_created":{"type":"boolean"},"skip_reason":{"type":"string","enum":["no-findings","duplicate","error"]}}}}},"issues_created":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["number","category"],"properties":{"number":{"type":"integer"},"category":{"type":"string","enum":["planning-health","security-audit","progress","todo-fixme","stale-issues"]}}}},"critical_pr_comments":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["pr_number","reason"],"properties":{"pr_number":{"type":"integer"},"reason":{"type":"string"}}}}}}'
          prompt: |
            REPO: ${{ github.repository }}

            Perform daily repository maintenance:

            1. Diagnose planning directory status with `node .claude/get-shit-done/bin/gsd-tools.cjs query validate.health`.
            2. Run `npm audit --json` and inspect its output for dependency vulnerabilities.
            3. Read `.planning/STATE.md` and `.planning/ROADMAP.md` to summarize phase completion status and counts.
            4. Check for TODO/FIXME comments in recent commits (last 12h): `git log --since="12 hours ago" --grep="TODO\|FIXME" --oneline`
            5. Review open issues older than 90 days with `gh issue list`. Skip issues labeled `stale` (owned by stale.yml's 60d-inactivity lifecycle), or with exempt labels `keep-open`, `backlog`, `in-progress`, or `umbrella-sub-issue`. Also skip umbrella/tracking issues identified by `[todo-backlog]`, `[claude-health]`, or `[grouped]` title prefixes; `backlog`, `epic`, `umbrella`, `tracking`, or `keep-open` labels; or body text matching “umbrella tracking issue” or “rolling issue”. Issues labeled `umbrella-sub-issue` are backlog-owned: their disposition already lives in `docs/TODOs-2.md` and their `[todo-backlog]` umbrella, and stale.yml exempts the same label from its 60d-inactivity close, so they are not stale candidates and must not be re-flagged for a disposition call. `deferred` is NOT exempt: fix-issue.yml applies it as a transient same-file-overlap marker and nothing removes it afterwards, so deferred issues must stay visible to this review. Only report issues that are old AND actively worked or recently triaged but unresolved.

            For EACH category where findings exist, create a NEW GitHub issue:
            - Security findings: `gh issue create --title "Security: [summary of vulnerabilities]" --label "security" --body "[detailed findings]"`
            - Stale issues (older than 90 days): `gh issue create --title "Maintenance: stale issues review" --label "maintenance" --body "[list of stale issues]"`
            - TODO/FIXME findings: `gh issue create --title "Maintenance: unresolved TODOs" --label "maintenance" --body "[list of TODOs with commit references]"`

            Do NOT create issues if no findings exist in that category.
            If critical security issues (HIGH/CRITICAL severity) are found, comment only on open PRs that modify dependency manifests (package.json, package-lock.json, yarn.lock). Skip workflow-only, doc-only, and src-only PRs — security advisories on non-dependency PRs trigger fix-review loops with no actionable fix.
            Do NOT push or open a PR. The workflow persists any maintenance changes by validating the prepared branch, pushing it, and opening a review PR.
            TOOL GRANTS: allowed-tools grants family prefixes — node, gh issue, gh pr, npm audit, git log, df, cat, head, tail, wc, echo, and rtk variants of the node/gh/npm/git ones. Issue ONE shell operation per Bash call: no `;` or `&&` chains. Never redirect output to /tmp (the sandbox only permits writes inside the workspace) and never create temp or helper files in the repo (the persist step commits all working-tree changes) — read command output directly from the tool result, or parse quoted values with `node -e`.
            BUDGET: 30 turns, 10-minute timeout. Skip categories with zero findings immediately — do not burn turns on clean sections.
            Operate as the `kos-maintenance` agent: first read `.claude/agents/kos-maintenance.md` and follow it as your operating contract (it enforces this prompt's rules and adds run-mined failure knowledge), then perform the task.
            Finish with the structured report matching the JSON schema: `summary` is a one-line sweep verdict; `categories` carries exactly one entry per sweep category (planning-health, security-audit, progress, todo-fixme, stale-issues), each with its `findings_count` and `issue_created` flag — omit `skip_reason` when the category produced findings and you created its issue, set it to `duplicate` when findings existed but an open issue already covers them (still report their `findings_count`), `no-findings` for a clean sweep, or `error` when the check could not run; `issues_created` lists every issue number you created with its sweep category; `critical_pr_comments` lists each dependency-manifest PR you commented on for critical advisories.

      - name: Record structured sweep report
        if: always()
        env:
          STRUCTURED_REPORT: ${{ steps.claude_run.outputs.structured_output }}
        run: |
          if [ -n "$STRUCTURED_REPORT" ]; then
            # Model-authored JSON can contain a triple backtick that would
            # terminate a standard fence and render the rest as
            # workflow-authored Markdown; a four-backtick fence cannot be
            # closed by it, so the payload reaches the summary verbatim.
            {
              echo '### Maintenance sweep structured report'
              echo '````json'
              echo "$STRUCTURED_REPORT"
              echo '````'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail workflow on Claude failure
        if: steps.claude_run.outcome == 'failure' || steps.claude_run.outputs.claude_failed == 'true'
        run: |
          echo "::error::Claude failure: ${{ steps.claude_run.outputs.claude_failure_reason || 'claude-code-action step failed' }}"
          exit 1

      - name: Prune stale resolved debug docs
        run: node .github/workflows/scripts/prune-stale-debug-docs.cjs

      - id: detect_changes
        name: Detect maintenance branch changes
        shell: bash
        run: |
          {
            git diff --name-only origin/main...HEAD
            git diff --name-only
            git diff --cached --name-only
          } | sort -u > "${RUNNER_TEMP}/maintenance-changed-files.txt"
          if [ -s "${RUNNER_TEMP}/maintenance-changed-files.txt" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "changed_files<<EOF"
              cat "${RUNNER_TEMP}/maintenance-changed-files.txt"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "changed_files=" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate maintenance changes
        id: gate
        if: steps.detect_changes.outputs.changed == 'true'
        uses: ./.github/actions/validate-pr-gate
        with:
          run-build: 'false'

      # The gate action runs every check with continue-on-error and only emits
      # gate_passed, so a failed gate never fails this job on its own. Without
      # this step, gate_passed=false would silently skip the push and leave the
      # maintenance job green, dropping the agent's changes with no PR, issue,
      # or comment. Failing here surfaces it via the report-failure job below.
      - name: Fail when maintenance changes fail the validation gate
        if: steps.detect_changes.outputs.changed == 'true' && steps.gate.outputs.gate_passed != 'true'
        shell: bash
        run: |
          echo "::error::Maintenance produced changes but the validation gate did not pass (gate_passed=${{ steps.gate.outputs.gate_passed }}). Changes will not be pushed."
          exit 1

      - name: Detect duplicate maintenance PR
        id: duplicate
        if: steps.detect_changes.outputs.changed == 'true' && steps.gate.outputs.gate_passed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          node .github/workflows/scripts/find-duplicate-automation-pr.cjs \
            --repo "${{ github.repository }}" \
            --base-ref main \
            --exclude-head "${{ steps.branch.outputs.branch_name }}" \
            --title-prefix "chore: persist daily maintenance" \
            --github-output "$GITHUB_OUTPUT"

      - name: Log duplicate maintenance result
        if: steps.duplicate.outputs.duplicate_found == 'true'
        run: |
          echo "Skipping duplicate maintenance PR."
          echo "Existing PR: #${{ steps.duplicate.outputs.duplicate_pr_number }} ${{ steps.duplicate.outputs.duplicate_pr_url }}"
          echo "Reason: ${{ steps.duplicate.outputs.duplicate_reason }}"

      - uses: ./.github/actions/commit-and-push
        id: push
        if: steps.detect_changes.outputs.changed == 'true' && steps.gate.outputs.gate_passed == 'true' && steps.duplicate.outputs.duplicate_found != 'true'
        with:
          branch-name: ${{ steps.branch.outputs.branch_name }}
          commit-message: 'chore: persist daily maintenance changes'
          github-token: ${{ secrets.GH_PAT }}

      - name: Build maintenance PR body
        id: pr-body
        if: steps.push.outputs.pushed == 'true'
        uses: ./.github/actions/build-automation-pr-body
        with:
          workflow-name: maintenance
          problem: 'Daily maintenance produced repository changes that must persist through review.'
          source-run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          base-ref: main
          changed-files: ${{ steps.detect_changes.outputs.changed_files }}
          evidence: |
            Maintenance report:
            ${{ steps.claude_run.outputs.claude_last_output }}
          execution-file: ${{ steps.claude_run.outputs.last_execution_file }}
          structured-output: ${{ steps.claude_run.outputs.structured_output }}
          claude-last-output: ${{ steps.claude_run.outputs.claude_last_output }}
          review-notes: 'Created from the scheduled maintenance workflow after the shared validation gate passed.'

      - name: Create maintenance PR
        if: steps.push.outputs.pushed == 'true'
        uses: ./.github/actions/upsert-pull-request
        with:
          github-token: ${{ secrets.GH_PAT }}
          base: main
          branch-name: ${{ steps.branch.outputs.branch_name }}
          title: 'chore: persist daily maintenance changes'
          body: ${{ steps.pr-body.outputs.body }}
          labels: maintenance,needs-review
          draft: 'false'
          require-rich-body: 'true'

      - name: Fail when a successful sweep has no structured report
        if: steps.claude_run.outcome == 'success' && steps.claude_run.outputs.claude_failed != 'true' && steps.claude_run.outputs.structured_output == ''
        shell: bash
        run: |
          echo "::error::Maintenance sweep succeeded without producing its required structured report."
          exit 1

  report-failure:
    needs: [maintenance]
    if: ${{ always() && needs.maintenance.result != 'success' && needs.maintenance.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-auth-mode: ${{ vars.GH_AUTH_MODE || 'env' }}
          node-version: ${{ env.NODE_VERSION }}

      - uses: ./.github/actions/report-failure
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mode: issue
          auto-fix-run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          issue-title: '[maintenance] Daily maintenance failed'
          labels: maintenance,ci-failure
          ensure-labels: maintenance,ci-failure
          dispatch-triage: 'true'
          claude-step-outcome: ${{ needs.maintenance.result }}
          claude-turns: ${{ needs.maintenance.outputs.claude_num_turns }}
          claude-is-error: ${{ needs.maintenance.outputs.claude_is_error }}
          claude-used-attempt: ${{ needs.maintenance.outputs.claude_used_attempt }}
          claude-failure-reason: ${{ needs.maintenance.outputs.claude_failure_reason }}
          claude-metrics-json: ${{ needs.maintenance.outputs.claude_metrics_json }}
