name: Daily Maintenance
on:
  schedule:
    - cron: '41 6,18 * * *' # Twice daily at 06:41 and 18:41 UTC
  workflow_dispatch: # Manual trigger option

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  MAX_TURNS: 50
  NODE_VERSION: '24.x'

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  maintenance:
    runs-on: [self-hosted, big]
    timeout-minutes: 10
    outputs:
      claude_failed: ${{ steps.claude_run.outputs.claude_failed }}
      claude_failure_reason: ${{ steps.claude_run.outputs.claude_failure_reason }}
      claude_num_turns: ${{ steps.claude_run.outputs.claude_num_turns }}
      claude_is_error: ${{ steps.claude_run.outputs.claude_is_error }}
      claude_used_attempt: ${{ steps.claude_run.outputs.claude_used_attempt }}
      claude_metrics_json: ${{ steps.claude_run.outputs.claude_metrics_json }}
    steps:
      - id: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - id: setup_env
        uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GH_PAT }}
          node-version: ${{ env.NODE_VERSION }}
          install-gsd: 'true'
          install-rtk: 'true'

      - id: ensure_labels
        name: Ensure maintenance labels exist
        uses: ./.github/actions/ensure-workflow-labels
        with:
          github-token: ${{ secrets.GH_PAT }}
          policy-file: .github/workflows/policy.json
          names: maintenance,security,ci-failure

      - id: claude_run
        continue-on-error: true
        uses: ./.github/actions/run-zai
        with:
          api-key: ${{ secrets.ZAI_API_KEY }}
          github-token: ${{ secrets.GH_PAT }}
          max-turns: '${{ env.MAX_TURNS }}'
          track-progress: 'false'
          allowed-tools: 'mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(npm *),Bash(gh issue:*),Bash(git *),Bash(rtk:*)'
          prompt: |
            /gsd:health && /gsd:stats
            REPO: ${{ github.repository }}

            Perform daily repository maintenance:

            1. Run /gsd:health to diagnose planning directory status
            2. Run /ck:security-scan for dependency vulnerabilities (npm audit)
            3. Run /gsd:progress to summarize phase completion status
            4. Check for TODO/FIXME comments in recent commits (last 12h): `git log --since="12 hours ago" --grep="TODO\|FIXME" --oneline`
            5. Review open issues older than 90 days with /gsd:inbox

            For EACH category where findings exist, create a NEW GitHub issue:
            - Security findings: `gh issue create --title "Security: [summary of vulnerabilities]" --label "security" --body "[detailed findings]"`
            - Stale issues (older than 90 days): `gh issue create --title "Maintenance: stale issues review" --label "maintenance" --body "[list of stale issues]"`
            - TODO/FIXME findings: `gh issue create --title "Maintenance: unresolved TODOs" --label "maintenance" --body "[list of TODOs with commit references]"`

            Do NOT create issues if no findings exist in that category.
            If critical security issues (HIGH/CRITICAL severity) are found, also comment on all open PRs.

      - name: Fail workflow on Claude failure
        if: steps.claude_run.outcome == 'failure' || steps.claude_run.outputs.claude_failed == 'true'
        run: |
          echo "::error::Claude failure: ${{ steps.claude_run.outputs.claude_failure_reason || 'claude-code-action step failed' }}"
          exit 1

  report-failure:
    needs: [maintenance]
    if: failure()
    runs-on: self-hosted
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          node-version: ${{ env.NODE_VERSION }}

      - uses: ./.github/actions/report-failure
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mode: issue
          auto-fix-run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          issue-title: '[maintenance] Daily maintenance failed'
          labels: maintenance,ci-failure
          ensure-labels: maintenance,ci-failure
          dispatch-triage: 'true'
          claude-step-outcome: ${{ needs.maintenance.result }}
          claude-turns: ${{ needs.maintenance.outputs.claude_num_turns }}
          claude-is-error: ${{ needs.maintenance.outputs.claude_is_error }}
          claude-used-attempt: ${{ needs.maintenance.outputs.claude_used_attempt }}
          claude-failure-reason: ${{ needs.maintenance.outputs.claude_failure_reason }}
          claude-metrics-json: ${{ needs.maintenance.outputs.claude_metrics_json }}
