name: Auto Fix CI Failures

# SECURITY NOTE
#
# This workflow checks out the PR branch and runs build/test commands
# (npm, bun, etc.) against it with elevated permissions (contents:write,
# id-token:write). This means code from the PR branch executes in a
# trusted context with access to secrets and the ability to push to the
# repository.
#
# Only use this workflow in repositories where everyone with write access
# is fully trusted with these permissions. Do not use this in repositories
# that accept contributions from untrusted or semi-trusted collaborators.
#
# The pull_requests length check below limits this to same-repo PRs (fork PRs
# are excluded), but anyone who can push a branch to this repository can
# control what code runs here.
#
# For CI failures on direct pushes to main/develop (no associated PR),
# see ci-failure-auto-fix-branch.yml (sibling workflow). The two workflows
# are mutually exclusive: this one fires when pull_requests != '[]', the
# sibling fires when pull_requests == '[]'.

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  actions: read
  issues: write
  id-token: write

env:
  MAX_TURNS: 300
  NODE_VERSION: "22.x"
  DISABLE_TELEMETRY: "1"
  API_TIMEOUT_MS: "${{ vars.API_TIMEOUT_MS }}"
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "${{ vars.CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC }}"
  ANTHROPIC_DEFAULT_HAIKU_MODEL: "${{ vars.ANTHROPIC_DEFAULT_HAIKU_MODEL }}"
  ANTHROPIC_DEFAULT_SONNET_MODEL: "${{ vars.ANTHROPIC_DEFAULT_SONNET_MODEL }}"
  ANTHROPIC_DEFAULT_OPUS_MODEL: "${{ vars.ANTHROPIC_DEFAULT_OPUS_MODEL }}"
  CLAUDE_CODE_SUBAGENT_MODEL: "${{ vars.CLAUDE_CODE_SUBAGENT_MODEL }}"
  ANTHROPIC_BASE_URL: "${{ vars.ANTHROPIC_BASE_URL }}"

jobs:
  auto-fix:
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      toJSON(github.event.workflow_run.pull_requests) != '[]' &&
      !startsWith(github.event.workflow_run.head_branch, 'claude-auto-fix-ci-')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup git identity
        run: |
          git config --global user.email "claude[bot]@users.noreply.github.com"
          git config --global user.name "claude[bot]"

      - name: Resolve linked PR
        id: pr
        env:
          PULL_REQUESTS_JSON: ${{ toJSON(github.event.workflow_run.pull_requests) }}
        run: |
          pr_number=$(jq -r '.[0].number // empty' <<<"$PULL_REQUESTS_JSON")
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Create fix branch
        id: branch
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_ID: ${{ github.run_id }}
        run: |
          SAFE_BRANCH=$(printf '%s' "$HEAD_BRANCH" | tr -cd 'a-zA-Z0-9/_.-')
          BRANCH_NAME="claude-auto-fix-ci-${SAFE_BRANCH}-${RUN_ID}"
          git checkout -b "$BRANCH_NAME"
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Get CI failure details
        id: failure_details
        uses: actions/github-script@v7
        with:
          script: |
            const run = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: ${{ github.event.workflow_run.id }}
            });

            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: ${{ github.event.workflow_run.id }}
            });

            const failedJobs = jobs.data.jobs.filter(job => job.conclusion === 'failure');

            let errorLogs = [];
            for (const job of failedJobs) {
              const logs = await github.rest.actions.downloadJobLogsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                job_id: job.id
              });
              errorLogs.push({
                jobName: job.name,
                logs: logs.data
              });
            }

            return {
              runUrl: run.data.html_url,
              failedJobs: failedJobs.map(j => j.name),
              errorLogs: errorLogs
            };

      - uses: ./.github/actions/setup-environment
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-deps: "true"
          install-gsd: "true"

      - name: Fix CI failures with Claude
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ZAI_API_KEY }}
          track_progress: true
          claude_args: |
            --model ${{ vars.ANTHROPIC_DEFAULT_SONNET_MODEL }}
            --max-turns ${{ env.MAX_TURNS }}
            --allowedTools 'Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(git:*),Bash(bun:*),Bash(npm:*),Bash(npx:*),Bash(gh:*)'
          prompt: |
            /gsd-debug
            Failed CI Run: ${{ fromJSON(steps.failure_details.outputs.result).runUrl }}
            Failed Jobs: ${{ join(fromJSON(steps.failure_details.outputs.result).failedJobs, ', ') }}
            PR Number: ${{ steps.pr.outputs.number }}
            Branch Name: ${{ steps.branch.outputs.branch_name }}
            Base Branch: ${{ github.event.workflow_run.head_branch }}
            Repository: ${{ github.repository }}

            Error logs:
            ${{ toJSON(fromJSON(steps.failure_details.outputs.result).errorLogs) }}

            Investigate root cause, then apply fix.
            After fixing, run: npm run lint && npx tsc --noEmit && npm run build
            Do NOT commit or push — the workflow handles that.

            TURN BUDGET: Max ${{ env.MAX_TURNS }} turns. Finish with a clear deliverable before the limit; if running low, stop exploring and post your best partial result.

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet HEAD; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push fix
        if: steps.changes.outputs.has_changes == 'true'
        env:
          BRANCH_NAME: ${{ steps.branch.outputs.branch_name }}
        run: |
          git add -A
          git commit -m "fix(ci): auto-fix CI failures" || true
          git push origin "$BRANCH_NAME"

      - name: Find related failure issues
        id: failure_issues
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        with:
          script: |
            const branch = process.env.BRANCH;
            const q = [
              `repo:${context.repo.owner}/${context.repo.repo}`,
              'is:issue', 'is:open',
              'label:auto-fix', 'label:ci-failure',
              `"${branch}" in:title`
            ].join(' ');
            try {
              const result = await github.rest.search.issuesAndPullRequests({ q, per_page: 10 });
              const nums = result.data.items.map(i => String(i.number)).join(',');
              core.setOutput('issue_numbers', nums);
            } catch (e) {
              core.warning(`Issue search failed: ${e.message}`);
              core.setOutput('issue_numbers', '');
            }

      - name: Create fix PR
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ steps.branch.outputs.branch_name }}
          BASE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          RUN_URL: ${{ fromJSON(steps.failure_details.outputs.result).runUrl }}
          ISSUE_NUMBERS: ${{ steps.failure_issues.outputs.issue_numbers }}
        run: |
          CLOSES_TEXT=""
          if [ -n "$ISSUE_NUMBERS" ]; then
            CLOSES_TEXT=$(printf '\n\n%s' "$(echo "$ISSUE_NUMBERS" | tr ',' '\n' | grep -v '^$' | sed 's/^/Closes #/')")
          fi
          BODY=$(printf 'Automated fix for failed CI run: %s\n\n**Review required before merge.** This PR was created by the CI auto-fix workflow.\n\nRelated PR: #%s%s' \
            "$RUN_URL" "$PR_NUMBER" "$CLOSES_TEXT")
          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$BRANCH_NAME" \
            --title "fix(ci): auto-fix failures from #${PR_NUMBER}" \
            --body "$BODY" \
            --label "auto-fix" --label "needs-review" 2>/dev/null || \
          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$BRANCH_NAME" \
            --title "fix(ci): auto-fix failures from #${PR_NUMBER}" \
            --body "$BODY"

  report-failure:
    needs: [auto-fix]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Collect auto-fix failure details
        id: collect
        uses: actions/github-script@v7
        with:
          script: |
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId
            });
            const failedJobs = jobs.data.jobs.filter(j => j.conclusion === 'failure');
            const failedSteps = [];
            const logSnippets = [];
            for (const job of failedJobs) {
              const steps = (job.steps || []).filter(s => s.conclusion === 'failure');
              for (const step of steps) {
                failedSteps.push(`${job.name} / ${step.name}`);
              }
              try {
                const logsResp = await github.rest.actions.downloadJobLogsForWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  job_id: job.id
                });
                const raw = typeof logsResp.data === 'string' ? logsResp.data : String(logsResp.data);
                logSnippets.push({ name: job.name, log: raw.slice(-3000) });
              } catch (e) {
                logSnippets.push({ name: job.name, log: `(log unavailable: ${e.message})` });
              }
            }
            core.setOutput('failed_steps', JSON.stringify(failedSteps));
            core.setOutput('log_snippets', JSON.stringify(logSnippets));

      - name: Create failure issue
        uses: actions/github-script@v7
        env:
          AUTO_FIX_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          PULL_REQUESTS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
          FAILED_STEPS: ${{ steps.collect.outputs.failed_steps }}
          LOG_SNIPPETS: ${{ steps.collect.outputs.log_snippets }}
        with:
          script: |
            const branch = process.env.BRANCH;
            const prs = JSON.parse(process.env.PULL_REQUESTS || '[]');
            const prNumber = prs[0]?.number || null;
            const autoFixRunUrl = process.env.AUTO_FIX_RUN_URL;
            const ciRunUrl = process.env.CI_RUN_URL;
            const failedSteps = JSON.parse(process.env.FAILED_STEPS || '[]');
            const logSnippets = JSON.parse(process.env.LOG_SNIPPETS || '[]');

            const title = prNumber
              ? `[auto-fix] Failed for #${prNumber} on ${branch}`
              : `[auto-fix] Failed on ${branch}`;

            const stepsSection = failedSteps.length > 0
              ? `## Failed Steps\n${failedSteps.map(s => `- ${s}`).join('\n')}`
              : '## Failed Steps\n_No failed step details available_';

            const logsSection = logSnippets.length > 0
              ? logSnippets.map(({ name, log }) => `### ${name}\n\`\`\`\n${log}\n\`\`\``).join('\n\n')
              : '_No logs available_';

            const tableRows = [
              `| **Auto-fix run** | ${autoFixRunUrl} |`,
              `| **Triggering CI run** | ${ciRunUrl} |`,
              `| **Branch** | \`${branch}\` |`,
            ];
            if (prNumber) tableRows.push(`| **PR** | #${prNumber} |`);

            const body = [
              '## Auto-fix Workflow Failure',
              '',
              'The auto-fix workflow itself failed and could not create a fix PR.',
              '',
              '| | |',
              '|---|---|',
              ...tableRows,
              '',
              stepsSection,
              '',
              '## Log Tails',
              '',
              logsSection,
            ].join('\n');

            for (const [name, color] of [['auto-fix', 'e4e669'], ['ci-failure', 'd73a4a']]) {
              try {
                await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name });
              } catch (e) {
                if (e.status === 404) {
                  await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name, color });
                }
              }
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['auto-fix', 'ci-failure']
            });
