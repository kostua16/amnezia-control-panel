name: Docker Image

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CACHE_SCOPE: amnezia-control-panel

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify Ref
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_publish: ${{ steps.classify.outputs.should_publish }}
      should_validate: ${{ steps.classify.outputs.should_validate }}
    steps:
      - name: Check out repository
        id: checkout
        continue-on-error: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        timeout-minutes: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 3 || 5 }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - id: rest_counter
        uses: ./.github/actions/log-rate-limit
        if: steps.checkout.outcome == 'success'
        with:
          github-token: ${{ github.token }}
          label: docker-classify
          report-at-job-end: 'true'
          rest-counter: 'true'

      - name: Decide Docker image action
        id: classify
        env:
          REST_COUNTER_PRELOAD: ${{ steps.rest_counter.outputs.rest-counter-preload }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          GIT_FETCH_TOKEN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.token || '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            try {
              if (process.env.REST_COUNTER_PRELOAD) require(process.env.REST_COUNTER_PRELOAD);
            } catch {
              // Counting is best-effort.
            }

            const relevantGlobs = [
              'Dockerfile',
              'Dockerfile.stack',
              'docker/**',
              '.dockerignore',
              'docker-compose*.yml',
              'docker-entrypoint.sh',
              'docker/stack-entrypoint.sh',
              'package.json',
              'package-lock.json',
              'next.config.*',
              'tsconfig.json',
              'postcss.config.*',
              'tailwind.config.*',
              'prisma.config.*',
              'src/**',
              'app/**',
              'pages/**',
              'components/**',
              'lib/**',
              'styles/**',
              'public/**',
              'prisma/**',
              'server.mjs',
              'instrumentation.ts',
              'middleware.*',
            ];

            function escapeRegex(value) {
              return value.replace(/[|\\{}()[\]^$+?.]/g, '\\$&');
            }

            function globToRegExp(glob) {
              let regex = '^';
              for (let index = 0; index < glob.length; index += 1) {
                const char = glob[index];
                const next = glob[index + 1];
                if (char === '*' && next === '*') {
                  regex += '.*';
                  index += 1;
                } else if (char === '*') {
                  regex += '[^/]*';
                } else {
                  regex += escapeRegex(char);
                }
              }
              return new RegExp(`${regex}$`);
            }

            const relevantPatterns = relevantGlobs.map(globToRegExp);

            function matchesRelevantPath(filePath) {
              return relevantPatterns.some((pattern) => pattern.test(filePath));
            }

            function collectFileNames(files) {
              const names = new Set();
              for (const file of files) {
                if (file?.filename) names.add(file.filename);
                if (file?.previous_filename) names.add(file.previous_filename);
              }
              return [...names].sort();
            }

            async function listPullRequestFiles(prNumber) {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                per_page: 100,
              });
              return collectFileNames(files);
            }

            function listMainPushFiles() {
              if (process.env.CHECKOUT_OUTCOME !== 'success') {
                throw new Error('could not check out the push head');
              }
              const { before, after } = context.payload;
              const isCommit = (sha) => /^[0-9a-f]{40}$/.test(sha) && !/^0+$/.test(sha);
              if (!isCommit(before) || !isCommit(after)) {
                throw new Error('push payload did not include a comparable before/after range');
              }

              const { execFileSync } = require('node:child_process');
              const token = process.env.GIT_FETCH_TOKEN;
              const credential = Buffer.from(`x-access-token:${token}`).toString('base64');
              const authHeader = `AUTHORIZATION: basic ${credential}`;
              core.setSecret(credential);
              core.setSecret(authHeader);
              // Authenticate only this fetch. A shallow checkout already has the after tree.
              try {
                execFileSync(
                  'git',
                  [
                    `--config-env=http.${process.env.GITHUB_SERVER_URL}/.extraheader=GIT_FETCH_AUTH`,
                    'fetch', '--no-tags', '--depth=1', 'origin', before,
                  ],
                  {
                    env: { ...process.env, GIT_FETCH_AUTH: authHeader },
                    stdio: 'pipe',
                    timeout: 45_000,
                  },
                );
              } catch (error) {
                // A force-push can leave the previous commit unavailable on origin.
                const stderr = String(error.stderr ?? '').trim();
                const detail = error.code === 'ETIMEDOUT' ? error.message : stderr || error.message;
                let safeDetail = String(detail);
                for (const secret of [authHeader, credential, token].filter(Boolean)) {
                  safeDetail = safeDetail.replaceAll(secret, '[redacted]');
                }
                const firstLine = safeDetail.trim().split(/\r?\n/, 1)[0];
                const diagnostic = firstLine.length > 300 ? `${firstLine.slice(0, 297)}...` : firstLine;
                throw new Error(`unable to fetch the previous main commit from origin: ${diagnostic}`);
              }

              // Treat renames as delete/add so both paths remain eligible.
              return execFileSync(
                'git',
                ['diff', '--no-renames', '--name-only', '-z', `${before}..${after}`, '--'],
                { encoding: 'utf8', maxBuffer: 64 * 1024 * 1024 },
              ).split('\0').filter(Boolean).sort();
            }

            let shouldPublish = false;
            let shouldValidate = false;
            let changedFiles = [];
            let relevantFiles = [];
            let reason = 'Docker image workflow is not required for this ref.';
            const eventName = context.eventName;
            const ref = context.ref;
            const isVersionTagRef = /^refs\/tags\/v[^/]*\.[^/]*\.[^/]*$/.test(ref);

            if (eventName === 'workflow_dispatch') {
              if (ref === 'refs/heads/main' || isVersionTagRef) {
                shouldPublish = true;
                reason = 'Manual dispatch on a publish ref preserves explicit operator intent.';
              } else {
                shouldValidate = true;
                reason = 'Manual dispatch on a non-publish ref preserves explicit operator intent.';
              }
            } else if (eventName === 'push' && isVersionTagRef) {
              shouldPublish = true;
              reason = 'Version tags always publish Docker images.';
            } else if (eventName === 'push' && ref === 'refs/heads/main') {
              try {
                changedFiles = listMainPushFiles();
                relevantFiles = changedFiles.filter(matchesRelevantPath);
                shouldPublish = relevantFiles.length > 0;
                reason = shouldPublish
                  ? 'Main push touched Docker-relevant paths.'
                  : 'Main push did not touch Docker-relevant paths.';
              } catch (error) {
                shouldPublish = true;
                reason = `Unable to determine changed files for main push; publishing fail-open. ${error.message}`;
                core.warning(reason);
              }
            } else if (eventName === 'pull_request') {
              try {
                changedFiles = await listPullRequestFiles(context.payload.pull_request.number);
                relevantFiles = changedFiles.filter(matchesRelevantPath);
                shouldValidate = relevantFiles.length > 0;
                reason = shouldValidate
                  ? 'Pull request touched Docker-relevant paths.'
                  : 'Pull request did not touch Docker-relevant paths.';
              } catch (error) {
                shouldValidate = true;
                reason = `Unable to determine changed files for pull request; validating fail-open. ${error.message}`;
                core.warning(reason);
              }
            }

            core.setOutput('should_publish', String(shouldPublish));
            core.setOutput('should_validate', String(shouldValidate));

            const matched = relevantFiles.length > 0 ? relevantFiles.join(', ') : 'none';
            core.info(
              `Docker image decision: publish=${shouldPublish}, validate=${shouldValidate}. ${reason} Matched paths: ${matched}`,
            );

            await core.summary
              .addHeading('Docker Image Decision', 3)
              .addRaw(`publish=${shouldPublish}, validate=${shouldValidate}. ${reason}`)
              .addBreak()
              .addRaw(`Matched paths: ${matched}`)
              .write();

  docker-build:
    name: Docker Build
    needs: classify
    if: needs.classify.outputs.should_validate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Ensure runner disk space
        uses: ./.github/actions/ensure-docker-disk-space

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      # Validation-only build (push: false): static local tag, no docker/metadata-action,
      # which calls the GitHub REST API and fails when the installation rate limit is hit.
      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:validate-${{ github.sha }}
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}

  docker-build-stack:
    name: Docker Build (Stack)
    needs: classify
    if: needs.classify.outputs.should_validate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Ensure runner disk space
        uses: ./.github/actions/ensure-docker-disk-space

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      # Validation-only build (push: false): static local tag, no docker/metadata-action (see Docker Build).
      - name: Build bundled stack image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ./Dockerfile.stack
          platforms: linux/amd64
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:stack-validate-${{ github.sha }}
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}-stack

  publish:
    name: Publish GHCR Image
    needs: classify
    if: needs.classify.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Ensure runner disk space
        uses: ./.github/actions/ensure-docker-disk-space

      - uses: ./.github/actions/log-rate-limit
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          label: docker-publish
          report-at-job-end: 'true'

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }},ignore-error=true,timeout=5m
          sbom: true
          provenance: mode=max

      - name: Generate artifact attestation
        if: ${{ !github.event.repository.private || github.event.repository.owner.type != 'User' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  publish-stack:
    name: Publish GHCR Stack Image
    needs: classify
    if: needs.classify.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Ensure runner disk space
        uses: ./.github/actions/ensure-docker-disk-space

      - uses: ./.github/actions/log-rate-limit
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          label: docker-publish-stack
          report-at-job-end: 'true'

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,prefix=stack-,enable={{is_default_branch}}
            type=semver,pattern={{version}},prefix=stack-
            type=semver,pattern={{major}}.{{minor}},prefix=stack-
            type=sha,prefix=stack-sha-
            type=raw,value=stack-latest,enable={{is_default_branch}}

      - name: Build and push bundled stack image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ./Dockerfile.stack
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}-stack
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }}-stack,ignore-error=true,timeout=5m
          sbom: true
          provenance: mode=max

      - name: Generate artifact attestation
        if: ${{ !github.event.repository.private || github.event.repository.owner.type != 'User' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
