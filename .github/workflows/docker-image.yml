name: Docker Image

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CACHE_SCOPE: amnezia-control-panel

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify Ref
    runs-on: self-hosted
    timeout-minutes: 5
    outputs:
      should_publish: ${{ steps.classify.outputs.should_publish }}
      should_validate: ${{ steps.classify.outputs.should_validate }}
    steps:
      - name: Ensure runner disk space
        shell: bash
        run: |
          set -euo pipefail
          # Self-hosted runners accumulate Docker buildx layer cache across
          # builds and eventually exhaust disk, failing jobs with ENOSPC
          # (including action extraction into _actions). Free headroom before
          # running when space drops below threshold, using the same prune as
          # cleanup-runner.yml and setup-environment's cleanup_general.
          threshold_mb=4096
          avail_mb=$(( $(df --output=avail / | tail -1 | tr -d ' ') / 1024 ))
          echo "Available disk space: ${avail_mb} MB (threshold ${threshold_mb} MB)"
          if [ "${avail_mb}" -lt "${threshold_mb}" ]; then
            echo "Low disk; pruning Docker state..."
            docker system prune -af --volumes 2>/dev/null || true
            avail_mb=$(( $(df --output=avail / | tail -1 | tr -d ' ') / 1024 ))
            echo "Available disk space after prune: ${avail_mb} MB"
          fi

      - name: Decide Docker image action
        id: classify
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const relevantGlobs = [
              'Dockerfile',
              '.dockerignore',
              'docker-compose*.yml',
              'docker-entrypoint.sh',
              'package.json',
              'package-lock.json',
              'next.config.*',
              'tsconfig.json',
              'postcss.config.*',
              'tailwind.config.*',
              'prisma.config.*',
              'src/**',
              'app/**',
              'pages/**',
              'components/**',
              'lib/**',
              'styles/**',
              'public/**',
              'prisma/**',
              'server.mjs',
              'instrumentation.ts',
              'middleware.*',
            ];

            function escapeRegex(value) {
              return value.replace(/[|\\{}()[\]^$+?.]/g, '\\$&');
            }

            function globToRegExp(glob) {
              let regex = '^';
              for (let index = 0; index < glob.length; index += 1) {
                const char = glob[index];
                const next = glob[index + 1];
                if (char === '*' && next === '*') {
                  regex += '.*';
                  index += 1;
                } else if (char === '*') {
                  regex += '[^/]*';
                } else {
                  regex += escapeRegex(char);
                }
              }
              return new RegExp(`${regex}$`);
            }

            const relevantPatterns = relevantGlobs.map(globToRegExp);

            function matchesRelevantPath(filePath) {
              return relevantPatterns.some((pattern) => pattern.test(filePath));
            }

            function collectFileNames(files) {
              const names = new Set();
              for (const file of files) {
                if (file?.filename) names.add(file.filename);
                if (file?.previous_filename) names.add(file.previous_filename);
              }
              return [...names].sort();
            }

            async function listPullRequestFiles(prNumber) {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                per_page: 100,
              });
              return collectFileNames(files);
            }

            async function listMainPushFiles() {
              const before = context.payload.before;
              const after = context.payload.after;
              if (!before || /^0+$/.test(before) || !after) {
                throw new Error('push payload did not include a comparable before/after range');
              }

              const comparison = await github.rest.repos.compareCommitsWithBasehead({
                owner: context.repo.owner,
                repo: context.repo.repo,
                basehead: `${before}...${after}`,
                per_page: 100,
              });
              const files = comparison.data.files ?? [];
              if (files.length >= 300) {
                throw new Error('compare API returned the maximum file list; changed files may be truncated');
              }
              return collectFileNames(files);
            }

            let shouldPublish = false;
            let shouldValidate = false;
            let changedFiles = [];
            let relevantFiles = [];
            let reason = 'Docker image workflow is not required for this ref.';
            const eventName = context.eventName;
            const ref = context.ref;
            const isVersionTagRef = /^refs\/tags\/v[^/]*\.[^/]*\.[^/]*$/.test(ref);

            if (eventName === 'workflow_dispatch') {
              if (ref === 'refs/heads/main' || isVersionTagRef) {
                shouldPublish = true;
                reason = 'Manual dispatch on a publish ref preserves explicit operator intent.';
              } else {
                shouldValidate = true;
                reason = 'Manual dispatch on a non-publish ref preserves explicit operator intent.';
              }
            } else if (eventName === 'push' && isVersionTagRef) {
              shouldPublish = true;
              reason = 'Version tags always publish Docker images.';
            } else if (eventName === 'push' && ref === 'refs/heads/main') {
              try {
                changedFiles = await listMainPushFiles();
                relevantFiles = changedFiles.filter(matchesRelevantPath);
                shouldPublish = relevantFiles.length > 0;
                reason = shouldPublish
                  ? 'Main push touched Docker-relevant paths.'
                  : 'Main push did not touch Docker-relevant paths.';
              } catch (error) {
                shouldPublish = true;
                reason = `Unable to determine changed files for main push; publishing fail-open. ${error.message}`;
                core.warning(reason);
              }
            } else if (eventName === 'pull_request') {
              try {
                changedFiles = await listPullRequestFiles(context.payload.pull_request.number);
                relevantFiles = changedFiles.filter(matchesRelevantPath);
                shouldValidate = relevantFiles.length > 0;
                reason = shouldValidate
                  ? 'Pull request touched Docker-relevant paths.'
                  : 'Pull request did not touch Docker-relevant paths.';
              } catch (error) {
                shouldValidate = true;
                reason = `Unable to determine changed files for pull request; validating fail-open. ${error.message}`;
                core.warning(reason);
              }
            }

            core.setOutput('should_publish', String(shouldPublish));
            core.setOutput('should_validate', String(shouldValidate));

            const matched = relevantFiles.length > 0 ? relevantFiles.join(', ') : 'none';
            core.info(
              `Docker image decision: publish=${shouldPublish}, validate=${shouldValidate}. ${reason} Matched paths: ${matched}`,
            );

            await core.summary
              .addHeading('Docker Image Decision', 3)
              .addRaw(`publish=${shouldPublish}, validate=${shouldValidate}. ${reason}`)
              .addBreak()
              .addRaw(`Matched paths: ${matched}`)
              .write();

  docker-build:
    name: Docker Build
    needs: classify
    if: needs.classify.outputs.should_validate == 'true'
    runs-on: [self-hosted, big]
    timeout-minutes: 30
    steps:
      - name: Ensure runner disk space
        shell: bash
        run: |
          set -euo pipefail
          # Self-hosted runners accumulate Docker buildx layer cache across
          # builds and eventually exhaust disk, failing jobs with ENOSPC
          # (including action extraction into _actions). Free headroom before
          # running when space drops below threshold, using the same prune as
          # cleanup-runner.yml and setup-environment's cleanup_general.
          threshold_mb=4096
          avail_mb=$(( $(df --output=avail / | tail -1 | tr -d ' ') / 1024 ))
          echo "Available disk space: ${avail_mb} MB (threshold ${threshold_mb} MB)"
          if [ "${avail_mb}" -lt "${threshold_mb}" ]; then
            echo "Low disk; pruning Docker state..."
            docker system prune -af --volumes 2>/dev/null || true
            avail_mb=$(( $(df --output=avail / | tail -1 | tr -d ' ') / 1024 ))
            echo "Available disk space after prune: ${avail_mb} MB"
          fi

      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=pr
            type=sha,prefix=sha-

      - name: Build Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}

  publish:
    name: Publish GHCR Image
    needs: classify
    if: needs.classify.outputs.should_publish == 'true'
    runs-on: [self-hosted, big]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Ensure runner disk space
        shell: bash
        run: |
          set -euo pipefail
          # Self-hosted runners accumulate Docker buildx layer cache across
          # builds and eventually exhaust disk, failing jobs with ENOSPC
          # (including action extraction into _actions). Free headroom before
          # running when space drops below threshold, using the same prune as
          # cleanup-runner.yml and setup-environment's cleanup_general.
          threshold_mb=4096
          avail_mb=$(( $(df --output=avail / | tail -1 | tr -d ' ') / 1024 ))
          echo "Available disk space: ${avail_mb} MB (threshold ${threshold_mb} MB)"
          if [ "${avail_mb}" -lt "${threshold_mb}" ]; then
            echo "Low disk; pruning Docker state..."
            docker system prune -af --volumes 2>/dev/null || true
            avail_mb=$(( $(df --output=avail / | tail -1 | tr -d ' ') / 1024 ))
            echo "Available disk space after prune: ${avail_mb} MB"
          fi

      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }},ignore-error=true,timeout=5m
          sbom: true
          provenance: mode=max

      - name: Generate artifact attestation
        if: ${{ !github.event.repository.private || github.event.repository.owner.type != 'User' }}
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
