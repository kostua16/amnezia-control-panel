name: Audit Auto PRs

on:
  schedule:
    - cron: '17 */3 * * *' # Every 3 hours at :17 UTC
  workflow_dispatch:

concurrency:
  group: audit-auto-prs-${{ github.ref }}
  cancel-in-progress: false

env:
  MAX_TURNS: 90
  NODE_VERSION: '24.x'

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  audit-auto-prs:
    runs-on: [self-hosted, big]
    timeout-minutes: 15
    outputs:
      claude_failed: ${{ steps.claude_run.outputs.claude_failed }}
      claude_failure_reason: ${{ steps.claude_run.outputs.claude_failure_reason }}
      claude_num_turns: ${{ steps.claude_run.outputs.claude_num_turns }}
      claude_is_error: ${{ steps.claude_run.outputs.claude_is_error }}
      claude_used_attempt: ${{ steps.claude_run.outputs.claude_used_attempt }}
      claude_metrics_json: ${{ steps.claude_run.outputs.claude_metrics_json }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GH_PAT }}
          node-version: ${{ env.NODE_VERSION }}
          install-deps: 'true'
          generate-prisma: 'true'
          install-gsd: 'true'
          install-rtk: 'true'
          install-uv: 'true'

      - name: Check for pending audit PRs
        id: pending_audit
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          node .github/workflows/scripts/check-pending-automation-pr.cjs \
            --repo "${{ github.repository }}" \
            --base-ref main \
            --title-prefix 'ci(workflows): audit automation-created PRs' \
            --exclude-head 'claude-workflow-optimize-auto-pr-audit-${{ github.run_id }}' \
            --max-open-automation-prs "${{ github.event_name == 'schedule' && '8' || '0' }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Prepare auto PR audit branch
        if: steps.pending_audit.outputs.pending != 'true'
        id: branch
        uses: ./.github/actions/prepare-automation-branch
        with:
          branch-name: claude-workflow-optimize-auto-pr-audit-${{ github.run_id }}
          github-token: ${{ secrets.GH_PAT }}

      - name: Audit automation-authored pull requests
        if: steps.pending_audit.outputs.pending != 'true'
        id: claude_run
        uses: ./.github/actions/run-zai
        with:
          api-key: ${{ secrets.ZAI_API_KEY }}
          github-token: ${{ secrets.GH_PAT }}
          max-turns: '${{ env.MAX_TURNS }}'
          track-progress: 'true'
          claude-full-output: 'false'
          allowed-bots: 'github-actions,github-actions[bot],claude[bot]'
          allowed-tools: 'Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(rtk:*),Bash(npm *),Bash(npx *),Bash(node *),Bash(ls *),Bash(cat *),Bash(grep *),Bash(find *),Bash(head *),Bash(tail *),Bash(sort *),Bash(wc *),Bash(echo *),Bash(date *),mcp__plugin_serena_serena__find_symbol,mcp__plugin_serena_serena__get_symbols_overview,mcp__plugin_serena_serena__find_referencing_symbols,mcp__plugin_serena_serena__find_implementations,mcp__plugin_serena_serena__find_declaration,mcp__plugin_serena_serena__search_for_pattern,mcp__plugin_serena_serena__find_file,mcp__plugin_serena_serena__list_dir,mcp__plugin_serena_serena__read_file,mcp__plugin_serena_serena__get_diagnostics_for_file,mcp__plugin_context7_context7__query-docs,mcp__plugin_context7_context7__resolve-library-id,mcp__plugin_typescript-lsp__*'
          json-schema: '{"type":"object","properties":{"summary":{"type":"string"},"auto_prs_inspected":{"type":"array","items":{"type":"object","properties":{"number":{"type":"integer"},"title":{"type":"string"},"branch":{"type":"string"},"author":{"type":"string"},"evidence":{"type":"string"},"recommendation":{"type":"string"}},"required":["number","title","branch","author","evidence","recommendation"],"additionalProperties":false}},"risk_patterns":{"type":"array","items":{"type":"string"}},"systemic_fix_made":{"type":"boolean"},"verification":{"type":"array","items":{"type":"string"}},"human_disposition":{"type":"array","items":{"type":"string"}},"no_new_pr_reason":{"type":"string"}},"required":["summary","auto_prs_inspected","risk_patterns","systemic_fix_made","verification","human_disposition","no_new_pr_reason"],"additionalProperties":false}'
          plugin-marketplaces: |-
            https://github.com/anthropics/claude-plugins-official.git
            https://github.com/juliusbrussee/caveman.git
          plugins: |-
            typescript-lsp@claude-plugins-official
            serena@claude-plugins-official
            context7@claude-plugins-official
            code-review@claude-plugins-official
            pr-review-toolkit@claude-plugins-official
            security-guidance@claude-plugins-official
            code-simplifier@claude-plugins-official
          prompt: |
            /gsd:audit-fix

            Audit the open GitHub pull requests for the amnezia-control-panel repository, focusing on PRs created automatically by repository workflows, bots, Codex/Claude automation, or generated branches.

            Follow the repository AGENTS.md/CLAUDE.md instructions, including using `rtk`-prefixed commands and starting any edits through the appropriate GSD workflow. When inspecting GitHub state, use exact evidence from `rtk gh ...` commands rather than title-only inference.

            Inspect the current open PR list and gather evidence for each automatically created PR: author, branch, title/body, labels, linked issue/run/source PR when available, changed files, commit messages, checks/statuses, and relevant workflow comments. Identify problems such as duplicate PRs, several PRs attempting to solve the same root problem in different ways, stale auto PRs, conflicting edits to the same shared workflow/helper files, PRs that should have used an existing shared helper/contract, missing evidence in autogenerated PR descriptions, or automation patterns that are likely to create repeated work.

            Do not classify PRs as duplicates based only on similar titles or shared wrapper/workflow names. Compare the actual problem statement, source issue/run/PR, failure signature or rationale, changed files, and implementation approach. When workflow failures or duplicate issue reports are involved, inspect exact GitHub run/log evidence where needed before grouping root causes.

            If you find an actionable systemic improvement, implement a narrow fix in the current prepared automation branch that prevents or reduces the repeat/conflict pattern. Prefer a shared workflow/helper/policy fix over copying checks into many workflows. Keep unrelated dirty files untouched. For changes to JS/CJS/TS/TSX or workflow helper files, verify lint and Prettier; for workflow YAML changes, run actionlint and any targeted tests that match the touched files.

            Hard rules:
            - Do NOT mutate existing GitHub PRs or issues: do not close, label, edit, comment on, approve, merge, or mark PRs ready.
            - Do NOT run raw `gh`; use `rtk gh ...` for GitHub evidence.
            - Do NOT commit, push, merge, or open a PR. The workflow handles that after this step.
            - If multiple existing PRs need human disposition rather than code changes, report the recommended action clearly and make no file changes.
            - If there is no actionable change to make, make no file changes and return a concise report listing the auto PRs inspected, any risk patterns found, why no new PR should be created, and what evidence supports that conclusion.
            - If you do make changes, keep the final report evidence-based and include what was inspected, why the systemic fix is appropriate, changed files, verification performed, and review notes.
            Operate as the `kos-audit-auto-prs` agent: first read `.claude/agents/kos-audit-auto-prs.md` and follow it as your operating contract (it enforces this prompt's rules and adds run-mined failure knowledge), then perform the task.

      - name: Fail on Claude soft failure
        if: always() && steps.claude_run.outputs.claude_failed == 'true'
        run: |
          echo "::error::Claude soft failure: ${{ steps.claude_run.outputs.claude_failure_reason }}"
          exit 1

      - name: Detect duplicate auto PR audit fix
        id: duplicate
        if: steps.claude_run.outputs.claude_changed_files_list != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          node .github/workflows/scripts/find-duplicate-automation-pr.cjs \
            --repo "${{ github.repository }}" \
            --base-ref main \
            --exclude-head "${{ steps.branch.outputs.branch_name }}" \
            --detect-overlap \
            --overlap-label auto-fix \
            --github-output "$GITHUB_OUTPUT"

      - name: Log duplicate audit result
        if: steps.duplicate.outputs.duplicate_found == 'true' || steps.duplicate.outputs.overlap_found == 'true'
        run: |
          if [ "${{ steps.duplicate.outputs.duplicate_found }}" = 'true' ]; then
            echo "Skipping duplicate auto PR audit fix."
            echo "Existing PR: #${{ steps.duplicate.outputs.duplicate_pr_number }} ${{ steps.duplicate.outputs.duplicate_pr_url }}"
            echo "Reason: ${{ steps.duplicate.outputs.duplicate_reason }}"
          fi
          if [ "${{ steps.duplicate.outputs.overlap_found }}" = 'true' ]; then
            echo "Deferring auto PR audit fix; another automation PR already edits the same file(s)."
            echo "Overlapping PR: #${{ steps.duplicate.outputs.overlap_pr_number }} ${{ steps.duplicate.outputs.overlap_pr_url }}"
            echo "Reason: ${{ steps.duplicate.outputs.overlap_reason }}"
          fi

      - uses: ./.github/actions/commit-and-push
        id: push
        if: steps.pending_audit.outputs.pending != 'true' && steps.duplicate.outputs.duplicate_found != 'true' && steps.duplicate.outputs.overlap_found != 'true'
        with:
          branch-name: ${{ steps.branch.outputs.branch_name }}
          commit-message: 'ci(workflows): audit automation-created PRs'
          github-token: ${{ secrets.GH_PAT }}

      - name: Build auto PR audit body
        id: pr-body
        if: steps.push.outputs.pushed == 'true'
        uses: ./.github/actions/build-automation-pr-body
        with:
          workflow-name: audit-auto-prs
          problem: 'Scheduled auto-PR audit found an actionable systemic pattern in automation-created pull requests.'
          source-run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          base-ref: main
          changed-files: ${{ steps.claude_run.outputs.claude_changed_files_list }}
          evidence: |
            Auto PR audit report:
            ${{ steps.claude_run.outputs.claude_last_output }}
          execution-file: ${{ steps.claude_run.outputs.last_execution_file }}
          structured-output: ${{ steps.claude_run.outputs.structured_output }}
          claude-last-output: ${{ steps.claude_run.outputs.claude_last_output }}
          review-notes: 'Ready-for-review PR. Existing PRs were not mutated; review any human-disposition recommendations in the audit evidence before merging.'

      - name: Create auto PR audit fix PR
        if: steps.push.outputs.pushed == 'true'
        uses: ./.github/actions/upsert-pull-request
        with:
          github-token: ${{ secrets.GH_PAT }}
          base: main
          branch-name: ${{ steps.branch.outputs.branch_name }}
          title: 'ci(workflows): audit automation-created PRs'
          body: ${{ steps.pr-body.outputs.body }}
          labels: auto-fix,needs-review,area/workflows
          draft: 'false'
          require-rich-body: 'true'

      - name: Write no-change audit summary
        if: steps.push.outputs.pushed != 'true'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PENDING: ${{ steps.pending_audit.outputs.pending }}
          PENDING_PR: ${{ steps.pending_audit.outputs.pending_pr }}
          DUPLICATE_FOUND: ${{ steps.duplicate.outputs.duplicate_found }}
          DUPLICATE_PR_NUMBER: ${{ steps.duplicate.outputs.duplicate_pr_number }}
          DUPLICATE_PR_URL: ${{ steps.duplicate.outputs.duplicate_pr_url }}
          DUPLICATE_REASON: ${{ steps.duplicate.outputs.duplicate_reason }}
          OVERLAP_FOUND: ${{ steps.duplicate.outputs.overlap_found }}
          OVERLAP_PR_NUMBER: ${{ steps.duplicate.outputs.overlap_pr_number }}
          OVERLAP_PR_URL: ${{ steps.duplicate.outputs.overlap_pr_url }}
          OVERLAP_REASON: ${{ steps.duplicate.outputs.overlap_reason }}
          STRUCTURED_OUTPUT: ${{ steps.claude_run.outputs.structured_output }}
          CLAUDE_LAST_OUTPUT: ${{ steps.claude_run.outputs.claude_last_output }}
        run: |
          {
            echo "## Auto PR Audit"
            echo
            echo "- Source run: ${RUN_URL}"
            if [ "$PENDING" = "true" ]; then
              echo "- Result: skipped - audit PR #${PENDING_PR} already open"
            elif [ "$DUPLICATE_FOUND" = "true" ]; then
              echo "- Result: duplicate fix suppressed"
              echo "- Existing PR: #${DUPLICATE_PR_NUMBER} ${DUPLICATE_PR_URL}"
              echo "- Reason: ${DUPLICATE_REASON}"
            elif [ "$OVERLAP_FOUND" = "true" ]; then
              echo "- Result: deferred — same-file overlap with another automation PR"
              echo "- Overlapping PR: #${OVERLAP_PR_NUMBER} ${OVERLAP_PR_URL}"
              echo "- Reason: ${OVERLAP_REASON}"
            else
              echo "- Result: no PR created"
            fi
            echo
            if [ -n "$STRUCTURED_OUTPUT" ]; then
              echo "### Structured Report"
              echo
              echo '```json'
              printf '%s\n' "$STRUCTURED_OUTPUT"
              echo '```'
              echo
            fi
            if [ -n "$CLAUDE_LAST_OUTPUT" ]; then
              echo "### Audit Notes"
              echo
              printf '%s\n' "$CLAUDE_LAST_OUTPUT"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  reconcile:
    name: Reconcile resolved audit issues
    needs: [audit-auto-prs]
    if: needs.audit-auto-prs.result == 'success'
    runs-on: self-hosted
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GH_PAT }}
          node-version: ${{ env.NODE_VERSION }}

      - name: Reconcile resolved dependency-vuln tracking issues
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          ./.github/workflows/scripts/reconcile-audit-issues.sh

  report-failure:
    needs: [audit-auto-prs]
    if: failure()
    runs-on: self-hosted
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          node-version: ${{ env.NODE_VERSION }}

      - uses: ./.github/actions/report-failure
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mode: issue
          auto-fix-run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          issue-title: '[audit-auto-prs] Auto PR audit workflow failed'
          labels: auto-fix,ci-failure
          ensure-labels: auto-fix,ci-failure
          dispatch-triage: 'true'
          claude-step-outcome: ${{ needs.audit-auto-prs.result }}
          claude-turns: ${{ needs.audit-auto-prs.outputs.claude_num_turns }}
          claude-is-error: ${{ needs.audit-auto-prs.outputs.claude_is_error }}
          claude-used-attempt: ${{ needs.audit-auto-prs.outputs.claude_used_attempt }}
          claude-failure-reason: ${{ needs.audit-auto-prs.outputs.claude_failure_reason }}
          claude-metrics-json: ${{ needs.audit-auto-prs.outputs.claude_metrics_json }}
