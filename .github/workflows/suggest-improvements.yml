name: Suggest Improvements

on:
  schedule:
    - cron: '11 0 * * *' # Daily at 00:11 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  MAX_TURNS: 50
  NODE_VERSION: '24.x'

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  suggest-improvements:
    runs-on: [self-hosted, big]
    timeout-minutes: 10
    outputs:
      claude_failed: ${{ steps.claude_run.outputs.claude_failed }}
      claude_failure_reason: ${{ steps.claude_run.outputs.claude_failure_reason }}
      claude_num_turns: ${{ steps.claude_run.outputs.claude_num_turns }}
      claude_is_error: ${{ steps.claude_run.outputs.claude_is_error }}
      claude_used_attempt: ${{ steps.claude_run.outputs.claude_used_attempt }}
      claude_metrics_json: ${{ steps.claude_run.outputs.claude_metrics_json }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GH_PAT }}
          node-version: ${{ env.NODE_VERSION }}
          install-gsd: 'true'
          install-rtk: 'true'
          install-uv: 'true'

      - name: Check for pending suggest-improvements PRs
        id: pending_suggest
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          node .github/workflows/scripts/check-pending-automation-pr.cjs \
            --repo "${{ github.repository }}" \
            --base-ref main \
            --title-prefix 'planning: repo-wide improvement follow-ups' \
            --exclude-head 'claude-workflow-optimize-${{ github.run_id }}' \
            --github-output "$GITHUB_OUTPUT"

      - name: Gather open PR context for dedup
        if: steps.pending_suggest.outputs.pending != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          {
            echo "# Open Automation PRs (for dedup context)"
            echo ""
            gh pr list --repo "${{ github.repository }}" --state open \
              --base main \
              --limit 100 \
              --json number,title,headRefName,labels \
              --jq '.[] | "## #\(.number): \(.title)\nBranch: \(.headRefName)\nLabels: \([.labels[].name] | join(", "))\n"' \
              || { echo "::error::gh pr list failed; aborting dedup context gather." >&2; exit 1; }
          } > /tmp/open-prs-context.md
          TOTAL_LINES=$(wc -l < /tmp/open-prs-context.md)
          if [ "$TOTAL_LINES" -gt 300 ]; then
            head -300 /tmp/open-prs-context.md > /tmp/open-prs-context.tmp
            mv /tmp/open-prs-context.tmp /tmp/open-prs-context.md
            {
              echo ""
              echo "> Warning: $((TOTAL_LINES - 300)) more lines truncated - run \`gh pr list\` for the full set. Treat this list as non-exhaustive when deduplicating."
            } >> /tmp/open-prs-context.md
          fi
          echo "Wrote $(wc -l < /tmp/open-prs-context.md) lines to /tmp/open-prs-context.md"

      - name: Prepare improvement branch
        id: branch
        if: steps.pending_suggest.outputs.pending != 'true'
        uses: ./.github/actions/prepare-automation-branch
        with:
          branch-name: claude-workflow-optimize-${{ github.run_id }}
          github-token: ${{ secrets.GH_PAT }}

      - name: Propose repo-wide improvement follow-ups
        if: steps.pending_suggest.outputs.pending != 'true'
        id: claude_run
        uses: ./.github/actions/run-zai
        with:
          api-key: ${{ secrets.ZAI_API_KEY }}
          github-token: ${{ secrets.GH_PAT }}
          max-turns: '${{ env.MAX_TURNS }}'
          track-progress: 'true'
          allowed-bots: 'claude[bot],github-actions[bot]'
          allowed-tools: 'Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(ls *),Bash(cat *),Bash(grep *),Bash(find *),Bash(head *),Bash(tail *),Bash(sort *),Bash(wc *),Bash(rtk:*),mcp__plugin_serena_serena__find_symbol,mcp__plugin_serena_serena__get_symbols_overview,mcp__plugin_serena_serena__find_referencing_symbols,mcp__plugin_serena_serena__find_implementations,mcp__plugin_serena_serena__find_declaration,mcp__plugin_serena_serena__search_for_pattern,mcp__plugin_serena_serena__find_file,mcp__plugin_serena_serena__list_dir,mcp__plugin_serena_serena__read_file,mcp__plugin_serena_serena__get_diagnostics_for_file,mcp__plugin_context7_context7__query-docs,mcp__plugin_context7_context7__resolve-library-id'
          plugin-marketplaces: |-
            https://github.com/anthropics/claude-plugins-official.git
            https://github.com/juliusbrussee/caveman.git
          plugins: |-
            context7@claude-plugins-official
            serena@claude-plugins-official
            caveman@caveman
          prompt: |
            /gsd:explore
            Perform a deep architectural review of the repository.
            Identify technical debt, missing abstractions, or performance bottlenecks, then record 2-3 concrete follow-up improvements.

            **Before proposing new improvements**, read `/tmp/open-prs-context.md` to see what work is already in progress or proposed in open PRs. Exclude any topics that are already covered by existing open PRs to avoid duplication.

            Allowed edit scope:
            - `.planning/ROADMAP.md`
            - `.planning/quick/**`

            Hard rules:
            - Do NOT edit source code, workflows, package manifests, or tests.
            - Do NOT run `git` or `gh`.
            - Do NOT commit, push, merge, or open issues/PRs. The workflow handles that.
            - Keep proposals concrete, non-duplicative, and ready for human review.
            - If there are no worthwhile follow-up proposals, make no file changes.

      - name: Fail on Claude soft failure
        if: always() && steps.claude_run.outputs.claude_failed == 'true'
        run: |
          echo "::error::Claude soft failure: ${{ steps.claude_run.outputs.claude_failure_reason }}"
          exit 1

      - uses: ./.github/actions/commit-and-push
        id: push
        if: steps.pending_suggest.outputs.pending != 'true'
        with:
          branch-name: ${{ steps.branch.outputs.branch_name }}
          commit-message: 'docs(planning): propose repo improvement follow-ups'

      - name: Log no-changes result
        if: steps.push.outputs.pushed != 'true'
        env:
          PENDING: ${{ steps.pending_suggest.outputs.pending }}
          PENDING_PR: ${{ steps.pending_suggest.outputs.pending_pr }}
        run: |
          if [ "$PENDING" = "true" ]; then
            echo "Skipped: pending suggest-improvements PR #${PENDING_PR} already open."
          else
            echo "No worthwhile repo-wide improvement proposals were identified."
          fi

      - name: Build improvement planning PR body
        id: pr-body
        if: steps.push.outputs.pushed == 'true'
        uses: ./.github/actions/build-automation-pr-body
        with:
          workflow-name: suggest-improvements
          problem: 'Repository-wide improvement scan found follow-up planning proposals worth manual review.'
          source-run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          base-ref: main
          changed-files: ${{ steps.claude_run.outputs.claude_changed_files_list }}
          execution-file: ${{ steps.claude_run.outputs.last_execution_file }}
          structured-output: ${{ steps.claude_run.outputs.structured_output }}
          claude-last-output: ${{ steps.claude_run.outputs.claude_last_output }}
          review-notes: 'Planning intake PR. Merge is automated after CI, PR Policy, core review, and security review pass; merged artifacts are picked up by the 4x/day GSD planning executor.'

      - name: Create improvement planning PR
        if: steps.push.outputs.pushed == 'true'
        uses: ./.github/actions/upsert-pull-request
        with:
          github-token: ${{ secrets.GH_PAT }}
          base: main
          branch-name: ${{ steps.branch.outputs.branch_name }}
          title: 'planning: repo-wide improvement follow-ups'
          body: ${{ steps.pr-body.outputs.body }}
          labels: planning-intake-open
          draft: 'false'
          require-rich-body: 'true'

  report-failure:
    needs: [suggest-improvements]
    if: failure()
    runs-on: self-hosted
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          node-version: ${{ env.NODE_VERSION }}

      - uses: ./.github/actions/report-failure
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mode: issue
          auto-fix-run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          issue-title: '[suggest-improvements] Repo improvement workflow failed'
          labels: auto-fix,ci-failure
          ensure-labels: auto-fix,ci-failure
          dispatch-triage: 'true'
          claude-step-outcome: ${{ needs.suggest-improvements.result }}
          claude-turns: ${{ needs.suggest-improvements.outputs.claude_num_turns }}
          claude-is-error: ${{ needs.suggest-improvements.outputs.claude_is_error }}
          claude-used-attempt: ${{ needs.suggest-improvements.outputs.claude_used_attempt }}
          claude-failure-reason: ${{ needs.suggest-improvements.outputs.claude_failure_reason }}
          claude-metrics-json: ${{ needs.suggest-improvements.outputs.claude_metrics_json }}
