name: Suggest Improvements

on:
  schedule:
    - cron: "0 0 * * *" # Daily at midnight
  workflow_dispatch:

concurrency:
  group: suggest-improvements-${{ github.sha }}
  cancel-in-progress: false

env:
  MAX_TURNS: 100
  NODE_VERSION: "22.x"

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  suggest-improvements:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Setup git identity
        run: |
          git config --global user.email "claude[bot]@users.noreply.github.com"
          git config --global user.name "claude[bot]"

      - name: Create improvement branch
        id: branch
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          BRANCH_NAME="claude-workflow-optimize-${RUN_ID}"
          git checkout -b "$BRANCH_NAME"
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-environment
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-gsd: "true"
          install-rtk: "true"

      - name: Propose repo-wide improvement follow-ups
        uses: ./.github/actions/run-zai
        with:
          api-key: ${{ secrets.ZAI_API_KEY }}
          max-turns: "${{ env.MAX_TURNS }}"
          track-progress: "true"
          allowed-bots: "claude[bot],github-actions[bot]"
          allowed-tools: "Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(ls *),Bash(cat *),Bash(grep *),Bash(find *),Bash(head *),Bash(tail *),Bash(sort *),Bash(wc *)"
          prompt: |
            /gsd-explore
            Perform a deep architectural review of the repository.
            Identify technical debt, missing abstractions, or performance bottlenecks, then record 2-3 concrete follow-up improvements.

            Allowed edit scope:
            - `.planning/ROADMAP.md`
            - `.planning/quick/**`

            Hard rules:
            - Do NOT edit source code, workflows, package manifests, or tests.
            - Do NOT run `git` or `gh`.
            - Do NOT commit, push, merge, or open issues/PRs. The workflow handles that.
            - Keep proposals concrete, non-duplicative, and ready for human review.
            - If there are no worthwhile follow-up proposals, make no file changes.

      - name: Check for planning changes
        id: changes
        run: |
          if git diff --quiet HEAD; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/commit-and-push
        id: push
        if: steps.changes.outputs.has_changes == 'true'
        with:
          branch-name: ${{ steps.branch.outputs.branch_name }}
          commit-message: "docs(planning): propose repo improvement follow-ups"
          token: ${{ secrets.GH_PAT }}

      - name: Create improvement planning PR
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          BRANCH_NAME: ${{ steps.branch.outputs.branch_name }}
        run: |
          BODY=$(cat <<'EOF'
          Repo-wide architectural improvement proposals generated by the `suggest-improvements` workflow.

          This draft PR is intentionally manual-only under repository policy.
          EOF
          )
          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "planning: repo-wide improvement follow-ups" \
            --body "$BODY" \
            --draft
