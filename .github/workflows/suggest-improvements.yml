name: Suggest Improvements

on:
  schedule:
    - cron: '11 0 * * *' # Daily at 00:11 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  MAX_TURNS: 100
  NODE_VERSION: '22.x'

permissions:
  contents: write
  pull-requests: write

jobs:
  suggest-improvements:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Prepare improvement branch
        id: branch
        uses: ./.github/actions/prepare-automation-branch
        with:
          branch-name: claude-workflow-optimize-${{ github.run_id }}

      - uses: ./.github/actions/setup-environment
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-gsd: 'true'
          install-rtk: 'true'

      - name: Propose repo-wide improvement follow-ups
        uses: ./.github/actions/run-zai
        with:
          api-key: ${{ secrets.ZAI_API_KEY }}
          max-turns: '${{ env.MAX_TURNS }}'
          track-progress: 'true'
          allowed-bots: 'claude[bot],github-actions[bot]'
          allowed-tools: 'Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(ls *),Bash(cat *),Bash(grep *),Bash(find *),Bash(head *),Bash(tail *),Bash(sort *),Bash(wc *)'
          prompt: |
            /gsd-explore
            Perform a deep architectural review of the repository.
            Identify technical debt, missing abstractions, or performance bottlenecks, then record 2-3 concrete follow-up improvements.

            Allowed edit scope:
            - `.planning/ROADMAP.md`
            - `.planning/quick/**`

            Hard rules:
            - Do NOT edit source code, workflows, package manifests, or tests.
            - Do NOT run `git` or `gh`.
            - Do NOT commit, push, merge, or open issues/PRs. The workflow handles that.
            - Keep proposals concrete, non-duplicative, and ready for human review.
            - If there are no worthwhile follow-up proposals, make no file changes.

      - uses: ./.github/actions/commit-and-push
        id: push
        with:
          branch-name: ${{ steps.branch.outputs.branch_name }}
          commit-message: 'docs(planning): propose repo improvement follow-ups'
          token: ${{ secrets.GH_PAT }}

      - name: Log no-changes result
        if: steps.push.outputs.pushed != 'true'
        run: echo "No worthwhile repo-wide improvement proposals were identified."

      - name: Create improvement planning PR
        if: steps.push.outputs.pushed == 'true'
        uses: ./.github/actions/upsert-pull-request
        with:
          github-token: ${{ secrets.GH_PAT }}
          base: main
          branch-name: ${{ steps.branch.outputs.branch_name }}
          title: 'planning: repo-wide improvement follow-ups'
          body: |
            Repo-wide architectural improvement proposals generated by the `suggest-improvements` workflow.

            This draft PR is intentionally manual-only under repository policy.
          draft: 'true'
