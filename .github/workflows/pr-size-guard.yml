name: PR Size Guard

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: pr-size-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  size-check:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          setup-node: 'false'
          setup-bun: 'false'

      - name: Check PR size
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ADDITIONS: ${{ github.event.pull_request.additions }}
          DELETIONS: ${{ github.event.pull_request.deletions }}
          FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          TOTAL=$((ADDITIONS + DELETIONS))

          if [ "$TOTAL" -gt 500 ]; then
            gh pr comment "$PR_NUMBER" --body "> **Large PR** ($TOTAL lines across $FILES files)
          >
          > Consider splitting into smaller, focused PRs for easier review."
            gh pr edit "$PR_NUMBER" --add-label "large-pr" 2>/dev/null || true
          fi
