name: PR Size Guard

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: pr-size-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  size-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: setup_environment
        uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-auth-mode: ${{ vars.GH_AUTH_MODE || 'env' }}
          setup-node: 'false'
          setup-bun: 'false'

      - name: Sync large PR warning
        env:
          REST_COUNTER_PRELOAD: ${{ steps.setup_environment.outputs.rest-counter-preload }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ADDITIONS: ${{ github.event.pull_request.additions }}
          DELETIONS: ${{ github.event.pull_request.deletions }}
          FILES: ${{ github.event.pull_request.changed_files }}
        shell: bash
        run: |
          TOTAL=$((ADDITIONS + DELETIONS))
          preload=()
          if [[ -n "$REST_COUNTER_PRELOAD" && -r "$REST_COUNTER_PRELOAD" ]]; then
            preload=(--require "$REST_COUNTER_PRELOAD")
          fi
          node "${preload[@]}" .github/workflows/scripts/upsert-pr-size-comment.cjs \
            --pr "$PR_NUMBER" \
            --total "$TOTAL" \
            --files "$FILES"
