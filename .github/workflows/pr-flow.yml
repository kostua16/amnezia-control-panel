name: PR Orchestrator

run-name: "PR Orchestrator ${{ github.event.pull_request.number && format('PR #{0}', github.event.pull_request.number) || github.event.issue.number && format('PR #{0}', github.event.issue.number) || github.event.inputs.pr_number || github.event.workflow_run.pull_requests[0].number && format('PR #{0}', github.event.workflow_run.pull_requests[0].number) || startsWith(github.event.workflow_run.display_title || '', 'PR #') && github.event.workflow_run.display_title || github.event.workflow_run.head_branch || github.run_id }}"

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
      - labeled
      - unlabeled
  workflow_run:
    workflows:
      [
        'CI',
        'PR Policy',
        'Code Review',
        'Dependency Review',
        'PR Improve',
        'PR Finalizer',
      ]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to orchestrate'
        required: true
        type: string
      dry_run:
        description: 'Evaluate and print the decision without labels or dispatches'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  checks: read
  statuses: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  # Isolate pull_request_target runs in `pr-flow-prt-<PR#>` from every reactive
  # wake — workflow_run (check/worker completions), issue_comment, and
  # workflow_dispatch — which share `pr-flow-wake-<PR#>`. The prt orchestrate is
  # the only run that reports a check on the PR, so it must never be cancelled by
  # a wake: a fast check completion or a bot issue_comment otherwise cancels it
  # mid-run and the "PR Orchestrator" check shows as cancelled. prt state-change
  # runs still cancel older prt runs via cancel-in-progress below; wakes collapse
  # among themselves without touching prt.
  group: pr-flow-${{ (github.event_name == 'pull_request_target' && 'prt') || 'wake' }}-${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr_number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.display_title || github.event.workflow_run.head_branch || github.run_id }}
  # Label churn must not cancel an in-flight orchestration run; only meaningful PR events cancel older runs.
  cancel-in-progress: ${{ github.event_name != 'pull_request_target' || (github.event.action != 'labeled' && github.event.action != 'unlabeled') }}

jobs:
  classify-trigger:
    if: >-
      (
        github.event_name != 'workflow_run' ||
        toJSON(github.event.workflow_run.pull_requests) != '[]' ||
        startsWith(github.event.workflow_run.display_title || '', 'PR #')
      ) &&
      (
        github.event_name != 'issue_comment' ||
        (
          github.event.issue.pull_request != null &&
          (
            contains(github.event.comment.body, '/approve') ||
            contains(github.event.comment.body, '/review') ||
            (
              github.event.comment.user.login == 'kilo-code-bot[bot]' &&
              contains(github.event.comment.body, '<!-- kilo-review -->')
            )
          )
        )
      )
    runs-on: self-hosted
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.classify.outputs.should_run }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        if: github.event_name == 'pull_request_target'

      - name: Classify PR flow trigger
        id: classify
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request_target" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          node .github/workflows/scripts/evaluate-trigger-policy.cjs \
            --mode pr-flow-pull-request-target \
            --policy-file .github/workflows/policy.json \
            --config-file .github/pr-flow.json \
            --event-path "$GITHUB_EVENT_PATH" \
            --event-name "$GITHUB_EVENT_NAME" \
            > /tmp/pr-flow-event-policy.json
          echo "should_run=$(jq -r '.should_run' /tmp/pr-flow-event-policy.json)" >> "$GITHUB_OUTPUT"

  orchestrate:
    needs: classify-trigger
    if: >-
      needs.classify-trigger.outputs.should_run == 'true' &&
      (
        github.event_name != 'pull_request_target' ||
        (
          github.event.action != 'labeled' &&
          github.event.action != 'unlabeled'
        ) ||
        github.event.pull_request.draft != true
      )
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          install-deps: 'false'

      - name: Evaluate PR flow issue-comment trigger
        id: comment
        if: github.event_name == 'issue_comment'
        shell: bash
        run: |
          node .github/workflows/scripts/evaluate-trigger-policy.cjs \
            --mode pr-flow-control \
            --policy-file .github/workflows/policy.json \
            --event-path "$GITHUB_EVENT_PATH" \
            --event-name "$GITHUB_EVENT_NAME" \
            > /tmp/pr-flow-comment-policy.json
          {
            echo "should_run=$(jq -r '.should_run' /tmp/pr-flow-comment-policy.json)"
            echo "approve_requested=$(jq -r '.approve_requested' /tmp/pr-flow-comment-policy.json)"
            echo "review_requested=$(jq -r '.review_requested' /tmp/pr-flow-comment-policy.json)"
            echo "pr_number=$(jq -r '.pr_number // empty' /tmp/pr-flow-comment-policy.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Ensure maintainer approval label exists
        if: github.event_name == 'issue_comment' && steps.comment.outputs.approve_requested == 'true'
        uses: ./.github/actions/ensure-workflow-labels
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          policy-file: .github/workflows/policy.json
          names: maintainer-approved

      - name: Record maintainer approval
        if: github.event_name == 'issue_comment' && steps.comment.outputs.approve_requested == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.comment.outputs.pr_number }}
          APPROVER: ${{ github.actor }}
        run: |
          gh issue edit "$PR_NUMBER" --add-label "maintainer-approved"
          gh issue comment "$PR_NUMBER" --body "Maintainer approval recorded by @$APPROVER. PR flow will continue after required checks and review signals pass."

      - name: Orchestrate PR flow
        if: github.event_name != 'issue_comment' || steps.comment.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.comment.outputs.pr_number || github.event.inputs.pr_number || '' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          node .github/workflows/scripts/orchestrate-pr-flow.cjs \
            --event-name "$GITHUB_EVENT_NAME" \
            --event-path "$GITHUB_EVENT_PATH" \
            --config-file .github/pr-flow.json \
            --policy-file .github/workflows/policy.json \
            --pr-number "$PR_NUMBER" \
            --dry-run "$DRY_RUN"
