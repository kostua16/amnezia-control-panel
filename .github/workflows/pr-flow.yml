name: PR Orchestrator

run-name: "PR Orchestrator ${{ github.event.pull_request.number && format('PR #{0}', github.event.pull_request.number) || github.event.issue.number && format('PR #{0}', github.event.issue.number) || github.event.inputs.pr_number || github.event.workflow_run.pull_requests[0].number && format('PR #{0}', github.event.workflow_run.pull_requests[0].number) || startsWith(github.event.workflow_run.display_title || '', 'PR #') && github.event.workflow_run.display_title || github.event.workflow_run.head_branch || github.run_id }}"

on:
  issue_comment:
    types: [created, edited]
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
      - labeled
      - unlabeled
  workflow_run:
    workflows:
      [
        'CI',
        'PR Policy',
        'Code Review',
        'Dependency Review',
        'PR Improve',
        'PR Finalizer',
      ]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to orchestrate'
        required: true
        type: string
      dry_run:
        description: 'Evaluate and print the decision without labels or dispatches'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  checks: read
  statuses: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  # Three isolated groups per PR:
  # - `pr-flow-prt-<PR#>`: pull_request_target runs. The prt orchestrate is the
  #   only run that reports a check on the PR, so it must never be cancelled by
  #   a wake; prt state-change runs still cancel older prt runs via
  #   cancel-in-progress below (restart on new commit), except labeled/unlabeled
  #   (anti-thrash: orchestrate itself adds `flow/*` labels).
  # - `pr-flow-noise-<PR#>`: issue_comment runs authored by github-actions[bot]
  #   (sticky-comment upserts from the orchestrator, project-manager state
  #   comments, worker reports). These can never pass the maintainer gate in
  #   evaluate-trigger-policy, so they are always no-ops — but GitHub applies
  #   concurrency cancellation at run creation, BEFORE job `if:` gates run.
  #   Keeping them out of the wake group means a no-op bot comment can never
  #   cancel or displace a real reactive wake (the failure that left PRs stuck
  #   at flow/checks-pending after CI went green).
  # - `pr-flow-kiloedit-<PR#>`: edits of the Kilo sticky comment. Kilo edits it
  #   twice per review and the second edit only grows the review history;
  #   classify-trigger drops that edit. Its own group means a dropped edit can
  #   only displace another Kilo edit, never a pending check/worker or command
  #   wake. cancel-in-progress is false, so the in-flight first edit finishes.
  #   KILO_EDIT_FILTER=off restores the previous grouping (edits in `wake`).
  # - `pr-flow-wake-<PR#>`: every other reactive wake — workflow_run
  #   (check/worker completions), human/kilo issue_comment, workflow_dispatch.
  #   cancel-in-progress is false for wakes: an in-flight wake (including one
  #   queued waiting for a runner) always finishes, while queued
  #   wakes still collapse newest-wins via GitHub's pending-run replacement.
  group: pr-flow-${{ (github.event_name == 'pull_request_target' && 'prt') || (github.event_name == 'issue_comment' && github.event.comment.user.login == 'github-actions[bot]' && 'noise') || (github.event_name == 'issue_comment' && github.event.action == 'edited' && github.event.comment.user.login == 'kilo-code-bot[bot]' && vars.KILO_EDIT_FILTER != 'off' && 'kiloedit') || 'wake' }}-${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr_number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.display_title || github.event.workflow_run.head_branch || github.run_id }}
  # Only prt state-change runs cancel older runs; label churn and reactive wakes never cancel an in-flight run.
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' && github.event.action != 'labeled' && github.event.action != 'unlabeled' }}

jobs:
  classify-trigger:
    if: >-
      (
        github.event_name != 'workflow_run' ||
        toJSON(github.event.workflow_run.pull_requests) != '[]' ||
        startsWith(github.event.workflow_run.display_title || '', 'PR #')
      ) &&
      (
        github.event_name != 'issue_comment' ||
        (
          github.event.issue.pull_request != null &&
          github.event.comment.user.login != 'github-actions[bot]' &&
          (
            contains(github.event.comment.body, '/approve') ||
            contains(github.event.comment.body, '/review') ||
            (
              github.event.comment.user.login == 'kilo-code-bot[bot]' &&
              contains(github.event.comment.body, '<!-- kilo-review -->')
            )
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.classify.outputs.should_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
        if: github.event_name == 'pull_request_target'

      # Base-branch checkout for the Kilo history-only edit classifier (a git
      # fetch, no REST). Non-fatal on purpose: if it fails the classifier call
      # below fails too and the fallback keeps the wake, so a checkout blip can
      # never drop a verdict-changing edit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        continue-on-error: true
        with:
          persist-credentials: false
        if: >-
          github.event_name == 'issue_comment' &&
          github.event.action == 'edited' &&
          github.event.comment.user.login == 'kilo-code-bot[bot]' &&
          vars.KILO_EDIT_FILTER != 'off'

      - name: Classify PR flow trigger
        id: classify
        shell: bash
        env:
          EVENT_ACTION: ${{ github.event.action }}
          COMMENT_LOGIN: ${{ github.event.comment.user.login }}
          # `off` (any case, like the expressions above) disables the Kilo history-only edit filter without a commit.
          KILO_EDIT_FILTER: ${{ vars.KILO_EDIT_FILTER || '' }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "issue_comment" && "$EVENT_ACTION" == "edited" && "$COMMENT_LOGIN" == "kilo-code-bot[bot]" && "${KILO_EDIT_FILTER,,}" != "off" ]]; then
            # A history-only Kilo edit cannot change the verdict; any classifier
            # failure keeps the wake.
            if ! node .github/workflows/scripts/classify-kilo-comment-edit.cjs \
              --event-path "$GITHUB_EVENT_PATH" \
              --filter "$KILO_EDIT_FILTER" >> "$GITHUB_OUTPUT"; then
              echo "should_run=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          if [[ "$GITHUB_EVENT_NAME" != "pull_request_target" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          node .github/workflows/scripts/evaluate-trigger-policy.cjs \
            --mode pr-flow-pull-request-target \
            --policy-file .github/workflows/policy.json \
            --config-file .github/pr-flow.json \
            --event-path "$GITHUB_EVENT_PATH" \
            --event-name "$GITHUB_EVENT_NAME" \
            > /tmp/pr-flow-event-policy.json
          echo "should_run=$(jq -r '.should_run' /tmp/pr-flow-event-policy.json)" >> "$GITHUB_OUTPUT"

  orchestrate:
    needs: classify-trigger
    if: >-
      needs.classify-trigger.outputs.should_run == 'true' &&
      (
        github.event_name != 'pull_request_target' ||
        (
          github.event.action != 'labeled' &&
          github.event.action != 'unlabeled'
        ) ||
        github.event.pull_request.draft != true
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        id: setup_environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-auth-mode: ${{ vars.GH_AUTH_MODE || 'env' }}
          install-deps: 'false'

      - name: Evaluate PR flow issue-comment trigger
        id: comment
        if: github.event_name == 'issue_comment'
        shell: bash
        run: |
          node .github/workflows/scripts/evaluate-trigger-policy.cjs \
            --mode pr-flow-control \
            --policy-file .github/workflows/policy.json \
            --event-path "$GITHUB_EVENT_PATH" \
            --event-name "$GITHUB_EVENT_NAME" \
            > /tmp/pr-flow-comment-policy.json
          {
            echo "should_run=$(jq -r '.should_run' /tmp/pr-flow-comment-policy.json)"
            echo "approve_requested=$(jq -r '.approve_requested' /tmp/pr-flow-comment-policy.json)"
            echo "review_requested=$(jq -r '.review_requested' /tmp/pr-flow-comment-policy.json)"
            echo "pr_number=$(jq -r '.pr_number // empty' /tmp/pr-flow-comment-policy.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Ensure maintainer approval label exists
        if: github.event_name == 'issue_comment' && steps.comment.outputs.approve_requested == 'true'
        uses: ./.github/actions/ensure-workflow-labels
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          policy-file: .github/workflows/policy.json
          names: maintainer-approved

      - name: Record maintainer approval
        if: github.event_name == 'issue_comment' && steps.comment.outputs.approve_requested == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.comment.outputs.pr_number }}
          APPROVER: ${{ github.actor }}
        run: |
          gh issue edit "$PR_NUMBER" --add-label "maintainer-approved"
          gh issue comment "$PR_NUMBER" --body "Maintainer approval recorded by @$APPROVER. PR flow will continue after required checks and review signals pass."

      - name: Orchestrate PR flow
        if: github.event_name != 'issue_comment' || steps.comment.outputs.should_run == 'true'
        shell: bash
        env:
          REST_COUNTER_PRELOAD: ${{ steps.setup_environment.outputs.rest-counter-preload }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.comment.outputs.pr_number || github.event.inputs.pr_number || '' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          # Kilo review input transport: graphql | rest. Empty keeps the script default; set the repository variable to `rest` to roll back without a commit.
          PR_FLOW_REVIEW_SOURCE: ${{ vars.PR_FLOW_REVIEW_SOURCE || '' }}
          # Worker run lookup: head | legacy. Empty keeps the script default; set the repository variable to `legacy` to roll back to the per-workflow lookup without a commit.
          PR_FLOW_WORKER_RUNS_SOURCE: ${{ vars.PR_FLOW_WORKER_RUNS_SOURCE || '' }}
          # Kilo severities that block pr-flow/kilo-review (comma-separated). Empty keeps the script default `critical,warning` (SUGGESTION-only reviews pass); set the repository variable to `all` to make every finding block again without a commit. Auto Cover Review passes the same variable.
          KILO_BLOCKING_SEVERITIES: ${{ vars.KILO_BLOCKING_SEVERITIES || '' }}
        run: |
          preload=()
          if [[ -n "$REST_COUNTER_PRELOAD" && -r "$REST_COUNTER_PRELOAD" ]]; then
            preload=(--require "$REST_COUNTER_PRELOAD")
          fi
          node "${preload[@]}" .github/workflows/scripts/orchestrate-pr-flow.cjs \
            --event-name "$GITHUB_EVENT_NAME" \
            --event-path "$GITHUB_EVENT_PATH" \
            --config-file .github/pr-flow.json \
            --policy-file .github/workflows/policy.json \
            --pr-number "$PR_NUMBER" \
            --dry-run "$DRY_RUN"
