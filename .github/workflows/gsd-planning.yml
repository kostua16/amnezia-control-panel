name: Claude GSD Planning

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      phase:
        description: 'Phase identifier to plan or refresh (for example 13.4)'
        required: true
        type: string
      dry_run:
        description: 'Analyze without pushing a planning PR'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: gsd-planning-${{ github.event.inputs.phase || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

env:
  MAX_TURNS: '60'
  NODE_VERSION: '22.x'

jobs:
  authorize:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        startsWith(github.event.comment.body, '/gsd-plan')
      )
    runs-on: self-hosted
    timeout-minutes: 10
    outputs:
      should-run: ${{ steps.resolve.outputs.should_run }}
      phase: ${{ steps.resolve.outputs.phase }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve planning trigger
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
          INPUT_PHASE: ${{ github.event.inputs.phase || '' }}
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association || '' }}
        run: |
          set -euo pipefail
          should_run=false
          phase="$INPUT_PHASE"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            should_run=true
          elif printf '%s' "$COMMENT_BODY" | grep -Eq '^/gsd-plan([[:space:]]+[0-9]+(\.[0-9]+)?)?'; then
            case "$AUTHOR_ASSOCIATION" in OWNER|MEMBER|COLLABORATOR) should_run=true ;; esac
            phase=$(printf '%s' "$COMMENT_BODY" | sed -nE 's|^/gsd-plan[[:space:]]+([0-9]+(\.[0-9]+)?).*|\1|p' | head -1)
          fi
          if [ -z "$phase" ]; then phase="13"; fi
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          echo "phase=$phase" >> "$GITHUB_OUTPUT"

  plan:
    needs: [authorize]
    if: needs.authorize.outputs.should-run == 'true'
    runs-on: [self-hosted, big]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GH_PAT }}
          node-version: ${{ env.NODE_VERSION }}
          install-gsd: 'true'
          install-rtk: 'true'
          install-uv: 'true'

      - uses: ./.github/actions/setup-bot-git

      - name: Prepare GSD planning branch
        id: branch
        uses: ./.github/actions/prepare-automation-branch
        with:
          branch-name: claude-planning-pr-${{ needs.authorize.outputs.phase }}-${{ github.run_id }}
          github-token: ${{ secrets.GH_PAT }}

      - name: Refresh GSD phase plan
        id: claude_run
        uses: ./.github/actions/run-zai
        with:
          api-key: ${{ secrets.ZAI_API_KEY }}
          github-token: ${{ secrets.GH_PAT }}
          max-turns: ${{ env.MAX_TURNS }}
          track-progress: 'false'
          allowed-bots: 'github-actions[bot],claude[bot]'
          allowed-tools: 'Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(npm *),Bash(npx *),Bash(node *),Bash(ls *),Bash(cat *),Bash(grep *),Bash(find *),Bash(head *),Bash(tail *),Bash(sort *),Bash(wc *),Bash(rtk:*),mcp__plugin_serena_serena__find_symbol,mcp__plugin_serena_serena__get_symbols_overview,mcp__plugin_serena_serena__find_referencing_symbols,mcp__plugin_serena_serena__find_implementations,mcp__plugin_serena_serena__find_declaration,mcp__plugin_serena_serena__search_for_pattern,mcp__plugin_serena_serena__find_file,mcp__plugin_serena_serena__list_dir,mcp__plugin_serena_serena__read_file,mcp__plugin_serena_serena__get_diagnostics_for_file,mcp__plugin_context7_context7__query-docs,mcp__plugin_context7_context7__resolve-library-id'
          plugin-marketplaces: |-
            https://github.com/anthropics/claude-plugins-official.git
            https://github.com/juliusbrussee/caveman.git
          plugins: |-
            context7@claude-plugins-official
            serena@claude-plugins-official
            caveman@caveman
          prompt: |
            /gsd:plan-phase
            Refresh planning artifacts for phase `${{ needs.authorize.outputs.phase }}`.

            Scope:
            - Edit only `.planning/**` planning artifacts.
            - Keep generated planning PRs limited to planning artifacts so PR flow can auto-merge them after CI plus core/security review.
            - Preserve existing phase intake markers.
            - Update phase tracking status, acceptance criteria, and verification checklist when missing.
            - Do not modify application source, package manifests, or workflow logic.
            - Do not commit or push; the workflow handles that.

      - uses: ./.github/actions/commit-and-push
        id: push
        if: (github.event.inputs.dry_run || 'false') != 'true'
        with:
          branch-name: ${{ steps.branch.outputs.branch_name }}
          commit-message: 'docs(planning): refresh GSD phase ${{ needs.authorize.outputs.phase }}'

      - name: Build planning PR body
        id: pr-body
        if: steps.push.outputs.pushed == 'true'
        uses: ./.github/actions/build-automation-pr-body
        with:
          workflow-name: gsd-planning
          problem: 'Claude GSD planning automation refreshed phase `${{ needs.authorize.outputs.phase }}` tracking artifacts.'
          source-run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          base-ref: main
          changed-files: ${{ steps.claude_run.outputs.claude_changed_files_list }}
          execution-file: ${{ steps.claude_run.outputs.last_execution_file }}
          structured-output: ${{ steps.claude_run.outputs.structured_output }}
          claude-last-output: ${{ steps.claude_run.outputs.claude_last_output }}
          review-notes: 'Planning intake PR. Merge is automated after CI, PR Policy, core review, and security review pass; merged artifacts are picked up by the 4x/day GSD planning executor.'

      - name: Create GSD planning PR
        if: steps.push.outputs.pushed == 'true'
        uses: ./.github/actions/upsert-pull-request
        with:
          github-token: ${{ secrets.GH_PAT }}
          base: main
          branch-name: ${{ steps.branch.outputs.branch_name }}
          title: 'planning: refresh GSD phase ${{ needs.authorize.outputs.phase }}'
          body: ${{ steps.pr-body.outputs.body }}
          labels: planning-intake-open
          draft: 'false'
          require-rich-body: 'true'
