name: Performance Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['src/**', 'package.json', 'next.config.*']

permissions:
  actions: read
  pull-requests: write
  contents: read

concurrency:
  group: perf-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bundle-size:
    runs-on: [self-hosted, big]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          install-deps: 'true'
          generate-prisma: 'true'
          cache-nextjs: 'true'
          require-gh-auth: 'false'

      - name: Build and measure PR
        id: pr-build
        run: |
          set -euo pipefail
          START=$(date +%s)
          npm run build 2>&1 | tail -20 > /tmp/build-output.txt
          END=$(date +%s)
          DURATION=$((END - START))
          SIZE=$(du -sb .next | cut -f1)
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "duration=$DURATION" >> "$GITHUB_OUTPUT"
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Resolve main build metrics baseline
        id: main-baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          node .github/workflows/scripts/build-metrics.cjs baseline \
            --repo "$GH_REPO" \
            --base-sha "$BASE_SHA" \
            --download-dir "$RUNNER_TEMP/build-metrics-baseline"

      - name: Compare and comment
        if: always() && steps.pr-build.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_SIZE: ${{ steps.pr-build.outputs.size }}
          PR_DURATION: ${{ steps.pr-build.outputs.duration }}
          BASELINE_FOUND: ${{ steps.main-baseline.outputs.baseline_found }}
          BASELINE_REASON: ${{ steps.main-baseline.outputs.baseline_reason }}
          BASELINE_SOURCE: ${{ steps.main-baseline.outputs.baseline_source }}
          MAIN_SIZE: ${{ steps.main-baseline.outputs.main_size }}
          MAIN_DURATION: ${{ steps.main-baseline.outputs.main_duration }}
          MAIN_SHA: ${{ steps.main-baseline.outputs.main_sha }}
          MAIN_RUN_URL: ${{ steps.main-baseline.outputs.main_run_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          post_comment() {
            local body="$1"
            local attempt

            for attempt in 1 2 3; do
              if gh pr comment "$PR_NUMBER" --body "$body"; then
                return 0
              fi

              if [ "$attempt" -lt 3 ]; then
                sleep 5
              fi
            done

            echo "::warning::Failed to post Performance Check comment after 3 attempts; keeping metrics job green."
            return 0
          }

          PR_SIZE_MB=$(echo "scale=2; $PR_SIZE / 1048576" | bc)

          if [ "$BASELINE_FOUND" != "true" ] || [ -z "$MAIN_SIZE" ] || [ -z "$MAIN_DURATION" ]; then
            BODY="## :warning: Build Performance

          | Metric | PR |
          |--------|-----|
          | Bundle size | ${PR_SIZE_MB}MB |
          | Build time | ${PR_DURATION}s |

          > **Note:** Main baseline metrics unavailable. Comparison skipped.
          > ${BASELINE_REASON:-No build metrics artifact found.}"
            post_comment "$BODY"
            exit 0
          fi

          if [ "$MAIN_SIZE" -eq 0 ]; then MAIN_SIZE=1; fi

          SIZE_DIFF=$(( (PR_SIZE - MAIN_SIZE) * 100 / MAIN_SIZE ))
          TIME_DIFF=$(( (PR_DURATION - MAIN_DURATION) * 100 / (MAIN_DURATION + 1) ))

          PR_SIZE_MB=$(echo "scale=2; $PR_SIZE / 1048576" | bc)
          MAIN_SIZE_MB=$(echo "scale=2; $MAIN_SIZE / 1048576" | bc)
          MAIN_SHA_SHORT="${MAIN_SHA:0:8}"

          if [ "$SIZE_DIFF" -gt 5 ] || [ "$TIME_DIFF" -gt 20 ]; then
            ICON="warning"
          else
            ICON="white_check_mark"
          fi

          BODY="## :${ICON}: Build Performance

          Baseline: [main ${MAIN_SHA_SHORT}](${MAIN_RUN_URL}) (${BASELINE_SOURCE})

          | Metric | main | PR | Delta |
          |--------|------|-----|-------|
          | Bundle size | ${MAIN_SIZE_MB}MB | ${PR_SIZE_MB}MB | ${SIZE_DIFF}% |
          | Build time | ${MAIN_DURATION}s | ${PR_DURATION}s | ${TIME_DIFF}% |"

          if [ "$SIZE_DIFF" -gt 5 ]; then
            BODY="$BODY

          > **Warning:** Bundle size increased by ${SIZE_DIFF}%. Please review."
          fi
          if [ "$TIME_DIFF" -gt 20 ]; then
            BODY="$BODY

          > **Warning:** Build time increased by ${TIME_DIFF}%. Consider investigating."
          fi

          post_comment "$BODY"
