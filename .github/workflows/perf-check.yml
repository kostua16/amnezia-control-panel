name: Performance Check

on:
  pull_request:
    paths: ['src/**', 'package.json', 'next.config.*']

permissions:
  pull-requests: write
  contents: read

concurrency:
  group: perf-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bundle-size:
    runs-on: [self-hosted, big]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          install-deps: "true"
          generate-prisma: "true"
          install-rtk: "true"

      - name: Build and measure PR
        id: pr-build
        run: |
          set -euo pipefail
          START=$(date +%s)
          npm run build 2>&1 | tail -20 > /tmp/build-output.txt
          END=$(date +%s)
          DURATION=$((END - START))
          SIZE=$(du -sb .next | cut -f1)
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "duration=$DURATION" >> "$GITHUB_OUTPUT"
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Prepare main baseline worktree
        run: |
          git worktree remove --force /tmp/perf-main 2>/dev/null || true
          rm -rf /tmp/perf-main
          git worktree add /tmp/perf-main origin/main

      - name: Build and measure main
        id: main-build
        continue-on-error: true
        working-directory: /tmp/perf-main
        run: |
          set -euo pipefail
          npm ci
          npx prisma generate
          START=$(date +%s)
          npm run build 2>&1 | tail -20 > /tmp/main-build-output.txt
          END=$(date +%s)
          DURATION=$((END - START))
          SIZE=$(du -sb .next | cut -f1)
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "duration=$DURATION" >> "$GITHUB_OUTPUT"
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Cleanup main baseline worktree
        if: always()
        run: git worktree remove --force /tmp/perf-main || true

      - name: Compare and comment
        if: always() && steps.pr-build.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_SIZE: ${{ steps.pr-build.outputs.size }}
          PR_DURATION: ${{ steps.pr-build.outputs.duration }}
          MAIN_SIZE: ${{ steps.main-build.outputs.size }}
          MAIN_DURATION: ${{ steps.main-build.outputs.duration }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          PR_SIZE_MB=$(echo "scale=2; $PR_SIZE / 1048576" | bc)

          if [ -z "$MAIN_SIZE" ] || [ -z "$MAIN_DURATION" ]; then
            BODY="## :warning: Build Performance

          | Metric | PR |
          |--------|-----|
          | Bundle size | ${PR_SIZE_MB}MB |
          | Build time | ${PR_DURATION}s |

          > **Note:** Main baseline build did not complete. Comparison unavailable."
            gh pr comment "$PR_NUMBER" --body "$BODY"
            exit 0
          fi

          if [ "$MAIN_SIZE" -eq 0 ]; then MAIN_SIZE=1; fi

          SIZE_DIFF=$(( (PR_SIZE - MAIN_SIZE) * 100 / MAIN_SIZE ))
          TIME_DIFF=$(( (PR_DURATION - MAIN_DURATION) * 100 / (MAIN_DURATION + 1) ))

          PR_SIZE_MB=$(echo "scale=2; $PR_SIZE / 1048576" | bc)
          MAIN_SIZE_MB=$(echo "scale=2; $MAIN_SIZE / 1048576" | bc)

          if [ "$SIZE_DIFF" -gt 5 ] || [ "$TIME_DIFF" -gt 20 ]; then
            ICON="warning"
          else
            ICON="white_check_mark"
          fi

          BODY="## :${ICON}: Build Performance

          | Metric | main | PR | Delta |
          |--------|------|-----|-------|
          | Bundle size | ${MAIN_SIZE_MB}MB | ${PR_SIZE_MB}MB | ${SIZE_DIFF}% |
          | Build time | ${MAIN_DURATION}s | ${PR_DURATION}s | ${TIME_DIFF}% |"

          if [ "$SIZE_DIFF" -gt 5 ]; then
            BODY="$BODY

          > **Warning:** Bundle size increased by ${SIZE_DIFF}%. Please review."
          fi
          if [ "$TIME_DIFF" -gt 20 ]; then
            BODY="$BODY

          > **Warning:** Build time increased by ${TIME_DIFF}%. Consider investigating."
          fi

          gh pr comment "$PR_NUMBER" --body "$BODY"
