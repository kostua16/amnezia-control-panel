name: Antigravity Code Review Workflow

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR Number to review'
        required: true
        type: string
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  antigravity-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify API Key Presence
        id: check-secrets
        run: |
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ] && [ -z "${{ secrets.AV_API_KEY }}" ]; then
            echo "Error: Neither GEMINI_API_KEY nor AV_API_KEY secret is configured."
            echo "missing=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Fetch PR Details
        id: pr-info
        if: steps.check-secrets.outputs.missing != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM="${{ github.event.inputs.pr_number || github.event.pull_request.number }}"
          if [ -z "$PR_NUM" ]; then
            echo "No PR number provided."
            exit 1
          fi
          echo "pr_num=$PR_NUM" >> "$GITHUB_OUTPUT"

          # Fetch PR diff
          gh pr diff "$PR_NUM" > pr_diff.patch

      - name: Run Antigravity CLI for Review
        id: agy-review
        if: steps.check-secrets.outputs.missing != 'true'
        uses: ./.github/actions/run-antigravity
        with:
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          av-api-key: ${{ secrets.AV_API_KEY }}
          prompt: |
            You are an expert AI code reviewer. Please review the following code changes for bugs, security issues, and code quality improvements. Keep your feedback concise and actionable.

            $(cat pr_diff.patch)

      - name: Post Review Comment
        if: steps.check-secrets.outputs.missing != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `${{ steps.run-antigravity.outputs.output }}`;
            const prNum = parseInt(`${{ steps.pr-info.outputs.pr_num }}`);
            github.rest.issues.createComment({
              issue_number: prNum,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Apply Review Label
        if: steps.check-secrets.outputs.missing != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNum = parseInt(`${{ steps.pr-info.outputs.pr_num }}`);
            const output = `${{ steps.run-antigravity.outputs.output }}`.toLowerCase();
            const label = output.includes("blocking concern") ? "antigravity-review-concerns" : "antigravity-review-passed";

            github.rest.issues.addLabels({
              issue_number: prNum,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: [label]
            });
