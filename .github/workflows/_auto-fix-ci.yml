name: _Auto Fix CI

on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
      head-branch:
        required: true
        type: string
      triggering-run-id:
        required: true
        type: string
      triggering-run-url:
        required: true
        type: string
      pr-number:
        required: false
        type: string
        default: ''
    secrets:
      GH_PAT:
        required: true
      ZAI_API_KEY:
        required: true
    outputs:
      pr-number:
        description: 'Linked PR number for PR-triggered auto-fix runs'
        value: ${{ jobs.fix.outputs.pr-number }}
      pushed:
        description: 'Whether the auto-fix workflow pushed a branch'
        value: ${{ jobs.fix.outputs.pushed }}
      claude-metrics-json:
        description: 'Parsed Claude metrics JSON from the auto-fix run'
        value: ${{ jobs.fix.outputs.claude_metrics_json }}
      claude-failure-reason:
        description: 'Claude failure reason from the auto-fix run'
        value: ${{ jobs.fix.outputs.claude_failure_reason }}
      claude-num-turns:
        description: 'Claude turn count from the auto-fix run'
        value: ${{ jobs.fix.outputs.claude_num_turns }}
      claude-is-error:
        description: 'Claude is_error value from the auto-fix run'
        value: ${{ jobs.fix.outputs.claude_is_error }}
      claude-used-attempt:
        description: 'Claude attempt number from the auto-fix run'
        value: ${{ jobs.fix.outputs.claude_used_attempt }}

permissions:
  contents: read
  actions: read

env:
  NODE_VERSION: '22.x'
  MAX_TURNS: '70'

jobs:
  fix:
    runs-on: [self-hosted, big]
    timeout-minutes: 10
    outputs:
      pr-number: ${{ steps.pr-context.outputs.pr_number }}
      pushed: ${{ steps.push.outputs.pushed }}
      claude_failure_reason: ${{ steps.claude_run.outputs.claude_failure_reason }}
      claude_num_turns: ${{ steps.claude_run.outputs.claude_num_turns }}
      claude_is_error: ${{ steps.claude_run.outputs.claude_is_error }}
      claude_used_attempt: ${{ steps.claude_run.outputs.claude_used_attempt }}
      claude_metrics_json: ${{ steps.claude_run.outputs.claude_metrics_json }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.head-branch }}
          fetch-depth: 1
          token: ${{ secrets.GH_PAT }}

      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GH_PAT }}
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve linked PR
        id: pr-context
        shell: bash
        env:
          PR_NUMBER: ${{ inputs.pr-number }}
        run: echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Compute fix branch name
        id: branch-name
        shell: bash
        env:
          HEAD_BRANCH: ${{ inputs.head-branch }}
          RUN_ID: ${{ github.run_id }}
        run: |
          SAFE_BRANCH=$(printf '%s' "$HEAD_BRANCH" | tr -cd 'a-zA-Z0-9/_.-')
          echo "branch_name=claude-auto-fix-ci-${SAFE_BRANCH}-${RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Prepare fix branch
        id: branch
        uses: ./.github/actions/prepare-automation-branch
        with:
          branch-name: ${{ steps.branch-name.outputs.branch_name }}
          github-token: ${{ secrets.GH_PAT }}

      - name: Collect CI failure context
        id: failure
        uses: ./.github/actions/collect-workflow-failure-context
        with:
          run-id: ${{ inputs.triggering-run-id }}
          head-branch: ${{ inputs.head-branch }}
          file-cap: '6'

      - name: Log skip reason
        if: steps.failure.outputs.fixable != 'true'
        shell: bash
        run: |
          echo "Auto-fix skipped: ${{ steps.failure.outputs.reason || 'workflow did not detect a safe, fixable failure' }}"

      - uses: ./.github/actions/prettier-auto-fix
        id: prettier
        if: steps.failure.outputs.fixable == 'true'
        with:
          run-id: ${{ inputs.triggering-run-id }}
          github-token: ${{ secrets.GH_PAT }}
          node-version: ${{ env.NODE_VERSION }}

      - uses: ./.github/actions/setup-environment
        if: steps.failure.outputs.fixable == 'true' && steps.prettier.outputs.prettier_only != 'true'
        with:
          github-token: ${{ secrets.GH_PAT }}
          node-version: ${{ env.NODE_VERSION }}
          install-deps: 'true'
          generate-prisma: 'true'
          install-gsd: 'true'
          install-rtk: 'true'
          install-uv: 'true'

      - name: Warm TypeScript cache
        if: steps.failure.outputs.fixable == 'true' && steps.prettier.outputs.prettier_only != 'true'
        run: npx tsc --noEmit 2>/dev/null || true

      - name: Build ZAI prompt
        id: prompt
        if: steps.failure.outputs.fixable == 'true' && steps.prettier.outputs.prettier_only != 'true'
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          RUN_URL: ${{ steps.failure.outputs.run_url }}
          FAILED_JOBS_JSON: ${{ steps.failure.outputs.failed_jobs_json }}
          ERROR_LOGS_JSON: ${{ steps.failure.outputs.error_logs_json }}
          PR_NUMBER: ${{ steps.pr-context.outputs.pr_number }}
          BRANCH_NAME: ${{ steps.branch.outputs.branch_name }}
          BASE_BRANCH: ${{ inputs.head-branch }}
          REPOSITORY: ${{ github.repository }}
          AFFECTED_FILES: ${{ steps.failure.outputs.affected_files_csv }}
        run: |
          FAILED_JOBS=$(node <<'NODE'
          const jobs = JSON.parse(process.env.FAILED_JOBS_JSON || '[]');
          process.stdout.write(jobs.join(', '));
          NODE
          )

          {
            DELIM="EOF-$(openssl rand -hex 8)"
            echo "content<<$DELIM"
            echo "/gsd:debug"
            echo "Failed CI Run: $RUN_URL"
            echo "Failed Jobs: $FAILED_JOBS"
            if [ "$MODE" = "pr" ] && [ -n "$PR_NUMBER" ]; then
              echo "PR Number: $PR_NUMBER"
            fi
            echo "Branch Name: $BRANCH_NAME"
            echo "Base Branch: $BASE_BRANCH"
            echo "Repository: $REPOSITORY"
            echo
            echo "Error logs:"
            echo "$ERROR_LOGS_JSON"
            echo
            if [ -n "$AFFECTED_FILES" ]; then
              echo "Affected files: $AFFECTED_FILES"
            else
              echo "Affected files: (extract from error logs above)"
            fi
            echo
            echo "=== CI AUTO-FIX PROTOCOL ==="
            echo
            echo "SCOPE (MANDATORY):"
            echo "- Maximum 6 files total. Count before editing. If you need more, STOP and report."
            echo "- Fix ONLY files listed in Affected files above, or files directly referenced in error logs."
            echo "- Read each file max 2 times before editing."
            echo "- Identify the SINGLE root cause — fix that, not symptoms."
            echo
            echo "PRIORITY: Fix type errors first (they often cause lint errors downstream)."
            echo
            echo "ANTI-CASCADE: If your fix creates NEW errors in unrelated files, your approach is wrong."
            echo "Revert and try a different approach. Do NOT expand scope to chase cascading errors."
            echo
            echo "EARLY EXIT (CRITICAL): After EACH fix cycle, run \`npx tsc --noEmit && npm run lint\`."
            echo "If BOTH pass → STOP immediately. Do NOT make additional improvements."
            echo "If build is needed: run \`npm run build\`. If it passes → STOP."
            echo
            echo "DO NOT commit or push — the workflow handles that."
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - id: claude_run
        uses: ./.github/actions/run-zai
        if: steps.failure.outputs.fixable == 'true' && steps.prettier.outputs.prettier_only != 'true'
        with:
          api-key: ${{ secrets.ZAI_API_KEY }}
          github-token: ${{ secrets.GH_PAT }}
          allowed-bots: 'claude[bot],github-actions[bot]'
          allowed-tools: 'Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(ls:*),Bash(cat:*),Bash(grep:*),Bash(find:*),Bash(head:*),Bash(tail:*),Bash(sort:*),Bash(wc:*),Bash(rtk:*),mcp__plugin_serena_serena__find_symbol,mcp__plugin_serena_serena__get_symbols_overview,mcp__plugin_serena_serena__find_referencing_symbols,mcp__plugin_serena_serena__find_implementations,mcp__plugin_serena_serena__find_declaration,mcp__plugin_serena_serena__search_for_pattern,mcp__plugin_serena_serena__find_file,mcp__plugin_serena_serena__list_dir,mcp__plugin_serena_serena__read_file,mcp__plugin_serena_serena__get_diagnostics_for_file,mcp__plugin_context7_context7__query-docs,mcp__plugin_context7_context7__resolve-library-id,mcp__plugin_typescript-lsp__*'
          max-turns: ${{ env.MAX_TURNS }}
          plugin-marketplaces: |-
            https://github.com/anthropics/claude-plugins-official.git
            https://github.com/juliusbrussee/caveman.git
          plugins: |-
            typescript-lsp@claude-plugins-official
            serena@claude-plugins-official
            context7@claude-plugins-official
            code-review@claude-plugins-official
            security-guidance@claude-plugins-official
            code-simplifier@claude-plugins-official
            frontend-design@claude-plugins-official
            superpowers@claude-plugins-official
            caveman@caveman
          prompt: ${{ steps.prompt.outputs.content }}

      - name: Validate (CI-matching gate)
        id: gate
        # Not gated on claude_changed_files_list: the prettier_only path skips
        # run-zai (claude_run), so that output is empty there. Gate whenever a
        # fix is attempted; commit-and-push handles the no-change case.
        if: steps.failure.outputs.fixable == 'true'
        uses: ./.github/actions/validate-pr-gate

      - uses: ./.github/actions/commit-and-push
        id: push
        if: steps.failure.outputs.fixable == 'true' && steps.gate.outputs.gate_passed == 'true'
        with:
          branch-name: ${{ steps.branch.outputs.branch_name }}
          commit-message: "${{ steps.prettier.outputs.prettier_only == 'true' && 'style: auto-fix prettier formatting' || 'fix(ci): auto-fix CI failures' }}"

      - name: Log no-changes result
        if: steps.failure.outputs.fixable == 'true' && steps.push.outputs.pushed != 'true'
        shell: bash
        run: echo "No reviewable CI auto-fix changes were produced."

      - name: Find related failure issues
        id: failure-issues
        if: steps.push.outputs.pushed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          BRANCH: ${{ inputs.head-branch }}
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const branch = process.env.BRANCH;
            const q = [
              `repo:${context.repo.owner}/${context.repo.repo}`,
              'is:issue', 'is:open',
              'label:auto-fix', 'label:ci-failure',
              `"${branch}" in:title`
            ].join(' ');
            try {
              const result = await github.rest.search.issuesAndPullRequests({ q, per_page: 10 });
              const nums = result.data.items.map(i => String(i.number)).join(',');
              core.setOutput('issue_numbers', nums);
            } catch (e) {
              core.warning(`Issue search failed: ${e.message}`);
              core.setOutput('issue_numbers', '');
            }

      - name: Build pull request body
        id: pr-body
        if: steps.push.outputs.pushed == 'true'
        uses: ./.github/actions/build-automation-pr-body
        with:
          workflow-name: _auto-fix-ci
          problem: 'CI failed on branch `${{ inputs.head-branch }}` and the auto-fix lane produced reviewable changes.'
          source-run-url: ${{ steps.failure.outputs.run_url }}
          source-pr-url: ${{ steps.pr-context.outputs.pr_number != '' && format('{0}/{1}/pull/{2}', github.server_url, github.repository, steps.pr-context.outputs.pr_number) || '' }}
          base-ref: ${{ inputs.head-branch }}
          changed-files: ${{ steps.claude_run.outputs.claude_changed_files_list }}
          rationale: ${{ steps.prettier.outputs.prettier_only == 'true' && 'The failed run matched a formatter-only failure; the workflow applied the Prettier auto-fix path without invoking ZAI.' || steps.claude_run.outputs.claude_last_output }}
          failed-jobs: ${{ steps.failure.outputs.failed_jobs_json }}
          error-logs: ${{ steps.failure.outputs.error_logs_json }}
          affected-files: ${{ steps.failure.outputs.affected_files_csv }}
          execution-file: ${{ steps.claude_run.outputs.last_execution_file }}
          structured-output: ${{ steps.claude_run.outputs.structured_output }}
          claude-last-output: ${{ steps.claude_run.outputs.claude_last_output }}
          closing-issues: ${{ steps.failure-issues.outputs.issue_numbers }}
          review-notes: 'This PR was created by the CI auto-fix workflow. Workflow and planning changes remain manual-only under repository policy.'

      - name: Upsert fix PR
        if: steps.push.outputs.pushed == 'true'
        uses: ./.github/actions/upsert-pull-request
        with:
          github-token: ${{ secrets.GH_PAT }}
          base: ${{ inputs.head-branch }}
          branch-name: ${{ steps.branch.outputs.branch_name }}
          title: "${{ inputs.mode == 'pr' && format('fix(ci): auto-fix failures from #{0}', steps.pr-context.outputs.pr_number) || format('fix(ci): auto-fix failures on {0}', inputs.head-branch) }}"
          body: ${{ steps.pr-body.outputs.body }}
          labels: auto-fix
          draft: 'false'
          allow-update: 'true'
          require-rich-body: 'true'
