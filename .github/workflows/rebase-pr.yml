name: Rebase PR

# Maintainer-triggered branch refresh: rebases one open same-repo PR onto its
# current base branch. Clean rebases validate and push with --force-with-lease;
# run-zai (opus) is invoked only when Git enters a conflict state. This is a
# branch-refresh tool, never a merge tool: it updates the SAME PR branch in
# place, posts one sticky summary, and wakes the existing PR orchestrator.
#
# SECURITY: same trust model as fix-review.yml -- PR code runs build/test with
# contents:write, so only maintainers may trigger this (policy gate) and the
# conflict-resolution agent gets no gh / write-git scope (it cannot bypass the
# gate, push, merge, or comment). All dynamic values flow through env:/with:;
# nothing attacker-controlled is interpolated into a run: command.

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to rebase'
        required: true
        type: string
      head_sha:
        description: 'Expected head SHA (stale-guard; leave empty to skip)'
        required: false
        type: string
      dry_run:
        description: 'Evaluate and validate without pushing'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  # Non-command, bot, or non-PR comments get a unique group so they cannot
  # cancel an in-progress run. Mirrors fix-review.yml: only a human "/rebase"
  # PR comment (or a workflow_dispatch) shares the PR-wide group. The exact-body
  # match (== '/rebase') stays in lockstep with evaluate-trigger-policy.cjs
  # mode rebase-pr.
  group: ${{ ((github.event_name == 'issue_comment' && !(github.event.issue.pull_request != null && github.event.comment.user.type != 'Bot' && github.event.comment.body == '/rebase')) && format('rebase-pr-ignored-{0}', github.run_id)) || format('rebase-pr-{0}', github.event.issue.number || github.event.inputs.pr_number || github.run_id) }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.x'
  MAX_TURNS: '70'

jobs:
  authorize:
    if: >-
      github.event_name != 'issue_comment' ||
      (
        github.event.issue.pull_request != null &&
        github.event.comment.body == '/rebase' &&
        github.event.comment.user.type != 'Bot'
      )
    runs-on: self-hosted
    timeout-minutes: 10
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      trusted: ${{ steps.gate.outputs.trusted }}
      pr-number: ${{ steps.gate.outputs.pr_number }}
      command: ${{ steps.gate.outputs.command }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          node-version: ${{ env.NODE_VERSION }}
      - name: Evaluate trigger trust
        id: gate
        shell: bash
        run: |
          node .github/workflows/scripts/evaluate-trigger-policy.cjs \
            --mode rebase-pr \
            --policy-file .github/workflows/policy.json \
            --event-path "$GITHUB_EVENT_PATH" \
            --event-name "$GITHUB_EVENT_NAME" > /tmp/rebase-pr-gate.json
          {
            echo "should_run=$(jq -r '.should_run' /tmp/rebase-pr-gate.json)"
            echo "trusted=$(jq -r '.trusted' /tmp/rebase-pr-gate.json)"
            echo "pr_number=$(jq -r '.pr_number // empty' /tmp/rebase-pr-gate.json)"
            echo "command=$(jq -r '.command // empty' /tmp/rebase-pr-gate.json)"
          } >> "$GITHUB_OUTPUT"

  rebase:
    needs: [authorize]
    if: needs.authorize.outputs.should_run == 'true' && needs.authorize.outputs.trusted == 'true'
    runs-on: [self-hosted, big]
    timeout-minutes: 45
    steps:
      - name: Checkout trusted workflow revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Export trusted rebase control scripts
        run: |
          control_dir="${RUNNER_TEMP:?}/rebase-control"
          rm -rf "$control_dir"
          mkdir -p "$control_dir"
          cp -R .github/workflows/scripts "$control_dir/scripts"
          cp .github/workflows/policy.json "$control_dir/policy.json"
          echo "REBASE_CONTROL_DIR=$control_dir" >> "$GITHUB_ENV"

      - name: Resolve PR head and eligibility
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PR_NUMBER: ${{ needs.authorize.outputs.pr-number }}
          EXPECTED_HEAD_SHA: ${{ github.event.inputs.head_sha }}
        run: |
          gh pr view "$PR_NUMBER" \
            --json number,state,mergedAt,isDraft,headRefName,headRefOid,baseRefName,isCrossRepository,autoMergeRequest,labels,commits > /tmp/rebase-pr.json
          node "$REBASE_CONTROL_DIR/scripts/evaluate-pr-policy.cjs" \
            --policy-file "$REBASE_CONTROL_DIR/policy.json" \
            --pr-file /tmp/rebase-pr.json > /tmp/rebase-eval.json
          node "$REBASE_CONTROL_DIR/scripts/evaluate-rebase-eligibility.cjs" \
            --pr-file /tmp/rebase-pr.json \
            --eval-file /tmp/rebase-eval.json \
            --expected-head-sha "${EXPECTED_HEAD_SHA:-}" >> "$GITHUB_OUTPUT"

      - name: React and post skipped (ineligible)
        if: steps.pr.outputs.eligible != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.authorize.outputs.pr-number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          REASON: ${{ steps.pr.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$COMMENT_ID" ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" -f content=eyes || true
          fi
          # Pass the specific ineligibility cause so the sticky summary names
          # the blocking condition instead of the generic cause list.
          node "$REBASE_CONTROL_DIR/scripts/upsert-rebase-comment.cjs" \
            --pr "$PR_NUMBER" --head-sha "$HEAD_SHA" --run-url "$RUN_URL" --reason "$REASON" --mode skipped
          exit 0

      - name: React eyes
        if: steps.pr.outputs.eligible == 'true' && github.event.comment.id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" -f content=eyes

      - name: Post started
        if: steps.pr.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.authorize.outputs.pr-number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node "$REBASE_CONTROL_DIR/scripts/upsert-rebase-comment.cjs" \
            --pr "$PR_NUMBER" --head-sha "$HEAD_SHA" --base-ref "$BASE_REF" \
            --run-url "$RUN_URL" --mode started

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        if: steps.pr.outputs.eligible == 'true'
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - uses: ./.github/actions/setup-environment
        if: steps.pr.outputs.eligible == 'true'
        with:
          github-token: ${{ secrets.GH_PAT }}
          node-version: ${{ env.NODE_VERSION }}
          install-deps: 'true'
          generate-prisma: 'true'
          install-gsd: 'true'
          install-rtk: 'true'
          install-uv: 'true'

      - uses: ./.github/actions/setup-bot-git
        if: steps.pr.outputs.eligible == 'true'
        with:
          github-token: ${{ secrets.GH_PAT }}

      - name: Baseline validation (CI-matching gate before rebase)
        id: baseline_gate
        if: steps.pr.outputs.eligible == 'true'
        uses: ./.github/actions/validate-pr-gate

      - name: Restore tracked files after baseline validation
        if: steps.pr.outputs.eligible == 'true'
        run: |
          # Validation commands may regenerate tracked framework artifacts such
          # as next-env.d.ts. Keep the captured gate outputs, but make the
          # checkout clean before git rebase inspects the working tree.
          if ! git diff --quiet || ! git diff --cached --quiet; then
            git status --short
            git reset --hard HEAD
          fi

      - name: Prepare branch (fetch base, capture heads)
        id: prep
        if: steps.pr.outputs.eligible == 'true'
        env:
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          git rev-parse HEAD > "$RUNNER_TEMP/original-head.txt"
          git rev-parse "origin/$BASE_REF" > "$RUNNER_TEMP/base-head.txt"
          echo "base_sha=$(git rev-parse "origin/$BASE_REF")" >> "$GITHUB_OUTPUT"

      - name: Check rebase ancestry
        id: ancestry
        if: steps.pr.outputs.eligible == 'true'
        env:
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
        run: |
          node "$REBASE_CONTROL_DIR/scripts/analyze-rebase-ancestry.cjs" \
            --pr-file /tmp/rebase-pr.json \
            --base-ref "$BASE_REF" >> "$GITHUB_OUTPUT"

      - name: Post ancestry failure
        if: always() && steps.pr.outputs.eligible == 'true' && steps.ancestry.outputs.ok != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.authorize.outputs.pr-number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          BASE_SHA: ${{ steps.ancestry.outputs.base_sha }}
          MERGE_BASE: ${{ steps.ancestry.outputs.merge_base }}
          REPLAY_COUNT: ${{ steps.ancestry.outputs.replay_count }}
          VISIBLE_COMMIT_COUNT: ${{ steps.ancestry.outputs.visible_commit_count }}
          REASON: ${{ steps.ancestry.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node "$REBASE_CONTROL_DIR/scripts/upsert-rebase-comment.cjs" \
            --pr "$PR_NUMBER" \
            --head-sha "$HEAD_SHA" \
            --base-ref "$BASE_REF" \
            --base-sha "$BASE_SHA" \
            --merge-base "$MERGE_BASE" \
            --replay-count "$REPLAY_COUNT" \
            --visible-commit-count "$VISIBLE_COMMIT_COUNT" \
            --reason "$REASON" \
            --run-url "$RUN_URL" \
            --mode ancestry-failed
          exit 1

      - name: Collect review feedback
        id: feedback
        if: steps.pr.outputs.eligible == 'true' && steps.ancestry.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.authorize.outputs.pr-number }}
        run: |
          out="$RUNNER_TEMP/rebase-review-feedback.md"
          node "$REBASE_CONTROL_DIR/scripts/collect-review-feedback.cjs" \
            --pr "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --out "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - name: Summarize review feedback presence
        id: fbsummary
        if: steps.pr.outputs.eligible == 'true' && steps.ancestry.outputs.ok == 'true'
        run: |
          file="${{ steps.feedback.outputs.path }}"
          present=$(node -e '
            const fs=require("fs");
            const { bundleHasActionableFeedback } = require(process.env.REBASE_CONTROL_DIR + "/scripts/collect-review-feedback.cjs");
            const s=fs.existsSync(process.argv[1])?fs.readFileSync(process.argv[1],"utf8"):"";
            process.stdout.write(bundleHasActionableFeedback(s)?"true":"false");
          ' "$file")
          echo "present=$present" >> "$GITHUB_OUTPUT"

      - name: Attempt rebase
        id: attempt
        if: steps.pr.outputs.eligible == 'true' && steps.ancestry.outputs.ok == 'true'
        env:
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
        run: |
          set +e
          git rebase "origin/$BASE_REF"
          status=$?
          set -e
          git_dir=$(git rev-parse --git-dir)
          if [ "$status" -eq 0 ]; then
            echo "rebase_state=clean" >> "$GITHUB_OUTPUT"
          elif [ -d "$git_dir/rebase-merge" ] || [ -d "$git_dir/rebase-apply" ]; then
            echo "rebase_state=conflict" >> "$GITHUB_OUTPUT"
          else
            git rebase --abort 2>/dev/null || true
            echo "rebase_state=failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Auto-resolve trivial conflicts
        id: autoresolve
        if: steps.pr.outputs.eligible == 'true' && steps.ancestry.outputs.ok == 'true' && steps.attempt.outputs.rebase_state == 'conflict'
        continue-on-error: true
        run: |
          node "$REBASE_CONTROL_DIR/scripts/auto-resolve-trivial-rebase-conflicts.cjs" >> "$GITHUB_OUTPUT"

      - name: Post conflict-working
        if: steps.pr.outputs.eligible == 'true' && steps.ancestry.outputs.ok == 'true' && steps.attempt.outputs.rebase_state == 'conflict' && steps.autoresolve.outputs.rebase_complete != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.authorize.outputs.pr-number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node "$REBASE_CONTROL_DIR/scripts/upsert-rebase-comment.cjs" \
            --pr "$PR_NUMBER" --head-sha "$HEAD_SHA" --base-ref "$BASE_REF" \
            --run-url "$RUN_URL" --mode conflict-working

      - name: Resolve conflicts with ZAI
        id: claude
        if: steps.pr.outputs.eligible == 'true' && steps.ancestry.outputs.ok == 'true' && steps.attempt.outputs.rebase_state == 'conflict' && steps.autoresolve.outputs.rebase_complete != 'true'
        continue-on-error: true
        uses: ./.github/actions/run-zai
        with:
          api-key: ${{ secrets.ZAI_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          model: 'opus'
          max-turns: ${{ env.MAX_TURNS }}
          track-progress: 'false'
          json-schema: '{"type":"object","required":["summary","conflicts_resolved","review_findings_preserved","review_findings_addressed","validation"],"properties":{"summary":{"type":"string"},"conflicts_resolved":{"type":"array","items":{"type":"object","required":["file","resolution"],"properties":{"file":{"type":"string"},"resolution":{"type":"string"}}}},"review_findings_preserved":{"type":"array","items":{"type":"string"}},"review_findings_addressed":{"type":"array","items":{"type":"string"}},"validation":{"type":"object","properties":{"typecheck":{"type":"string"},"tests":{"type":"string"},"lint":{"type":"string"},"format":{"type":"string"},"build":{"type":"string"}}}}}'
          allowed-tools: 'Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(git status:*),Bash(git diff:*),Bash(git add:*),Bash(git rebase:*),Bash(git -c core.editor=true rebase --continue:*),Bash(git log:*),Bash(git show:*),Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(rtk:*)'
          prompt: |
            You are continuing an in-progress git rebase for pull request #${{ needs.authorize.outputs.pr-number }} onto its base branch `${{ steps.pr.outputs.base_ref }}`. The rebase stopped on merge conflicts.

            Review feedback has been pre-fetched to: ${{ steps.feedback.outputs.path }}
            READ THAT FILE FIRST. It contains unresolved, non-outdated review threads, review submissions, trusted Kilo summaries, non-noise human comments, and the diff, so you can preserve or address review findings touched by the conflicts.

            Your job:
            - Resolve each conflict by preserving the source PR intent AND the current base branch behavior. Prefer the PR changes; reconcile with base where they diverge.
            - If a conflict touches a line with unresolved review feedback, address that feedback as part of the resolution.
            - Continue the rebase with `git -c core.editor=true rebase --continue` when Git needs to reuse a commit message without opening an editor.
            - Use only allowlisted command forms: `git status`, `git diff`, `git add`, `git rebase`, `git -c core.editor=true rebase --continue`, `git log`, `git show`, `npm ...`, `npx ...`, `node ...`, and `rtk ...`.
            - Do not call absolute binaries such as `/usr/bin/node`, and do not use pipes, shell control operators, or output-tail wrappers inside Bash commands. Use `rtk node --test ...` or `rtk npm ...` when output may be large.
            - Iterate with `npx tsc --noEmit` for fast feedback; leave full CI-matching validation to the workflow's `validate-pr-gate` step after the rebase is complete.

            Before finishing:
            - Leave the tree with NO rebase in progress and NO unstaged conflict markers. If a conflict cannot be resolved, stop and report it -- do not force a bad merge.

            Hard rules (the workflow enforces the gate and pushes; you must not):
            - Do NOT push. Do NOT run git commit or create standalone commits outside the rebase. Do NOT merge, approve, close PRs, or post comments.
            - Do NOT weaken or delete tests to make conflicts disappear.
            - Do NOT drop source PR intent to make conflicts disappear.

            Return JSON only with: summary, conflicts_resolved[] {file,resolution}, review_findings_preserved[], review_findings_addressed[], and validation {typecheck,tests,lint,format,build}.
            Operate as the `kos-rebase-pr` agent: first read `.claude/agents/kos-rebase-pr.md` and follow it as your operating contract (it enforces this prompt's rules and adds run-mined failure knowledge), then perform the task.

      - name: Verify rebase completed
        id: verify
        if: steps.pr.outputs.eligible == 'true' && steps.ancestry.outputs.ok == 'true' && steps.attempt.outputs.rebase_state == 'conflict' && steps.autoresolve.outputs.rebase_complete != 'true'
        run: |
          git_dir=$(git rev-parse --git-dir)
          if [ -d "$git_dir/rebase-merge" ] || [ -d "$git_dir/rebase-apply" ]; then
            git rebase --abort 2>/dev/null || true
            echo "rebase_complete=false" >> "$GITHUB_OUTPUT"
          else
            echo "rebase_complete=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect moved head
        id: moved
        if: >-
          steps.pr.outputs.eligible == 'true' &&
          steps.ancestry.outputs.ok == 'true' &&
          (
            steps.attempt.outputs.rebase_state == 'clean' ||
            (steps.attempt.outputs.rebase_state == 'conflict' && steps.autoresolve.outputs.rebase_complete == 'true') ||
            (steps.attempt.outputs.rebase_state == 'conflict' && steps.verify.outputs.rebase_complete == 'true')
          )
        run: |
          original=$(cat "$RUNNER_TEMP/original-head.txt")
          current=$(git rev-parse HEAD)
          if [ "$current" != "$original" ]; then
            echo "rebase_moved_head=true" >> "$GITHUB_OUTPUT"
          else
            echo "rebase_moved_head=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate (CI-matching gate)
        id: gate
        if: >-
          steps.pr.outputs.eligible == 'true' &&
          steps.ancestry.outputs.ok == 'true' &&
          steps.moved.outputs.rebase_moved_head == 'true' &&
          steps.claude.outputs.claude_failed != 'true'
        uses: ./.github/actions/validate-pr-gate

      - name: Restore tracked files after post-rebase validation
        if: >-
          steps.pr.outputs.eligible == 'true' &&
          steps.ancestry.outputs.ok == 'true' &&
          steps.moved.outputs.rebase_moved_head == 'true' &&
          steps.claude.outputs.claude_failed != 'true'
        run: |
          # The post-rebase gate has already exposed its outcomes. Discard any
          # tracked files changed only by validation before comparing/pushing.
          if ! git diff --quiet || ! git diff --cached --quiet; then
            git status --short
            git reset --hard HEAD
          fi

      - name: Compare rebase CI baseline
        id: gate_compare
        if: >-
          steps.pr.outputs.eligible == 'true' &&
          steps.ancestry.outputs.ok == 'true' &&
          steps.moved.outputs.rebase_moved_head == 'true' &&
          steps.claude.outputs.claude_failed != 'true'
        run: |
          node "$REBASE_CONTROL_DIR/scripts/compare-rebase-gate-outcomes.cjs" \
            --baseline-lint "${{ steps.baseline_gate.outputs.lint_outcome }}" \
            --baseline-typecheck "${{ steps.baseline_gate.outputs.typecheck_outcome }}" \
            --baseline-format "${{ steps.baseline_gate.outputs.format_outcome }}" \
            --baseline-test "${{ steps.baseline_gate.outputs.test_outcome }}" \
            --baseline-build "${{ steps.baseline_gate.outputs.build_outcome }}" \
            --baseline-script-tests "${{ steps.baseline_gate.outputs.script_tests_outcome }}" \
            --baseline-prisma-safe "${{ steps.baseline_gate.outputs.prisma_safe_outcome }}" \
            --post-lint "${{ steps.gate.outputs.lint_outcome }}" \
            --post-typecheck "${{ steps.gate.outputs.typecheck_outcome }}" \
            --post-format "${{ steps.gate.outputs.format_outcome }}" \
            --post-test "${{ steps.gate.outputs.test_outcome }}" \
            --post-build "${{ steps.gate.outputs.build_outcome }}" \
            --post-script-tests "${{ steps.gate.outputs.script_tests_outcome }}" \
            --post-prisma-safe "${{ steps.gate.outputs.prisma_safe_outcome }}"

      - name: Push rebased branch
        id: push
        if: >-
          steps.pr.outputs.eligible == 'true' &&
          steps.ancestry.outputs.ok == 'true' &&
          (
            steps.gate.outputs.gate_passed == 'true' ||
            steps.gate_compare.outputs.no_new_failures == 'true'
          ) &&
          steps.moved.outputs.rebase_moved_head == 'true' &&
          github.event.inputs.dry_run != 'true'
        env:
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        run: |
          # Only push a clean tree whose HEAD advanced past the original head.
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::working tree not clean after rebase; refusing to push"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          original=$(cat "$RUNNER_TEMP/original-head.txt")
          current=$(git rev-parse HEAD)
          if [ "$current" = "$original" ]; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git push --force-with-lease origin "HEAD:$HEAD_REF"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Capture new head SHA
        id: newhead
        if: steps.pr.outputs.eligible == 'true' && steps.ancestry.outputs.ok == 'true' && steps.push.outputs.pushed == 'true'
        run: echo "new_head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Disable auto-merge (force re-review of the rebased branch)
        id: automerge
        if: steps.pr.outputs.eligible == 'true' && steps.ancestry.outputs.ok == 'true' && steps.push.outputs.pushed == 'true' && steps.pr.outputs.auto_merge_enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PR_NUMBER: ${{ needs.authorize.outputs.pr-number }}
        run: |
          gh pr merge "$PR_NUMBER" --disable-auto || true
          echo "disabled=true" >> "$GITHUB_OUTPUT"

      - name: Wake the PR orchestrator
        if: steps.pr.outputs.eligible == 'true' && steps.ancestry.outputs.ok == 'true' && steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PR_NUMBER: ${{ needs.authorize.outputs.pr-number }}
        run: |
          gh workflow run pr-flow.yml --ref main -f pr_number="$PR_NUMBER" -f dry_run=false || true

      - name: Post summary
        if: always() && steps.pr.outputs.eligible == 'true' && steps.ancestry.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.authorize.outputs.pr-number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          NEW_HEAD_SHA: ${{ steps.newhead.outputs.new_head_sha }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          BASE_SHA: ${{ steps.prep.outputs.base_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STRUCTURED_OUTPUT: ${{ steps.claude.outputs.structured_output }}
          REVIEW_FEEDBACK_PRESENT: ${{ steps.fbsummary.outputs.present }}
          NUM_TURNS: ${{ steps.claude.outputs.claude_num_turns }}
          CONFLICTS_RESOLVED_BY_AI: ${{ steps.attempt.outputs.rebase_state == 'conflict' && steps.autoresolve.outputs.rebase_complete != 'true' && steps.verify.outputs.rebase_complete == 'true' }}
          TRIVIAL_CONFLICTS_AUTO_RESOLVED: ${{ steps.attempt.outputs.rebase_state == 'conflict' && steps.autoresolve.outputs.rebase_complete == 'true' && steps.autoresolve.outputs.resolved == 'true' }}
          TRIVIAL_CONFLICT_COUNT: ${{ steps.autoresolve.outputs.resolved_count }}
          TRIVIAL_CONFLICT_PATHS: ${{ steps.autoresolve.outputs.resolved_paths }}
          FAILED: ${{ steps.attempt.outputs.rebase_state == 'failed' || (steps.attempt.outputs.rebase_state == 'conflict' && steps.autoresolve.outputs.rebase_complete != 'true' && steps.verify.outputs.rebase_complete != 'true') || steps.claude.outputs.claude_failed == 'true' }}
          FAIL_REASON: ${{ steps.claude.outputs.claude_failure_reason || 'the rebase could not be completed (conflicts unresolved or a git error)' }}
          OUTCOME: ${{ steps.claude.outcome }}
          GATE_PASSED: ${{ steps.gate.outputs.gate_passed }}
          LINT_OUTCOME: ${{ steps.gate.outputs.lint_outcome }}
          TYPECHECK_OUTCOME: ${{ steps.gate.outputs.typecheck_outcome }}
          FORMAT_OUTCOME: ${{ steps.gate.outputs.format_outcome }}
          TEST_OUTCOME: ${{ steps.gate.outputs.test_outcome }}
          BUILD_OUTCOME: ${{ steps.gate.outputs.build_outcome }}
          SCRIPT_TESTS_OUTCOME: ${{ steps.gate.outputs.script_tests_outcome }}
          PRISMA_SAFE_OUTCOME: ${{ steps.gate.outputs.prisma_safe_outcome }}
          GATE_COMPARISON_JSON: ${{ steps.gate_compare.outputs.comparison_json }}
          GATE_NO_NEW_FAILURES: ${{ steps.gate_compare.outputs.no_new_failures }}
          PUSHED: ${{ steps.push.outputs.pushed }}
          REBASE_MOVED_HEAD: ${{ steps.moved.outputs.rebase_moved_head }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' }}
          AUTOMERGE_DISABLED: ${{ steps.automerge.outputs.disabled }}
        run: |
          node "$REBASE_CONTROL_DIR/scripts/upsert-rebase-comment.cjs" \
            --pr "$PR_NUMBER" \
            --head-sha "$HEAD_SHA" \
            --new-head-sha "$NEW_HEAD_SHA" \
            --base-ref "$BASE_REF" \
            --base-sha "$BASE_SHA" \
            --run-url "$RUN_URL" \
            --structured-output "$STRUCTURED_OUTPUT" \
            --review-feedback-present "$REVIEW_FEEDBACK_PRESENT" \
            --num-turns "$NUM_TURNS" \
            --conflicts-resolved-by-ai "$CONFLICTS_RESOLVED_BY_AI" \
            --trivial-conflicts-auto-resolved "$TRIVIAL_CONFLICTS_AUTO_RESOLVED" \
            --trivial-conflict-count "$TRIVIAL_CONFLICT_COUNT" \
            --trivial-conflict-paths "$TRIVIAL_CONFLICT_PATHS" \
            --failed "$FAILED" \
            --fail-reason "$FAIL_REASON" \
            --outcome "$OUTCOME" \
            --gate-passed "$GATE_PASSED" \
            --lint-outcome "$LINT_OUTCOME" \
            --typecheck-outcome "$TYPECHECK_OUTCOME" \
            --format-outcome "$FORMAT_OUTCOME" \
            --test-outcome "$TEST_OUTCOME" \
            --build-outcome "$BUILD_OUTCOME" \
            --script-tests-outcome "$SCRIPT_TESTS_OUTCOME" \
            --prisma-safe-outcome "$PRISMA_SAFE_OUTCOME" \
            --gate-comparison-json "$GATE_COMPARISON_JSON" \
            --gate-no-new-failures "$GATE_NO_NEW_FAILURES" \
            --pushed "$PUSHED" \
            --rebase-moved-head "$REBASE_MOVED_HEAD" \
            --dry-run "$DRY_RUN" \
            --automerge-disabled "$AUTOMERGE_DISABLED" \
            --mode complete
