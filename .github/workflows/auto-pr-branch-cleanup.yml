name: Auto PR Branch Cleanup

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: '15 3 * * *' # Daily at 03:15 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  delete-generated-branch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Delete closed automation branch
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const pr = context.payload.pull_request;
            if (!pr) {
              core.setFailed('pull_request payload missing');
              return;
            }

            const policyPath = path.join(
              process.env.GITHUB_WORKSPACE,
              '.github',
              'workflows',
              'policy.json',
            );
            const policy = JSON.parse(fs.readFileSync(policyPath, 'utf8'));
            const headRef = pr.head?.ref || '';
            const prefixes = [
              ...(policy.trustedAutomationBranchPrefixes ?? []),
              ...(policy.trustedPlanning?.branchPrefixes ?? []),
              ...(policy.manualOnlyBranchPrefixes ?? []),
              ...(policy.cleanupBranchPrefixes ?? []),
              ...(policy.planningBranchPrefix ? [policy.planningBranchPrefix] : []),
              ...(policy.gsdExecution?.branchPrefix
                ? [policy.gsdExecution.branchPrefix]
                : []),
              ...(policy.auditSafe?.safeBranchPrefix
                ? [policy.auditSafe.safeBranchPrefix]
                : []),
              ...(policy.auditSafe?.manualBranchPrefix
                ? [policy.auditSafe.manualBranchPrefix]
                : []),
              ...(policy.dependabot?.manualOnlyBranchPrefixes ?? []),
            ].filter(Boolean);
            const uniquePrefixes = [...new Set(prefixes)];

            if (!headRef) {
              core.info('No head ref found on the closed pull request.');
              return;
            }

            if (!uniquePrefixes.some((prefix) => headRef.startsWith(prefix))) {
              core.info(
                `Branch ${headRef} is not in the automation cleanup allow-list.`,
              );
              return;
            }

            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${headRef}`,
              });
              core.notice(
                `Deleted closed automation branch ${headRef} from PR #${pr.number}.`,
              );
            } catch (error) {
              if (error.status === 404 || error.status === 422) {
                core.info(
                  `Branch ${headRef} was already absent or could not be deleted: ${error.message}`,
                );
                return;
              }

              throw error;
            }

  cleanup-orphan-branches:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Collect open PR head refs
        id: open_prs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OPEN_HEADS=$(gh pr list --state open --limit 200 \
            --json headRefName --jq '.[].headRefName' 2>/dev/null || true)
          {
            echo "heads<<EOF"
            echo "$OPEN_HEADS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Delete orphan automation branches older than 7 days
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const policyPath = path.join(
              process.env.GITHUB_WORKSPACE,
              '.github',
              'workflows',
              'policy.json',
            );
            const policy = JSON.parse(fs.readFileSync(policyPath, 'utf8'));
            const prefixes = [
              ...(policy.cleanupBranchPrefixes ?? []),
              ...(policy.trustedAutomationBranchPrefixes ?? []),
              ...(policy.trustedPlanning?.branchPrefixes ?? []),
              ...(policy.manualOnlyBranchPrefixes ?? []),
              ...(policy.gsdExecution?.branchPrefix
                ? [policy.gsdExecution.branchPrefix]
                : []),
              ...(policy.auditSafe?.safeBranchPrefix
                ? [policy.auditSafe.safeBranchPrefix]
                : []),
              ...(policy.auditSafe?.manualBranchPrefix
                ? [policy.auditSafe.manualBranchPrefix]
                : []),
              ...(policy.planningBranchPrefix
                ? [policy.planningBranchPrefix]
                : []),
            ].filter(Boolean);
            const uniquePrefixes = [...new Set(prefixes)];

            const openHeads = new Set(
              (core.getInput('open_prs') || '').split('\n').filter(Boolean),
            );

            const branches = await github.rest.repos.listBranches({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            const SEVEN_DAYS_MS = 7 * 24 * 60 * 60 * 1000;
            const now = Date.now();
            let deleted = 0;

            for (const branch of branches.data) {
              if (!uniquePrefixes.some((p) => branch.name.startsWith(p))) {
                continue;
              }
              if (openHeads.has(branch.name)) {
                core.info(`Skipping ${branch.name} — has open PR`);
                continue;
              }

              const lastCommit = await github.rest.repos.getCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: branch.name,
              });
              const commitDate = new Date(
                lastCommit.data.commit.committer.date,
              ).getTime();
              const ageMs = now - commitDate;

              if (ageMs < SEVEN_DAYS_MS) {
                core.info(
                  `Skipping ${branch.name} — last commit ${Math.round(ageMs / (24 * 60 * 60 * 1000))}d ago (under 7d threshold)`,
                );
                continue;
              }

              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${branch.name}`,
                });
                core.notice(
                  `Deleted orphan branch ${branch.name} (last commit ${Math.round(ageMs / (24 * 60 * 60 * 1000))}d ago, no open PR)`,
                );
                deleted++;
              } catch (error) {
                if (error.status === 404 || error.status === 422) {
                  core.info(`Branch ${branch.name} already absent`);
                } else {
                  core.warning(`Failed to delete ${branch.name}: ${error.message}`);
                }
              }
            }

            if (deleted > 0) {
              core.notice(`Orphan branch cleanup: deleted ${deleted} branch(es)`);
            } else {
              core.info('No orphan automation branches to delete');
            }
