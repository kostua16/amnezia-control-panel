name: Auto Cover Review

run-name: "Auto Cover Review ${{ github.event.issue.number && format('PR #{0}', github.event.issue.number) || github.event.inputs.pr_number || github.event.workflow_run.pull_requests[0].number && format('PR #{0}', github.event.workflow_run.pull_requests[0].number) || github.run_id }}"

on:
  workflow_run:
    workflows: ['Code Review']
    types: [completed]
  issue_comment:
    types: [created, edited]
  schedule:
    - cron: '47 */3 * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to evaluate; empty scans open PRs'
        required: false
        type: string
      head_sha:
        description: 'Expected pull request head SHA'
        required: false
        type: string
      dry_run:
        description: 'Evaluate without dispatching fix-review'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: read
  actions: write
  checks: read

concurrency:
  # Targeted single-PR paths (issue_comment, pr_number dispatch, resolved
  # workflow_run) get a per-PR group. Scan-all runs (schedule, unresolved
  # workflow_run, empty dispatch) fall through to a shared 'scan' group so two
  # overlapping scans cannot both pass the active-run check (eventually
  # consistent) and dispatch duplicate fix-review runs for the same PR.
  # github-actions[bot] issue_comment runs (sticky-comment upserts, worker
  # reports) are always no-ops but GitHub applies concurrency cancellation at
  # run creation, before job `if:` gates run — routing them to a per-PR noise
  # group with cancel-in-progress=false prevents them from cancelling or
  # displacing a real fix-review wake (same bug class as PR #695 / #715).
  # Kilo sticky-comment edits get their own per-PR `kiloedit` group with
  # cancel-in-progress=false: Kilo edits the comment twice per review and the
  # `classify` job drops the second, history-only edit, so a dropped edit may
  # only displace another Kilo edit, never a pending Code Review completion or
  # targeted dispatch, and never cancels the in-flight first edit. Every other
  # comment that `cover` ignores anyway (human comments, Kilo comments without
  # the sticky marker) joins the per-PR noise group, so it cannot cancel an
  # in-flight run either. Only a newly created Kilo sticky comment still
  # cancels like a Code Review completion. KILO_EDIT_FILTER=off restores the
  # previous grouping and cancellation.
  group: >-
    auto-cover-review-${{
      (github.event_name == 'issue_comment' && github.event.comment.user.login == 'github-actions[bot]' && format('noise-{0}', github.event.issue.number)) ||
      (github.event_name == 'issue_comment' && vars.KILO_EDIT_FILTER != 'off' && (github.event.comment.user.login != 'kilo-code-bot[bot]' || !contains(github.event.comment.body, '<!-- kilo-review -->')) && format('noise-{0}', github.event.issue.number)) ||
      (github.event_name == 'issue_comment' && github.event.action == 'edited' && github.event.comment.user.login == 'kilo-code-bot[bot]' && vars.KILO_EDIT_FILTER != 'off' && format('kiloedit-{0}', github.event.issue.number)) ||
      github.event.issue.number ||
      github.event.inputs.pr_number ||
      github.event.workflow_run.pull_requests[0].number ||
      'scan'
    }}
  cancel-in-progress: ${{ github.event_name != 'issue_comment' || (github.event.comment.user.login != 'github-actions[bot]' && (vars.KILO_EDIT_FILTER == 'off' || (github.event.action != 'edited' && github.event.comment.user.login == 'kilo-code-bot[bot]' && contains(github.event.comment.body, '<!-- kilo-review -->')))) }}

jobs:
  # Cheap gate for Kilo sticky-comment edits: no setup-environment, no API
  # call. A history-only edit ends here; anything else (and any classifier
  # failure) lets `cover` run.
  classify:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'edited' &&
      github.event.issue.pull_request != null &&
      github.event.comment.user.login == 'kilo-code-bot[bot]' &&
      contains(github.event.comment.body, '<!-- kilo-review -->') &&
      vars.KILO_EDIT_FILTER != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.classify.outputs.should_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Classify Kilo sticky-comment edit
        id: classify
        shell: bash
        env:
          KILO_EDIT_FILTER: ${{ vars.KILO_EDIT_FILTER || '' }}
        run: |
          if ! node .github/workflows/scripts/classify-kilo-comment-edit.cjs \
            --event-path "$GITHUB_EVENT_PATH" \
            --filter "$KILO_EDIT_FILTER" >> "$GITHUB_OUTPUT"; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  cover:
    needs: classify
    # `classify` is skipped for every other event; `!cancelled()` lets `cover`
    # run then, and only an explicit should_run=false stops it.
    if: >-
      !cancelled() &&
      needs.classify.outputs.should_run != 'false' &&
      (
        github.event_name != 'issue_comment' ||
        (
          github.event.issue.pull_request != null &&
          github.event.comment.user.login == 'kilo-code-bot[bot]' &&
          contains(github.event.comment.body, '<!-- kilo-review -->')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        id: setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-auth-mode: ${{ vars.GH_AUTH_MODE || 'env' }}
          node-version: '24.x'
          install-deps: 'false'

      # Auto Cover is deferrable: below the reserve it stops here (green, with
      # a notice) and the next trigger or the 3-hourly scan retries. Uses the
      # quota setup-environment already read at job start; QUOTA_RESERVE=0
      # disables the gate.
      - name: Check API quota reserve
        id: reserve
        env:
          CORE_REMAINING: ${{ steps.setup.outputs.core-remaining }}
          QUOTA_RESERVE: ${{ vars.QUOTA_RESERVE || '600' }}
        run: node .github/workflows/scripts/check-quota-reserve.cjs

      - name: Evaluate and dispatch review repair
        if: steps.reserve.outputs.proceed != 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
          INPUT_PR_NUMBER: ${{ github.event.inputs.pr_number }}
          INPUT_HEAD_SHA: ${{ github.event.inputs.head_sha }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          # Same switch as the PR Orchestrator so both verdict producers agree: empty = `critical,warning`, `all` = every Kilo finding blocks.
          KILO_BLOCKING_SEVERITIES: ${{ vars.KILO_BLOCKING_SEVERITIES || '' }}
          # `delayed` (default): eligible PRs wait out the auto-cover-delay environment timer in auto-cover-dispatch.yml; `direct` dispatches fix-review immediately without a commit.
          AUTO_COVER_DELAY_MODE: ${{ vars.AUTO_COVER_DELAY_MODE || 'delayed' }}
        shell: bash
        run: |
          set -euo pipefail

          resolve_prs() {
            node - <<'NODE'
          const fs = require('node:fs');
          const event = JSON.parse(fs.readFileSync(process.env.EVENT_PATH, 'utf8'));
          const inputPr = process.env.INPUT_PR_NUMBER || '';
          if (inputPr) {
            console.log(inputPr);
            process.exit(0);
          }
          if (process.env.EVENT_NAME === 'issue_comment') {
            console.log(event.issue?.number || '');
            process.exit(0);
          }
          if (process.env.EVENT_NAME === 'workflow_run') {
            const fromPayload = event.workflow_run?.pull_requests?.[0]?.number;
            if (fromPayload) {
              console.log(fromPayload);
              process.exit(0);
            }
            const title = String(event.workflow_run?.display_title || '');
            const match = title.match(/^PR #(\d+)\b/);
            if (match) console.log(match[1]);
          }
          NODE
          }

          prs_file="$RUNNER_TEMP/auto-cover-review/prs.txt"
          mkdir -p "$RUNNER_TEMP/auto-cover-review"
          {
            resolved="$(resolve_prs)"
            if [ -n "$resolved" ]; then
              printf '%s\n' "$resolved"
            else
              gh pr list --state open --limit 100 --json number --jq '.[].number'
            fi
          } > "$prs_file"

          # Fetch all per-PR context once with bounded concurrency. Rate-limit /
          # 5xx / network errors fail the job loudly; a fresh commit with no
          # statuses/check-runs yet (HTTP 404) is treated as an empty list. The
          # repo-wide fix-review run list is fetched once and shared across PRs.
          node .github/workflows/scripts/fetch-auto-cover-context.cjs \
            --repo "$GITHUB_REPOSITORY" \
            --out-dir "$RUNNER_TEMP/auto-cover-review" \
            --prs-file "$prs_file" \
            --concurrency 4 \
            --fix-review-workflow fix-review.yml

          # Evaluate every fetched PR and act on the eligible ones. `delayed`
          # hands each eligible PR to auto-cover-dispatch.yml (quiet period,
          # then re-validation and fix-review dispatch); `direct` dispatches
          # fix-review right away (previous behavior).
          mode="delayed"
          if [ "$AUTO_COVER_DELAY_MODE" = "direct" ]; then
            mode="direct"
          fi
          node .github/workflows/scripts/run-auto-cover-repairs.cjs \
            --mode "$mode" \
            --context-dir "$RUNNER_TEMP/auto-cover-review" \
            --policy-file .github/workflows/policy.json \
            --head-sha "$INPUT_HEAD_SHA" \
            --dry-run "$DRY_RUN"
