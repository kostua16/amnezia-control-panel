name: Auto Cover Review

run-name: "Auto Cover Review ${{ github.event.issue.number && format('PR #{0}', github.event.issue.number) || github.event.inputs.pr_number || github.event.workflow_run.pull_requests[0].number && format('PR #{0}', github.event.workflow_run.pull_requests[0].number) || github.run_id }}"

on:
  workflow_run:
    workflows: ['Code Review']
    types: [completed]
  issue_comment:
    types: [created, edited]
  schedule:
    - cron: '47 */3 * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to evaluate; empty scans open PRs'
        required: false
        type: string
      head_sha:
        description: 'Expected pull request head SHA'
        required: false
        type: string
      dry_run:
        description: 'Evaluate without dispatching fix-review'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: read
  actions: write
  checks: read

concurrency:
  # Targeted single-PR paths (issue_comment, pr_number dispatch, resolved
  # workflow_run) get a per-PR group. Scan-all runs (schedule, unresolved
  # workflow_run, empty dispatch) fall through to a shared 'scan' group so two
  # overlapping scans cannot both pass the active-run check (eventually
  # consistent) and dispatch duplicate fix-review runs for the same PR.
  group: auto-cover-review-${{ github.event.issue.number || github.event.inputs.pr_number || github.event.workflow_run.pull_requests[0].number || 'scan' }}
  cancel-in-progress: true

jobs:
  cover:
    if: >-
      github.event_name != 'issue_comment' ||
      (
        github.event.issue.pull_request != null &&
        github.event.comment.user.login == 'kilo-code-bot[bot]' &&
        contains(github.event.comment.body, '<!-- kilo-review -->')
      )
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          node-version: '24.x'
          install-deps: 'false'

      - name: Evaluate and dispatch review repair
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
          INPUT_PR_NUMBER: ${{ github.event.inputs.pr_number }}
          INPUT_HEAD_SHA: ${{ github.event.inputs.head_sha }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        shell: bash
        run: |
          set -euo pipefail

          resolve_prs() {
            node - <<'NODE'
          const fs = require('node:fs');
          const event = JSON.parse(fs.readFileSync(process.env.EVENT_PATH, 'utf8'));
          const inputPr = process.env.INPUT_PR_NUMBER || '';
          if (inputPr) {
            console.log(inputPr);
            process.exit(0);
          }
          if (process.env.EVENT_NAME === 'issue_comment') {
            console.log(event.issue?.number || '');
            process.exit(0);
          }
          if (process.env.EVENT_NAME === 'workflow_run') {
            const fromPayload = event.workflow_run?.pull_requests?.[0]?.number;
            if (fromPayload) {
              console.log(fromPayload);
              process.exit(0);
            }
            const title = String(event.workflow_run?.display_title || '');
            const match = title.match(/^PR #(\d+)\b/);
            if (match) console.log(match[1]);
          }
          NODE
          }

          prs_file="$RUNNER_TEMP/auto-cover-review/prs.txt"
          mkdir -p "$RUNNER_TEMP/auto-cover-review"
          {
            resolved="$(resolve_prs)"
            if [ -n "$resolved" ]; then
              printf '%s\n' "$resolved"
            else
              gh pr list --state open --limit 100 --json number --jq '.[].number'
            fi
          } > "$prs_file"

          # Fetch all per-PR context once with bounded concurrency. Rate-limit /
          # 5xx / network errors fail the job loudly; a fresh commit with no
          # statuses/check-runs yet (HTTP 404) is treated as an empty list. The
          # repo-wide fix-review run list is fetched once and shared across PRs.
          node .github/workflows/scripts/fetch-auto-cover-context.cjs \
            --repo "$GITHUB_REPOSITORY" \
            --out-dir "$RUNNER_TEMP/auto-cover-review" \
            --prs-file "$prs_file" \
            --concurrency 4 \
            --fix-review-workflow fix-review.yml

          dispatched=0
          evaluated=0
          while IFS= read -r pr_number; do
            [ -n "$pr_number" ] || continue
            evaluated=$((evaluated + 1))
            prefix="$RUNNER_TEMP/auto-cover-review/pr-$pr_number"
            head_sha="$(cat "$prefix-head-sha")"
            expected_sha="${INPUT_HEAD_SHA:-$head_sha}"

            node .github/workflows/scripts/evaluate-external-review.cjs \
              --pr-file "$prefix-pr.json" \
              --comments-file "$prefix-comments.json" \
              --review-comments-file "$prefix-review-comments.json" \
              --reviews-file "$prefix-reviews.json" \
              --check-runs-file "$prefix-check-runs.json" \
              --statuses-file "$prefix-statuses.json" \
              > "$prefix-external-review.json"

            node .github/workflows/scripts/evaluate-auto-cover-review.cjs \
              --policy-file .github/workflows/policy.json \
              --pr-file "$prefix-pr.json" \
              --external-review-file "$prefix-external-review.json" \
              --comments-file "$prefix-comments.json" \
              --commits-file "$prefix-commits.json" \
              --attempts-file "$prefix-attempts.json" \
              --fix-review-runs-file "$prefix-fix-review-runs.json" \
              --head-sha "$expected_sha" \
              > "$prefix-decision.json"

            should_run="$(jq -r '.should_run' "$prefix-decision.json")"
            reason="$(jq -r '.reason // "eligible"' "$prefix-decision.json")"
            echo "PR #$pr_number: $reason"
            if [ "$should_run" = "true" ]; then
              if [ "$DRY_RUN" = "true" ]; then
                echo "Dry-run: would dispatch fix-review for PR #$pr_number @ $head_sha"
              else
                dispatch_started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                fix_review_title="Fix Review PR #${pr_number} @ ${head_sha}"
                gh workflow run fix-review.yml \
                  --ref main \
                  -f pr_number="$pr_number" \
                  -f head_sha="$head_sha" \
                  -f automation_review_loop=true
                fix_review_run_url=""
                for attempt in $(seq 1 10); do
                  fix_review_run_url="$(
                    gh run list \
                      --workflow fix-review.yml \
                      --event workflow_dispatch \
                      --limit 20 \
                      --json displayTitle,createdAt,url,status,databaseId \
                      | jq -r \
                        --arg title "$fix_review_title" \
                        --arg started "$dispatch_started_at" \
                        '[.[] | select(.displayTitle == $title and .createdAt >= $started)] | sort_by(.createdAt) | .[0].url // empty'
                  )" || true
                  if [ -n "$fix_review_run_url" ]; then
                    break
                  fi
                  if [ "$attempt" -lt 10 ]; then
                    sleep 2
                  fi
                done
                fix_review_run_url="${fix_review_run_url:-_unavailable_}"
                comment_body="$prefix-auto-cover-comment.md"
                {
                  echo "<!-- auto-cover-review-summary -->"
                  echo
                  echo "Auto-cover review dispatched fix-review for \`$head_sha\`."
                  echo
                  echo "- Dispatcher run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
                  echo "- Fix-review run: $fix_review_run_url"
                } > "$comment_body"
                gh issue comment "$pr_number" --body-file "$comment_body"
                dispatched=$((dispatched + 1))
              fi
            fi
          done < "$RUNNER_TEMP/auto-cover-review/prs-to-evaluate.txt"

          echo "Evaluated $evaluated PR(s); dispatched $dispatched fix-review run(s)." >> "$GITHUB_STEP_SUMMARY"
