name: Auto Cover Review

run-name: "Auto Cover Review ${{ github.event.issue.number && format('PR #{0}', github.event.issue.number) || github.event.inputs.pr_number || github.event.workflow_run.pull_requests[0].number && format('PR #{0}', github.event.workflow_run.pull_requests[0].number) || github.run_id }}"

on:
  workflow_run:
    workflows: ['Code Review']
    types: [completed]
  issue_comment:
    types: [created]
  schedule:
    - cron: '47 */3 * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to evaluate; empty scans open PRs'
        required: false
        type: string
      head_sha:
        description: 'Expected pull request head SHA'
        required: false
        type: string
      dry_run:
        description: 'Evaluate without dispatching fix-review'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: read
  actions: write
  checks: read

concurrency:
  group: auto-cover-review-${{ github.event.issue.number || github.event.inputs.pr_number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true

jobs:
  cover:
    if: >-
      github.event_name != 'issue_comment' ||
      (
        github.event.issue.pull_request != null &&
        github.event.comment.user.login == 'kilo-code-bot[bot]' &&
        contains(github.event.comment.body, '<!-- kilo-review -->')
      )
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          node-version: '24.x'
          install-deps: 'false'

      - name: Evaluate and dispatch review repair
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
          INPUT_PR_NUMBER: ${{ github.event.inputs.pr_number }}
          INPUT_HEAD_SHA: ${{ github.event.inputs.head_sha }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        shell: bash
        run: |
          set -euo pipefail

          resolve_prs() {
            node - <<'NODE'
          const fs = require('node:fs');
          const event = JSON.parse(fs.readFileSync(process.env.EVENT_PATH, 'utf8'));
          const inputPr = process.env.INPUT_PR_NUMBER || '';
          if (inputPr) {
            console.log(inputPr);
            process.exit(0);
          }
          if (process.env.EVENT_NAME === 'issue_comment') {
            console.log(event.issue?.number || '');
            process.exit(0);
          }
          if (process.env.EVENT_NAME === 'workflow_run') {
            const fromPayload = event.workflow_run?.pull_requests?.[0]?.number;
            if (fromPayload) {
              console.log(fromPayload);
              process.exit(0);
            }
            const title = String(event.workflow_run?.display_title || '');
            const match = title.match(/^PR #(\d+)\b/);
            if (match) console.log(match[1]);
          }
          NODE
          }

          prs="$(resolve_prs)"
          if [ -z "$prs" ]; then
            prs="$(gh pr list --state open --limit 100 --json number --jq '.[].number')"
          fi

          mkdir -p "$RUNNER_TEMP/auto-cover-review"
          dispatched=0
          evaluated=0
          while IFS= read -r pr_number; do
            [ -n "$pr_number" ] || continue
            evaluated=$((evaluated + 1))
            prefix="$RUNNER_TEMP/auto-cover-review/pr-$pr_number"

            gh pr view "$pr_number" \
              --json number,title,url,state,mergedAt,isDraft,headRefName,headRefOid,baseRefName,author,labels,files,isCrossRepository \
              > "$prefix-pr.json"
            head_sha="$(node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); process.stdout.write(p.headRefOid || "")' "$prefix-pr.json")"
            expected_sha="${INPUT_HEAD_SHA:-$head_sha}"

            gh api "repos/$GITHUB_REPOSITORY/issues/$pr_number/comments" --paginate > "$prefix-comments.json"
            node -e '
              const fs = require("fs");
              const comments = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              const attempts = comments.filter((comment) =>
                String(comment.body || "").includes("<!-- auto-cover-review-summary -->")
              );
              fs.writeFileSync(process.argv[2], JSON.stringify(attempts));
            ' "$prefix-comments.json" "$prefix-attempts.json"
            gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number/comments" --paginate > "$prefix-review-comments.json"
            gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number/reviews" --paginate > "$prefix-reviews.json"
            gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number/commits" --paginate > "$prefix-commits.json"
            gh run list --workflow fix-review.yml --limit 50 --json displayTitle,status,conclusion,createdAt > "$prefix-fix-review-runs.json"
            gh api "repos/$GITHUB_REPOSITORY/commits/$head_sha/status" --jq '.statuses' > "$prefix-statuses.json" || echo '[]' > "$prefix-statuses.json"
            gh api "repos/$GITHUB_REPOSITORY/commits/$head_sha/check-runs" --jq '.check_runs' > "$prefix-check-runs.json" || echo '[]' > "$prefix-check-runs.json"

            node .github/workflows/scripts/evaluate-external-review.cjs \
              --pr-file "$prefix-pr.json" \
              --comments-file "$prefix-comments.json" \
              --review-comments-file "$prefix-review-comments.json" \
              --reviews-file "$prefix-reviews.json" \
              --check-runs-file "$prefix-check-runs.json" \
              --statuses-file "$prefix-statuses.json" \
              > "$prefix-external-review.json"

            node .github/workflows/scripts/evaluate-auto-cover-review.cjs \
              --policy-file .github/workflows/policy.json \
              --pr-file "$prefix-pr.json" \
              --external-review-file "$prefix-external-review.json" \
              --commits-file "$prefix-commits.json" \
              --attempts-file "$prefix-attempts.json" \
              --fix-review-runs-file "$prefix-fix-review-runs.json" \
              --head-sha "$expected_sha" \
              > "$prefix-decision.json"

            should_run="$(jq -r '.should_run' "$prefix-decision.json")"
            reason="$(jq -r '.reason // "eligible"' "$prefix-decision.json")"
            echo "PR #$pr_number: $reason"
            if [ "$should_run" = "true" ]; then
              if [ "$DRY_RUN" = "true" ]; then
                echo "Dry-run: would dispatch fix-review for PR #$pr_number @ $head_sha"
              else
                gh workflow run fix-review.yml \
                  --ref main \
                  -f pr_number="$pr_number" \
                  -f head_sha="$head_sha" \
                  -f automation_review_loop=true
                comment_body="$prefix-auto-cover-comment.md"
                {
                  echo "<!-- auto-cover-review-summary -->"
                  echo
                  echo "Auto-cover review dispatched fix-review for \`$head_sha\`."
                  echo
                  echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
                } > "$comment_body"
                gh issue comment "$pr_number" --body-file "$comment_body"
                dispatched=$((dispatched + 1))
              fi
            fi
          done <<< "$prs"

          echo "Evaluated $evaluated PR(s); dispatched $dispatched fix-review run(s)." >> "$GITHUB_STEP_SUMMARY"
