name: Security Audit (Weekly)

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: security-audit-weekly
  cancel-in-progress: false

jobs:
  audit:
    runs-on: [self-hosted, big]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          require-gh-auth: 'false'

      - name: npm audit (high+ advisories)
        id: audit
        run: |
          set +e
          AUDIT_JSON="${RUNNER_TEMP}/npm-audit-high.json"
          AUDIT_STDERR="${RUNNER_TEMP}/npm-audit-high-stderr.txt"
          AUDIT_OUTPUT="${RUNNER_TEMP}/npm-audit-high-output.txt"
          npm audit --audit-level=high --json > "${AUDIT_JSON}" 2> "${AUDIT_STDERR}"
          AUDIT_EXIT=$?
          set -e
          {
            if [ -s "${AUDIT_STDERR}" ]; then
              cat "${AUDIT_STDERR}"
            fi
            if [ -s "${AUDIT_JSON}" ]; then
              cat "${AUDIT_JSON}"
            fi
          } | tee "${AUDIT_OUTPUT}"
          AUDIT_RESULT=$(node .github/workflows/scripts/classify-npm-audit-result.cjs \
            "${AUDIT_JSON}" "${AUDIT_EXIT}")
          echo "exit-code=${AUDIT_EXIT}" >> "$GITHUB_OUTPUT"
          echo "result=${AUDIT_RESULT}" >> "$GITHUB_OUTPUT"
          if [ "${AUDIT_RESULT}" = "infrastructure" ] && [ "${AUDIT_EXIT}" -eq 0 ]; then
            exit 2
          fi
          exit "${AUDIT_EXIT}"
        continue-on-error: true

      - name: Open issue on vulnerabilities
        id: issue-vulns
        if: steps.audit.outcome == 'failure' && steps.audit.outputs.result == 'vulnerabilities'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          AUDIT_ISSUE_BODY="${RUNNER_TEMP}/audit-issue-body.md"
          AUDIT_ISSUE_TITLE="Security: weekly npm audit found HIGH+ advisories"
          AUDIT_OUTPUT_FILE="${RUNNER_TEMP}/npm-audit-high-output.txt"
          AUDIT_OUTPUT_LIMIT=60000
          RUN_URL="https://github.com/${REPOSITORY}/actions/runs/${RUN_ID}"
          AUDIT_OUTPUT_SIZE=$(wc -c < "${AUDIT_OUTPUT_FILE}" | tr -d ' ')
          {
            echo "## Weekly npm audit found HIGH+ advisories"
            echo ""
            echo "Scheduled security audit failed. Review and remediate before the next run."
            echo ""
            echo "Run: ${RUN_URL}"
            echo ""
            echo '<details><summary>npm audit output</summary>'
            echo ""
            echo '```'
            head -c "${AUDIT_OUTPUT_LIMIT}" "${AUDIT_OUTPUT_FILE}"
            if [ "${AUDIT_OUTPUT_SIZE}" -gt "${AUDIT_OUTPUT_LIMIT}" ]; then
              echo ""
              echo "[output truncated to ${AUDIT_OUTPUT_LIMIT} bytes; full output is in the workflow logs]"
            fi
            echo '```'
            echo '</details>'
          } > "${AUDIT_ISSUE_BODY}"
          EXISTING_ISSUE=""
          if ! EXISTING_ISSUE=$(
            gh issue list --repo "${REPOSITORY}" --state open \
              --search 'weekly npm audit found HIGH+ advisories in:title' \
              --json number \
              --jq '.[0].number // empty' \
              2>/dev/null
          ); then
            echo "Unable to check for an existing weekly npm audit issue; creating a new issue."
            EXISTING_ISSUE=""
          fi
          if [ -z "${EXISTING_ISSUE}" ]; then
            gh issue create \
              --repo "${REPOSITORY}" \
              --title "${AUDIT_ISSUE_TITLE}" \
              --body-file "${AUDIT_ISSUE_BODY}"
          else
            echo "Refreshing existing weekly npm audit tracking issue #${EXISTING_ISSUE}."
            if ! gh issue edit "${EXISTING_ISSUE}" \
              --repo "${REPOSITORY}" \
              --body-file "${AUDIT_ISSUE_BODY}"; then
              echo "Unable to refresh issue #${EXISTING_ISSUE}; creating a new issue."
              gh issue create \
                --repo "${REPOSITORY}" \
                --title "${AUDIT_ISSUE_TITLE}" \
                --body-file "${AUDIT_ISSUE_BODY}"
            fi
          fi

      - name: Report audit infrastructure failure
        if: steps.audit.outcome == 'failure' && steps.audit.outputs.result == 'infrastructure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          AUDIT_OUTPUT_FILE="${RUNNER_TEMP}/npm-audit-high-output.txt"
          RUN_URL="https://github.com/${REPOSITORY}/actions/runs/${RUN_ID}"
          INFRA_ISSUE_TITLE="Security: weekly npm audit infrastructure error"
          INFRA_ISSUE_BODY="${RUNNER_TEMP}/audit-infra-issue-body.md"
          AUDIT_EXIT="${{ steps.audit.outputs.exit-code }}"
          {
            echo "## Weekly npm audit infrastructure error"
            echo ""
            echo "Scheduled security audit could not complete. This is not a vulnerability finding — the audit tool itself failed."
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Run** | ${RUN_URL} |"
            echo "| **Exit code** | \`${AUDIT_EXIT}\` |"
            echo ""
            echo '<details><summary>npm audit output</summary>'
            echo ""
            echo '```'
            if [ -f "${AUDIT_OUTPUT_FILE}" ]; then
              head -c 30000 "${AUDIT_OUTPUT_FILE}"
            else
              echo "(no output captured)"
            fi
            echo '```'
            echo '</details>'
          } > "${INFRA_ISSUE_BODY}"
          EXISTING_ISSUE=""
          if ! EXISTING_ISSUE=$(
            gh issue list --repo "${REPOSITORY}" --state open \
              --search 'weekly npm audit infrastructure error in:title' \
              --json number \
              --jq '.[0].number // empty' \
            2>/dev/null
          ); then
            EXISTING_ISSUE=""
          fi
          if [ -z "${EXISTING_ISSUE}" ]; then
            gh issue create \
              --repo "${REPOSITORY}" \
              --title "${INFRA_ISSUE_TITLE}" \
              --body-file "${INFRA_ISSUE_BODY}" \
              --label 'ci-failure'
          else
            if ! gh issue edit "${EXISTING_ISSUE}" \
              --repo "${REPOSITORY}" \
              --body-file "${INFRA_ISSUE_BODY}" \
              --add-label 'ci-failure'; then
              gh issue create \
                --repo "${REPOSITORY}" \
                --title "${INFRA_ISSUE_TITLE}" \
                --body-file "${INFRA_ISSUE_BODY}" \
                --label 'ci-failure'
            fi
          fi
          echo "::error::npm audit infrastructure error (exit ${AUDIT_EXIT}) — see opened issue"
          exit 1

      - name: Verify issue creation succeeded
        if: steps.audit.outcome == 'failure' && steps.audit.outputs.result == 'vulnerabilities' && steps.issue-vulns.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "::error::npm audit found vulnerabilities but issue creation failed"
          echo "::error::Manual review required — see https://github.com/${REPOSITORY}/actions/runs/${RUN_ID}"
          exit 1
