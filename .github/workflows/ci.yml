name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: [self-hosted, big]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          install-deps: 'true'
      - run: npm run lint
      - run: npm run format:check

  typecheck:
    name: Type Check
    runs-on: [self-hosted, big]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          install-deps: 'true'
          generate-prisma: 'true'
      - run: npx tsc --noEmit

  test:
    name: Test
    runs-on: [self-hosted, big]
    timeout-minutes: 10
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          install-deps: 'true'
          generate-prisma: 'true'
      - run: npm test

  build:
    name: Build
    runs-on: [self-hosted, big]
    timeout-minutes: 15
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          install-deps: 'true'
          generate-prisma: 'true'
      - name: Build and measure
        id: build-metrics
        run: |
          set -euo pipefail
          START=$(date +%s)
          npm run build
          END=$(date +%s)
          DURATION=$((END - START))
          SIZE=$(du -sb .next | cut -f1)

          node .github/workflows/scripts/build-metrics.cjs write \
            --size-bytes "$SIZE" \
            --duration-seconds "$DURATION" \
            --next-cache-enabled false \
            --output-dir "$RUNNER_TEMP"
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Upload build metrics artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build-metrics.outputs.artifact_name }}
          path: ${{ steps.build-metrics.outputs.metrics_file }}
          if-no-files-found: error
          retention-days: 30
