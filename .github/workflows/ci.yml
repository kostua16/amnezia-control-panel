name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: [self-hosted, big]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          install-deps: 'true'
          require-gh-auth: 'false'
      - run: npm run lint
      - run: npm run format:check
      - name: Block Prisma unsafe raw SQL
        run: node .github/workflows/scripts/check-prisma-safe-sql.cjs

  typecheck:
    name: Type Check
    runs-on: [self-hosted, big]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          install-deps: 'true'
          generate-prisma: 'true'
          require-gh-auth: 'false'
      - run: npm run typecheck

  test:
    name: Test
    runs-on: [self-hosted, big]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          install-deps: 'true'
          generate-prisma: 'true'
          require-gh-auth: 'false'
      - run: npm run test-only
      - run: node --test .github/workflows/scripts/__tests__/*.test.cjs

  build:
    name: Build
    runs-on: [self-hosted, big]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          install-deps: 'true'
          generate-prisma: 'true'
          require-gh-auth: 'false'
      - name: Build and measure
        id: build-metrics
        run: |
          set -euo pipefail
          START=$(date +%s)
          npm run build
          END=$(date +%s)
          DURATION=$((END - START))
          SIZE=$(du -sb .next | cut -f1)

          node .github/workflows/scripts/build-metrics.cjs write \
            --size-bytes "$SIZE" \
            --duration-seconds "$DURATION" \
            --next-cache-enabled false \
            --output-dir "$RUNNER_TEMP"
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Upload build metrics artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.build-metrics.outputs.artifact_name }}
          path: ${{ steps.build-metrics.outputs.metrics_file }}
          if-no-files-found: error
          retention-days: 30

  security-audit:
    name: Security Audit
    runs-on: [self-hosted, big]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          setup-bun: 'false'
          require-gh-auth: 'false'
      - name: npm audit (high+ advisories)
        run: npm audit --audit-level=high
