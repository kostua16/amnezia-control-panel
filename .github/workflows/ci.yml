name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: self-hosted
    timeout-minutes: 5
    outputs:
      run-heavy: ${{ steps.detect.outputs.run-heavy }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - name: Detect code-relevant changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            RANGE="$PR_BASE..$PR_HEAD"
          elif [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="HEAD~1..HEAD"
          else
            RANGE="$PUSH_BEFORE..$PUSH_AFTER"
          fi
          CHANGED=$(git diff --name-only "$RANGE" 2>/dev/null || true)
          # docs-only = markdown, docs/, LICENSE, .editorconfig. If changes can't
          # be determined, run heavy (safe default).
          if [ -z "$CHANGED" ] || printf '%s\n' "$CHANGED" | grep -Evq '^(docs/|.*\.md$|LICENSE$|\.editorconfig$)'; then
            echo "run-heavy=true" >> "$GITHUB_OUTPUT"
          else
            echo "run-heavy=false" >> "$GITHUB_OUTPUT"
          fi
  lint:
    name: Lint
    needs: [changes]
    if: needs.changes.outputs.run-heavy == 'true'
    runs-on: [self-hosted, big]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          install-deps: 'true'
          require-gh-auth: 'false'
      - run: npm run lint
      - run: npm run format:check
      - name: Check shell script syntax
        run: |
          set -euo pipefail
          failed=0
          for script in scripts/*.sh docker-entrypoint.sh docker/stack-entrypoint.sh; do
            [ -f "$script" ] || continue
            if ! bash -n "$script"; then
              echo "::error file=$script::shell syntax check failed"
              failed=1
            fi
          done
          exit "$failed"
      - name: Block Prisma unsafe raw SQL
        run: node .github/workflows/scripts/check-prisma-safe-sql.cjs

  typecheck:
    name: Type Check
    needs: [changes]
    if: needs.changes.outputs.run-heavy == 'true'
    runs-on: [self-hosted, big]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          install-deps: 'true'
          generate-prisma: 'true'
          require-gh-auth: 'false'
      - run: npm run typecheck

  test:
    name: Test
    needs: [changes]
    if: needs.changes.outputs.run-heavy == 'true'
    runs-on: [self-hosted, big]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          install-deps: 'true'
          generate-prisma: 'true'
          require-gh-auth: 'false'
      - run: npm run test-only
      - run: node --test .github/workflows/scripts/__tests__/*.test.cjs

  build:
    name: Build
    needs: [changes]
    if: needs.changes.outputs.run-heavy == 'true'
    runs-on: [self-hosted, big]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          install-deps: 'true'
          generate-prisma: 'true'
          require-gh-auth: 'false'
      - name: Build and measure
        id: build-metrics
        run: |
          set -euo pipefail
          START=$(date +%s)
          npm run build
          END=$(date +%s)
          DURATION=$((END - START))
          SIZE=$(du -sb .next | cut -f1)

          node .github/workflows/scripts/build-metrics.cjs write \
            --size-bytes "$SIZE" \
            --duration-seconds "$DURATION" \
            --next-cache-enabled false \
            --output-dir "$RUNNER_TEMP"
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Upload build metrics artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.build-metrics.outputs.artifact_name }}
          path: ${{ steps.build-metrics.outputs.metrics_file }}
          if-no-files-found: error
          retention-days: 30

  security-audit:
    name: Security Audit
    needs: [changes]
    if: needs.changes.outputs.run-heavy == 'true'
    runs-on: [self-hosted, big]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          setup-bun: 'false'
          require-gh-auth: 'false'
      - name: npm audit (high+ advisories)
        run: npm audit --audit-level=high
