name: Dependency Review

run-name: "PR #${{ github.event.inputs.pr_number || 'manual' }} @ ${{ github.event.inputs.head_sha || github.sha }}"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Dependabot PR number to review'
        required: true
        type: string
      head_sha:
        description: 'Expected pull request head SHA'
        required: false
        type: string
      base_ref:
        description: 'Expected pull request base ref'
        required: false
        type: string
      orchestrated:
        description: 'Whether this run was dispatched by PR Orchestrator'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: dep-review-${{ github.event.pull_request.number || github.event.inputs.pr_number || github.sha }}
  cancel-in-progress: true

env:
  MAX_TURNS: 80

jobs:
  resolve-pr:
    runs-on: self-hosted
    timeout-minutes: 10
    outputs:
      should-run: ${{ steps.resolve.outputs.should_run }}
      pr-number: ${{ steps.resolve.outputs.pr_number }}
      base-ref: ${{ steps.resolve.outputs.base_ref }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Dependabot PR context
        id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            let pr = null;

            const response = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(context.payload.inputs.pr_number)
            });
            pr = response.data;

            const expectedHeadSha = context.payload.inputs?.head_sha || '';
            const headMatches = !expectedHeadSha || pr.head.sha === expectedHeadSha;
            const isOpen = pr.state === 'open' && !pr.merged;
            const shouldRun = isOpen && headMatches && pr.user.login === 'dependabot[bot]';
            core.setOutput('should_run', String(shouldRun));
            core.setOutput('pr_number', String(pr.number));
            core.setOutput('base_ref', context.payload.inputs?.base_ref || pr.base.ref);

  ai-dependency-review:
    needs: [resolve-pr]
    if: needs.resolve-pr.outputs.should-run == 'true'
    runs-on: [self-hosted, big]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: refs/pull/${{ needs.resolve-pr.outputs.pr-number }}/head
          fetch-depth: 0

      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          install-deps: 'true'
          install-rtk: 'true'

      - name: Ensure dependency review labels exist
        uses: ./.github/actions/ensure-workflow-labels
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          policy-file: .github/workflows/policy.json
          names: deps-review-passed,deps-review-manual,deps-review-blocked

      - name: Get dependency diff
        id: diff
        env:
          BASE_REF: ${{ needs.resolve-pr.outputs.base-ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # One-shot -c (not `git config`) so the rewritten URL is never written
          # to .git/config. Persisted credentials must stay off this reused
          # self-hosted workspace; actions/checkout uses persist-credentials: false.
          git -c "url.https://x-access-token:${GH_TOKEN}@github.com/.insteadOf=https://github.com/" fetch origin "$BASE_REF" --depth=1
          git diff "origin/$BASE_REF" -- package.json package-lock.json .github/workflows .github/actions > /tmp/dep-diff.txt
          {
            DELIM="EOF-$(openssl rand -hex 8)"
            echo "diff<<$DELIM"
            head -200 /tmp/dep-diff.txt
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Review dependency update
        id: review
        uses: ./.github/actions/run-zai
        with:
          api-key: ${{ secrets.ZAI_API_KEY }}
          model: 'haiku'
          max-turns: '${{ env.MAX_TURNS }}'
          track-progress: 'true'
          allowed-bots: ${{ github.event.inputs.orchestrated == 'true' && 'github-actions,github-actions[bot],claude[bot]' || '' }}
          json-schema: '{"type":"object","properties":{"verdict":{"type":"string","enum":["passed","manual","blocked"]},"summary":{"type":"string"},"update_type":{"type":"string","enum":["patch","minor","major","unknown"]},"risk_notes":{"type":"string"}},"required":["verdict","summary","update_type","risk_notes"],"additionalProperties":false}'
          allowed-tools: 'Bash(npm audit:*),Bash(npm ls:*),Bash(cat *),Bash(grep *),Bash(head *),Bash(node *),Bash(rtk:*)'
          prompt: |
            Review this Dependabot dependency update PR using only local repository context.

            Review criteria:
            1. Breaking-change risk from the manifest and lockfile diff
            2. Security advisories resolved or introduced according to `npm audit`
            3. Potential compatibility issues with Node 24 / Next.js 16 / React 19
            4. Whether the update should stay auto-merge eligible or require manual review

            GitHub Actions updates (diff touches `.github/workflows/**` or `.github/actions/**` instead of npm manifests):
            - verdict `passed` ONLY when every changed line is a pinned-digest bump (one full-length commit SHA replaced by another full-length SHA, optionally with an updated version comment) or a patch-level version bump of an action that stays pinned to a full-length SHA
            - any newly unpinned action, tag-only reference, minor/major version jump, or edit beyond the `uses:` lines and their version comments → verdict `manual`
            - use update_type `patch` for digest-only bumps

            Dependency diff:
            ${{ steps.diff.outputs.diff }}

            Use local evidence only:
            - package.json / package-lock.json diff
            - `npm audit`
            - `npm ls`
            - lockfile and manifest metadata

            Do NOT browse the web or claim you checked changelogs.

            Return JSON only:
            - verdict: passed | manual | blocked
            - summary: one short sentence
            - update_type: patch | minor | major | unknown
            - risk_notes: short justification

            Do NOT approve the PR or edit labels yourself. The workflow handles dependency review signals and comments.
            Operate as the `kos-dependency-review` agent: first read `.claude/agents/kos-dependency-review.md` and follow it as your operating contract (it enforces this prompt's rules and adds run-mined failure knowledge), then perform the task.

      - name: Apply dependency review signal
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          PR_NUMBER: ${{ needs.resolve-pr.outputs.pr-number }}
          STRUCTURED_OUTPUT: ${{ steps.review.outputs.structured_output }}
        with:
          script: |
            const review = JSON.parse(process.env.STRUCTURED_OUTPUT || '{}');
            const issueNumber = Number(process.env.PR_NUMBER);
            const labelMap = {
              passed: 'deps-review-passed',
              manual: 'deps-review-manual',
              blocked: 'deps-review-blocked'
            };
            const addLabel = labelMap[review.verdict] || 'deps-review-manual';
            const removeLabels = Object.values(labelMap).filter((name) => name !== addLabel);

            for (const label of removeLabels) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: label
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: [addLabel]
            });

      - name: Upsert dependency review comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.resolve-pr.outputs.pr-number }}
          STRUCTURED_OUTPUT: ${{ steps.review.outputs.structured_output }}
        run: |
          node .github/workflows/scripts/upsert-dependency-review-comment.cjs \
            --pr "$PR_NUMBER"

  wake-orchestrator:
    needs: [resolve-pr, ai-dependency-review]
    if: always() && github.event.inputs.orchestrated == 'true' && github.event.inputs.pr_number != ''
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wake PR Orchestrator
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
        run: |
          gh workflow run pr-flow.yml \
            --ref main \
            -f pr_number="$PR_NUMBER" \
            -f dry_run=false
