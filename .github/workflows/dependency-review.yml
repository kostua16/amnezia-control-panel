name: Dependency Review

on:
  pull_request:
    paths: ['package.json', 'package-lock.json']

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: dep-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  MAX_TURNS: 80

jobs:
  ai-dependency-review:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-environment
        with:
          install-deps: "true"
          install-rtk: "true"

      - name: Get dependency diff
        id: diff
        run: |
          git diff origin/main -- package.json package-lock.json > /tmp/dep-diff.txt
          echo "diff<<EOF" >> "$GITHUB_OUTPUT"
          head -200 /tmp/dep-diff.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/run-claude
        with:
          model: "${{ vars.ANTHROPIC_DEFAULT_HAIKU_MODEL }}"
          max-turns: "${{ env.MAX_TURNS }}"
          track-progress: "true"
          allowed-tools: "Bash(npm audit:*),Bash(npm ls:*),Bash(cat *),Bash(gh pr comment:*)"
          prompt: |
            Review this Dependabot dependency update PR for:
            1. Breaking changes (check changelogs for major version bumps)
            2. Security advisories resolved
            3. Potential compatibility issues with Node 22 / Next.js 16 / React 19
            4. Bundle size impact

            Dependency diff:
            ${{ steps.diff.outputs.diff }}

            Run `npm audit` to check current vulnerability status.

            Post a PR comment with verdict:
            - APPROVE: safe patch/minor with no breaking changes
            - REVIEW NEEDED: major bump or breaking changes detected
            - BLOCK: new security vulnerability introduced
