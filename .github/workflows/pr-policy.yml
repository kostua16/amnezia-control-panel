name: PR Policy

# SECURITY NOTE
# This workflow uses pull_request_target only to read PR metadata and apply labels/status.
# It does not check out or execute pull-request head code.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label-and-validate:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          setup-node: 'false'
          setup-bun: 'false'

      - name: Ensure PR policy labels exist
        uses: ./.github/actions/ensure-workflow-labels
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          policy-file: .github/workflows/policy.json

      - name: Apply PR labels and policy status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const fs = require('fs');
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setFailed('pull_request payload missing');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = pr.number;
            const policy = JSON.parse(fs.readFileSync('.github/workflows/policy.json', 'utf8'));
            const sizeLabels = ['size/XS', 'size/S', 'size/M', 'size/L', 'size/XL'];
            const areaLabels = [
              'area/workflows', 'area/planning', 'area/docs', 'area/frontend',
              'area/backend', 'area/database', 'area/tests', 'area/dependencies', 'area/docker'
            ];

            function escapeRegex(value) {
              return value.replace(/[|\\{}()[\]^$+?.]/g, '\\$&');
            }

            function globToRegExp(glob) {
              let regex = '^';
              for (let index = 0; index < glob.length; index += 1) {
                const char = glob[index];
                const next = glob[index + 1];
                if (char === '*' && next === '*') {
                  regex += '.*';
                  index += 1;
                } else if (char === '*') {
                  regex += '[^/]*';
                } else {
                  regex += escapeRegex(char);
                }
              }
              return new RegExp(`${regex}$`);
            }

            function matchesAny(filename, globs) {
              return (globs || []).some((glob) => globToRegExp(glob).test(filename));
            }

            function startsWithAny(value, prefixes) {
              return (prefixes || []).some((prefix) => value.startsWith(prefix));
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: issue_number,
              per_page: 100
            });
            const filenames = files.map((file) => file.filename);
            const changedLines = files.reduce((sum, file) => sum + file.additions + file.deletions, 0);
            const headRef = pr.head?.ref || '';
            const trustedPlanning = startsWithAny(
              headRef,
              policy.trustedPlanning?.branchPrefixes || []
            ) && filenames.length > 0 && filenames.every((filename) =>
              matchesAny(filename, policy.trustedPlanning?.allowedPathGlobs || [])
            );
            const isGsdExecution = Boolean(policy.gsdExecution?.branchPrefix) &&
              headRef.startsWith(policy.gsdExecution.branchPrefix);
            const gsdExecutionSafe = isGsdExecution &&
              filenames.length > 0 &&
              files.length <= Number(policy.gsdExecution?.maxFiles || 0) &&
              changedLines <= Number(policy.gsdExecution?.maxChangedLines || 0) &&
              filenames.every((filename) =>
                matchesAny(filename, policy.gsdExecution?.safeAllowedPathGlobs || [])
              ) &&
              !filenames.some((filename) =>
                matchesAny(filename, policy.gsdExecution?.manualOnlyPathGlobs || [])
              );
            const generatedStateFiles = filenames.filter((filename) => filename.startsWith('graphify-out/'));

            const labels = new Set();
            if (changedLines <= 20) labels.add('size/XS');
            else if (changedLines <= 100) labels.add('size/S');
            else if (changedLines <= 300) labels.add('size/M');
            else if (changedLines <= 800) labels.add('size/L');
            else labels.add('size/XL');

            for (const filename of filenames) {
              if (filename.startsWith('.github/')) labels.add('area/workflows');
              if (filename.startsWith('.planning/')) labels.add('area/planning');
              if (filename.startsWith('docs/') || filename === 'README.md') labels.add('area/docs');
              if (filename.startsWith('src/app/') || filename.startsWith('src/components/')) labels.add('area/frontend');
              if (filename.startsWith('src/lib/') || filename.startsWith('src/app/api/')) labels.add('area/backend');
              if (filename.startsWith('prisma/')) labels.add('area/database');
              if (filename.includes('__tests__') || filename.endsWith('.test.ts') || filename.endsWith('.test.tsx')) labels.add('area/tests');
              if (filename === 'package.json' || filename === 'package-lock.json') labels.add('area/dependencies');
              if (filename === 'Dockerfile' || filename === 'docker-compose.yml' || filename.startsWith('docker/')) labels.add('area/docker');
            }

            const manualOnly = filenames.some((filename) => filename.startsWith('.github/') || filename.startsWith('.planning/')) &&
              !trustedPlanning &&
              !(isGsdExecution && gsdExecutionSafe);
            const securitySensitiveTest = filenames.some((filename) =>
              /(__tests__\/.*(hmac|auth|sync|server|panel|user|config).*\.test\.ts$|src\/lib\/(hmac|auth|auth-store|prisma|panel-|server-|user-|config-).*)/.test(filename)
            );
            if (manualOnly || securitySensitiveTest || (isGsdExecution && !gsdExecutionSafe) || generatedStateFiles.length > 0) labels.add('needs-review');

            const titlePattern = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|security|planning)(\([^)]+\))?!?: .+/;
            const badReasons = [];
            if (!titlePattern.test(pr.title || '')) {
              badReasons.push('PR title must use Conventional Commit format, e.g. `feat(scope): summary`.');
            }

            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner,
              repo,
              pull_number: issue_number,
              per_page: 100
            });
            const badCommits = commits
              .map((commit) => commit.commit.message.split('\n')[0])
              .filter((subject) => !titlePattern.test(subject) && !subject.startsWith('Merge '));
            if (badCommits.length > 0) {
              badReasons.push(`Non-conventional commit subjects: ${badCommits.slice(0, 5).join('; ')}`);
            }

            const existingLabels = (await github.paginate(github.rest.issues.listLabelsOnIssue, {
              owner,
              repo,
              issue_number,
              per_page: 100
            })).map((label) => label.name);

            for (const label of [...sizeLabels, ...areaLabels]) {
              if (existingLabels.includes(label) && !labels.has(label)) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name: label }).catch((error) => {
                  if (error.status !== 404) throw error;
                });
              }
            }

            if (labels.size > 0) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [...labels] });
            }

            const state = badReasons.length === 0 ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: pr.head.sha,
              state,
              context: 'pr-policy/conventional-commits',
              description: badReasons.length === 0 ? 'PR title and commits follow policy' : badReasons[0].slice(0, 140)
            });

            const generatedStateReasons = [];
            if (generatedStateFiles.length > 0) {
              generatedStateReasons.push(`Generated graphify state is local cache and must not be committed: ${generatedStateFiles.slice(0, 5).join(', ')}`);
            }

            const generatedState = generatedStateReasons.length === 0 ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: pr.head.sha,
              state: generatedState,
              context: 'pr-policy/generated-state',
              description: generatedStateReasons.length === 0 ? 'No generated graphify state in PR' : generatedStateReasons[0].slice(0, 140)
            });

            const failureReasons = [...badReasons, ...generatedStateReasons];
            if (failureReasons.length > 0) {
              core.setFailed(failureReasons.join('\n'));
            }
