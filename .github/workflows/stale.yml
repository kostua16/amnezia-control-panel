# Stale Issues — owns the 60d-inactivity lifecycle for issues and PRs.
# Boundary contract (MNT-I08): this workflow is the sole handler for
# inactivity-based stale/close.  maintenance.yml's 90d review skips
# `stale`-labeled issues; issue-catch-up.yml skips `stale`-labeled issues
# only from inactivity re-engagement buckets (duplicate/canceled close
# still fire promptly).  If you change the label name or exempt list
# here, update those two workflows to match.
name: Stale Issues

on:
  schedule:
    - cron: '23 1 * * 0' # Weekly Sunday at 01:23 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93
        with:
          days-before-stale: 60
          days-before-close: 30
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          exempt-issue-labels: 'keep-open,backlog,in-progress'
          exempt-pr-labels: 'keep-open,in-progress'
          stale-issue-message: 'This issue has been inactive for 60 days. It will be closed in 30 days unless there is new activity.'
          stale-pr-message: 'This PR has been inactive for 60 days. It will be closed in 30 days unless there is new activity.'
