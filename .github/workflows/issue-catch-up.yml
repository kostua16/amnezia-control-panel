name: Issue Catch-Up

on:
  schedule:
    - cron: '37 * * * *' # Every hour at :37 (offset from workflow-health-optimize at :07)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what would happen without taking action'
        type: boolean
        default: false

concurrency:
  group: issue-catch-up
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
  checks: read
  statuses: write

env:
  NODE_VERSION: '24.x'

jobs:
  collect-issues:
    name: Collect Issues
    runs-on: self-hosted
    timeout-minutes: 10
    outputs:
      has-actionable: ${{ steps.categorize.outputs.has_actionable }}
      categorized: ${{ steps.categorize.outputs.categorized }}
      rate-limited: ${{ steps.categorize.outputs.rate_limited }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          node-version: ${{ env.NODE_VERSION }}

      - name: Ensure labels exist
        uses: ./.github/actions/ensure-workflow-labels
        with:
          github-token: ${{ secrets.GH_PAT }}
          policy-file: .github/workflows/policy.json
          names: auto-fix,umbrella-sub-issue,high,medium,low,triaged,triage-failed

      # Hourly umbrella progress engine: tick checkboxes for completed
      # sub-issues, close umbrellas with a fully ticked checklist, and top up
      # sub-issues for the next unchecked items (max 3 open per umbrella).
      # Deterministic — runs before (and independent of) the agent sweep.
      - name: Reconcile and spin off umbrella sub-issues
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          EXTRA=""
          if [ "$DRY_RUN" = "true" ]; then EXTRA="--dry-run"; fi
          node .github/workflows/scripts/umbrella-sub-issues.cjs \
            --all --reconcile --spin-off $EXTRA

      - name: Fetch and categorize open issues
        id: categorize
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const EXEMPT_LABELS = ['keep-open', 'backlog', 'in-progress', 'fixed'];
            const MAX_ACTIONS = 30;

            // Umbrella/tracking issues (todo-backlog umbrellas, claude-health
            // rolling trackers, grouped canonicals) are fully exempt from the
            // sweep regardless of labels — a stray `canceled`/`duplicate`
            // label must never get a 20-item backlog auto-closed.
            const { isTrackingIssue } = require(
              `${process.env.GITHUB_WORKSPACE}/.github/workflows/scripts/lib/tracking-issue.cjs`
            );

            // --- Fetch all open issues ---
            const allIssues = [];
            let page = 1;
            while (true) {
              const resp = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100,
                page
              });
              if (resp.data.length === 0) break;
              // Exclude PRs (they have pull_request property)
              allIssues.push(...resp.data.filter(i => !i.pull_request));
              if (resp.data.length < 100) break;
              page++;
            }
            core.info(`Found ${allIssues.length} open issues`);

            // --- Check active triage/fix workflow runs ---
            const activeRuns = new Set();
            for (const wf of ['triage.yml', 'fix-issue.yml']) {
              try {
                const runs = await github.rest.actions.listWorkflowRunsForRepo({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: wf,
                  status: 'in_progress',
                  per_page: 50
                });
                for (const r of runs.data.workflow_runs) {
                  // Extract issue number from branch name or run metadata
                  const match = r.head_branch?.match(/claude-fix-issue-(\d+)/);
                  if (match) activeRuns.add(Number(match[1]));
                }
                // Also check queued runs
                const queued = await github.rest.actions.listWorkflowRunsForRepo({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: wf,
                  status: 'queued',
                  per_page: 50
                });
                for (const r of queued.data.workflow_runs) {
                  const match = r.head_branch?.match(/claude-fix-issue-(\d+)/);
                  if (match) activeRuns.add(Number(match[1]));
                }
              } catch (e) {
                core.warning(`Failed to check ${wf} runs: ${e.message}`);
              }
            }
            core.info(`Active fix/triage runs for issues: ${[...activeRuns].join(',') || 'none'}`);

            // --- Check for fix branches (indicates fix in progress even if workflow completed) ---
            try {
              const branches = await github.rest.repos.listBranches({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              });
              for (const b of branches.data) {
                const match = b.name.match(/claude-fix-issue-(\d+)/);
                if (match) activeRuns.add(Number(match[1]));
              }
            } catch (e) {
              core.warning(`Failed to list branches: ${e.message}`);
            }

            // --- Categorize issues ---
            const buckets = {
              needs_retriage: [],
              triage_dead_letter: [],
              should_close_dupe: [],
              should_close_canceled: [],
              orphaned_fixed: [],
              priority_escalation: [],
              groupable_candidates: [],
              triaged_no_fix: [],
              fix_dead_letter: [],
              dead_letter_retry: []
            };

            const twoHoursAgo = new Date(Date.now() - 2 * 60 * 60 * 1000);
            const twoDaysAgo = new Date(Date.now() - 2 * 24 * 60 * 60 * 1000);
            const sevenDaysAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);

            for (const issue of allIssues) {
              const labels = issue.labels.map(l => l.name);
              const num = issue.number;

              // Skip exempt labels and umbrella/tracking issues
              if (EXEMPT_LABELS.some(el => labels.includes(el))) continue;
              if (isTrackingIssue(issue)) continue;

              // Skip if active fix/triage run
              if (activeRuns.has(num)) continue;

              const hasTriaged = labels.includes('triaged');
              const hasDuplicate = labels.includes('duplicate');
              const hasCanceled = labels.includes('canceled');
              const hasCritical = labels.includes('critical');
              const hasHigh = labels.includes('high');
              const hasNeedsReview = labels.includes('needs-review');
              const hasTriageFailed = labels.includes('triage-failed');
              const createdAt = new Date(issue.created_at);

              // Bucket: should_close_dupe — close any issue with duplicate label
              if (hasDuplicate) {
                buckets.should_close_dupe.push({ number: num, title: issue.title });
                continue;
              }

              // Bucket: should_close_canceled
              if (hasCanceled) {
                buckets.should_close_canceled.push({ number: num, title: issue.title });
                continue;
              }

              // Bucket: orphaned_fixed — has 'fixed' label but still open >7d
              if (labels.includes('fixed') && createdAt < sevenDaysAgo) {
                buckets.orphaned_fixed.push({ number: num, title: issue.title });
                continue;
              }

              // Bucket: priority_escalation — critical/high, no in-progress/fixed, open >48h
              if ((hasCritical || hasHigh) && !hasTriaged && createdAt < twoDaysAgo) {
                buckets.priority_escalation.push({ number: num, title: issue.title, labels });
                continue;
              }

              // Fetch comments for triage/fix attempt counting
              let comments = [];
              try {
                const commentsResp = await github.rest.issues.listComments({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: num,
                  per_page: 100
                });
                comments = commentsResp.data;
              } catch (e) {
                core.warning(`Failed to fetch comments for #${num}: ${e.message}`);
              }

              // A dead-letter fresh-context retry resets the attempt counter:
              // attempts made before the latest retry marker are history, not
              // budget. Without this, an un-parked issue would count its old
              // attempts and be re-parked on the next sweep with zero new runs.
              const RETRY_MARKER = '<!-- dead-letter-retry -->';
              const retryMarkerAt = comments
                .filter(c => (c.body || '').includes(RETRY_MARKER))
                .map(c => new Date(c.created_at).getTime())
                .sort((a, b) => b - a)[0] || 0;
              const afterRetry = c => new Date(c.created_at).getTime() > retryMarkerAt;

              // Re-triage attempts count both the legacy "/triage" comments and
              // the deterministic workflow_dispatch markers. A dispatch marker
              // is only posted after the dispatch API call succeeded, so every
              // counted attempt actually started (or could start) a triage run.
              const triageComments = comments.filter(c =>
                (c.body.includes('/triage') ||
                  c.body.includes('<!-- re-triage-dispatch -->')) &&
                afterRetry(c)
              );
              const fixComments = comments.filter(c =>
                c.body.includes('/fix') && afterRetry(c)
              );

              // Parked dead letters: issues needs-review'd after repeated
              // automation failures get exactly ONE fresh-context retry after
              // 7 days (failures are often transient: turn limits, runner
              // pressure). The retry marker makes a second cycle impossible.
              const hasRetryMarker = retryMarkerAt > 0;
              const deadLetterComment = comments.find(c =>
                /attempted 2x without success/i.test(c.body || '')
              );
              // triage-failed parks failed-triage dead letters; needs-review is
              // the legacy parking label (and still parks fix dead letters).
              // needs-review must never be applied for triage failures — it is
              // terminal for project-manager's issue /fix route, which would
              // strand the issue with no automated recovery path.
              if ((hasNeedsReview || hasTriageFailed) && deadLetterComment) {
                const DL_AUTO_GEN = [/\[auto-fix\]/, /\[workflow-health\]/];
                const parkedLongEnough =
                  new Date(deadLetterComment.created_at) < sevenDaysAgo;
                const kind = /^Triage/i.test(deadLetterComment.body || '')
                  ? 'triage'
                  : 'fix';
                const dlAutomationAuthored =
                  ['maintenance', 'auto-fix', 'ci-failure'].some(l => labels.includes(l)) ||
                  issue.user?.type === 'Bot';
                const dlFixEligible =
                  dlAutomationAuthored &&
                  ['low', 'medium', 'high'].some(p => labels.includes(p)) &&
                  !labels.includes('security') &&
                  !labels.includes('critical') &&
                  !DL_AUTO_GEN.some(p => p.test(issue.title));
                const retryEligible = kind === 'triage' || dlFixEligible;
                if (!hasRetryMarker && parkedLongEnough && retryEligible) {
                  buckets.dead_letter_retry.push({
                    number: num,
                    title: issue.title,
                    kind
                  });
                }
                continue;
              }

              if (!hasTriaged) {
                // Check triage cooldown — skip if /triage posted in last 2h
                const recentTriage = triageComments.find(c =>
                  new Date(c.created_at) > twoHoursAgo
                );
                if (recentTriage) continue;

                // Bucket: triage_dead_letter — >=2 triage attempts without success
                if (triageComments.length >= 2) {
                  if (!hasNeedsReview && !hasTriageFailed) {
                    buckets.triage_dead_letter.push({ number: num, title: issue.title });
                  }
                  continue;
                }

                // Bucket: needs_retriage — no triaged label, <2 past triage attempts
                buckets.needs_retriage.push({
                  number: num,
                  title: issue.title,
                  attempt: triageComments.length + 1
                });
                continue;
              }

              // Issue has triaged label from here on

              // Check for linked PR in body or comments
              const hasLinkedPR = /Fixes #\d+|pull\/\d+|PR:.*#\d+/.test(
                (issue.body || '') + comments.map(c => c.body).join(' ')
              );
              if (hasLinkedPR) continue;

              // Check fix attempt count
              if (fixComments.length >= 2) {
                // Bucket: fix_dead_letter — >=2 fix attempts without success
                if (!hasNeedsReview) {
                  buckets.fix_dead_letter.push({ number: num, title: issue.title });
                }
                continue;
              }

              // Bucket: triaged_no_fix — has triaged, no linked PR, no active fix, <2 fix attempts
              // Only consider issues triaged >1h ago (give triage workflow time to settle)
              // Skip issues already flagged needs-review: the manual-fix notice is a one-time nudge, not an hourly reminder
              // Skip auto-generated issues whose titles match patterns from failed workflows
              const AUTO_GEN_PATTERNS = [/\[auto-fix\]/, /\[workflow-health\]/];
              const triageResultComment = comments.find(c =>
                c.body.includes('Triage Result')
              );
              const triagedAt = triageResultComment
                ? new Date(triageResultComment.created_at)
                : createdAt;
              const oneHourAgo = new Date(Date.now() - 60 * 60 * 1000);
              if (triagedAt < oneHourAgo && !hasNeedsReview && !AUTO_GEN_PATTERNS.some(p => p.test(issue.title))) {
                // Auto-fix authorization: automation-authored issues triaged
                // low/medium/high may receive /fix without a maintainer;
                // security/critical (and human-authored) issues stay manual.
                const automationAuthored =
                  ['maintenance', 'auto-fix', 'ci-failure'].some(l => labels.includes(l)) ||
                  issue.user?.type === 'Bot';
                const autoFixEligible =
                  automationAuthored &&
                  ['low', 'medium', 'high'].some(p => labels.includes(p)) &&
                  !labels.includes('security') &&
                  !labels.includes('critical');
                buckets.triaged_no_fix.push({
                  number: num,
                  title: issue.title,
                  attempt: fixComments.length + 1,
                  auto_fix_eligible: autoFixEligible
                });
                continue;
              }

              // Bucket: groupable_candidates — triaged, no fix running, triage result >24h old
              const oneDayAgo = new Date(Date.now() - 24 * 60 * 60 * 1000);
              if (triagedAt < oneDayAgo && triageResultComment) {
                buckets.groupable_candidates.push({
                  number: num,
                  title: issue.title,
                  triage_result: triageResultComment.body.substring(0, 2000)
                });
              }
            }

            // --- Title-based dedup: close newer duplicates of same title ---
            const titleGroups = {};
            for (const issue of allIssues) {
              const labels = issue.labels.map(l => l.name);
              if (EXEMPT_LABELS.some(el => labels.includes(el))) continue;
              if (isTrackingIssue(issue)) continue;
              if (labels.includes('canceled') || labels.includes('duplicate')) continue;
              const key = issue.title.trim().toLowerCase();
              if (!titleGroups[key]) titleGroups[key] = [];
              titleGroups[key].push({ number: issue.number, title: issue.title, created: issue.created_at });
            }
            for (const [title, issues] of Object.entries(titleGroups)) {
              if (issues.length < 2) continue;
              issues.sort((a, b) => new Date(a.created) - new Date(b.created));
              const canonical = issues[0];
              for (let i = 1; i < issues.length; i++) {
                buckets.should_close_dupe.push({
                  number: issues[i].number,
                  title: issues[i].title,
                  duplicate_of: canonical.number
                });
              }
            }

            // --- Rate limit check ---
            // needs_retriage and triage_dead_letter are executed by the
            // deterministic re-triage step in this job (never by the agent),
            // so they don't count toward the agent's workload.
            const totalActions =
              buckets.should_close_dupe.length +
              buckets.should_close_canceled.length +
              buckets.orphaned_fixed.length +
              buckets.priority_escalation.length +
              buckets.triaged_no_fix.length +
              buckets.fix_dead_letter.length +
              buckets.dead_letter_retry.length;

            const rateLimited = totalActions > MAX_ACTIONS;
            if (rateLimited) {
              core.warning(`Rate limit reached: ${totalActions} actions > ${MAX_ACTIONS} max`);
            }

            const hasActionable = totalActions > 0 || buckets.groupable_candidates.length >= 3;

            core.setOutput('has_actionable', String(hasActionable));
            core.setOutput('rate_limited', String(rateLimited));

            // Truncate to 50KB — drop whole items to keep valid JSON (WHO-I03 pattern).
            const MAX_BYTES = 51200;
            let json = JSON.stringify(buckets);
            if (json.length > MAX_BYTES) {
              const keys = Object.keys(buckets);
              for (let round = 0; round < 200 && json.length > MAX_BYTES; round++) {
                const key = keys[round % keys.length];
                if (buckets[key].length > 0) {
                  buckets[key].pop();
                  json = JSON.stringify(buckets);
                }
              }
              core.info(`Truncated categorized output to ${json.length} bytes`);
            }
            core.setOutput('categorized', json);

            // Recompute after truncation: trimming popped items from buckets,
            // so the per-bucket counts below no longer sum to the
            // pre-truncation totalActions used for rate-limit/has_actionable
            // decisions. Exclude groupable_candidates to match that definition.
            const AGENT_EXCLUDED_BUCKETS = [
              'groupable_candidates',
              'needs_retriage',
              'triage_dead_letter',
            ];
            const loggedTotalActions = Object.entries(buckets)
              .filter(([key]) => !AGENT_EXCLUDED_BUCKETS.includes(key))
              .reduce((sum, [, items]) => sum + items.length, 0);

            core.info('=== Issue Catch-Up Summary ===');
            for (const [bucket, items] of Object.entries(buckets)) {
              core.info(`  ${bucket}: ${items.length}`);
            }
            core.info(`  Total actions: ${loggedTotalActions}`);
            core.info(`  Rate limited: ${rateLimited}`);
            core.info(`  Has actionable: ${hasActionable}`);

      # Deterministic re-triage. The agent used to post "/triage" comments for
      # these buckets, but those were authored by github-actions[bot] via
      # GITHUB_TOKEN — GitHub never starts workflows from such events, so every
      # "attempt" was a guaranteed no-op that still burned the attempt counter
      # and eventually dead-lettered the issue. An explicit workflow_dispatch
      # API call is a real trigger, and running it here (not in the agent job)
      # keeps re-triage working even when the agent itself is down — the exact
      # scenario that produces untriaged issues in the first place.
      - name: Dispatch re-triage and park triage dead letters
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          CATEGORIZED: ${{ steps.categorize.outputs.categorized }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const buckets = JSON.parse(process.env.CATEGORIZED || '{}');
            const dryRun = process.env.DRY_RUN === 'true';
            const MAX_DISPATCHES = 10;
            const retriage = (buckets.needs_retriage || []).slice(0, MAX_DISPATCHES);
            const deadLetters = buckets.triage_dead_letter || [];
            const stepStart = Date.now();
            let dispatched = 0;

            for (const item of retriage) {
              if (dryRun) {
                core.info(`DRY RUN: would dispatch triage.yml for #${item.number} (attempt ${item.attempt})`);
                continue;
              }
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'triage.yml',
                  ref: context.payload.repository?.default_branch || 'main',
                  inputs: { issue_number: String(item.number) }
                });
              } catch (e) {
                // A failed dispatch is NOT an attempt — no marker comment, so
                // the attempt counter is not burned by infrastructure errors.
                core.warning(`triage dispatch failed for #${item.number}: ${e.message}`);
                await core.summary.addRaw(`:warning: triage dispatch failed for #${item.number}: ${e.message}`, true).write();
                continue;
              }
              dispatched += 1;
              // Marker records a real attempt. It must not contain the literal
              // "/triage" (a maintainer-authored comment with that prefix would
              // start a second, comment-triggered triage run).
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: item.number,
                body: `<!-- re-triage-dispatch -->\nRe-triage dispatched via workflow_dispatch (catch-up workflow, attempt ${item.attempt}).`
              });
              core.info(`dispatched triage.yml for #${item.number} (attempt ${item.attempt})`);
            }

            // Liveness check: confirm the dispatches actually became runs.
            // Warning-only — the marker already gates on a successful API call.
            if (dispatched > 0) {
              await new Promise((resolve) => setTimeout(resolve, 10000));
              try {
                const runs = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'triage.yml',
                  event: 'workflow_dispatch',
                  per_page: 30
                });
                const observed = runs.data.workflow_runs.filter(
                  (r) => new Date(r.created_at).getTime() >= stepStart - 60000
                ).length;
                if (observed < dispatched) {
                  core.warning(`dispatched ${dispatched} triage runs but only observed ${observed} started — inert-trigger suspicion`);
                  await core.summary.addRaw(`:warning: dispatched ${dispatched} triage runs, observed only ${observed} started`, true).write();
                } else {
                  core.info(`liveness ok: ${observed} dispatched triage runs observed`);
                }
              } catch (e) {
                core.warning(`liveness check failed: ${e.message}`);
              }
            }

            for (const item of deadLetters) {
              if (dryRun) {
                core.info(`DRY RUN: would park #${item.number} with triage-failed`);
                continue;
              }
              // triage-failed (NOT needs-review): needs-review is terminal for
              // project-manager's issue /fix route, which would leave the issue
              // with no automated recovery path at all.
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: item.number,
                labels: ['triage-failed']
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: item.number,
                body: 'Triage attempted 2x without success. Manual review needed.'
              });
              core.info(`parked #${item.number} as triage-failed`);
            }

            core.info(`re-triage: ${dispatched} dispatched, ${deadLetters.length} parked, dryRun=${dryRun}`);

  analyze-and-act:
    name: Analyze & Act
    runs-on: [self-hosted, big]
    timeout-minutes: 10
    needs: [collect-issues]
    if: needs.collect-issues.outputs.has-actionable == 'true'
    outputs:
      claude_failed: ${{ steps.claude_run.outputs.claude_failed }}
      claude_failure_reason: ${{ steps.claude_run.outputs.claude_failure_reason }}
      claude_num_turns: ${{ steps.claude_run.outputs.claude_num_turns }}
      claude_is_error: ${{ steps.claude_run.outputs.claude_is_error }}
      claude_used_attempt: ${{ steps.claude_run.outputs.claude_used_attempt }}
      claude_metrics_json: ${{ steps.claude_run.outputs.claude_metrics_json }}
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GH_PAT }}
          node-version: ${{ env.NODE_VERSION }}
          install-gsd: 'true'
          install-rtk: 'true'

      - id: claude_run
        uses: ./.github/actions/run-zai
        with:
          api-key: ${{ secrets.ZAI_API_KEY }}
          model: 'sonnet'
          max-turns: '30'
          track-progress: 'false'
          # The agent's gh runs inside claude-code-action, which exports ITS
          # github-token as GH_TOKEN — the job-level GH_PAT env never reaches
          # it. With the default GITHUB_TOKEN the Phase 6 "/fix" comments are
          # authored by github-actions[bot]: GitHub does not start workflows
          # from GITHUB_TOKEN events and fix-issue's policy gate requires a
          # maintainer author, so authorization was silently inert. The PAT
          # makes those comments maintainer-authored real triggers.
          github-token: ${{ secrets.GH_PAT }}
          allowed-bots: 'github-actions[bot]'
          allowed-tools: 'Bash(rtk:*),Bash(gh:*),Bash(git:*),Read,Grep'
          additional-permissions: 'issues: write'
          prompt: |
            ## Task: Issue Catch-Up — Analyze and Act on Orphaned Issues

            REPO: ${{ github.repository }}
            DRY RUN: ${{ github.event.inputs.dry_run || 'false' }}
            RATE LIMITED: ${{ needs.collect-issues.outputs.rate-limited }}

            ### Categorized Issues
            ```json
            ${{ needs.collect-issues.outputs.categorized }}
            ```

            ## PHASE-BASED EXECUTION (MANDATORY)

            **IMPORTANT:** If DRY RUN is "true", prefix every action description with "DRY RUN:" and DO NOT execute any `gh issue close/create/edit/comment` commands. Instead, write a summary of what would happen.

            **IMPORTANT:** If RATE LIMITED is "true", only execute Phase 1 (close stale issues) and Phase 3 (priority escalation). Skip all other phases.

            ### Phase 1: Close Stale Issues (turns 1-5)

            **GUARD (all phases):** NEVER close an issue whose title starts with `[todo-backlog]`, `[claude-health]`, or `[GROUPED]`, or that carries a `backlog`, `keep-open`, or `claude-health` label, or whose body says "Umbrella tracking issue" or "rolling issue". These are umbrella/tracking issues; if one appears in a close bucket, skip it and note the skip in your summary.

            For each `should_close_dupe` issue:
            - If `duplicate_of` field is present (title-based dedup):
            ```
            gh issue comment NUM --body "Closing as duplicate of #DUPLICATE_OF — same title."
            gh issue edit NUM --add-label "duplicate"
            gh issue close NUM --reason "not planned"
            ```
            - Otherwise (label-based dedup):
            ```
            gh issue close NUM --reason "not planned" --comment "Auto-closed by catch-up workflow — duplicate label confirmed."
            ```

            For each `should_close_canceled` issue:
            ```
            gh issue close NUM --reason "not planned" --comment "Auto-closed by catch-up workflow — canceled label confirmed."
            ```

            ### Phase 2: Re-trigger Triage & Handle Dead Letters — NO AGENT ACTION

            The `needs_retriage` and `triage_dead_letter` buckets are handled
            deterministically by the collect job (workflow_dispatch of
            triage.yml and the `triage-failed` parking label). They appear in
            the JSON for visibility only. Do NOT post "/triage" comments and do
            NOT add `needs-review` for triage failures — skip straight to
            Phase 3.

            ### Phase 3: Priority Escalation (turns 16-20)

            For each `priority_escalation` issue:
            ```
            gh issue comment NUM --body "⚠️ Priority issue awaiting attention for >48h. Consider adding 'in-progress' label or assigning."
            ```

            ### Phase 4: Orphaned Fixed Reminders (turns 21-25)

            For each `orphaned_fixed` issue:
            ```
            gh issue comment NUM --body "Issue marked 'fixed' but still open after 7 days. Please close if the fix PR was merged, or remove 'fixed' label if not resolved."
            ```

            ### Phase 5: Smart Grouping (turns 26-45)

            ONLY if `groupable_candidates` has 3 or more items. Otherwise skip this phase.

            Analyze the `triage_result` fields for semantic similarity. Group by:
            - classification (bug/feature/question)
            - priority level
            - root cause area
            - overlapping error messages or symptoms

            For each group of 3 or more similar issues:
            1. Create canonical issue:
               ```
               gh issue create --title "[GROUPED] Common: {summary}" --body "{details with linked issue numbers}" --label "triaged"
               ```
            2. For each original issue in the group:
               ```
               gh issue edit NUM --add-label "duplicate"
               gh issue comment NUM --body "Grouped with #{canonical_number} and similar issues. Closing as duplicate."
               gh issue close NUM --reason "not planned"
               ```

            ### Phase 6: Route Fix Authorization & Handle Dead Letters (turns 46-50)

            For each `fix_dead_letter` issue:
            ```
            gh issue edit NUM --add-label "needs-review"
            gh issue comment NUM --body "Fix attempted 2x without success. Manual review needed."
            ```

            For each `triaged_no_fix` issue (max 5 actions per run, auto-fix and manual combined):
            - First check: `gh issue view NUM --json body,comments` — skip if body/comments contain PR URL, "Fixes #", the issue already has the `needs-review` label, a prior "Manual fix triage needed." comment exists, or a `/fix` comment was posted in the last 6 hours
            - If `auto_fix_eligible` is true in the JSON data (automation-authored, triaged low/medium/high, no security/critical label):
            ```
            gh issue comment NUM --body "/fix"
            gh issue comment NUM --body "Fix auto-authorized (catch-up workflow, attempt N): automation-authored issue triaged low/medium/high with no security or critical label. The resulting PR still passes CI, AI review, and merge policy before merging."
            ```
            Where N is the attempt number from the JSON data.
            - If `auto_fix_eligible` is false:
            ```
            gh issue edit NUM --add-label "needs-review"
            gh issue comment NUM --body "Manual fix triage needed. This issue is triaged but still has no linked fix PR. A maintainer should decide whether to apply \`auto-fix-approved\` or handle it manually."
            ```
            Stop after 5 triaged_no_fix actions, even if more candidates remain.

            ### Phase 7: Dead-Letter Fresh-Context Retry (turns 51-55)

            For each `dead_letter_retry` issue (max 2 per run):
            - First check: `gh issue view NUM --json body,comments` — skip if any comment contains `<!-- dead-letter-retry -->`, or body/comments contain a PR URL or "Fixes #"
            - If safe to proceed:
            ```
            gh issue edit NUM --remove-label "needs-review" --remove-label "triage-failed"
            gh issue comment NUM --body "<!-- dead-letter-retry --> One-time fresh-context retry: this issue was parked after repeated automation failures, which are often transient (turn limits, runner pressure). Retrying once; it will park permanently if this attempt also fails."
            ```
            - If `kind` is "triage": nothing more to do — with the parking label
              removed, the next hourly sweep re-enters the issue into
              `needs_retriage` and the collect job dispatches a real triage run.
            - If `kind` is "fix": `gh issue comment NUM --body "/fix"`
            Stop after 2 dead-letter retries, even if more candidates remain.
            Operate as the `kos-issue-catch-up` agent: first read `.claude/agents/kos-issue-catch-up.md` and follow it as your operating contract (it enforces this prompt's rules and adds run-mined failure knowledge), then perform the task.

  report-failure:
    needs: [collect-issues, analyze-and-act]
    if: failure()
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          node-version: ${{ env.NODE_VERSION }}

      - name: Report catch-up workflow failure
        uses: ./.github/actions/report-failure
        with:
          mode: 'issue'
          auto-fix-run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          issue-title: '[issue-catch-up] Hourly catch-up workflow failed'
          issue-body: |
            ## Issue Catch-Up Failure

            **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            The hourly issue catch-up workflow failed. Manual investigation needed.
          labels: auto-fix,ci-failure
          ensure-labels: auto-fix,ci-failure
          dispatch-triage: 'true'
          claude-step-outcome: ${{ needs.analyze-and-act.result }}
          claude-turns: ${{ needs.analyze-and-act.outputs.claude_num_turns }}
          claude-is-error: ${{ needs.analyze-and-act.outputs.claude_is_error }}
          claude-used-attempt: ${{ needs.analyze-and-act.outputs.claude_used_attempt }}
          claude-failure-reason: ${{ needs.analyze-and-act.outputs.claude_failure_reason }}
          claude-metrics-json: ${{ needs.analyze-and-act.outputs.claude_metrics_json }}
