name: PR Flow Watchdog

run-name: 'PR Flow Watchdog'

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
    - cron: '2,12,17,27,32,42,47,57 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print stale PRs without dispatching PR Orchestrator'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  statuses: read
  # write: the watchdog labels PRs caught in a ready-pending re-poke loop
  # with pm-escalation so a human sees them instead of silent retries.
  pull-requests: write
  issues: read
  actions: write

concurrency:
  group: ${{ github.event.schedule == '2,12,17,27,32,42,47,57 * * * *' && 'pr-flow-sweep-shadow' || 'pr-flow-watchdog' }}
  cancel-in-progress: ${{ github.event.schedule != '2,12,17,27,32,42,47,57 * * * *' }}

jobs:
  watch:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '7,22,37,52 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-auth-mode: ${{ vars.GH_AUTH_MODE || 'env' }}
          install-deps: 'false'

      - name: Wake stale PR flow states
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          node .github/workflows/scripts/watch-pr-flow.cjs \
            --dry-run "$DRY_RUN" \
            --ref main \
            --workflow pr-flow.yml

  shadow:
    if: >-
      github.event_name == 'schedule' && vars.PR_FLOW_SWEEP_MODE == 'shadow' &&
      (github.event.schedule == '7,22,37,52 * * * *' || github.event.schedule == '2,12,17,27,32,42,47,57 * * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      statuses: read
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-auth-mode: ${{ vars.GH_AUTH_MODE || 'env' }}
          install-deps: 'false'
      - name: Scan open PR heads in read-only mode
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_FLOW_SWEEP_MODE: ${{ vars.PR_FLOW_SWEEP_MODE }}
          PR_FLOW_SWEEP_SCHEDULE: ${{ github.event.schedule }}
        run: |
          node .github/workflows/scripts/scan-pr-flow.cjs
