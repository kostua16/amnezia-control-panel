name: Workflow Health Check & Optimize

on:
  schedule:
    - cron: '7 * * * *' # Every hour at :07
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Bounded to max 3 file edits, minimal diffs (5-10 lines). 25 turns is
  # sufficient for the assess-plan-execute phases; mirrors the triage.yml
  # reduction pattern (40 → 15) from PR #185.
  MAX_TURNS: 25
  NODE_VERSION: '24.x'

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write

jobs:
  fleet-gate:
    name: Fleet back-pressure gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.fleet_check.outputs.skip }}
    steps:
      - uses: ./.github/actions/fleet-back-pressure
        id: fleet_check
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  collect-runs:
    needs: [fleet-gate]
    if: needs.fleet-gate.outputs.skip != 'true'
    name: Collect Workflow Runs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has-runs: ${{ steps.collect.outputs.has_runs }}
      has-problems: ${{ steps.collect.outputs.has_problems }}
      runs-data: ${{ steps.collect.outputs.runs_data }}
      summary-path: ${{ steps.collect.outputs.summary_path }}
      queue-telemetry: ${{ steps.collect.outputs.queue_telemetry }}
      starvation-alert: ${{ steps.collect.outputs.starvation_alert }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Collect workflow runs from past hour
        id: collect
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const { parseClaudeExecution } = require('./.github/workflows/scripts/parse-claude-execution.cjs');
            const {
              duplicateSameSha,
              summarizeWorkflowRunTiming,
            } = require('./.github/workflows/scripts/workflow-run-timings.cjs');

            const oneHourAgo = new Date(Date.now() - 60 * 60 * 1000).toISOString();

            function compactClaudeSummary(metrics) {
              const hasSignal = metrics.actionError ||
                metrics.errorMessages?.length > 0 ||
                metrics.numTurns !== null ||
                metrics.isError !== null ||
                metrics.numFailedToolCalls > 0 ||
                metrics.failedToolSamples?.length > 0;
              if (!hasSignal) return null;
              return {
                model: metrics.modelUsed || undefined,
                turns: metrics.numTurns,
                isError: metrics.isError,
                durationSec: metrics.durationSec,
                failedToolCalls: metrics.numFailedToolCalls,
                failedToolSamples: (metrics.failedToolSamples || []).slice(0, 3),
                actionError: metrics.actionError || undefined,
                errorMessages: (metrics.errorMessages || []).slice(0, 3),
              };
            }

            const runs = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              created: `${oneHourAgo}..${new Date().toISOString()}`,
              per_page: 50,
              status: 'completed'
            });

            // Exclude own workflow — compare by file path, not display name (survives renames)
            const ownPath = '.github/workflows/workflow-health-optimize.yml';
            const filteredRuns = runs.data.workflow_runs.filter(r =>
              r.path !== ownPath
            );

            // WHO-I02: cap detailed failure-log API calls to avoid timeout.
            // All runs still evaluated for hasProblems (uses run.conclusion only).
            // Empty and non-empty paths share the same runs_data envelope shape.
            const MAX_DETAILED_FAILURES = 10;

            if (filteredRuns.length === 0) {
              core.setOutput('has_runs', 'false');
              core.setOutput('has_problems', 'false');
              core.setOutput('runs_data', JSON.stringify({
                failureLogCapApplied: false,
                failureLogCapMax: MAX_DETAILED_FAILURES,
                failureLogCapTotal: 0,
                runs: [],
              }));
              core.info('No completed workflow runs in the past hour');
              return;
            }

            core.setOutput('has_runs', 'true');
            core.info(`Found ${filteredRuns.length} completed runs`);

            let hasProblems = false;

            // Identify problem runs (failure or slow) for detailed processing.
            // newest-first so the cap keeps the most recent failures.
            const problemRuns = filteredRuns
              .map((r, idx) => ({ run: r, idx, durationSec: Math.round((new Date(r.updated_at) - new Date(r.run_started_at || r.created_at)) / 1000) }))
              .filter(({ run, durationSec }) => run.conclusion === 'failure' || durationSec > 300);
            const detailedSet = new Set(problemRuns.slice(0, MAX_DETAILED_FAILURES).map(({ idx }) => idx));

            const runSummaries = [];
            for (let i = 0; i < filteredRuns.length; i++) {
              const run = filteredRuns[i];
              const runStartedAt = run.run_started_at || run.created_at;
              const durationSec = Math.round((new Date(run.updated_at) - new Date(runStartedAt)) / 1000);
              const isSlow = durationSec > 300;
              const summary = {
                name: run.name,
                status: run.conclusion,
                runNumber: run.run_number,
                headSha: run.head_sha,
                duration: `${durationSec}s`,
                durationSec,
                url: run.html_url,
                headBranch: run.head_branch,
                event: run.event,
                runStartedAt,
                runUpdatedAt: run.updated_at
              };

              const duplicate = duplicateSameSha(run, filteredRuns);
              if (duplicate) {
                summary.duplicateSameSha = duplicate;
              }

              const isDetailed = detailedSet.has(i);
              let jobs = null;
              let jobsError = '';
              if (isDetailed && (run.conclusion === 'failure' || isSlow)) {
                try {
                  jobs = await github.rest.actions.listJobsForWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: run.id,
                    per_page: 100
                  });
                } catch (e) {
                  jobsError = e.message;
                  summary.timingSummary = { error: `Could not fetch jobs: ${e.message}` };
                }
              }

              if (isSlow && jobs) {
                summary.timingSummary = summarizeWorkflowRunTiming({
                  jobs: jobs.data.jobs
                });
              }

              // Collect failure logs for failed runs (only detailed ones)
              if (run.conclusion === 'failure') {
                if (!isDetailed) {
                  summary.failureLogs = [{ job: 'skipped', reason: `failure-log cap applied (max ${MAX_DETAILED_FAILURES} detailed failures)` }];
                } else if (!jobs) {
                  summary.failureLogs = [{ job: 'unknown', failedSteps: [], logTail: `Could not fetch jobs: ${jobsError || 'unknown error'}` }];
                } else {
                  const failedJobs = jobs.data.jobs.filter(j => j.conclusion === 'failure');
                  summary.failedJobs = failedJobs.map(j => ({
                    name: j.name,
                    steps: (j.steps || [])
                      .filter(s => s.conclusion === 'failure')
                      .map(s => s.name)
                  }));

                  // Get last 2000 chars of log per failed job
                  for (const fj of failedJobs) {
                    try {
                      const logs = await github.rest.actions.downloadJobLogsForWorkflowRun({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        job_id: fj.id
                      });
                      const raw = typeof logs.data === 'string' ? logs.data : String(logs.data);
                      fj.logTail = raw.slice(-2000);
                      fj.claudeSummary = compactClaudeSummary(parseClaudeExecution({
                        logText: raw,
                        outcome: fj.conclusion || 'failure',
                      }));
                    } catch (e) {
                      fj.logTail = `(log unavailable: ${e.message})`;
                      fj.claudeSummary = null;
                    }
                  }
                  summary.failureLogs = failedJobs.map(j => ({
                    job: j.name,
                    failedSteps: (j.steps || []).filter(s => s.conclusion === 'failure').map(s => s.name),
                    claudeSummary: j.claudeSummary,
                    logTail: j.logTail
                  }));
                }
              }

              runSummaries.push(summary);

              // Trigger on real failures and genuine timeouts. A run hitting
              // its timeout-minutes cap concludes as `timed_out`. A long
              // `cancelled` run is only a likely timeout when it belongs to an
              // event that cannot be supersede-cancelled by newer push/PR
              // activity (schedule, workflow_dispatch); every PR-triggered
              // event in this repo — push, pull_request, pull_request_target,
              // plus the workflow_run/issue_comment wakes — shares a
              // concurrency group that can cancel an in-progress run mid-flight,
              // so a long cancel there is normal CI churn, not a problem.
              // Allowlisting the non-supersedable events avoids a denylist that
              // must track every PR event type; a new one would otherwise
              // reopen the false trigger. Slow-but-successful runs are expected
              // for long-running workflows (audit-fix, fix-review) and never
              // trigger optimization.
              if (run.conclusion === 'failure' ||
                  run.conclusion === 'timed_out' ||
                  (run.conclusion === 'cancelled' && isSlow &&
                   (run.event === 'schedule' || run.event === 'workflow_dispatch'))) {
                hasProblems = true;
              }
            }

            core.setOutput('has_problems', String(hasProblems));
            core.info(`Has problems: ${hasProblems}`);

            // Truncate to 50KB to stay within action limits.
            // Drop whole trailing entries to keep valid JSON (WHO-I03).
            let trimmed = runSummaries;
            while (JSON.stringify(trimmed).length > 51200 && trimmed.length > 1) {
              trimmed = trimmed.slice(0, -1);
            }

            // WHO-I02: wrap in envelope so downstream consumers know about the cap.
            const capApplied = problemRuns.length > MAX_DETAILED_FAILURES;
            const envelope = {
              failureLogCapApplied: capApplied,
              failureLogCapMax: MAX_DETAILED_FAILURES,
              failureLogCapTotal: problemRuns.length,
              runs: trimmed,
            };
            const runsJson = JSON.stringify(envelope);
            if (trimmed.length < runSummaries.length) {
              core.info(`Truncated runs_data from ${runSummaries.length} to ${trimmed.length} entries (${runsJson.length} bytes)`);
            }
            if (capApplied) {
              core.info(`Failure-log cap applied: ${MAX_DETAILED_FAILURES} of ${problemRuns.length} problem runs fetched in detail`);
            }
            core.setOutput('runs_data', runsJson);

            // Persist per-run health summaries as JSONL for trend analysis (WHO-E01)
            const { persistHealthSummary } = require('./.github/workflows/scripts/persist-health-summary.cjs');
            const summaryPath = persistHealthSummary(runSummaries);
            if (summaryPath) {
              core.info(`Health summary persisted to ${summaryPath}`);
              core.setOutput('summary_path', summaryPath);
            }

            # WHO-E03: compute queue-latency telemetry for starvation alerts
            const { computeQueueLatencyTelemetry } = require('./.github/workflows/scripts/compute-queue-latency-telemetry.cjs');
            const telemetry = computeQueueLatencyTelemetry(runSummaries);
            core.setOutput('queue_telemetry', JSON.stringify(telemetry));
            core.setOutput('starvation_alert', String(telemetry.exceedsThreshold));
            if (telemetry.percentiles) {
              core.info(`Queue telemetry: p50=${telemetry.percentiles.p50}s p95=${telemetry.percentiles.p95}s max=${telemetry.percentiles.max}s (samples=${telemetry.sampleCount})`);
            }

      - name: Upload health summary artifact
        if: steps.collect.outputs.summary_path != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: health-summary-${{ github.run_id }}
          path: health-summary-*.jsonl
          retention-days: 7
          if-no-files-found: ignore

  detect-flaky:
    name: Detect Flaky Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [collect-runs]
    if: needs.collect-runs.outputs.has-problems == 'true'
    outputs:
      flaky_detected: ${{ steps.flaky.outputs.flaky_detected }}
      flaky_workflows: ${{ steps.flaky.outputs.flaky_workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Detect flaky workflows across hours (WHO-E04)
        id: flaky
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          RUNS_DATA: ${{ needs.collect-runs.outputs.runs-data }}
        run: |
          node .github/workflows/scripts/detect-flaky-workflows.cjs \
            --repo "${{ github.repository }}" \
            --runs-data "$RUNS_DATA" \
            --lookback-hours 6

  report-queue-starvation:
    name: Report Queue Starvation Alert
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [collect-runs]
    if: needs.collect-runs.outputs.starvation-alert == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: File queue starvation alert (WHO-E03)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          QUEUE_TELEMETRY: ${{ needs.collect-runs.outputs.queue-telemetry }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node .github/workflows/scripts/file-queue-starvation-alert.cjs \
            --repo "${{ github.repository }}" \
            --telemetry "$QUEUE_TELEMETRY" \
            --run-url "$RUN_URL"

  optimize:
    name: Analyze & Optimize Workflows
    runs-on: [self-hosted, big]
    timeout-minutes: 15
    needs: [collect-runs, detect-flaky]
    if: needs.collect-runs.outputs.has-problems == 'true' && needs.detect-flaky.outputs.flaky_detected != 'true'
    outputs:
      claude_failed: ${{ steps.claude_run.outputs.claude_failed }}
      claude_failure_reason: ${{ steps.claude_run.outputs.claude_failure_reason }}
      claude_num_turns: ${{ steps.claude_run.outputs.claude_num_turns }}
      claude_is_error: ${{ steps.claude_run.outputs.claude_is_error }}
      claude_used_attempt: ${{ steps.claude_run.outputs.claude_used_attempt }}
      claude_metrics_json: ${{ steps.claude_run.outputs.claude_metrics_json }}
      validate_blocked: ${{ steps.gate.outputs.gate_passed == 'false' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GH_PAT }}
          node-version: ${{ env.NODE_VERSION }}
          install-deps: 'true'
          install-gsd: 'true'
          install-rtk: 'true'
          generate-prisma: 'true'

      - name: Prepare optimization branch
        id: branch
        uses: ./.github/actions/prepare-automation-branch
        with:
          branch-name: claude-workflow-optimize-${{ github.run_id }}
          github-token: ${{ secrets.GH_PAT }}

      - id: claude_run
        uses: ./.github/actions/run-zai
        with:
          api-key: ${{ secrets.ZAI_API_KEY }}
          github-token: ${{ secrets.GH_PAT }}
          max-turns: '${{ env.MAX_TURNS }}'
          allowed-tools: 'Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(python3:*),Bash(ls:*),Bash(cat:*),Bash(grep:*),Bash(find:*),Bash(head:*),Bash(tail:*),Bash(sort:*),Bash(wc:*),Bash(echo:*),Bash(rtk:*)'
          prompt: |
            REPO: ${{ github.repository }}

            ## Task: Analyze Workflow Runs and Optimize Workflow Files

            You have completed workflow run data from the past hour AND workflow YAML files in `.github/workflows/`.
            The run data may include compact `claudeSummary`, `timingSummary`, and `duplicateSameSha` objects extracted by the workflow itself.

            ### Completed Runs Data
            ```json
            ${{ needs.collect-runs.outputs.runs-data }}
            ```

            ## GLOBAL CONSTRAINT (all phases)
            Do NOT run `git`, `gh`, `curl`, or any live network/API commands in ANY phase.
            Use ONLY the provided Completed Runs Data for run/log evidence. The ONLY local file read allowed before Phase 2 is a `Grep cron:` scan of `.github/workflows/*.yml` to detect scheduled-run collisions (WHO-E02); cron schedules count as collision evidence. Do NOT fetch logs, run statuses, or issue details from the API.

            ## PHASE-BASED EXECUTION (MANDATORY)

            ### Phase 1: ASSESS (turns 1-3)
            - Read runs data. Any failures? Slow runs?
            - If ALL runs successful AND none exceeded 5 min → EXIT NOW, no changes.
            - Use ONLY the provided Completed Runs Data for run/log evidence.
            - Use `timingSummary` to identify concrete queue, runner, job, or step bottlenecks. If timing evidence is missing, mark the slow run ambiguous.
            - If a slow successful run is explained by `duplicateSameSha`, and CI no longer subscribes to `ready_for_review`, treat that duplicate-run class as already addressed and do not edit workflows for it.
            - Cron collision scan (WHO-E02): `Grep` for `cron:` in `.github/workflows/*.yml` and detect schedules firing in the same 5-minute window (report under `CRON COLLISIONS:`). This surface scan is allowed; do NOT read full workflow YAML bodies yet — that is Phase 2.

            ### Phase 2: PLAN (turns 4-6)
            - Read ONLY the relevant workflow file(s) for each problem.
            - Decide: fixable via YAML changes? If no → skip.
            - If the provided run data lacks enough detail to identify a concrete YAML-level fix, mark that problem ambiguous and skip it.
            - If total edits > 3 files → STOP, exit with notes, don't edit.

            ### Phase 3: EXECUTE (remaining turns)
            - Apply planned changes. Validate YAML after each edit using only allowed local tools such as `node`, `npx`, or file reads.
            - Do NOT commit or push.

            ## SCOPE
            - ONLY modify `.github/workflows/` files
            - Max 3 files per run
            - Minimal diffs (5-10 lines), not rewrites
            - Do NOT refactor to shared actions — separate task
            - Do NOT change files outside `.github/workflows/`
            Operate as the `kos-workflow-health-optimize` agent: first read `.claude/agents/kos-workflow-health-optimize.md` and follow it as your operating contract (it enforces this prompt's rules and adds run-mined failure knowledge), then perform the task.

      - name: Detect exact duplicate optimization PR
        id: duplicate
        if: steps.claude_run.outputs.claude_changed_files_list != ''
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          node .github/workflows/scripts/find-duplicate-automation-pr.cjs \
            --repo "${{ github.repository }}" \
            --base-ref main \
            --title-prefix "ci(workflows): hourly optimization - " \
            --exclude-head "${{ steps.branch.outputs.branch_name }}" \
            --detect-overlap \
            --overlap-label auto-fix \
            --github-output "$GITHUB_OUTPUT"

      - name: Warn on duplicate detection failure
        if: steps.duplicate.outcome == 'failure'
        run: |
          echo "::warning::Duplicate/overlap detection failed — proceeding without dedup guard to preserve agent work. WHO-I08 hardening."

      - name: Log duplicate optimization result
        if: steps.duplicate.outputs.duplicate_found == 'true' || steps.duplicate.outputs.overlap_found == 'true'
        run: |
          if [ "${{ steps.duplicate.outputs.duplicate_found }}" = 'true' ]; then
            echo "Skipping duplicate optimization PR."
            echo "Existing PR: #${{ steps.duplicate.outputs.duplicate_pr_number }} ${{ steps.duplicate.outputs.duplicate_pr_url }}"
            echo "Reason: ${{ steps.duplicate.outputs.duplicate_reason }}"
          fi
          if [ "${{ steps.duplicate.outputs.overlap_found }}" = 'true' ]; then
            echo "Deferring optimization PR; another automation PR already edits the same file(s)."
            echo "Overlapping PR: #${{ steps.duplicate.outputs.overlap_pr_number }} ${{ steps.duplicate.outputs.overlap_pr_url }}"
            echo "Reason: ${{ steps.duplicate.outputs.overlap_reason }}"
          fi

      - name: Validate (CI-matching gate; build skipped for YAML-only edits)
        id: gate
        if: steps.claude_run.outputs.claude_changed_files_list != '' && steps.duplicate.outputs.duplicate_found != 'true' && steps.duplicate.outputs.overlap_found != 'true'
        uses: ./.github/actions/validate-pr-gate
        with:
          run-build: 'false'

      - uses: ./.github/actions/commit-and-push
        id: push
        if: steps.duplicate.outputs.duplicate_found != 'true' && steps.duplicate.outputs.overlap_found != 'true' && steps.gate.outputs.gate_passed == 'true'
        with:
          branch-name: ${{ steps.branch.outputs.branch_name }}
          commit-message: 'ci(workflows): hourly optimization pass'
          github-token: ${{ secrets.GH_PAT }}
      - name: Build optimization PR body
        id: pr-body
        if: steps.push.outputs.pushed == 'true'
        uses: ./.github/actions/build-automation-pr-body
        with:
          workflow-name: workflow-health-optimize
          problem: 'Scheduled workflow health analysis found failed or slow workflow runs in the past hour.'
          source-run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          base-ref: main
          changed-files: ${{ steps.claude_run.outputs.claude_changed_files_list }}
          evidence: |
            Completed runs data:
            ${{ needs.collect-runs.outputs.runs-data }}
          execution-file: ${{ steps.claude_run.outputs.last_execution_file }}
          structured-output: ${{ steps.claude_run.outputs.structured_output }}
          claude-last-output: ${{ steps.claude_run.outputs.claude_last_output }}
          review-notes: 'Draft PR. Confirm the listed run evidence supports the workflow YAML change before merging.'

      - name: Create optimization PR
        if: steps.push.outputs.pushed == 'true'
        uses: ./.github/actions/upsert-pull-request
        with:
          github-token: ${{ secrets.GH_PAT }}
          base: main
          branch-name: ${{ steps.branch.outputs.branch_name }}
          title: 'ci(workflows): hourly optimization - ${{ github.run_id }}'
          body: ${{ steps.pr-body.outputs.body }}
          labels: auto-fix,needs-review
          draft: 'true'
          require-rich-body: 'true'

      - name: Log no-changes result
        if: steps.push.outputs.pushed != 'true'
        run: echo "No workflow improvements identified this hour."

  report-blocked-gate:
    name: Report blocked optimization gate
    needs: [collect-runs, detect-flaky, optimize]
    # Runs only when optimize succeeded AND the gate actually blocked. When
    # optimize is skipped (no problems or flaky) or the validate step is
    # skipped (no changes / duplicate), validate_blocked is empty and skipped.
    if: needs.optimize.result == 'success' && needs.optimize.outputs.validate_blocked == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Track blocked optimization gate
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Search by a distinctive title phrase so repeated blocks accumulate
          # as comments on one issue instead of spawning duplicates.
          EXISTING=$(gh issue list --repo "${{ github.repository }}" \
            --state open \
            --search "in:title Optimization test gate is blocking all PRs" \
            --json number --jq '.[0].number // empty' || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" \
              --body "Test gate blocked again at $(date -u +%Y-%m-%dT%H:%M:%SZ) — no optimization PR created. **Run:** ${RUN_URL}"
          else
            gh issue create --repo "${{ github.repository }}" \
              --title '[workflow-health] Optimization test gate is blocking all PRs' \
              --body "The pre-push \`npm run test-only\` gate in \`workflow-health-optimize.yml\` rejected the AI's workflow edits, so no optimization PR was created. A single block is the gate working as designed; **repeated comments below mean the optimizer is chronically breaking workflow invariant tests and silently producing zero PRs**. First observed: ${RUN_URL}" \
              --label auto-fix,needs-review
          fi

  report-failure:
    needs: [collect-runs, detect-flaky, optimize]
    if: ${{ always() && ((needs.collect-runs.result != 'success' && needs.collect-runs.result != 'skipped') || (needs.detect-flaky.result != 'success' && needs.detect-flaky.result != 'skipped') || (needs.optimize.result != 'success' && needs.optimize.result != 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Report workflow health check failure
        uses: ./.github/actions/report-failure
        with:
          mode: 'issue'
          auto-fix-run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          issue-title: '[workflow-health] Hourly optimization workflow failed'
          issue-body: |
            ## Workflow Health Check Failure

            **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            The hourly workflow health check and optimization workflow itself failed. Manual investigation needed.
          labels: auto-fix,ci-failure
          ensure-labels: auto-fix,ci-failure
          dispatch-triage: 'true'
          claude-step-outcome: ${{ needs.optimize.result }}
          claude-turns: ${{ needs.optimize.outputs.claude_num_turns }}
          claude-is-error: ${{ needs.optimize.outputs.claude_is_error }}
          claude-used-attempt: ${{ needs.optimize.outputs.claude_used_attempt }}
          claude-failure-reason: ${{ needs.optimize.outputs.claude_failure_reason }}
          claude-metrics-json: ${{ needs.optimize.outputs.claude_metrics_json }}
