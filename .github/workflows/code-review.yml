name: Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read

concurrency:
  group: code-review-${{ github.event.issue.number || github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  MAX_TURNS: 100
  NODE_VERSION: "22.x"

jobs:
  check-paths:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      has-code-changes: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'package.json'
              - 'package-lock.json'
              - 'prisma/**'
              - 'scripts/**'
              - 'next.config.*'
              - '.github/**'

  claude-main-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [check-paths]
    if: |
      !failure() && !cancelled() &&
      (needs.check-paths.result == 'skipped' || needs.check-paths.outputs.has-code-changes == 'true') &&
      !contains(github.event.pull_request.title || '', '[skip-review]') &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/review')) || github.event_name == 'pull_request_review_comment')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-environment
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-deps: "true"
          install-gsd: "true"
          install-rtk: "true"

      - name: Main Claude review
        id: claude
        uses: ./.github/actions/run-zai
        with:
          api-key: ${{ secrets.ZAI_API_KEY }}
          max-turns: "${{ env.MAX_TURNS }}"
          track-progress: "true"
          allowed-tools: "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr review:*),Bash(gh pr edit:*),Bash(gh pr diff:*),Bash(npm *),Bash(npx *),Bash(node *),Bash(ls *),Bash(git *),Bash(cat *),Bash(grep *),Bash(find *),Bash(mkdir *),Bash(head *),Bash(tail *),Bash(sort *),Bash(wc *),Bash(echo *),Bash(date *)"
          prompt: |
            /gsd-code-review
            REPO: ${{ github.repository }}
            PR NUMBER: '${{ github.event.pull_request.number }}'

            Review this pull request for:
            - Code quality and best practices
            - Potential bugs or logic issues
            - Performance considerations
            - Adherence to project coding conventions
            - Test coverage (unit and integration)
            - Documentation for new features
            - Breaking changes

            Post findings as inline review comments.
            If the PR touches UI components, also check layout, accessibility, and responsiveness.

            After completing your review, submit a formal verdict:
            - If NO blocking issues found: `gh pr review ${{ github.event.pull_request.number }} --approve --body "AI Review: PASSED. No blocking issues found."`
            - If blocking issues exist: `gh pr review ${{ github.event.pull_request.number }} --request-changes --body "AI Review: CHANGES REQUESTED. See inline comments."`

            Also update the PR label to reflect the verdict:
            - Pass: `gh pr edit ${{ github.event.pull_request.number }} --add-label "ai-review-passed" --remove-label "ai-review-concerns"`
            - Fail: `gh pr edit ${{ github.event.pull_request.number }} --add-label "ai-review-concerns" --remove-label "ai-review-passed"`

  claude-security-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [check-paths, claude-main-review]
    if: |
      !failure() && !cancelled() &&
      (needs.check-paths.result == 'skipped' || needs.check-paths.outputs.has-code-changes == 'true') &&
      !contains(github.event.pull_request.title || '', '[skip-review]') &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/review')) || github.event_name == 'pull_request_review_comment')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-environment
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-deps: "true"
          install-gsd: "true"
          install-rtk: "true"

      - uses: ./.github/actions/run-zai
        with:
          api-key: ${{ secrets.ZAI_API_KEY }}
          model: 'opus'
          max-turns: "${{ env.MAX_TURNS }}"
          track-progress: "true"
          allowed-tools: "mcp__github_inline_comment__create_inline_comment,Bash(npm *),Bash(gh pr comment:*),Bash(gh pr review:*),Bash(gh pr edit:*),Bash(gh pr diff:*),Bash(npx *),Bash(node *),Bash(ls *),Bash(git *),Bash(cat *),Bash(grep *),Bash(find *),Bash(mkdir *),Bash(head *),Bash(tail *),Bash(sort *),Bash(wc *),Bash(echo *),Bash(date *)"
          prompt: |
            /gsd-secure-phase
            REPO: ${{ github.repository }}
            PR NUMBER: '${{ github.event.pull_request.number }}'

            Perform a STRIDE + OWASP security review of changed files:

            ## STRIDE Analysis
            - Spoofing: Authentication/identity bypass risks
            - Tampering: Data modification without authorization
            - Repudiation: Actions that cannot be audited
            - Information Disclosure: Leakage of secrets, PII, or internal state
            - Denial of Service: Resource exhaustion vectors
            - Elevation of Privilege: Privilege escalation paths

            ## OWASP Top 10
            - SQL Injection, XSS, CSRF
            - Broken Authentication & Access Control
            - Sensitive Data Exposure, Security Misconfiguration
            - SSRF, Unsafe Deserialization
            - Known vulnerabilities in dependencies

            ## Additional Checks
            - Hardcoded secrets or credentials
            - Insecure cryptographic practices
            - Race conditions or TOCTOU issues

            Rate severity: CRITICAL, HIGH, MEDIUM, LOW, or NONE.
            Post findings as inline review comments with remediation steps.

            After completing your security review, submit a formal verdict:
            - If severity is NONE or LOW only: `gh pr review ${{ github.event.pull_request.number }} --approve --body "Security Review: PASSED. No significant security concerns."`
            - If MEDIUM+ severity found: `gh pr review ${{ github.event.pull_request.number }} --request-changes --body "Security Review: CONCERNS FOUND. See inline comments for remediation steps."`
