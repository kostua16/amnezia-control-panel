name: Zai Code Bot

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  NODE_VERSION: '22.x'
  ANTHROPIC_BASE_URL: '${{ vars.ANTHROPIC_BASE_URL }}'
  ANTHROPIC_API_KEY: '${{ secrets.ZAI_API_KEY }}'
  ANTHROPIC_AUTH_TOKEN: '${{ secrets.ZAI_API_KEY }}'
  API_TIMEOUT_MS: '${{ vars.API_TIMEOUT_MS }}'
  DISABLE_TELEMETRY: '${{ vars.DISABLE_TELEMETRY }}'
  CLAUDE_CODE_ENABLE_TELEMETRY: '${{ vars.CLAUDE_CODE_ENABLE_TELEMETRY }}'
  CLAUDE_CODE_DISABLE_FEEDBACK_SURVEY: '${{ vars.CLAUDE_CODE_DISABLE_FEEDBACK_SURVEY }}'
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '${{ vars.CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC }}'
  ANTHROPIC_DEFAULT_HAIKU_MODEL: '${{ vars.ANTHROPIC_DEFAULT_HAIKU_MODEL }}'
  ANTHROPIC_DEFAULT_SONNET_MODEL: '${{ vars.ANTHROPIC_DEFAULT_SONNET_MODEL }}'
  ANTHROPIC_DEFAULT_OPUS_MODEL: '${{ vars.ANTHROPIC_DEFAULT_OPUS_MODEL }}'
  CLAUDE_CODE_SUBAGENT_MODEL: '${{ vars.CLAUDE_CODE_SUBAGENT_MODEL }}'

jobs:
  # zai-review:
  #   runs-on: ubuntu-latest
  #   if: github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && github.event.issue.pull_request) || github.event_name == 'pull_request_review_comment'
  #   steps:
  #     - name: Checkout repository
  #       uses: actions/checkout@v6
  #       with:
  #         fetch-depth: 0
          
  #     - name: Setup Node.js
  #       uses: actions/setup-node@v4
  #       with:
  #         node-version: ${{ env.NODE_VERSION }}
  #         cache: 'npm'

  #     - name: Install dependencies
  #       run: npm ci

  #     - name: ZAI Bot review
  #       uses: AndreiDrang/zai-code-bot@v0.0.6
  #       with:
  #         ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
  #         ZAI_MODEL: ${{ vars.ZAI_MODEL }}
  #         GITHUB_TOKEN: ${{ github.token }}

  claude-main-review:
    runs-on: ubuntu-latest
    if: !github.event.pull_request.draft && github.event.pull_request.user.login != 'dependabot[bot]' && (github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && github.event.issue.pull_request) || github.event_name == 'pull_request_review_comment')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: gsd-cache
        uses: actions/cache@v4
        with:
          path: .claude/skills/gsd-*
          key: gsd-${{ hashFiles('package.json') }}
          restore-keys: gsd-

      - name: Install GSD
        if: steps.gsd-cache.outputs.cache-hit != 'true'
        run: npx get-shit-done-cc@latest --claude --local --minimal
          
      - name: Main Claude review
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ZAI_API_KEY }}
          claude_args: |
            --model ${{ vars.ANTHROPIC_DEFAULT_SONNET_MODEL }}
            --max-turns 70
            --allowedTools "Bash(npm *),Bash(npx *),Bash(node *),Bash(ls *),Bash(git *),Bash(cat *),Bash(grep *),Bash(find *),Bash(mkdir *),Bash(head *),Bash(tail *),Bash(sort *),Bash(wc *),Bash(echo *),Bash(date *)"
          prompt: |
            Review this pull request for:
            - Code correctness and logic issues
            - Security vulnerabilities
            - Performance concerns
            - Adherence to coding conventions
            Post your findings as review comments.

  claude-security-review:
    runs-on: ubuntu-latest
    if: !github.event.pull_request.draft && github.event.pull_request.user.login != 'dependabot[bot]' && (github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && github.event.issue.pull_request) || github.event_name == 'pull_request_review_comment')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: gsd-cache
        uses: actions/cache@v4
        with:
          path: .claude/skills/gsd-*
          key: gsd-${{ hashFiles('package.json') }}
          restore-keys: gsd-

      - name: Install GSD
        if: steps.gsd-cache.outputs.cache-hit != 'true'
        run: npx get-shit-done-cc@latest --claude --local --minimal
      
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ZAI_API_KEY }}
          claude_args: |
            --model ${{ vars.ANTHROPIC_DEFAULT_SONNET_MODEL }}
            --max-turns 70
            --allowedTools "Bash(npm *),Bash(npx *),Bash(node *),Bash(ls *),Bash(git *),Bash(cat *),Bash(grep *),Bash(find *),Bash(mkdir *),Bash(head *),Bash(tail *),Bash(sort *),Bash(wc *),Bash(echo *),Bash(date *)"
          prompt: |
            Review this PR strictly from a security perspective:
            - SQL injection, XSS, CSRF risks
            - Authentication and authorization gaps
            - Hardcoded secrets or credentials
            - Known vulnerabilities in dependencies
 
  claude-performance-review:
    runs-on: ubuntu-latest
    if: !github.event.pull_request.draft && github.event.pull_request.user.login != 'dependabot[bot]' && (github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && github.event.issue.pull_request) || github.event_name == 'pull_request_review_comment')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: gsd-cache
        uses: actions/cache@v4
        with:
          path: .claude/skills/gsd-*
          key: gsd-${{ hashFiles('package.json') }}
          restore-keys: gsd-

      - name: Install GSD
        if: steps.gsd-cache.outputs.cache-hit != 'true'
        run: npx get-shit-done-cc@latest --claude --local --minimal
      
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ZAI_API_KEY }}
          claude_args: |
            --model ${{ vars.ANTHROPIC_DEFAULT_SONNET_MODEL }}
            --max-turns 70
            --allowedTools "Bash(npm *),Bash(npx *),Bash(node *),Bash(ls *),Bash(git *),Bash(cat *),Bash(grep *),Bash(find *),Bash(mkdir *),Bash(head *),Bash(tail *),Bash(sort *),Bash(wc *),Bash(echo *),Bash(date *)"
          prompt: |
            Review this PR from a performance perspective:
            - N+1 queries or inefficient loops
            - Potential memory leaks
            - Unnecessary re-renders
            - Bundle size impact
