name: Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read

concurrency:
  group: code-review-${{ github.event.issue.number || github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

env:
  MAX_TURNS: 350
  NODE_VERSION: "22.x"
  DISABLE_TELEMETRY: "1"
  API_TIMEOUT_MS: "${{ vars.API_TIMEOUT_MS }}"
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "${{ vars.CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC }}"
  ANTHROPIC_DEFAULT_HAIKU_MODEL: "${{ vars.ANTHROPIC_DEFAULT_HAIKU_MODEL }}"
  ANTHROPIC_DEFAULT_SONNET_MODEL: "${{ vars.ANTHROPIC_DEFAULT_SONNET_MODEL }}"
  ANTHROPIC_DEFAULT_OPUS_MODEL: "${{ vars.ANTHROPIC_DEFAULT_OPUS_MODEL }}"
  CLAUDE_CODE_SUBAGENT_MODEL: "${{ vars.CLAUDE_CODE_SUBAGENT_MODEL }}"
  ANTHROPIC_BASE_URL: "${{ vars.ANTHROPIC_BASE_URL }}"

jobs:
  claude-main-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if:  github.event.pull_request.user.login != 'dependabot[bot]' && (github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && github.event.issue.pull_request) || github.event_name == 'pull_request_review_comment')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache GSD installation
        id: gsd-cache
        uses: actions/cache@v4
        with:
          path: |
            .claude/skills/gsd-*
            .claude/commands/gsd/*
            .claude/get-shit-done/*
            .claude/hooks/*
          key: gsd-v1-${{ hashFiles('.claude/package.json') }}
          restore-keys: |
            gsd-v1-

      - name: Install GSD
        if: steps.gsd-cache.outputs.cache-hit != 'true'
        run: npx get-shit-done-cc@latest --claude --local --minimal
          
      - name: Main Claude review
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ZAI_API_KEY }}
          track_progress: true
          claude_args: |
            --model ${{ vars.ANTHROPIC_DEFAULT_SONNET_MODEL }}
            --max-turns ${{ env.MAX_TURNS }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(npm *),Bash(npx *),Bash(node *),Bash(ls *),Bash(git *),Bash(cat *),Bash(grep *),Bash(find *),Bash(mkdir *),Bash(head *),Bash(tail *),Bash(sort *),Bash(wc *),Bash(echo *),Bash(date *)"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: '${{ github.event.pull_request.number }}'

            Review this pull request for:
            - Code quality and best practices
            - Potential bugs or issues
            - Security implications
            - Performance considerations
            - Adherence to coding conventions
            - Code correctness and logic issues
            - Compliance with project coding standards
            - Proper test coverage (unit and integration)
            - Documentation for new features
            - Potential breaking changes
            - License header requirements
            Post your findings as review comments.
            Use GSD workflow for audit and review tasks.

            TURN BUDGET: Max ${{ env.MAX_TURNS }} turns. Finish with a clear deliverable before the limit; if running low, stop exploring and post your best partial result.
          settings: |
            {
              "env": {
                "ANTHROPIC_API_KEY": "${{ secrets.ZAI_API_KEY }}",
                "ANTHROPIC_AUTH_TOKEN": "${{ secrets.ZAI_API_KEY }}"
              }
            }

  claude-security-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if:  github.event.pull_request.user.login != 'dependabot[bot]' && (github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && github.event.issue.pull_request) || github.event_name == 'pull_request_review_comment')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache GSD installation
        id: gsd-cache
        uses: actions/cache@v4
        with:
          path: |
            .claude/skills/gsd-*
            .claude/commands/gsd/*
            .claude/get-shit-done/*
            .claude/hooks/*
          key: gsd-v1-${{ hashFiles('.claude/package.json') }}
          restore-keys: |
            gsd-v1-

      - name: Install GSD
        if: steps.gsd-cache.outputs.cache-hit != 'true'
        run: npx get-shit-done-cc@latest --claude --local --minimal
      
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ZAI_API_KEY }}
          track_progress: true
          claude_args: |
            --model ${{ vars.ANTHROPIC_DEFAULT_SONNET_MODEL }}
            --max-turns ${{ env.MAX_TURNS }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(npm *),Bash(gh pr comment:*),Bash(npx *),Bash(node *),Bash(ls *),Bash(git *),Bash(cat *),Bash(grep *),Bash(find *),Bash(mkdir *),Bash(head *),Bash(tail *),Bash(sort *),Bash(wc *),Bash(echo *),Bash(date *)"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: '${{ github.event.pull_request.number }}'
            
            Perform a comprehensive security review:

            ## OWASP Top 10 Analysis
            - SQL Injection vulnerabilities
            - Cross-Site Scripting (XSS)
            - Broken Authentication
            - Sensitive Data Exposure
            - XML External Entities (XXE)
            - Broken Access Control
            - Security Misconfiguration
            - Cross-Site Request Forgery (CSRF)
            - Using Components with Known Vulnerabilities
            - Insufficient Logging & Monitoring

            ## Additional Security Checks
            - Authentication and authorization gaps
            - Hardcoded secrets or credentials
            - Insecure cryptographic practices
            - Unsafe deserialization
            - Server-Side Request Forgery (SSRF)
            - Race conditions or TOCTOU issues
            - Known vulnerabilities in dependencies

            Rate severity as: CRITICAL, HIGH, MEDIUM, LOW, or NONE.
            Post detailed findings with recommendations.
            Use GSD workflow for analysis,audit and review tasks.

            TURN BUDGET: Max ${{ env.MAX_TURNS }} turns. Finish with a clear deliverable before the limit; if running low, stop exploring and post your best partial result.
          settings: |
            {
              "env": {
                "ANTHROPIC_API_KEY": "${{ secrets.ZAI_API_KEY }}",
                "ANTHROPIC_AUTH_TOKEN": "${{ secrets.ZAI_API_KEY }}"
              }
            }
 
