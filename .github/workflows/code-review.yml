name: Code Review

run-name: "${{ github.event_name == 'issue_comment' && github.event.issue.pull_request == null && format('Issue #{0} @ {1}', github.event.issue.number, github.sha) || format('PR #{0} @ {1}', github.event.inputs.pr_number || github.event.issue.number || 'manual', github.event.inputs.head_sha || github.sha) }}"

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to review'
        required: true
        type: string
      head_sha:
        description: 'Expected pull request head SHA'
        required: false
        type: string
      base_ref:
        description: 'Expected pull request base ref'
        required: false
        type: string
      orchestrated:
        description: 'Whether this run was dispatched by PR Orchestrator'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: ${{ github.event_name == 'issue_comment' && !contains(github.event.comment.body, '/review') && format('code-review-ignored-{0}', github.run_id) || format('code-review-{0}', github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr_number || github.sha) }}
  cancel-in-progress: true

env:
  MAX_TURNS: 100
  NODE_VERSION: '22.x'

jobs:
  resolve-pr:
    if: >-
      github.event_name != 'issue_comment' ||
      (
        github.event.issue.pull_request != null &&
        contains(github.event.comment.body, '/review')
      )
    runs-on: self-hosted
    timeout-minutes: 10
    outputs:
      should-run: ${{ steps.resolve.outputs.should_run }}
      pr-number: ${{ steps.resolve.outputs.pr_number }}
      head-sha: ${{ steps.resolve.outputs.head_sha }}
      base-ref: ${{ steps.resolve.outputs.base_ref }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          node-version: ${{ env.NODE_VERSION }}
          # Runs actions/github-script (a Node action); Bun is unused here.
          setup-bun: 'false'

      - name: Resolve PR context
        id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const eventName = context.eventName;
            let pr = null;

            if (eventName === 'issue_comment') {
              const isPrComment = Boolean(context.payload.issue?.pull_request);
              const wantsReview = context.payload.comment?.body?.includes('/review');
              if (!isPrComment || !wantsReview) {
                core.setOutput('should_run', 'false');
                return;
              }
              const response = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.issue.number
              });
              pr = response.data;
            } else if (eventName === 'workflow_dispatch') {
              const response = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: Number(context.payload.inputs.pr_number)
              });
              pr = response.data;
            }

            if (!pr) {
              core.setOutput('should_run', 'false');
              return;
            }

            const expectedHeadSha = context.payload.inputs?.head_sha || '';
            const headMatches = !expectedHeadSha || pr.head.sha === expectedHeadSha;
            const isOpen = pr.state === 'open' && !pr.merged;
            const shouldRun =
              isOpen &&
              headMatches &&
              !pr.draft &&
              pr.user.login !== 'dependabot[bot]' &&
              !(pr.title || '').includes('[skip-review]');

            core.setOutput('should_run', String(shouldRun));
            core.setOutput('pr_number', String(pr.number));
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('base_ref', context.payload.inputs?.base_ref || pr.base.ref);

  claude-combined-review:
    needs: [resolve-pr]
    if: needs.resolve-pr.outputs.should-run == 'true'
    runs-on: [self-hosted, big]
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: refs/pull/${{ needs.resolve-pr.outputs.pr-number }}/head
          fetch-depth: 0

      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          node-version: ${{ env.NODE_VERSION }}
          install-deps: 'true'
          install-gsd: 'true'
          install-rtk: 'true'
          install-uv: 'true'

      - name: Ensure review labels exist
        uses: ./.github/actions/ensure-workflow-labels
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          policy-file: .github/workflows/policy.json
          names: ai-review-passed,ai-review-concerns,security-review-passed,security-review-concerns

      - name: Combined Claude review
        id: review
        uses: ./.github/actions/run-zai
        with:
          api-key: ${{ secrets.ZAI_API_KEY }}
          model: 'opus'
          max-turns: '${{ env.MAX_TURNS }}'
          track-progress: 'true'
          allowed-bots: ${{ github.event.inputs.orchestrated == 'true' && 'github-actions,github-actions[bot],claude[bot]' || '' }}
          json-schema: '{"type":"object","properties":{"code_review":{"type":"object","properties":{"verdict":{"type":"string","enum":["passed","concerns"]},"summary":{"type":"string"},"blocking_findings_count":{"type":"integer","minimum":0}},"required":["verdict","summary","blocking_findings_count"],"additionalProperties":false},"security_review":{"type":"object","properties":{"verdict":{"type":"string","enum":["passed","concerns"]},"summary":{"type":"string"},"highest_severity":{"type":"string","enum":["none","low","medium","high","critical"]}},"required":["verdict","summary","highest_severity"],"additionalProperties":false},"reviewed_files":{"type":"array","items":{"type":"string"}}},"required":["code_review","security_review","reviewed_files"],"additionalProperties":false}'
          allowed-tools: 'mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(npm *),Bash(npx *),Bash(node *),Bash(ls *),Bash(git *),Bash(cat *),Bash(grep *),Bash(find *),Bash(mkdir *),Bash(head *),Bash(tail *),Bash(sort *),Bash(wc *),Bash(echo *),Bash(date *),Bash(rtk:*),mcp__plugin_serena_serena__find_symbol,mcp__plugin_serena_serena__get_symbols_overview,mcp__plugin_serena_serena__find_referencing_symbols,mcp__plugin_serena_serena__find_implementations,mcp__plugin_serena_serena__find_declaration,mcp__plugin_serena_serena__search_for_pattern,mcp__plugin_serena_serena__find_file,mcp__plugin_serena_serena__list_dir,mcp__plugin_serena_serena__read_file,mcp__plugin_serena_serena__get_diagnostics_for_file,mcp__plugin_context7_context7__query-docs,mcp__plugin_context7_context7__resolve-library-id,mcp__plugin_typescript-lsp__*'
          plugin-marketplaces: |-
            anthropics/claude-plugins-official
            juliusbrussee/caveman
          plugins: |-
            typescript-lsp@claude-plugins-official
            serena@claude-plugins-official
            context7@claude-plugins-official
            code-review@claude-plugins-official
            pr-review-toolkit@claude-plugins-official
            security-guidance@claude-plugins-official
            code-simplifier@claude-plugins-official
          prompt: |
            /gsd:code-review
            REPO: ${{ github.repository }}
            PR NUMBER: '${{ needs.resolve-pr.outputs.pr-number }}'

            Review this pull request once, using one shared pass over PR metadata,
            changed files, and diff. First gather:
            - PR title, body, base/head refs, and author
            - The changed file list
            - The full relevant diff, expanding to file-at-HEAD reads when needed

            Return reviewed_files as the changed-file manifest you actually considered.

            ## General Code Review
            Review for:
            - Code quality and best practices
            - Potential bugs or logic issues
            - Performance considerations
            - Adherence to project coding conventions
            - Test coverage (unit and integration)
            - Documentation for new features
            - Breaking changes

            ## Security Review
            Perform a STRIDE + OWASP security review of changed files:

            ### STRIDE Analysis
            - Spoofing: Authentication/identity bypass risks
            - Tampering: Data modification without authorization
            - Repudiation: Actions that cannot be audited
            - Information Disclosure: Leakage of secrets, PII, or internal state
            - Denial of Service: Resource exhaustion vectors
            - Elevation of Privilege: Privilege escalation paths

            ### OWASP Top 10
            - SQL Injection, XSS, CSRF
            - Broken Authentication & Access Control
            - Sensitive Data Exposure, Security Misconfiguration
            - SSRF, Unsafe Deserialization
            - Known vulnerabilities in dependencies

            ### Additional Security Checks
            - Hardcoded secrets or credentials
            - Insecure cryptographic practices
            - Race conditions or TOCTOU issues

            ## Diff Hygiene
            - Lines prefixed `-` are REMOVED, lines prefixed `+` are ADDED.
            - Only flag issues on `+` lines. Never treat a `-` line as current code.
            - If uncertain, read the file at HEAD (`git show HEAD:<path>`) before posting.

            ## Cross-Module Accuracy
            - Before claiming code violates a contract from another module, trace the
              actual call path. Only flag if the code actually participates in that contract.
            - A top-level CLI exit handler is not subject to an in-process router's no-throw rule.

            ## Threat Model Awareness
            - Standard CLI patterns (env var config overrides, Date.now() temp files,
              process.exit() in error handlers) are NOT security findings without a concrete
              exploit path viable in this deployment model.
            - Crypto hashes used for non-security purposes (directory naming, cache keys)
              are NOT insecure-crypto findings. Only flag crypto used for auth/integrity.
            - If you cannot describe a realistic attack scenario given project architecture,
              do not post the finding.

            Post actionable findings as inline review comments.
            If the PR touches UI components, also check layout, accessibility, and responsiveness.
            Rate security severity as none, low, medium, high, or critical.

            After finishing, return JSON only:
            - code_review.verdict: "passed" if no blocking code-review issues remain, otherwise "concerns"
            - code_review.summary: one short sentence
            - code_review.blocking_findings_count: integer
            - security_review.verdict: "passed" if highest severity is none or low, otherwise "concerns"
            - security_review.summary: one short sentence
            - security_review.highest_severity: one of none, low, medium, high, critical
            - reviewed_files: array of reviewed changed-file paths

            Do NOT approve the PR, request changes, or edit PR labels yourself. The workflow handles review signals.

      - name: Apply review signals
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          PR_NUMBER: ${{ needs.resolve-pr.outputs.pr-number }}
          STRUCTURED_OUTPUT: ${{ steps.review.outputs.structured_output }}
        with:
          script: |
            const review = JSON.parse(process.env.STRUCTURED_OUTPUT || '{}');
            const issueNumber = Number(process.env.PR_NUMBER);
            const labelPairs = [
              {
                review: review.code_review || {},
                passed: 'ai-review-passed',
                concerns: 'ai-review-concerns'
              },
              {
                review: review.security_review || {},
                passed: 'security-review-passed',
                concerns: 'security-review-concerns'
              }
            ];

            const labelsToAdd = [];
            const labelsToRemove = [];
            for (const pair of labelPairs) {
              const passed = pair.review.verdict === 'passed';
              labelsToAdd.push(passed ? pair.passed : pair.concerns);
              labelsToRemove.push(passed ? pair.concerns : pair.passed);
            }

            for (const name of labelsToRemove) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: labelsToAdd
            });

  wake-orchestrator:
    needs: [resolve-pr, claude-combined-review]
    if: always() && github.event.inputs.orchestrated == 'true' && github.event.inputs.pr_number != ''
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          node-version: ${{ env.NODE_VERSION }}
          # Only runs `gh workflow run`; Node and Bun are unused here.
          # setup-gh provides gh without Node (verified by pr-policy.yml).
          setup-node: 'false'
          setup-bun: 'false'

      - name: Wake PR Orchestrator
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
        run: |
          gh workflow run pr-flow.yml \
            --ref main \
            -f pr_number="$PR_NUMBER" \
            -f dry_run=false
