name: Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read

concurrency:
  group: code-review-${{ github.event.issue.number || github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

env:
  MAX_TURNS: 350
  NODE_VERSION: "22.x"
  DISABLE_TELEMETRY: "1"
  API_TIMEOUT_MS: "${{ vars.API_TIMEOUT_MS }}"
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "${{ vars.CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC }}"
  ANTHROPIC_DEFAULT_HAIKU_MODEL: "${{ vars.ANTHROPIC_DEFAULT_HAIKU_MODEL }}"
  ANTHROPIC_DEFAULT_SONNET_MODEL: "${{ vars.ANTHROPIC_DEFAULT_SONNET_MODEL }}"
  ANTHROPIC_DEFAULT_OPUS_MODEL: "${{ vars.ANTHROPIC_DEFAULT_OPUS_MODEL }}"
  CLAUDE_CODE_SUBAGENT_MODEL: "${{ vars.CLAUDE_CODE_SUBAGENT_MODEL }}"
  ANTHROPIC_BASE_URL: "${{ vars.ANTHROPIC_BASE_URL }}"

jobs:
  check-paths:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      has-code-changes: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'package.json'
              - 'package-lock.json'
              - 'prisma/**'
              - 'scripts/**'
              - 'next.config.*'
              - '.github/**'

  claude-main-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [check-paths]
    if: |
      !failure() && !cancelled() &&
      (needs.check-paths.result == 'skipped' || needs.check-paths.outputs.has-code-changes == 'true') &&
      !contains(github.event.pull_request.title || '', '[skip-review]') &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && github.event.issue.pull_request) || github.event_name == 'pull_request_review_comment')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-environment
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-deps: "true"
          install-gsd: "true"

      - name: Main Claude review
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ZAI_API_KEY }}
          track_progress: true
          claude_args: |
            --model ${{ vars.ANTHROPIC_DEFAULT_SONNET_MODEL }}
            --max-turns ${{ env.MAX_TURNS }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(npm *),Bash(npx *),Bash(node *),Bash(ls *),Bash(git *),Bash(cat *),Bash(grep *),Bash(find *),Bash(mkdir *),Bash(head *),Bash(tail *),Bash(sort *),Bash(wc *),Bash(echo *),Bash(date *)"
          prompt: |
            /gsd-code-review
            REPO: ${{ github.repository }}
            PR NUMBER: '${{ github.event.pull_request.number }}'

            Review this pull request for:
            - Code quality and best practices
            - Potential bugs or logic issues
            - Performance considerations
            - Adherence to project coding conventions
            - Test coverage (unit and integration)
            - Documentation for new features
            - Breaking changes

            Post findings as inline review comments.
            If the PR touches UI components, also check layout, accessibility, and responsiveness.

            TURN BUDGET: Max ${{ env.MAX_TURNS }} turns. Finish with a clear deliverable before the limit; if running low, stop exploring and post your best partial result.
          settings: |
            {
              "env": {
                "ANTHROPIC_API_KEY": "${{ secrets.ZAI_API_KEY }}",
                "ANTHROPIC_AUTH_TOKEN": "${{ secrets.ZAI_API_KEY }}"
              }
            }

  claude-security-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [check-paths]
    if: |
      !failure() && !cancelled() &&
      (needs.check-paths.result == 'skipped' || needs.check-paths.outputs.has-code-changes == 'true') &&
      !contains(github.event.pull_request.title || '', '[skip-review]') &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && github.event.issue.pull_request) || github.event_name == 'pull_request_review_comment')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-environment
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-deps: "true"
          install-gsd: "true"

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ZAI_API_KEY }}
          track_progress: true
          claude_args: |
            --model ${{ vars.ANTHROPIC_DEFAULT_OPUS_MODEL }}
            --max-turns ${{ env.MAX_TURNS }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(npm *),Bash(gh pr comment:*),Bash(npx *),Bash(node *),Bash(ls *),Bash(git *),Bash(cat *),Bash(grep *),Bash(find *),Bash(mkdir *),Bash(head *),Bash(tail *),Bash(sort *),Bash(wc *),Bash(echo *),Bash(date *)"
          prompt: |
            /gsd-secure-phase
            REPO: ${{ github.repository }}
            PR NUMBER: '${{ github.event.pull_request.number }}'

            Perform a STRIDE + OWASP security review of changed files:

            ## STRIDE Analysis
            - Spoofing: Authentication/identity bypass risks
            - Tampering: Data modification without authorization
            - Repudiation: Actions that cannot be audited
            - Information Disclosure: Leakage of secrets, PII, or internal state
            - Denial of Service: Resource exhaustion vectors
            - Elevation of Privilege: Privilege escalation paths

            ## OWASP Top 10
            - SQL Injection, XSS, CSRF
            - Broken Authentication & Access Control
            - Sensitive Data Exposure, Security Misconfiguration
            - SSRF, Unsafe Deserialization
            - Known vulnerabilities in dependencies

            ## Additional Checks
            - Hardcoded secrets or credentials
            - Insecure cryptographic practices
            - Race conditions or TOCTOU issues

            Rate severity: CRITICAL, HIGH, MEDIUM, LOW, or NONE.
            Post findings as inline review comments with remediation steps.

            TURN BUDGET: Max ${{ env.MAX_TURNS }} turns. Finish with a clear deliverable before the limit; if running low, stop exploring and post your best partial result.
          settings: |
            {
              "env": {
                "ANTHROPIC_API_KEY": "${{ secrets.ZAI_API_KEY }}",
                "ANTHROPIC_AUTH_TOKEN": "${{ secrets.ZAI_API_KEY }}"
              }
            }
