name: Release Notes

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  MAX_TURNS: 80

jobs:
  generate-release-notes:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get previous tag
        id: prev-tag
        run: |
          PREV=$(git tag --sort=-creatordate | sed -n '2p')
          echo "tag=${PREV:-$(git rev-list --max-parents=0 HEAD)}" >> "$GITHUB_OUTPUT"

      - name: Get commit log
        id: commits
        env:
          PREV_TAG: ${{ steps.prev-tag.outputs.tag }}
          CURRENT_TAG: ${{ github.ref_name }}
        run: |
          {
            echo "log<<EOF"
            git log "${PREV_TAG}..${CURRENT_TAG}" --pretty=format:"- %s (%h)" --no-merges | head -100
            echo ""
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate structured release notes
        id: notes
        uses: ./.github/actions/run-zai
        with:
          api-key: ${{ secrets.ZAI_API_KEY }}
          model: 'haiku'
          max-turns: "${{ env.MAX_TURNS }}"
          track-progress: "false"
          allowed-tools: "Bash(cat *),Bash(git log *),Bash(git diff *)"
          json-schema: '{"type":"object","properties":{"notes":{"type":"string"}},"required":["notes"],"additionalProperties":false}'
          prompt: |
            Generate release notes for ${{ github.ref_name }}.

            Commits since ${{ steps.prev-tag.outputs.tag }}:
            ${{ steps.commits.outputs.log }}

            Format the release notes as GitHub Release markdown with these sections:
            ## What's New (feat: commits)
            ## Bug Fixes (fix: commits)
            ## Other Changes (refactor, docs, chore)
            ## Breaking Changes (commits with BREAKING CHANGE or !)

            Omit empty sections. Return the markdown in the `notes` field only.

      - name: Write notes file
        if: steps.notes.outputs.structured_output != ''
        env:
          STRUCTURED_OUTPUT: ${{ steps.notes.outputs.structured_output }}
        run: |
          printf '%s' "$STRUCTURED_OUTPUT" | jq -r '.notes' > /tmp/release-notes.md

      - name: Create GitHub Release (draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -f /tmp/release-notes.md ] && [ -s /tmp/release-notes.md ]; then
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file /tmp/release-notes.md \
              --draft
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              --draft
          fi
