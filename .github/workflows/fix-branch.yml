name: Fix Branch

# SECURITY NOTE
#
# This workflow checks out a branch and runs build/test commands
# (npm, bun, etc.) against it with repository write permissions. This means
# code from the branch executes in a
# trusted context with access to secrets and the ability to push to the
# repository.
#
# Only use this workflow in repositories where everyone with write access
# is fully trusted with these permissions. Do not use this in repositories
# that accept contributions from untrusted or semi-trusted collaborators.
#
# This workflow handles direct pushes to main/develop with no associated PR.
# For CI failures on PRs, see fix-pr.yml (sibling workflow).
#
# The head_branch allow-list (main, develop) further limits exposure:
# only failures on those protected branches trigger the auto-fix attempt.

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write
  checks: read
  statuses: write

concurrency:
  group: fix-branch-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  evaluate:
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      toJSON(github.event.workflow_run.pull_requests) == '[]' &&
      (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'develop') &&
      !startsWith(github.event.workflow_run.head_branch, 'claude-auto-fix-ci-')
    runs-on: self-hosted
    timeout-minutes: 10
    outputs:
      should_run: ${{ steps.policy.outputs.should_run }}
      reason: ${{ steps.policy.outputs.reason }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Evaluate branch auto-fix policy
        id: policy
        shell: bash
        run: |
          result=$(node .github/workflows/scripts/evaluate-trigger-policy.cjs \
            --mode fix-branch \
            --policy-file .github/workflows/policy.json \
            --event-path "$GITHUB_EVENT_PATH" \
            --event-name "$GITHUB_EVENT_NAME")
          echo "$result"
          echo "should_run=$(jq -r '.should_run' <<<"$result")" >> "$GITHUB_OUTPUT"
          echo "reason=$(jq -r '.reason // ""' <<<"$result")" >> "$GITHUB_OUTPUT"

      - name: Log skip reason
        if: steps.policy.outputs.should_run != 'true'
        shell: bash
        run: |
          echo "Skipping branch auto-fix: ${{ steps.policy.outputs.reason || 'policy declined run' }}"

  fix:
    needs: [evaluate]
    if: needs.evaluate.outputs.should_run == 'true'
    uses: ./.github/workflows/_auto-fix-ci.yml
    with:
      mode: branch
      head-branch: ${{ github.event.workflow_run.head_branch }}
      triggering-run-id: ${{ github.event.workflow_run.id }}
      triggering-run-url: ${{ github.event.workflow_run.html_url }}
    secrets: inherit

  report-failure:
    needs: [evaluate, fix]
    if: |
      failure() &&
      needs.evaluate.outputs.should_run == 'true' &&
      needs.fix.result == 'failure'
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/report-failure
        with:
          mode: 'issue'
          auto-fix-run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          triggering-run-url: ${{ github.event.workflow_run.html_url }}
          branch: ${{ github.event.workflow_run.head_branch }}
          claude-step-outcome: ${{ needs.fix.result }}
          claude-turns: ${{ needs.fix.outputs.claude-num-turns }}
          claude-is-error: ${{ needs.fix.outputs.claude-is-error }}
          claude-used-attempt: ${{ needs.fix.outputs.claude-used-attempt }}
          claude-failure-reason: ${{ needs.fix.outputs.claude-failure-reason }}
          claude-metrics-json: ${{ needs.fix.outputs.claude-metrics-json }}
