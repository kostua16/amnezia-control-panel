name: Autonomous Audit-Fix

on:
  schedule:
    - cron: "0 2 * * 0" # Weekly on Sundays at 02:00
  workflow_dispatch:

concurrency:
  group: audit-fix-${{ github.sha }}
  cancel-in-progress: false

env:
  MAX_TURNS: 100
  NODE_VERSION: "22.x"

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup git identity
        run: |
          git config --global user.email "claude[bot]@users.noreply.github.com"
          git config --global user.name "claude[bot]"

      - uses: ./.github/actions/setup-environment
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-deps: "true"
          generate-prisma: "true"
          install-gsd: "true"
          install-rtk: "true"

      - uses: ./.github/actions/run-zai
        with:
          api-key: ${{ secrets.ZAI_API_KEY }}
          max-turns: "${{ env.MAX_TURNS }}"
          track-progress: "true"
          allowed-bots: "claude[bot],github-actions[bot]"
          allowed-tools: "Bash(rtk:*),Bash(gh:*),Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(git:*),Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(ls:*),Bash(cat:*),Bash(grep:*),Bash(find:*)"
          prompt: |
            /gsd-audit-fix
            Run a full repository audit for technical debt, code smells, and missing tests.
            Fix the issues, run tests to verify, and create a PR with the fixes.
