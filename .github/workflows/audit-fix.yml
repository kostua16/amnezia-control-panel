name: Autonomous Audit-Fix

on:
  schedule:
    - cron: '53 9,21 * * *' # Twice daily at 09:53 and 21:53 UTC
  workflow_dispatch:
    inputs:
      lane:
        description: 'Audit PR lane selection'
        required: false
        type: choice
        default: auto
        options:
          - auto
          - manual-only

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  MAX_TURNS: 70
  NODE_VERSION: '24.x'

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  fleet-gate:
    name: Fleet back-pressure gate
    runs-on: self-hosted
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.fleet_check.outputs.skip }}
    steps:
      - uses: ./.github/actions/fleet-back-pressure
        id: fleet_check
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  audit-fix:
    needs: [fleet-gate]
    if: needs.fleet-gate.outputs.skip != 'true'
    runs-on: [self-hosted, big]
    # Includes checkout + setup-environment (deps, prisma, gsd, rtk) before the
    # audit agent starts; the agent needs the bulk of this budget to finish a
    # full audit/fix/verify pass. Raised from 30 to 45 min — codebase growth +
    # plugin bloat made 30 min consistently insufficient (29/30
    # runs cancelled at timeout since mid-June). See AFX-I01 (#678).
    # AFX-I04 (#834): trimmed to audit-mission plugins (was 9). security-guidance
    # is kept in pattern-rules-only mode (regex on Edit/Write, no LLM calls) —
    # see the env block on the claude_run step.
    timeout-minutes: 45
    outputs:
      claude_failed: ${{ steps.claude_run.outputs.claude_failed }}
      claude_failure_reason: ${{ steps.claude_run.outputs.claude_failure_reason }}
      claude_num_turns: ${{ steps.claude_run.outputs.claude_num_turns }}
      claude_is_error: ${{ steps.claude_run.outputs.claude_is_error }}
      claude_used_attempt: ${{ steps.claude_run.outputs.claude_used_attempt }}
      claude_metrics_json: ${{ steps.claude_run.outputs.claude_metrics_json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GH_PAT }}
          node-version: ${{ env.NODE_VERSION }}
          install-deps: 'true'
          generate-prisma: 'true'
          install-gsd: 'true'
          install-rtk: 'true'

      - name: Prepare audit branch
        id: branch
        uses: ./.github/actions/prepare-automation-branch
        with:
          branch-name: claude-audit-work-${{ github.run_id }}
          github-token: ${{ secrets.GH_PAT }}

      # AFX-E01 (#872): deterministically pick this run's focus area from the
      # workflow run number. This keeps each run budget-sized without committing
      # mutable cursor state into parallel automation PR branches.
      - name: Select audit focus area
        id: focus
        run: |
          set -euo pipefail
          if node .github/workflows/scripts/audit-focus.cjs select \
            --run-number "${{ github.run_number }}" > /tmp/audit-focus.json 2>/tmp/audit-focus.err && \
            [ -s /tmp/audit-focus.json ]; then
            {
              echo "name=$(jq -r '.name' /tmp/audit-focus.json)"
              echo "clause=$(jq -r '.focus_clause' /tmp/audit-focus.json)"
              echo "total=$(jq -r '.total' /tmp/audit-focus.json)"
              echo "run_number=$(jq -r '.run_number' /tmp/audit-focus.json)"
            } >> "$GITHUB_OUTPUT"
          else
            echo "Audit focus selection failed; falling back to full-repo audit."
            cat /tmp/audit-focus.err >&2 || true
            {
              echo "name="
              echo "clause="
              echo "total=0"
              echo "run_number=${{ github.run_number }}"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Audit repository and apply targeted fixes
        id: claude_run
        uses: ./.github/actions/run-zai
        # security-guidance runs in pattern-rules-only mode: the regex layer on
        # Edit/Write is free (stdlib python, no API calls) and catches hardcoded
        # secrets / injection / unsafe patterns in the agent's own edits. The
        # LLM diff/Stop/commit review layers are disabled — they add a model
        # call per turn to a timeout-sensitive job, and the commit layer can
        # never fire here because the agent is forbidden from running git.
        env:
          ENABLE_CODE_SECURITY_REVIEW: '0'
          ENABLE_STOP_REVIEW: '0'
          ENABLE_COMMIT_REVIEW: '0'
        with:
          api-key: ${{ secrets.ZAI_API_KEY }}
          github-token: ${{ secrets.GH_PAT }}
          max-turns: '${{ env.MAX_TURNS }}'
          track-progress: 'true'
          claude-full-output: 'false'
          allowed-bots: 'claude[bot],github-actions[bot]'
          allowed-tools: 'Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(npm *),Bash(npx *),Bash(ls *),Bash(cat *),Bash(grep *),Bash(find *),Bash(head *),Bash(tail *),Bash(sort *),Bash(wc *),Bash(echo *),Bash(mkdir *),Bash(rtk:*),mcp__plugin_serena_serena__find_symbol,mcp__plugin_serena_serena__get_symbols_overview,mcp__plugin_serena_serena__find_referencing_symbols,mcp__plugin_serena_serena__find_implementations,mcp__plugin_serena_serena__find_declaration,mcp__plugin_serena_serena__search_for_pattern,mcp__plugin_serena_serena__find_file,mcp__plugin_serena_serena__list_dir,mcp__plugin_serena_serena__read_file,mcp__plugin_serena_serena__get_diagnostics_for_file,mcp__plugin_context7_context7__query-docs,mcp__plugin_context7_context7__resolve-library-id,mcp__plugin_typescript-lsp__*'
          json-schema: |
            {
              "type": "object",
              "additionalProperties": true,
              "properties": {
                "summary": {
                  "type": "string"
                },
                "fixed_findings": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "additionalProperties": true,
                    "properties": {
                      "finding_id": {
                        "type": "string"
                      },
                      "severity": {
                        "type": "string"
                      },
                      "summary": {
                        "type": "string"
                      },
                      "details": {
                        "type": "string"
                      },
                      "files": {
                        "type": "array",
                        "items": {
                          "type": "string"
                        }
                      }
                    }
                  }
                },
                "manual_findings": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "additionalProperties": true,
                    "required": ["summary", "details"],
                    "properties": {
                      "finding_id": {
                        "type": "string"
                      },
                      "severity": {
                        "type": "string"
                      },
                      "summary": {
                        "type": "string"
                      },
                      "details": {
                        "type": "string"
                      },
                      "files": {
                        "type": "array",
                        "items": {
                          "type": "string"
                        }
                      }
                    }
                  }
                }
              }
            }
          plugin-marketplaces: |-
            https://github.com/anthropics/claude-plugins-official.git
          plugins: |-
            typescript-lsp@claude-plugins-official
            serena@claude-plugins-official
            context7@claude-plugins-official
            code-review@claude-plugins-official
            security-guidance@claude-plugins-official
          prompt: |
            /gsd:audit-fix
            Audit focus area for this run (AFX-E01 per-run rotation): ${{ steps.focus.outputs.name }} under ${{ steps.focus.outputs.clause }}.
            Confine your audit and fixes to files within that focus area, honoring any exclusions in the clause; other areas are covered by future runs selected deterministically from the GitHub run number. If no focus area is named above (empty name/clause), fall back to a full-repository audit.
            Implement targeted fixes, run the most relevant verification you can, and stop once the audit findings are addressed.

            When running tests or lint, always use `npm run <script>` or `npx <tool>` — never invoke binaries directly via node_modules paths (e.g. avoid `node node_modules/.bin/...` or `./node_modules/...`).

            Hard rules:
            - Do NOT run `git` or `gh`.
            - Do NOT commit, push, merge, or open a PR. The workflow handles that.
            - Keep changes reviewable; avoid broad refactors unless they are directly required by the audit finding.
            - Prefer narrow, low-risk fixes in components, hooks, formatting helpers, API response helpers, resource monitoring, and monitoring types.
            - If the selected focus area exposes a broad, security-sensitive, schema, package, workflow, planning, or out-of-focus finding, report it as a manual finding instead of editing outside the focus area.
            - If no worthwhile fixes are identified, make no file changes.
            - Use project-level commands for verification: `npm test`, `npm run lint`, and targeted `npx prettier --check ...`.
            - Do NOT execute binaries through `node_modules` paths; use package scripts or `npx` instead.
            - Do NOT search ignored, generated, or dependency directories such as `node_modules`, `.next`, `src/generated`, or coverage output.
            - Once required verification passes, stop and report the result instead of running alternate test entrypoints.
            - If you find audit findings that you cannot safely fix in this run, do not silently drop them.
            - In the final response and structured output, list every fixed finding in `fixed_findings` and every unfixed/manual-only finding in `manual_findings`.
            - Each `manual_findings` entry must include `finding_id`, `severity`, `summary`, `details`, and `files` so the workflow can create a follow-up GitHub issue.
            - Also include a Markdown `### Manual-only findings` section in the final response, with one bullet per unfixed finding in the form `- **F-02 (medium):** details`.
            Operate as the `kos-audit-fix` agent: first read `.claude/agents/kos-audit-fix.md` and follow it as your operating contract (it enforces this prompt's rules and adds run-mined failure knowledge), then perform the task.

      - name: Fail on Claude soft failure
        if: always() && steps.claude_run.outputs.claude_failed == 'true'
        run: |
          echo "::error::Claude soft failure: ${{ steps.claude_run.outputs.claude_failure_reason }}"
          exit 1

      - name: Classify audit fix lane
        id: classify
        env:
          AUDIT_FIX_MODE: ${{ github.event.inputs.lane || 'auto' }}
          RUN_ID: ${{ github.run_id }}
          CLAUDE_EXECUTION_FILE: ${{ steps.claude_run.outputs.last_execution_file }}
          CLAUDE_STRUCTURED_OUTPUT: ${{ steps.claude_run.outputs.structured_output }}
          CLAUDE_LAST_OUTPUT: ${{ steps.claude_run.outputs.claude_last_output }}
        run: |
          # PR Finalizer independently re-validates audit-safe policy from PR file metadata.
          node .github/workflows/scripts/classify-audit-fix.cjs \
            --policy-file .github/workflows/policy.json \
            --mode "$AUDIT_FIX_MODE" \
            --run-id "$RUN_ID" \
            > /tmp/audit-classification.json

          {
            echo "eligible=$(jq -r '.eligible' /tmp/audit-classification.json)"
            echo "reason=$(jq -r '.reason' /tmp/audit-classification.json)"
            echo "branch_name=$(jq -r '.branch_name' /tmp/audit-classification.json)"
            echo "draft=$(jq -r '.draft' /tmp/audit-classification.json)"
            echo "labels=$(jq -r '.labels' /tmp/audit-classification.json)"
            echo "title=$(jq -r '.title' /tmp/audit-classification.json)"
            DELIM="EOF-$(openssl rand -hex 8)"
            echo "body<<$DELIM"
            jq -r '.body' /tmp/audit-classification.json
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

          echo "Audit fix lane: $(jq -r '.branch_name' /tmp/audit-classification.json)"
          echo "Audit fix classification: $(jq -r '.reason' /tmp/audit-classification.json)"

      - name: Detect manual audit findings
        id: detect_manual_findings
        env:
          CLAUDE_STRUCTURED_OUTPUT: ${{ steps.claude_run.outputs.structured_output }}
          CLAUDE_LAST_OUTPUT: ${{ steps.claude_run.outputs.claude_last_output }}
          PR_BODY: ${{ steps.classify.outputs.body }}
        run: node .github/workflows/scripts/upsert-audit-manual-findings.cjs --report-only

      - name: Restore composite action files (Claude agent may alter working tree)
        if: steps.claude_run.outputs.claude_changed_files_list != ''
        run: git checkout HEAD -- .github/actions/

      - name: Validate audit focus changes
        if: steps.claude_run.outputs.claude_changed_files_list != '' && steps.focus.outputs.total != '0' && steps.focus.outputs.total != ''
        run: |
          set -euo pipefail
          {
            git diff --name-only HEAD 2>/dev/null || true
            git ls-files --others --exclude-standard 2>/dev/null || true
          } | sed '/^$/d' | sort -u > /tmp/audit-changed-files.txt
          if [ ! -s /tmp/audit-changed-files.txt ]; then
            echo "No post-restore changes to validate against audit focus."
            exit 0
          fi
          node .github/workflows/scripts/audit-focus.cjs validate-changed-files \
            --focus /tmp/audit-focus.json \
            --changed-files /tmp/audit-changed-files.txt

      - name: Validate (CI-matching gate)
        id: gate
        if: steps.claude_run.outputs.claude_changed_files_list != ''
        uses: ./.github/actions/validate-pr-gate

      - uses: ./.github/actions/commit-and-push
        id: push
        if: steps.gate.outputs.gate_passed == 'true'
        with:
          branch-name: ${{ steps.classify.outputs.branch_name }}
          commit-message: 'fix(audit): address autonomous audit findings'
          github-token: ${{ secrets.GH_PAT }}

      - name: Log no-changes result
        if: steps.push.outputs.pushed != 'true'
        run: echo "No reviewable audit fixes identified."

      - name: Create audit fix PR
        id: audit_pr
        if: steps.push.outputs.pushed == 'true'
        uses: ./.github/actions/upsert-pull-request
        with:
          github-token: ${{ secrets.GH_PAT }}
          base: main
          branch-name: ${{ steps.classify.outputs.branch_name }}
          title: ${{ steps.classify.outputs.title }}
          body: ${{ steps.classify.outputs.body }}
          labels: ${{ steps.classify.outputs.labels }}
          draft: ${{ steps.classify.outputs.draft }}
          require-rich-body: 'true'

      - name: Ensure manual finding labels
        if: steps.detect_manual_findings.outputs.finding_count != '0'
        uses: ./.github/actions/ensure-workflow-labels
        with:
          github-token: ${{ secrets.GH_PAT }}
          policy-file: .github/workflows/policy.json
          names: auto-fix,needs-review,audit-manual-finding

      - name: Create issues for manual audit findings
        if: steps.detect_manual_findings.outputs.finding_count != '0'
        id: manual_findings
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          CLAUDE_STRUCTURED_OUTPUT: ${{ steps.claude_run.outputs.structured_output }}
          CLAUDE_LAST_OUTPUT: ${{ steps.claude_run.outputs.claude_last_output }}
          PR_BODY: ${{ steps.classify.outputs.body }}
          CHANGED_FILES: ${{ steps.claude_run.outputs.claude_changed_files_list }}
          SOURCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_PR_URL: ${{ steps.audit_pr.outputs.pr_url }}
        run: node .github/workflows/scripts/upsert-audit-manual-findings.cjs

  reconcile:
    name: Reconcile resolved audit issues
    needs: [audit-fix]
    if: needs.audit-fix.result == 'success'
    runs-on: self-hosted
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GH_PAT }}
          node-version: ${{ env.NODE_VERSION }}

      - name: Reconcile resolved dependency-vuln tracking issues
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          ./.github/workflows/scripts/reconcile-audit-issues.sh

  report-failure:
    needs: [fleet-gate, audit-fix]
    if: always() && (needs.audit-fix.result == 'failure' || needs.audit-fix.result == 'cancelled' || needs.fleet-gate.result == 'failure')
    runs-on: self-hosted
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          node-version: ${{ env.NODE_VERSION }}

      - uses: ./.github/actions/report-failure
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mode: issue
          auto-fix-run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          issue-title: '[audit-fix] Autonomous audit-fix workflow failed'
          labels: auto-fix,ci-failure
          ensure-labels: auto-fix,ci-failure
          dispatch-triage: 'true'
          claude-step-outcome: ${{ needs.audit-fix.result }}
          claude-turns: ${{ needs.audit-fix.outputs.claude_num_turns }}
          claude-is-error: ${{ needs.audit-fix.outputs.claude_is_error }}
          claude-used-attempt: ${{ needs.audit-fix.outputs.claude_used_attempt }}
          claude-failure-reason: ${{ needs.audit-fix.outputs.claude_failure_reason }}
          claude-metrics-json: ${{ needs.audit-fix.outputs.claude_metrics_json }}
