name: GSD Planning Execute

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Select and validate intake without writing, executing, or opening a PR'
        required: false
        default: true
        type: boolean
      candidate_path:
        description: 'Optional merged .planning/quick artifact path to execute'
        required: false
        default: ''
        type: string
      max_plans:
        description: 'Maximum artifacts to import; scheduled runs are capped at 1'
        required: false
        default: '1'
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: gsd-planning-execute-main
  cancel-in-progress: false

env:
  MAX_TURNS: '120'
  NODE_VERSION: '24.x'

jobs:
  execute:
    runs-on: [self-hosted, big]
    timeout-minutes: 60
    outputs:
      claude_failed: ${{ steps.gsd.outputs.claude_failed }}
      claude_failure_reason: ${{ steps.gsd.outputs.claude_failure_reason }}
      claude_num_turns: ${{ steps.gsd.outputs.claude_num_turns }}
      claude_is_error: ${{ steps.gsd.outputs.claude_is_error }}
      claude_used_attempt: ${{ steps.gsd.outputs.claude_used_attempt }}
      claude_metrics_json: ${{ steps.gsd.outputs.claude_metrics_json }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GH_PAT }}
          node-version: ${{ env.NODE_VERSION }}
          install-deps: 'true'
          generate-prisma: 'true'
          install-gsd: 'true'
          install-rtk: 'true'

      - name: Ensure execution labels exist
        uses: ./.github/actions/ensure-workflow-labels
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          policy-file: .github/workflows/policy.json
          names: auto-fix,needs-review,skip-improve,gsd-plan-execution

      - name: Prepare GSD execution branch
        id: branch
        uses: ./.github/actions/prepare-automation-branch
        with:
          branch-name: claude-gsd-planning-execute-${{ github.run_id }}
          github-token: ${{ secrets.GH_PAT }}

      - name: Collect open execution PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr list \
            --state open \
            --label gsd-plan-execution \
            --json number,title,body,headRefName,files \
            > /tmp/gsd-planning-open-prs.json

      - name: Import merged planning artifact
        id: intake
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          CANDIDATE_PATH: ${{ github.event.inputs.candidate_path || '' }}
          INPUT_MAX_PLANS: ${{ github.event.inputs.max_plans || '1' }}
        run: |
          set -euo pipefail
          max_plans="$INPUT_MAX_PLANS"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            max_plans=1
          fi
          if ! [[ "$max_plans" =~ ^[0-9]+$ ]] || [ "$max_plans" -lt 1 ]; then
            max_plans=1
          fi

          write=false
          if [ "$DRY_RUN" != "true" ]; then
            write=true
          fi

          node .github/workflows/scripts/collect-gsd-planning-intake.cjs \
            --open-prs-file /tmp/gsd-planning-open-prs.json \
            --candidate-path "$CANDIDATE_PATH" \
            --max-plans "$max_plans" \
            --write "$write" \
            > /tmp/gsd-planning-intake.json

          cat /tmp/gsd-planning-intake.json

          {
            echo "has_candidate=$(jq -r '.has_candidate' /tmp/gsd-planning-intake.json)"
            echo "selected_count=$(jq -r '.selected_count' /tmp/gsd-planning-intake.json)"
            echo "plan_path=$(jq -r '.selected[0].plan_path // empty' /tmp/gsd-planning-intake.json)"
            echo "wave=$(jq -r '.selected[0].wave // empty' /tmp/gsd-planning-intake.json)"
            echo "source_path=$(jq -r '.selected[0].path // empty' /tmp/gsd-planning-intake.json)"
            echo "source_hash=$(jq -r '.selected[0].hash // empty' /tmp/gsd-planning-intake.json)"
            echo "source_title=$(jq -r '.selected[0].title // empty' /tmp/gsd-planning-intake.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Log no candidate
        if: steps.intake.outputs.has_candidate != 'true'
        run: echo "No eligible merged GSD planning artifact found."

      - name: Validate imported plan
        if: steps.intake.outputs.has_candidate == 'true' && (github.event.inputs.dry_run || 'false') != 'true'
        env:
          PLAN_PATH: ${{ steps.intake.outputs.plan_path }}
        run: |
          node .claude/get-shit-done/bin/gsd-tools.cjs frontmatter validate "$PLAN_PATH" --schema plan
          node .claude/get-shit-done/bin/gsd-tools.cjs verify plan-structure "$PLAN_PATH"

      - name: Execute imported GSD plan
        id: gsd
        if: steps.intake.outputs.has_candidate == 'true' && (github.event.inputs.dry_run || 'false') != 'true'
        uses: ./.github/actions/run-zai
        with:
          api-key: ${{ secrets.ZAI_API_KEY }}
          github-token: ${{ secrets.GH_PAT }}
          model: 'sonnet'
          max-turns: ${{ env.MAX_TURNS }}
          track-progress: 'true'
          allowed-bots: 'github-actions,github-actions[bot],claude[bot]'
          allowed-tools: 'Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(git:*),Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(rtk:*),Bash(ls *),Bash(cat *),Bash(grep *),Bash(find *),Bash(head *),Bash(tail *),Bash(sort *),Bash(wc *),mcp__plugin_serena_serena__find_symbol,mcp__plugin_serena_serena__get_symbols_overview,mcp__plugin_serena_serena__find_referencing_symbols,mcp__plugin_serena_serena__find_implementations,mcp__plugin_serena_serena__find_declaration,mcp__plugin_serena_serena__search_for_pattern,mcp__plugin_serena_serena__find_file,mcp__plugin_serena_serena__list_dir,mcp__plugin_serena_serena__read_file,mcp__plugin_serena_serena__get_diagnostics_for_file,mcp__plugin_context7_context7__query-docs,mcp__plugin_context7_context7__resolve-library-id,mcp__plugin_typescript-lsp__*'
          plugin-marketplaces: |-
            https://github.com/anthropics/claude-plugins-official.git
            https://github.com/juliusbrussee/caveman.git
          plugins: |-
            typescript-lsp@claude-plugins-official
            serena@claude-plugins-official
            context7@claude-plugins-official
            code-review@claude-plugins-official
            security-guidance@claude-plugins-official
            code-simplifier@claude-plugins-official
            frontend-design@claude-plugins-official
            superpowers@claude-plugins-official
            caveman@caveman
          prompt: |
            /gsd:execute-phase 999 --wave ${{ steps.intake.outputs.wave }} --no-transition

            Execute exactly the imported GSD planning queue plan:
            - Plan: `${{ steps.intake.outputs.plan_path }}`
            - Source artifact: `${{ steps.intake.outputs.source_path }}`
            - Source SHA-256: `${{ steps.intake.outputs.source_hash }}`

            Hard rules:
            - Execute only Wave `${{ steps.intake.outputs.wave }}` from Phase 999.
            - Keep implementation scoped to the imported source artifact.
            - Do not process other Phase 999 waves.
            - Do not open, approve, merge, or comment on pull requests.
            - Do not push. The workflow handles branch push and PR creation.
            - Run `npm test` after implementation. Typecheck, unit test, lint, and Prettier failures are unfinished work; fix them before reporting completion.
            - If any source artifact proposal is intentionally left out of scope, include a final `### Proposals deferred` section with one bullet per deferred proposal.
            - Each deferred proposal bullet must include the proposal number, title, and rationale, e.g. `- **Proposal 2 (Decompose vpn-services.ts):** rationale`.
            Operate as the `kos-gsd-planning-execute` agent: first read `.claude/agents/kos-gsd-planning-execute.md` and follow it as your operating contract (it enforces this prompt's rules and adds run-mined failure knowledge), then perform the task.

      - name: Fail on GSD soft failure
        if: always() && steps.gsd.outputs.claude_failed == 'true'
        run: |
          echo "::error::GSD execution soft failure: ${{ steps.gsd.outputs.claude_failure_reason }}"
          exit 1

      - name: Format executed source before commit
        if: steps.intake.outputs.has_candidate == 'true' && (github.event.inputs.dry_run || 'false') != 'true'
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only --diff-filter=d -- 'src/**/*.ts' 'src/**/*.tsx' 'src/**/*.css')
          if [ "${#changed[@]}" -gt 0 ]; then
            npx prettier --write "${changed[@]}"
          fi

      - name: Detect meaningful code changes
        id: code-changes
        if: steps.intake.outputs.has_candidate == 'true' && (github.event.inputs.dry_run || 'false') != 'true'
        run: |
          non_planning=$(git diff --name-only --diff-filter=d -- . ':(exclude).planning/')
          if [ -z "$non_planning" ]; then
            echo "has_code_changes=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No implementation changes detected — only planning artifacts differ. Skipping PR creation."
          else
            echo "has_code_changes=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Implementation changes in $(echo "$non_planning" | wc -l) file(s)."
          fi

      - name: Persist plan file to main (no-op execution)
        if: steps.code-changes.outputs.has_code_changes == 'false'
        run: |
          plan_file="${{ steps.intake.outputs.plan_path }}"
          git config user.name "claude[bot]"
          git config user.email "claude[bot]@users.noreply.github.com"
          git stash -- "$plan_file"
          git checkout main
          git checkout stash -- "$plan_file"
          git add "$plan_file"
          git commit -m "chore(planning): track execution queue plan for ${{ steps.intake.outputs.source_title }}"
          git push origin main
          echo "::notice::Plan file persisted to main — candidate will not be re-selected."

      - name: Validate execution output
        id: validate1
        if: steps.intake.outputs.has_candidate == 'true' && (github.event.inputs.dry_run || 'false') != 'true' && steps.code-changes.outputs.has_code_changes == 'true'
        continue-on-error: true
        uses: ./.github/actions/run-npm-test-validation
        with:
          attempt: '1'

      - name: Repair validation failures
        id: repair1
        if: steps.validate1.outcome == 'failure'
        uses: ./.github/actions/run-gsd-validation-repair
        with:
          api-key: ${{ secrets.ZAI_API_KEY }}
          github-token: ${{ secrets.GH_PAT }}
          model: 'sonnet'
          max-turns: ${{ env.MAX_TURNS }}
          plan-path: ${{ steps.intake.outputs.plan_path }}
          source-path: ${{ steps.intake.outputs.source_path }}
          source-hash: ${{ steps.intake.outputs.source_hash }}
          wave: ${{ steps.intake.outputs.wave }}
          exit-code: ${{ steps.validate1.outputs.exit_code }}
          validation-log: ${{ steps.validate1.outputs.log }}
          final-pass: 'false'

      - name: Fail on first repair soft failure
        if: always() && steps.repair1.outputs.claude_failed == 'true'
        run: |
          echo "::error::First validation repair soft failure: ${{ steps.repair1.outputs.claude_failure_reason }}"
          exit 1

      - name: Validate first repair
        id: validate2
        if: steps.validate1.outcome == 'failure'
        continue-on-error: true
        uses: ./.github/actions/run-npm-test-validation
        with:
          attempt: '2'

      - name: Repair remaining validation failures
        id: repair2
        if: steps.validate2.outcome == 'failure'
        uses: ./.github/actions/run-gsd-validation-repair
        with:
          api-key: ${{ secrets.ZAI_API_KEY }}
          github-token: ${{ secrets.GH_PAT }}
          model: 'sonnet'
          max-turns: ${{ env.MAX_TURNS }}
          plan-path: ${{ steps.intake.outputs.plan_path }}
          source-path: ${{ steps.intake.outputs.source_path }}
          source-hash: ${{ steps.intake.outputs.source_hash }}
          wave: ${{ steps.intake.outputs.wave }}
          exit-code: ${{ steps.validate2.outputs.exit_code }}
          validation-log: ${{ steps.validate2.outputs.log }}
          final-pass: 'true'

      - name: Fail on second repair soft failure
        if: always() && steps.repair2.outputs.claude_failed == 'true'
        run: |
          echo "::error::Second validation repair soft failure: ${{ steps.repair2.outputs.claude_failure_reason }}"
          exit 1

      - name: Validate second repair
        id: validate3
        if: steps.validate2.outcome == 'failure'
        continue-on-error: true
        uses: ./.github/actions/run-npm-test-validation
        with:
          attempt: '3'

      - name: Fail on unfinished validation
        if: always() && steps.code-changes.outputs.has_code_changes == 'true' && steps.validate1.outcome != 'success' && steps.validate2.outcome != 'success' && steps.validate3.outcome != 'success'
        run: |
          echo "::error::GSD planning execution did not reach a passing npm test after two repair passes."
          exit 1

      - name: Select final ZAI output
        id: final-zai
        if: steps.validate1.outcome == 'success' || steps.validate2.outcome == 'success' || steps.validate3.outcome == 'success'
        shell: bash
        env:
          REPAIR2_OUTCOME: ${{ steps.repair2.outcome }}
          REPAIR2_CHANGED_FILES: ${{ steps.repair2.outputs.claude_changed_files_list }}
          REPAIR2_EXECUTION_FILE: ${{ steps.repair2.outputs.last_execution_file }}
          REPAIR2_STRUCTURED_OUTPUT: ${{ steps.repair2.outputs.structured_output }}
          REPAIR2_LAST_OUTPUT: ${{ steps.repair2.outputs.claude_last_output }}
          REPAIR1_OUTCOME: ${{ steps.repair1.outcome }}
          REPAIR1_CHANGED_FILES: ${{ steps.repair1.outputs.claude_changed_files_list }}
          REPAIR1_EXECUTION_FILE: ${{ steps.repair1.outputs.last_execution_file }}
          REPAIR1_STRUCTURED_OUTPUT: ${{ steps.repair1.outputs.structured_output }}
          REPAIR1_LAST_OUTPUT: ${{ steps.repair1.outputs.claude_last_output }}
          GSD_CHANGED_FILES: ${{ steps.gsd.outputs.claude_changed_files_list }}
          GSD_EXECUTION_FILE: ${{ steps.gsd.outputs.last_execution_file }}
          GSD_STRUCTURED_OUTPUT: ${{ steps.gsd.outputs.structured_output }}
          GSD_LAST_OUTPUT: ${{ steps.gsd.outputs.claude_last_output }}
        run: |
          if [ "$REPAIR2_OUTCOME" = "success" ]; then
            final_changed_files="$REPAIR2_CHANGED_FILES"
            final_execution_file="$REPAIR2_EXECUTION_FILE"
            final_structured_output="$REPAIR2_STRUCTURED_OUTPUT"
            final_last_output="$REPAIR2_LAST_OUTPUT"
          elif [ "$REPAIR1_OUTCOME" = "success" ]; then
            final_changed_files="$REPAIR1_CHANGED_FILES"
            final_execution_file="$REPAIR1_EXECUTION_FILE"
            final_structured_output="$REPAIR1_STRUCTURED_OUTPUT"
            final_last_output="$REPAIR1_LAST_OUTPUT"
          else
            final_changed_files="$GSD_CHANGED_FILES"
            final_execution_file="$GSD_EXECUTION_FILE"
            final_structured_output="$GSD_STRUCTURED_OUTPUT"
            final_last_output="$GSD_LAST_OUTPUT"
          fi

          write_output() {
            local name="$1"
            local value="$2"
            {
              echo "${name}<<GSD_FINAL_OUTPUT"
              printf '%s\n' "$value"
              echo "GSD_FINAL_OUTPUT"
            } >> "$GITHUB_OUTPUT"
          }

          write_output changed_files "$final_changed_files"
          write_output execution_file "$final_execution_file"
          write_output structured_output "$final_structured_output"
          write_output last_output "$final_last_output"

      - name: Detect deferred GSD proposals
        id: detect_deferred_proposals
        if: steps.final-zai.outcome == 'success'
        env:
          MANUAL_FINDING_MODE: gsd-deferred-proposals
          CLAUDE_STRUCTURED_OUTPUT: ${{ steps.final-zai.outputs.structured_output }}
          CLAUDE_LAST_OUTPUT: ${{ steps.final-zai.outputs.last_output }}
          SOURCE_ARTIFACT: ${{ steps.intake.outputs.source_path }}
          SOURCE_HASH: ${{ steps.intake.outputs.source_hash }}
          SOURCE_TITLE: ${{ steps.intake.outputs.source_title }}
          IMPORTED_PLAN: ${{ steps.intake.outputs.plan_path }}
          CHANGED_FILES: ${{ steps.final-zai.outputs.changed_files }}
        run: node .github/workflows/scripts/upsert-audit-manual-findings.cjs --mode gsd-deferred-proposals --report-only

      - name: Ensure deferred proposal labels
        if: steps.detect_deferred_proposals.outcome == 'success' && steps.detect_deferred_proposals.outputs.finding_count != '0'
        uses: ./.github/actions/ensure-workflow-labels
        with:
          github-token: ${{ secrets.GH_PAT }}
          policy-file: .github/workflows/policy.json
          names: needs-review,gsd-deferred-proposal,area/planning

      - name: Create issues for deferred GSD proposals
        if: steps.detect_deferred_proposals.outcome == 'success' && steps.detect_deferred_proposals.outputs.finding_count != '0'
        id: deferred_proposals
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          MANUAL_FINDING_MODE: gsd-deferred-proposals
          CLAUDE_STRUCTURED_OUTPUT: ${{ steps.final-zai.outputs.structured_output }}
          CLAUDE_LAST_OUTPUT: ${{ steps.final-zai.outputs.last_output }}
          SOURCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_ARTIFACT: ${{ steps.intake.outputs.source_path }}
          SOURCE_HASH: ${{ steps.intake.outputs.source_hash }}
          SOURCE_TITLE: ${{ steps.intake.outputs.source_title }}
          IMPORTED_PLAN: ${{ steps.intake.outputs.plan_path }}
          CHANGED_FILES: ${{ steps.final-zai.outputs.changed_files }}
        run: node .github/workflows/scripts/upsert-audit-manual-findings.cjs --mode gsd-deferred-proposals

      - uses: ./.github/actions/commit-and-push
        id: push
        if: steps.code-changes.outputs.has_code_changes == 'true'
        with:
          branch-name: ${{ steps.branch.outputs.branch_name }}
          commit-message: 'feat(gsd): execute planning intake'
          github-token: ${{ secrets.GH_PAT }}

      - name: Build execution PR body
        id: pr-body
        if: steps.push.outputs.pushed == 'true'
        uses: ./.github/actions/build-automation-pr-body
        with:
          workflow-name: gsd-planning-execute
          problem: 'GSD planning executor imported and executed a merged planning artifact.'
          source-run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          base-ref: main
          changed-files: ${{ steps.final-zai.outputs.changed_files }}
          execution-file: ${{ steps.final-zai.outputs.execution_file }}
          structured-output: ${{ steps.final-zai.outputs.structured_output }}
          claude-last-output: ${{ steps.final-zai.outputs.last_output }}
          review-notes: |
            GSD planning execution PR.
            Source artifact: `${{ steps.intake.outputs.source_path }}`
            Imported plan: `${{ steps.intake.outputs.plan_path }}`
            <!-- gsd-planning-source-sha256: ${{ steps.intake.outputs.source_hash }} -->

      - name: Create GSD planning execution PR
        if: steps.push.outputs.pushed == 'true'
        uses: ./.github/actions/upsert-pull-request
        with:
          github-token: ${{ secrets.GH_PAT }}
          base: main
          branch-name: ${{ steps.branch.outputs.branch_name }}
          title: 'feat(gsd): execute planning intake - ${{ steps.intake.outputs.source_title }}'
          body: ${{ steps.pr-body.outputs.body }}
          labels: auto-fix,gsd-plan-execution,skip-improve
          draft: 'false'
          require-rich-body: 'true'

  report-failure:
    needs: [execute]
    if: failure()
    runs-on: self-hosted
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          node-version: ${{ env.NODE_VERSION }}

      - uses: ./.github/actions/report-failure
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mode: issue
          auto-fix-run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          issue-title: '[gsd-planning-execute] Planning execution workflow failed'
          labels: auto-fix,ci-failure
          ensure-labels: auto-fix,ci-failure
          dispatch-triage: 'true'
          claude-step-outcome: ${{ needs.execute.result }}
          claude-turns: ${{ needs.execute.outputs.claude_num_turns }}
          claude-is-error: ${{ needs.execute.outputs.claude_is_error }}
          claude-used-attempt: ${{ needs.execute.outputs.claude_used_attempt }}
          claude-failure-reason: ${{ needs.execute.outputs.claude_failure_reason }}
          claude-metrics-json: ${{ needs.execute.outputs.claude_metrics_json }}
