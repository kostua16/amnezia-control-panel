name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

env:
  MAX_TURNS: 100
  NODE_VERSION: '22.x'

jobs:
  authorize:
    runs-on: self-hosted
    outputs:
      triggered: ${{ steps.gate.outputs.triggered }}
      trusted: ${{ steps.gate.outputs.trusted }}
    steps:
      - uses: actions/checkout@v5

      - name: Evaluate trigger trust
        id: gate
        shell: bash
        run: |
          node .github/workflows/scripts/evaluate-trigger-policy.cjs \
            --mode claude \
            --policy-file .github/workflows/policy.json \
            --event-path "$GITHUB_EVENT_PATH" \
            --event-name "$GITHUB_EVENT_NAME" \
            > /tmp/trigger-policy.json
          {
            echo "triggered=$(jq -r '.triggered' /tmp/trigger-policy.json)"
            echo "trusted=$(jq -r '.trusted' /tmp/trigger-policy.json)"
            echo "author_association=$(jq -r '.author_association' /tmp/trigger-policy.json)"
          } >> "$GITHUB_OUTPUT"

  claude:
    needs: [authorize]
    if: needs.authorize.outputs.triggered == 'true' && needs.authorize.outputs.trusted == 'true'
    runs-on: self-hosted
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-environment
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-deps: 'true'
          install-gsd: 'true'
          install-rtk: 'true'

      - name: Setup git identity
        uses: ./.github/actions/setup-bot-git

      - name: Run Claude Code
        id: claude
        uses: ./.github/actions/run-zai
        with:
          api-key: ${{ secrets.ZAI_API_KEY }}
          max-turns: '${{ env.MAX_TURNS }}'
          track-progress: 'true'
          allowed-tools: 'mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr review:*),Bash(gh pr edit:*),Bash(gh pr diff:*),Bash(gh issue comment:*),Bash(gh issue view:*),Bash(gh issue edit:*),Bash(npm *),Bash(npx *),Bash(node *),Bash(ls *),Bash(git *),Bash(cat *),Bash(grep *),Bash(find *),Bash(mkdir *),Bash(head *),Bash(tail *),Bash(sort *),Bash(wc *),Bash(echo *),Bash(date *)'
          prompt: 'Follow our coding standards. Ensure all new code has tests. Use TypeScript for new files. Route tasks to the right GSD command: /gsd-quick for small fixes and ad-hoc tasks, /gsd-debug for bug investigation, /gsd-ship for PR shipping pipeline, /gsd-capture for capturing ideas and notes, /gsd-progress to check project status.'
