name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
  checks: read
  statuses: write
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

env:
  MAX_TURNS: 100
  NODE_VERSION: '24.x'

jobs:
  authorize:
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (
        github.event_name == 'issues' &&
        (
          contains(github.event.issue.title, '@claude') ||
          contains(github.event.issue.body, '@claude')
        )
      )
    runs-on: self-hosted
    timeout-minutes: 10
    outputs:
      triggered: ${{ steps.gate.outputs.triggered }}
      trusted: ${{ steps.gate.outputs.trusted }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          node-version: ${{ env.NODE_VERSION }}

      - name: Evaluate trigger trust
        id: gate
        shell: bash
        run: |
          node .github/workflows/scripts/evaluate-trigger-policy.cjs \
            --mode claude \
            --policy-file .github/workflows/policy.json \
            --event-path "$GITHUB_EVENT_PATH" \
            --event-name "$GITHUB_EVENT_NAME" \
            > /tmp/trigger-policy.json
          {
            echo "triggered=$(jq -r '.triggered' /tmp/trigger-policy.json)"
            echo "trusted=$(jq -r '.trusted' /tmp/trigger-policy.json)"
            echo "author_association=$(jq -r '.author_association' /tmp/trigger-policy.json)"
          } >> "$GITHUB_OUTPUT"

  claude:
    needs: [authorize]
    if: needs.authorize.outputs.triggered == 'true' && needs.authorize.outputs.trusted == 'true'
    runs-on: [self-hosted, big]
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Capture job start time
        id: job_start
        shell: bash
        run: |
          set -euo pipefail
          echo "epoch=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          node-version: ${{ env.NODE_VERSION }}
          install-deps: 'true'
          install-gsd: 'true'
          install-rtk: 'true'
          install-uv: 'true'

      - name: Setup git identity
        uses: ./.github/actions/setup-bot-git

      - name: Compute STOP_BY deadline
        id: deadline
        uses: ./.github/actions/compute-stop-by-deadline
        with:
          timeout-minutes: '10'
          safety-margin-minutes: '2'
          job-start-epoch: '${{ steps.job_start.outputs.epoch }}'

      - name: Run Claude Code
        id: claude
        uses: ./.github/actions/run-zai
        with:
          allow-post-inline: 'true'
          api-key: ${{ secrets.ZAI_API_KEY }}
          max-turns: '${{ env.MAX_TURNS }}'
          track-progress: 'true'
          allowed-tools: 'mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr review:*),Bash(gh pr edit:*),Bash(gh pr diff:*),Bash(gh issue comment:*),Bash(gh issue view:*),Bash(gh issue edit:*),Bash(npm *),Bash(npx *),Bash(node *),Bash(ls *),Bash(git *),Bash(cat *),Bash(grep *),Bash(find *),Bash(mkdir *),Bash(head *),Bash(tail *),Bash(sort *),Bash(wc *),Bash(echo *),Bash(date *),Bash(rtk:*),mcp__plugin_serena_serena__find_symbol,mcp__plugin_serena_serena__get_symbols_overview,mcp__plugin_serena_serena__find_referencing_symbols,mcp__plugin_serena_serena__find_implementations,mcp__plugin_serena_serena__find_declaration,mcp__plugin_serena_serena__search_for_pattern,mcp__plugin_serena_serena__find_file,mcp__plugin_serena_serena__list_dir,mcp__plugin_serena_serena__read_file,mcp__plugin_serena_serena__get_diagnostics_for_file,mcp__plugin_context7_context7__query-docs,mcp__plugin_context7_context7__resolve-library-id,mcp__plugin_typescript-lsp__*'
          plugin-marketplaces: |-
            https://github.com/anthropics/claude-plugins-official.git
            https://github.com/juliusbrussee/caveman.git
          plugins: |-
            typescript-lsp@claude-plugins-official
            serena@claude-plugins-official
            context7@claude-plugins-official
            code-review@claude-plugins-official
            security-guidance@claude-plugins-official
            code-simplifier@claude-plugins-official
            frontend-design@claude-plugins-official
            superpowers@claude-plugins-official
            caveman@caveman
            commit-commands@claude-plugins-official
          prompt: |
            Follow our coding standards. Ensure all new code has tests. Use TypeScript for new files. Route tasks to the right GSD command: /gsd:quick for small fixes and ad-hoc tasks, /gsd:debug for bug investigation, /gsd:ship for PR shipping pipeline, /gsd:capture for capturing ideas and notes, /gsd:progress to check project status.

            STOP_BY: ${{ steps.deadline.outputs.stop_by }}

            The job has a hard 10-minute timeout. STOP_BY is the deadline by which you must produce your final output. Wrap up and report before STOP_BY — partial results are better than a timeout kill.

            Operate as the `kos-claude` agent: first read `.claude/agents/kos-claude.md` and follow it as your operating contract (it enforces this prompt's rules and adds run-mined failure knowledge), then perform the task.
