name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          API_TIMEOUT_MS: ${{ secrets.API_TIMEOUT_MS }}
          DISABLE_TELEMETRY: ${{ secrets.DISABLE_TELEMETRY }}
          CLAUDE_CODE_ENABLE_TELEMETRY: ${{ secrets.CLAUDE_CODE_ENABLE_TELEMETRY }}
          CLAUDE_CODE_DISABLE_FEEDBACK_SURVEY: ${{ secrets.CLAUDE_CODE_DISABLE_FEEDBACK_SURVEY }}
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: ${{ secrets.CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ secrets.ANTHROPIC_DEFAULT_HAIKU_MODEL }}
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ secrets.ANTHROPIC_DEFAULT_SONNET_MODEL }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ secrets.ANTHROPIC_DEFAULT_OPUS_MODEL }}
          CLAUDE_CODE_SUBAGENT_MODEL: ${{ secrets.CLAUDE_CODE_SUBAGENT_MODEL }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}

          # Optional: Customize the trigger phrase (default: @claude)
          # trigger_phrase: "/claude"

          # Optional: Trigger when specific user is assigned to an issue
          # assignee_trigger: "claude-bot"

          # Optional: Configure Claude's behavior with CLI arguments
          claude_args: |
            --model ${{ secrets.ANTHROPIC_DEFAULT_SONNET_MODEL }}
            --max-turns 70
            --allowedTools "Bash(npm *),Bash(ls *),Bash(git *)" 
            --system-prompt "Follow our coding standards. Ensure all new code has tests. Use TypeScript for new files."

          # Optional: Advanced settings configuration
          settings: |
            {
              "env": {
                "ANTHROPIC_BASE_URL": "${{ secrets.ANTHROPIC_BASE_URL }}",
                "ANTHROPIC_API_KEY": "${{ secrets.ANTHROPIC_AUTH_TOKEN }}",
                "ANTHROPIC_AUTH_TOKEN": "${{ secrets.ANTHROPIC_AUTH_TOKEN }}",
                "API_TIMEOUT_MS": "${{ secrets.API_TIMEOUT_MS }}",
                "DISABLE_TELEMETRY": "${{ secrets.DISABLE_TELEMETRY }}",
                "CLAUDE_CODE_ENABLE_TELEMETRY": "${{ secrets.CLAUDE_CODE_ENABLE_TELEMETRY }}",
                "CLAUDE_CODE_DISABLE_FEEDBACK_SURVEY": "${{ secrets.CLAUDE_CODE_DISABLE_FEEDBACK_SURVEY }}",
                "CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC": "${{ secrets.CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC }}",
                "ANTHROPIC_DEFAULT_HAIKU_MODEL": "${{ secrets.ANTHROPIC_DEFAULT_HAIKU_MODEL }}",
                "ANTHROPIC_DEFAULT_SONNET_MODEL": "${{ secrets.ANTHROPIC_DEFAULT_SONNET_MODEL }}",
                "ANTHROPIC_DEFAULT_OPUS_MODEL": "${{ secrets.ANTHROPIC_DEFAULT_OPUS_MODEL }}",
                "CLAUDE_CODE_SUBAGENT_MODEL": "${{ secrets.CLAUDE_CODE_SUBAGENT_MODEL }}"
              }
            }