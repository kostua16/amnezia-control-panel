name: Fix PR

# SECURITY NOTE
#
# This workflow checks out the PR branch and runs build/test commands
# (npm, bun, etc.) against it with repository write permissions. This means
# code from the PR branch executes in a
# trusted context with access to secrets and the ability to push to the
# repository.
#
# Only use this workflow in repositories where everyone with write access
# is fully trusted with these permissions. Do not use this in repositories
# that accept contributions from untrusted or semi-trusted collaborators.
#
# The pull_requests length check below limits this to same-repo PRs (fork PRs
# are excluded), but anyone who can push a branch to this repository can
# control what code runs here.
#
# For CI failures on direct pushes to main/develop (no associated PR),
# see fix-branch.yml (sibling workflow). The two workflows are mutually
# exclusive: this one fires when pull_requests != '[]', the sibling
# fires when pull_requests == '[]'.

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write

concurrency:
  group: fix-pr-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  evaluate:
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      toJSON(github.event.workflow_run.pull_requests) != '[]'
    runs-on: self-hosted
    timeout-minutes: 10
    outputs:
      should_run: ${{ steps.policy.outputs.should_run }}
      reason: ${{ steps.policy.outputs.reason }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Read source PR metadata
        id: source-pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = Number(
              context.payload.workflow_run?.pull_requests?.[0]?.number ?? 0,
            );
            if (!prNumber) {
              core.setFailed('workflow_run did not include a source PR number');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            const AUTO_FIX_MSG = /^(fix\(ci\): auto-fix CI failures|style: auto-fix prettier formatting)/;
            let autoFixAttempts = 0;
            for (let page = 1; page <= 10; page += 1) {
              const { data: pageCommits } = await github.rest.pulls.listCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                per_page: 100,
                page,
              });
              for (const c of pageCommits) {
                if (AUTO_FIX_MSG.test(String(c.commit?.message ?? ""))) {
                  autoFixAttempts += 1;
                }
              }
              if (pageCommits.length < 100) break;
            }
            pr.auto_fix_attempt_count = autoFixAttempts;

            const outputPath = `${process.env.RUNNER_TEMP}/fix-pr-source-pr.json`;
            require('fs').writeFileSync(outputPath, JSON.stringify(pr));
            core.setOutput('path', outputPath);

      - name: Evaluate PR auto-fix policy
        id: policy
        shell: bash
        run: |
          result=$(node .github/workflows/scripts/evaluate-trigger-policy.cjs \
            --mode fix-pr \
            --policy-file .github/workflows/policy.json \
            --event-path "$GITHUB_EVENT_PATH" \
            --event-name "$GITHUB_EVENT_NAME" \
            --source-pr-file "${{ steps.source-pr.outputs.path }}")
          echo "$result"
          echo "should_run=$(jq -r '.should_run' <<<"$result")" >> "$GITHUB_OUTPUT"
          echo "reason=$(jq -r '.reason // \"\"' <<<"$result")" >> "$GITHUB_OUTPUT"

      - name: Log skip reason
        if: steps.policy.outputs.should_run != 'true'
        shell: bash
        run: |
          echo "Skipping PR auto-fix: ${{ steps.policy.outputs.reason || 'policy declined run' }}"

  fix:
    needs: [evaluate]
    if: |
      needs.evaluate.outputs.should_run == 'true'
    uses: ./.github/workflows/_auto-fix-ci.yml
    with:
      mode: pr
      head-branch: ${{ github.event.workflow_run.head_branch }}
      triggering-run-id: ${{ github.event.workflow_run.id }}
      triggering-run-url: ${{ github.event.workflow_run.html_url }}
      pr-number: ${{ github.event.workflow_run.pull_requests[0].number }}
    secrets: inherit

  report-failure:
    needs: [evaluate, fix]
    if: |
      failure() &&
      needs.evaluate.outputs.should_run == 'true' &&
      needs.fix.result == 'failure'
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/report-failure
        with:
          mode: 'issue'
          auto-fix-run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          triggering-run-url: ${{ github.event.workflow_run.html_url }}
          branch: ${{ github.event.workflow_run.head_branch }}
          pr-number: ${{ needs.fix.outputs.pr-number }}
          claude-step-outcome: ${{ needs.fix.result }}
          claude-turns: ${{ needs.fix.outputs.claude-num-turns }}
          claude-is-error: ${{ needs.fix.outputs.claude-is-error }}
          claude-used-attempt: ${{ needs.fix.outputs.claude-used-attempt }}
          claude-failure-reason: ${{ needs.fix.outputs.claude-failure-reason }}
          claude-metrics-json: ${{ needs.fix.outputs.claude-metrics-json }}
