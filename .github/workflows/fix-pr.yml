name: Fix Issue PR

on:
  issue_comment:
    types: [created]
  issues:
    types: [labeled]

concurrency:
  group: fix-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

env:
  MAX_TURNS: 300
  NODE_VERSION: "22.x"
  DISABLE_TELEMETRY: "1"
  API_TIMEOUT_MS: "${{ vars.API_TIMEOUT_MS }}"
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "${{ vars.CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC }}"
  ANTHROPIC_DEFAULT_HAIKU_MODEL: "${{ vars.ANTHROPIC_DEFAULT_HAIKU_MODEL }}"
  ANTHROPIC_DEFAULT_SONNET_MODEL: "${{ vars.ANTHROPIC_DEFAULT_SONNET_MODEL }}"
  ANTHROPIC_DEFAULT_OPUS_MODEL: "${{ vars.ANTHROPIC_DEFAULT_OPUS_MODEL }}"
  CLAUDE_CODE_SUBAGENT_MODEL: "${{ vars.CLAUDE_CODE_SUBAGENT_MODEL }}"
  ANTHROPIC_BASE_URL: "${{ vars.ANTHROPIC_BASE_URL }}"

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: |
      (
        github.event_name == 'issue_comment' &&
        !github.event.issue.pull_request &&
        contains(github.event.comment.body, '/fix')
      ) || (
        github.event_name == 'issues' &&
        github.event.label.name == 'triaged'
      )
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup git identity
        run: |
          git config --global user.email "claude[bot]@users.noreply.github.com"
          git config --global user.name "claude[bot]"

      - name: Extract fix message
        id: extract
        env:
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
        run: |
          FIX_MSG=$(printf '%s' "$COMMENT_BODY" | sed -n 's|.*/fix[[:space:]]*||p' | head -1)
          echo "message=$FIX_MSG" >> "$GITHUB_OUTPUT"

      - name: Create fix branch
        id: branch
        env:
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          BRANCH_NAME="claude-fix-issue-${ISSUE_NUM}-$(date +%s)"
          git checkout -b "$BRANCH_NAME"
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-environment
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-deps: "true"
          install-gsd: "true"

      - name: Fix issue with Claude
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ZAI_API_KEY }}
          track_progress: true
          claude_args: |
            --model ${{ vars.ANTHROPIC_DEFAULT_SONNET_MODEL }}
            --max-turns ${{ env.MAX_TURNS }}
            --allowedTools 'Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(git:*),Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(ls:*),Bash(cat:*),Bash(grep:*),Bash(find:*),Bash(gh issue view:*),Bash(gh issue list:*)'
          prompt: |
            /gsd-quick
            Fix the following GitHub issue by implementing the necessary code changes.

            ISSUE NUMBER: #${{ github.event.issue.number }}
            ISSUE TITLE: ${{ github.event.issue.title }}
            FIX INSTRUCTION: ${{ steps.extract.outputs.message || 'Analyze the issue and implement the appropriate fix based on the description and comments.' }}

            Steps:
            1. Run `gh issue view ${{ github.event.issue.number }}` to read full issue description
            2. Run `gh issue view ${{ github.event.issue.number }} --comments` to read the conversation
            3. Understand the problem from the issue context and the fix instruction
            4. Implement the fix in the codebase
            5. Run: npm run lint && npx tsc --noEmit
            6. Ensure the fix is complete and correct

            Do NOT commit or push — the workflow handles that.

            TURN BUDGET: Max ${{ env.MAX_TURNS }} turns. Finish before the limit.
          settings: |
            {
              "env": {
                "ANTHROPIC_API_KEY": "${{ secrets.ZAI_API_KEY }}",
                "ANTHROPIC_AUTH_TOKEN": "${{ secrets.ZAI_API_KEY }}"
              }
            }

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet HEAD; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push fix
        if: steps.changes.outputs.has_changes == 'true'
        env:
          BRANCH_NAME: ${{ steps.branch.outputs.branch_name }}
        run: |
          git add -A
          git commit -m "fix: resolve #${{ github.event.issue.number }}" || true
          git push origin "$BRANCH_NAME"

      - name: Create fix PR
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ steps.branch.outputs.branch_name }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          FIX_MSG: ${{ steps.extract.outputs.message }}
        run: |
          BODY=$(printf 'Fixes #%s\n\n**Issue:** %s\n**Fix instruction:** %s\n\n---\n*Auto-generated by fix-pr workflow from `/fix` command.*' \
            "$ISSUE_NUM" "$ISSUE_TITLE" "$FIX_MSG")
          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "fix: resolve #${ISSUE_NUM} - ${ISSUE_TITLE}" \
            --body "$BODY" \
            --label "auto-fix" 2>/dev/null || \
          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "fix: resolve #${ISSUE_NUM} - ${ISSUE_TITLE}" \
            --body "$BODY"

      - name: Comment on issue if no changes
        if: steps.changes.outputs.has_changes == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUM" \
            --body "The \`/fix\` workflow ran but could not produce code changes. Manual investigation may be needed."
