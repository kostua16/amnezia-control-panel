name: Fix PR

# SECURITY NOTE
#
# This workflow checks out the PR branch and runs build/test commands
# (npm, bun, etc.) against it with elevated permissions (contents:write,
# id-token:write). This means code from the PR branch executes in a
# trusted context with access to secrets and the ability to push to the
# repository.
#
# Only use this workflow in repositories where everyone with write access
# is fully trusted with these permissions. Do not use this in repositories
# that accept contributions from untrusted or semi-trusted collaborators.
#
# The pull_requests length check below limits this to same-repo PRs (fork PRs
# are excluded), but anyone who can push a branch to this repository can
# control what code runs here.
#
# For CI failures on direct pushes to main/develop (no associated PR),
# see fix-branch.yml (sibling workflow). The two workflows are mutually
# exclusive: this one fires when pull_requests != '[]', the sibling
# fires when pull_requests == '[]'.

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write
  id-token: write

env:
  NODE_VERSION: "22.x"
  MAX_TURNS: "70"
jobs:
  fix:
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      toJSON(github.event.workflow_run.pull_requests) != '[]' &&
      !startsWith(github.event.workflow_run.head_branch, 'claude-auto-fix-ci-')
    outputs:
      pr-number: ${{ steps.pr.outputs.number }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 1
          token: ${{ secrets.GH_PAT }}

      - name: Setup git identity
        run: |
          git config --global user.email "claude[bot]@users.noreply.github.com"
          git config --global user.name "claude[bot]"

      - name: Resolve linked PR
        id: pr
        env:
          PULL_REQUESTS_JSON: ${{ toJSON(github.event.workflow_run.pull_requests) }}
        run: |
          pr_number=$(jq -r '.[0].number // empty' <<<"$PULL_REQUESTS_JSON")
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Create fix branch
        id: branch
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_ID: ${{ github.run_id }}
        run: |
          SAFE_BRANCH=$(printf '%s' "$HEAD_BRANCH" | tr -cd 'a-zA-Z0-9/_.-')
          BRANCH_NAME="claude-auto-fix-ci-${SAFE_BRANCH}-${RUN_ID}"
          git checkout -b "$BRANCH_NAME"
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Get CI failure details
        id: failure_details
        uses: actions/github-script@v8
        with:
          script: |
            const run = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: ${{ github.event.workflow_run.id }}
            });

            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: ${{ github.event.workflow_run.id }}
            });

            const failedJobs = jobs.data.jobs.filter(job => job.conclusion === 'failure');

            let errorLogs = [];
            for (const job of failedJobs) {
              const logs = await github.rest.actions.downloadJobLogsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                job_id: job.id
              });
              const raw = typeof logs.data === 'string' ? logs.data : String(logs.data);
              // Filter to error lines only — strip warnings and noise
              const errorLines = raw.split('\n')
                .filter(line => line.includes('##[error]') || line.includes('error TS'))
                .join('\n');
              errorLogs.push({
                jobName: job.name,
                logs: errorLines.slice(-3000)
              });
            }

            return {
              runUrl: run.data.html_url,
              failedJobs: failedJobs.map(j => j.name),
              errorLogs: errorLogs
            };

      - name: Detect transient failures
        id: fixability
        if: steps.failure_details.outputs.result
        uses: actions/github-script@v8
        with:
          script: |
            const { errorLogs } = ${{ steps.failure_details.outputs.result }};
            const allLogs = errorLogs.map(e => e.logs).join('\n');

            // Detect transient patterns (network, rate limit, OOM, runner issues)
            const transientPatterns = [
              /ETIMEDOUT/i, /ECONNRESET/i, /ENOTFOUND/i,
              /Failed sending HTTP request/i,
              /rate limit/i, /throttle/i,
              /Runner cancelled/i, /shutdown signal/i,
              /out of memory/i, /\bOOM\b/i
            ];
            const isTransient = transientPatterns.some(p => p.test(allLogs));

            if (isTransient) {
              core.setOutput('fixable', 'false');
              core.setOutput('reason', 'Transient failure detected (network/rate-limit/OOM/runner)');
              core.setOutput('label', 'transient-failure');
              return;
            }

            // Count distinct error files
            const errorFiles = new Set(allLogs.match(/src\/[^\s:]+\.ts/g) || []);

            // Detect unfixable patterns
            const reasons = [];
            if (/Property '\w+' does not exist on type 'PrismaClient'/.test(allLogs))
              reasons.push('Missing Prisma model — requires schema migration');
            if (errorFiles.size > 6)
              reasons.push(`${errorFiles.size} files with errors (exceeds 6-file cap)`);
            if (!allLogs.includes('##[error]') && !allLogs.includes('error TS'))
              reasons.push('No actual errors found (warnings only)');

            const fixable = reasons.length === 0;
            core.setOutput('fixable', String(fixable));
            if (!fixable) core.setOutput('reason', reasons.join('; '));

      - name: Extract affected files
        id: affected_files
        if: steps.fixability.outputs.fixable == 'true'
        env:
          ERROR_LOGS: ${{ toJSON(fromJSON(steps.failure_details.outputs.result).errorLogs) }}
        run: |
          FILES=$(echo "$ERROR_LOGS" | grep -oE '[a-zA-Z0-9_./-]+\.(ts|tsx|js|jsx)\([0-9]+' | sed 's/(.*//' | sort -u | head -6 | tr '\n' ',' | sed 's/,$//')
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-environment
        if: steps.fixability.outputs.fixable == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-deps: "true"
          generate-prisma: "true"
          install-gsd: "true"
          install-rtk: "true"

      - name: Warm TypeScript cache
        if: steps.fixability.outputs.fixable == 'true'
        run: npx tsc --noEmit 2>/dev/null || true

      - uses: ./.github/actions/run-claude
        if: steps.fixability.outputs.fixable == 'true'
        with:
          allowed-bots: "claude[bot],github-actions[bot]"
          max-turns: ${{ env.MAX_TURNS }}
          prompt: |
            /gsd-debug
            Failed CI Run: ${{ fromJSON(steps.failure_details.outputs.result).runUrl }}
            Failed Jobs: ${{ join(fromJSON(steps.failure_details.outputs.result).failedJobs, ', ') }}
            PR Number: ${{ steps.pr.outputs.number }}
            Branch Name: ${{ steps.branch.outputs.branch_name }}
            Base Branch: ${{ github.event.workflow_run.head_branch }}
            Repository: ${{ github.repository }}

            Error logs:
            ${{ toJSON(fromJSON(steps.failure_details.outputs.result).errorLogs) }}

            Affected files: ${{ steps.affected_files.outputs.files || '(extract from error logs above)' }}

            === CI AUTO-FIX PROTOCOL ===

            SCOPE (MANDATORY):
            - Maximum 6 files total. Count before editing. If you need more, STOP and report.
            - Fix ONLY files listed in Affected files above, or files directly referenced in error logs.
            - Read each file max 2 times before editing.
            - Identify the SINGLE root cause — fix that, not symptoms.

            PRIORITY: Fix type errors first (they often cause lint errors downstream).

            ANTI-CASCADE: If your fix creates NEW errors in unrelated files, your approach is wrong.
            Revert and try a different approach. Do NOT expand scope to chase cascading errors.

            EARLY EXIT (CRITICAL): After EACH fix cycle, run `npx tsc --noEmit && npm run lint`.
            If BOTH pass → STOP immediately. Do NOT make additional improvements.
            If build is needed: run `npm run build`. If it passes → STOP.

            DO NOT commit or push — the workflow handles that.

      - name: Check for changes
        id: changes
        if: steps.fixability.outputs.fixable == 'true'
        run: |
          if git diff --quiet HEAD; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/commit-and-push
        if: steps.changes.outputs.has_changes == 'true'
        with:
          branch-name: ${{ steps.branch.outputs.branch_name }}
          token: ${{ secrets.GH_PAT }}

      - name: Find related failure issues
        id: failure_issues
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/github-script@v8
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        with:
          script: |
            const branch = process.env.BRANCH;
            const q = [
              `repo:${context.repo.owner}/${context.repo.repo}`,
              'is:issue', 'is:open',
              'label:auto-fix', 'label:ci-failure',
              `"${branch}" in:title`
            ].join(' ');
            try {
              const result = await github.rest.search.issuesAndPullRequests({ q, per_page: 10 });
              const nums = result.data.items.map(i => String(i.number)).join(',');
              core.setOutput('issue_numbers', nums);
            } catch (e) {
              core.warning(`Issue search failed: ${e.message}`);
              core.setOutput('issue_numbers', '');
            }

      - name: Create fix PR
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          BRANCH_NAME: ${{ steps.branch.outputs.branch_name }}
          BASE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          RUN_URL: ${{ fromJSON(steps.failure_details.outputs.result).runUrl }}
          ISSUE_NUMBERS: ${{ steps.failure_issues.outputs.issue_numbers }}
        run: |
          CLOSES_TEXT=""
          if [ -n "$ISSUE_NUMBERS" ]; then
            CLOSES_TEXT=$(printf '\n\n%s' "$(echo "$ISSUE_NUMBERS" | tr ',' '\n' | grep -v '^$' | sed 's/^/Closes #/')")
          fi
          BODY=$(printf 'Automated fix for failed CI run: %s\n\n**Review required before merge.** This PR was created by the CI auto-fix workflow.\n\nRelated PR: #%s%s' \
            "$RUN_URL" "$PR_NUMBER" "$CLOSES_TEXT")
          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$BRANCH_NAME" \
            --title "fix(ci): auto-fix failures from #${PR_NUMBER}" \
            --body "$BODY" \
            --label "auto-fix" --label "needs-review" 2>/dev/null || \
          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$BRANCH_NAME" \
            --title "fix(ci): auto-fix failures from #${PR_NUMBER}" \
            --body "$BODY"

  report-failure:
    needs: [fix]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/report-failure
        with:
          mode: "issue"
          auto-fix-run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          triggering-run-url: ${{ github.event.workflow_run.html_url }}
          branch: ${{ github.event.workflow_run.head_branch }}
          pr-number: ${{ needs.fix.outputs.pr-number }}
