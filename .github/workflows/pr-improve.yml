name: PR Improve

run-name: "PR #${{ github.event.inputs.pr_number || 'manual' }} @ ${{ github.event.inputs.head_sha || github.sha }}"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to analyze'
        required: true
        type: string
      head_sha:
        description: 'Expected pull request head SHA'
        required: false
        type: string
      base_ref:
        description: 'Expected pull request base ref'
        required: false
        type: string
      orchestrated:
        description: 'Whether this run was dispatched by PR Orchestrator'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Analyze without creating or updating planning branches/PRs'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: write
  checks: read
  statuses: write

concurrency:
  group: pr-improve-workflow-${{ github.event.pull_request.number || github.event.inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  collect-targets:
    runs-on: self-hosted
    timeout-minutes: 15
    outputs:
      targets: ${{ steps.collect.outputs.targets }}
      count: ${{ steps.collect.outputs.count }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect PR targets
        id: collect
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            let targets = [];

            targets = [Number(context.payload.inputs.pr_number)];

            core.setOutput('targets', JSON.stringify(targets));
            core.setOutput('count', String(targets.length));

  improve:
    needs: [collect-targets]
    if: needs.collect-targets.outputs.count != '0'
    runs-on: [self-hosted, big]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pr-number: ${{ fromJSON(needs.collect-targets.outputs.targets) }}
    env:
      NODE_VERSION: '24.x'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GH_PAT }}
          node-version: ${{ env.NODE_VERSION }}
          install-gsd: 'true'
          install-rtk: 'true'
          install-uv: 'true'

      - name: Ensure planning labels exist
        uses: ./.github/actions/ensure-workflow-labels
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          policy-file: .github/workflows/policy.json
          names: skip-improve,planning-intake-open,planning-draft-open

      - name: Fetch PR metadata and evaluate policy
        id: metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ matrix.pr-number }}
        run: |
          gh pr view "$PR_NUMBER" \
            --json number,title,url,state,mergedAt,isDraft,headRefName,headRefOid,baseRefName,author,labels,files,isCrossRepository \
            > /tmp/pr.json
          node .github/workflows/scripts/evaluate-pr-policy.cjs \
            --policy-file .github/workflows/policy.json \
            --pr-file /tmp/pr.json \
            > /tmp/policy-eval.json
          expected_head_sha="${{ github.event.inputs.head_sha || '' }}"
          actual_head_sha=$(jq -r '.headRefOid // ""' /tmp/pr.json)
          should_analyze=$(jq -r '.should_analyze' /tmp/policy-eval.json)
          if [ -n "$expected_head_sha" ] && [ "$expected_head_sha" != "$actual_head_sha" ]; then
            should_analyze="false"
          fi
          base_ref="${{ github.event.inputs.base_ref || '' }}"
          if [ -z "$base_ref" ]; then
            base_ref=$(jq -r '.base_ref_name' /tmp/policy-eval.json)
          fi
          pr_state=$(jq -r '.state // ""' /tmp/pr.json)
          merged_at=$(jq -r '.mergedAt // ""' /tmp/pr.json)
          if [ "$pr_state" != "OPEN" ] || [ -n "$merged_at" ]; then
            should_analyze="false"
          fi
          {
            echo "should_analyze=$should_analyze"
            echo "base_ref=$base_ref"
            echo "pr_title=$(jq -r '.title' /tmp/pr.json)"
            echo "pr_url=$(jq -r '.url' /tmp/pr.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare trusted planning context
        if: steps.metadata.outputs.should_analyze == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ matrix.pr-number }}
          BASE_REF: ${{ steps.metadata.outputs.base_ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=1
          git checkout -B "$BASE_REF" "origin/$BASE_REF"
          gh pr diff "$PR_NUMBER" > /tmp/pr.diff

      - name: Setup git identity
        if: steps.metadata.outputs.should_analyze == 'true'
        uses: ./.github/actions/setup-bot-git

      - name: Analyze follow-up improvements
        if: steps.metadata.outputs.should_analyze == 'true'
        id: analyze
        uses: ./.github/actions/run-zai
        with:
          api-key: ${{ secrets.ZAI_API_KEY }}
          github-token: ${{ secrets.GH_PAT }}
          model: 'sonnet'
          max-turns: '40'
          track-progress: 'false'
          allowed-bots: ${{ github.event.inputs.orchestrated == 'true' && 'github-actions,github-actions[bot],claude[bot]' || '' }}
          json-schema: '{"type":"object","properties":{"summary":{"type":"string"},"quick_tasks":{"type":"array","items":{"type":"object","properties":{"title":{"type":"string"},"rationale":{"type":"string"},"owner":{"type":"string"},"artifact_type":{"type":"string","enum":["quick-task","workflow-improvement"]}},"required":["title","rationale","owner","artifact_type"],"additionalProperties":false}},"phase_suggestions":{"type":"array","items":{"type":"object","properties":{"bucket":{"type":"string","enum":["workflow-governance","ci-correctness","approval-policy","planning-automation"]},"title":{"type":"string"},"rationale":{"type":"string"},"owner":{"type":"string"}},"required":["bucket","title","rationale","owner"],"additionalProperties":false}}},"required":["summary","quick_tasks","phase_suggestions"],"additionalProperties":false}'
          allowed-tools: 'Read,Glob,Grep,LS,Bash(cat *),Bash(head *),Bash(tail *),Bash(sort *),Bash(wc *),Bash(node *),Bash(ls *),Bash(find *),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(rtk:*),mcp__plugin_serena_serena__find_symbol,mcp__plugin_serena_serena__get_symbols_overview,mcp__plugin_serena_serena__find_referencing_symbols,mcp__plugin_serena_serena__find_implementations,mcp__plugin_serena_serena__find_declaration,mcp__plugin_serena_serena__search_for_pattern,mcp__plugin_serena_serena__find_file,mcp__plugin_serena_serena__list_dir,mcp__plugin_serena_serena__read_file,mcp__plugin_serena_serena__get_diagnostics_for_file,mcp__plugin_context7_context7__query-docs,mcp__plugin_context7_context7__resolve-library-id'
          plugin-marketplaces: |-
            https://github.com/anthropics/claude-plugins-official.git
            https://github.com/juliusbrussee/caveman.git
          plugins: |-
            context7@claude-plugins-official
            serena@claude-plugins-official
            caveman@caveman
          prompt: |
            /gsd:quick
            Analyze this pull request for follow-up improvements and roadmap-worthy automation work.

            SOURCE PR NUMBER: ${{ matrix.pr-number }}
            SOURCE PR TITLE: ${{ steps.metadata.outputs.pr_title }}
            SOURCE PR URL: ${{ steps.metadata.outputs.pr_url }}

            Safety rules:
            - This is planning-only work.
            - Do NOT edit repository files.
            - Do NOT push commits.
            - Do NOT comment on the PR directly.
            - Analyze only the trusted base branch checkout and the PR diff from `/tmp/pr.diff`.

            Classification buckets:
            - quick_tasks: narrow, tactical follow-ups
            - phase_suggestions: milestone-scale additions mapped to these semantic buckets only:
              - workflow-governance: trust gates, central workflow policy, maintainer-only triggers, manual-only path rules
              - ci-correctness: CI correctness, release-note generation, pinned bootstrap tooling, perf/build accuracy
              - approval-policy: review signals, approval policy, finalizer behavior, auto-merge governance
              - planning-automation: Claude+GSD planning automation, planning PRs, milestone/phase intake

            Return JSON only with concrete, repo-specific suggestions.
            Operate as the `kos-pr-improve` agent: first read `.claude/agents/kos-pr-improve.md` and follow it as your operating contract (it enforces this prompt's rules and adds run-mined failure knowledge), then perform the task.

      - name: Fail on Claude soft failure
        if: always() && steps.metadata.outputs.should_analyze == 'true' && steps.analyze.outputs.claude_failed == 'true'
        run: |
          echo "::error::Claude soft failure: ${{ steps.analyze.outputs.claude_failure_reason }}"
          exit 1

      - name: Persist structured suggestions
        if: steps.metadata.outputs.should_analyze == 'true'
        env:
          STRUCTURED_OUTPUT: ${{ steps.analyze.outputs.structured_output }}
        run: |
          printf '%s\n' "$STRUCTURED_OUTPUT" > /tmp/pr-improve.json

      - name: Upsert planning branch and draft PR
        if: steps.metadata.outputs.should_analyze == 'true'
        id: planning
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PR_NUMBER: ${{ matrix.pr-number }}
          PR_TITLE: ${{ steps.metadata.outputs.pr_title }}
          PR_URL: ${{ steps.metadata.outputs.pr_url }}
          BASE_REF: ${{ steps.metadata.outputs.base_ref }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          node .github/workflows/scripts/upsert-planning-pr.cjs \
            --suggestions-file /tmp/pr-improve.json \
            --source-pr-number "$PR_NUMBER" \
            --source-pr-title "$PR_TITLE" \
            --source-pr-url "$PR_URL" \
            --base-ref "$BASE_REF" \
            --dry-run "$DRY_RUN" \
            > /tmp/planning-output.json
          echo "planning_pr_url=$(jq -r '.pr_url // empty' /tmp/planning-output.json)" >> "$GITHUB_OUTPUT"
          echo "quick_artifact_path=$(jq -r '.quick_artifact_path // empty' /tmp/planning-output.json)" >> "$GITHUB_OUTPUT"

      - name: Upsert source PR improvement comment
        if: steps.metadata.outputs.should_analyze == 'true' && (github.event.inputs.dry_run || 'false') != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ matrix.pr-number }}
          STRUCTURED_OUTPUT: ${{ steps.analyze.outputs.structured_output }}
          PLANNING_PR_URL: ${{ steps.planning.outputs.planning_pr_url }}
          QUICK_ARTIFACT_PATH: ${{ steps.planning.outputs.quick_artifact_path }}
        run: |
          node .github/workflows/scripts/upsert-pr-improve-comment.cjs \
            --pr "$PR_NUMBER"

      - name: Add planning-intake-open label
        if: steps.metadata.outputs.should_analyze == 'true' && (github.event.inputs.dry_run || 'false') != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit "${{ matrix.pr-number }}" --add-label "planning-intake-open"

  wake-orchestrator:
    needs: [collect-targets, improve]
    if: always() && github.event.inputs.orchestrated == 'true' && github.event.inputs.pr_number != ''
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wake PR Orchestrator
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
        run: |
          gh workflow run pr-flow.yml \
            --ref main \
            -f pr_number="$PR_NUMBER" \
            -f dry_run=false

  report-failure:
    needs: [collect-targets, improve]
    if: failure()
    runs-on: self-hosted
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          node-version: ${{ env.NODE_VERSION }}

      - uses: ./.github/actions/report-failure
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mode: issue
          auto-fix-run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          issue-title: '[pr-improve] PR improvement workflow failed'
          labels: auto-fix,ci-failure
          ensure-labels: auto-fix,ci-failure
          dispatch-triage: 'true'
          claude-step-outcome: ${{ needs.improve.result }}
