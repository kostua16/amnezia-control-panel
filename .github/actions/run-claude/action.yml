name: "Run Claude"
description: "claude-code-action wrapper with shared settings, model pin, default tools"

inputs:
  api-key:
    description: "API key"
    required: true
  prompt:
    description: "Prompt for Claude"
    required: true
  max-turns:
    description: "Maximum turns"
    default: "70"
  track-progress:
    description: "Track progress"
    default: "false"
  allowed-bots:
    description: "Allowed bots"
    required: false
  allowed-tools:
    description: "Allowed tools"
    default: "Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(git:*),Bash(bun:*),Bash(npm:*),Bash(npx:*),Bash(gh:*),Bash(node:*)"
  system-prompt:
    description: "Custom system prompt. When empty, Claude uses its built-in default. Note: literal { and } must be escaped as {{ and }}."
    required: false
    default: ""
  model:
    description: "Override default model (claude-sonnet-4-5-sonnet)"
    required: false
    default: "sonnet"
  subagent-model:
    description: "Override default agent model (claude-haiku-4-5-20251001)"
    required: false
    default: "haiku"
  claude-debug:
    description: "Claude debug"
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Run Claude
      uses: ./.github/actions/run-claude-params
      with:
        api-key: ${{ inputs.api-key }}
        api-url: 'https://api.anthropic.com'
        haiku-model: 'claude-haiku-4-5-20251001'
        sonnet-model: 'claude-sonnet-4-5-20250929'
        opus-model: 'claude-opus-4-5-20251101'
        model: ${{ inputs.model }}
        subagent-model: ${{ inputs.subagent-model }}
        prompt: ${{ inputs.prompt }}
        max-turns: ${{ inputs.max-turns }}
        track-progress: ${{ inputs.track-progress }}
        allowed-bots: ${{ inputs.allowed-bots }}
        allowed-tools: ${{ inputs.allowed-tools }}
        system-prompt: ${{ inputs.system-prompt }}
        claude-debug: ${{ inputs.claude-debug }}
