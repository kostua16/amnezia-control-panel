name: "Run Claude"
description: "claude-code-action wrapper with shared settings, model pin, default tools"

inputs:
  api-key:
    description: "API key override"
    default: ""
    required: false
  api-url:
    description: "Anthropic API URL"
    default: ""
  prompt:
    description: "Prompt for Claude"
    required: true
  max-turns:
    description: "Maximum turns"
    default: "70"
  track-progress:
    description: "Track progress"
    default: "false"
  allowed-bots:
    description: "Allowed bots"
    required: false
  allowed-tools:
    description: "Allowed tools"
    default: "Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(git:*),Bash(bun:*),Bash(npm:*),Bash(npx:*),Bash(gh:*),Bash(node:*)"
  system-prompt:
    description: "Custom system prompt. When empty, Claude uses its built-in default. Note: literal { and } must be escaped as {{ and }}."
    required: false
    default: ""
  api-timeout:
    description: "API timeout"
    default: ""
  disable-telemetry:
    description: "Disable telemetry"
    default: "1"
  haiku-model:
    description: "Anthropic default haiku model"
    default: ""
  sonnet-model:
    description: "Anthropic default sonnet model"
    default: ""
  opus-model:
    description: "Anthropic default opus model"
    default: ""
  model:
    description: "Anthropic model"
    default: ""
  subagent-model:
    description: "Claude code subagent model"
    default: ""
  claude-debug:
    description: "Claude debug"
    default: ""
runs:
  using: composite
  steps:
    - id: turn_budget
      shell: bash
      run: |
        max="${{ inputs.max-turns }}"
        if ! [[ "$max" =~ ^[0-9]+$ ]]; then
          echo "::error::max-turns must be a non-negative integer, got: $max"
          exit 1
        fi
        budget=$(( max * 80 / 100 ))
        investigate=$(( budget * 20 / 100 ))
        verify=$(( budget * 20 / 100 ))
        main=$(( budget - investigate - verify ))
        echo "budget=$budget" >> "$GITHUB_OUTPUT"
        echo "investigate=$investigate" >> "$GITHUB_OUTPUT"
        echo "main=$main" >> "$GITHUB_OUTPUT"
        echo "verify=$verify" >> "$GITHUB_OUTPUT"

    - id: resolve-config
      shell: bash
      env:
        RESOLVED_API_KEY: ${{ inputs.api-key || github.secrets.ZAI_API_KEY || github.secrets.ANTHROPIC_API_KEY || github.secrets.ANTHROPIC_AUTH_TOKEN || github.secrets.CLAUDE_API_KEY || github.secrets.API_KEY }}
        RESOLVED_API_URL: ${{ inputs.api-url || env.ANTHROPIC_BASE_URL || env.ANTHROPIC_BASE_URL || 'https://api.anthropic.com' }}
        RESOLVED_API_TIMEOUT: ${{ inputs.api-timeout || env.API_TIMEOUT_MS || env.API_TIMEOUT_MS || '30000' }}
        RESOLVED_HAIKU_MODEL: ${{ inputs.haiku-model || env.ANTHROPIC_DEFAULT_HAIKU_MODEL || env.ANTHROPIC_DEFAULT_HAIKU_MODEL || 'claude-haiku-4-5-20251001' }}
        RESOLVED_SONNET_MODEL: ${{ inputs.sonnet-model || env.ANTHROPIC_DEFAULT_SONNET_MODEL || env.ANTHROPIC_DEFAULT_SONNET_MODEL || 'claude-sonnet-4-20250514' }}
        RESOLVED_OPUS_MODEL: ${{ inputs.opus-model || env.ANTHROPIC_DEFAULT_OPUS_MODEL || env.ANTHROPIC_DEFAULT_OPUS_MODEL || 'claude-opus-4-20250514' }}
        RESOLVED_MODEL: ${{ inputs.model || env.ANTHROPIC_DEFAULT_SONNET_MODEL || env.ANTHROPIC_DEFAULT_SONNET_MODEL || 'claude-sonnet-4-20250514' }}
        RESOLVED_SUBAGENT_MODEL: ${{ inputs.subagent-model || env.CLAUDE_CODE_SUBAGENT_MODEL || env.CLAUDE_CODE_SUBAGENT_MODEL || 'claude-haiku-4-5-20251001' }}
        RESOLVED_CLAUDE_DEBUG: ${{ inputs.claude-debug || env.CLAUDE_DEBUG || env.CLAUDE_DEBUG || 'false' }}
      run: |
        echo "api_key=$RESOLVED_API_KEY" >> "$GITHUB_OUTPUT"
        echo "api_url=$RESOLVED_API_URL" >> "$GITHUB_OUTPUT"
        echo "api_timeout=$RESOLVED_API_TIMEOUT" >> "$GITHUB_OUTPUT"
        echo "haiku_model=$RESOLVED_HAIKU_MODEL" >> "$GITHUB_OUTPUT"
        echo "sonnet_model=$RESOLVED_SONNET_MODEL" >> "$GITHUB_OUTPUT"
        echo "opus_model=$RESOLVED_OPUS_MODEL" >> "$GITHUB_OUTPUT"
        echo "model=$RESOLVED_MODEL" >> "$GITHUB_OUTPUT"
        echo "subagent_model=$RESOLVED_SUBAGENT_MODEL" >> "$GITHUB_OUTPUT"
        echo "claude_debug=$RESOLVED_CLAUDE_DEBUG" >> "$GITHUB_OUTPUT"

    - name: Run Claude Code
      uses: anthropics/claude-code-action@v1
      env:
        DISABLE_TELEMETRY: ${{ inputs.disable-telemetry }}
        API_TIMEOUT_MS: ${{ steps.resolve-config.outputs.api_timeout }}
        CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: ${{ inputs.disable-telemetry }}
        ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ steps.resolve-config.outputs.haiku_model }}
        ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ steps.resolve-config.outputs.sonnet_model }}
        ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ steps.resolve-config.outputs.opus_model }}
        CLAUDE_CODE_SUBAGENT_MODEL: ${{ steps.resolve-config.outputs.subagent_model }}
        ANTHROPIC_BASE_URL: ${{ steps.resolve-config.outputs.api_url }}
        ANTHROPIC_API_KEY: ${{ steps.resolve-config.outputs.api_key }}
        ANTHROPIC_AUTH_TOKEN: ${{ steps.resolve-config.outputs.api_key }}
      with:
        anthropic_api_key: ${{ steps.resolve-config.outputs.api_key }}
        allowed_bots: ${{ inputs.allowed-bots }}
        track_progress: ${{ inputs.track-progress }}
        show_full_output: ${{ steps.resolve-config.outputs.claude_debug || false }}
        claude_args: |-
          --model ${{ steps.resolve-config.outputs.model }}
          --max-turns ${{ inputs.max-turns }}
          --allowedTools '${{ inputs.allowed-tools }}'${{ inputs.system-prompt != '' && format(' --system-prompt "{0}"', inputs.system-prompt) || '' }}
        prompt: |-
          ${{ inputs.prompt }}.

          AGENT TURN LIMIT — maximum ${{ steps.turn_budget.outputs.budget }} turns (do not exceed):
            - You have at most ${{ steps.turn_budget.outputs.budget }} turns total.
            - Phase allocation (do not exceed):
              • ≤${{ steps.turn_budget.outputs.investigate }} turns — investigate only (read logs, reproduce, search codebase).
              • ≤${{ steps.turn_budget.outputs.main }} turns — implement (edit files, run fixes, commit).
              • ≤${{ steps.turn_budget.outputs.verify }} turns — verify only (run tests, lint, confirm the fix).
            - Once a phase budget is used up, move to the next phase; do not keep exploring after investigate is done.
            - Prefer fewer tool calls per turn; avoid re-reading the same files.
            - If you cannot finish in time, STOP and report: what you did, what remains, and your best partial result.
        settings: |
          {
            "env": {
              "ANTHROPIC_API_KEY": "${{ steps.resolve-config.outputs.api_key }}",
              "ANTHROPIC_AUTH_TOKEN": "${{ steps.resolve-config.outputs.api_key }}"
            }
          }
