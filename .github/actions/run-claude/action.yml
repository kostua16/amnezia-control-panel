name: "Run Claude"
description: "claude-code-action wrapper with shared settings, model pin, default tools"

inputs:
  api-key:
    description: "API key override. Defaults to secrets.ZAI_API_KEY."
    default: ${{ github.secrets.ZAI_API_KEY || github.secrets.ANTHROPIC_API_KEY || github.secrets.ANTHROPIC_AUTH_TOKEN || github.secrets.CLAUDE_API_KEY || github.secrets.API_KEY }}
    required: false
  api-url:
    description: "Anthropic API URL"
    default: "${{ github.env.ANTHROPIC_BASE_URL || 'https://api.anthropic.com' }}"
  prompt:
    description: "Prompt for Claude"
    required: true
  max-turns:
    description: "Maximum turns"
    default: "70"
  track-progress:
    description: "Track progress"
    default: "false"
  allowed-bots:
    description: "Allowed bots"
    required: false
  allowed-tools:
    description: "Allowed tools"
    default: "Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(git:*),Bash(bun:*),Bash(npm:*),Bash(npx:*),Bash(gh:*),Bash(node:*)"
  system-prompt:
    description: "Custom system prompt. When empty, Claude uses its built-in default. Note: literal { and } must be escaped as {{ and }}."
    required: false
    default: ""
  api-timeout:
    description: "API timeout"
    default: "${{ github.env.API_TIMEOUT_MS || 30000 }}"
  disable-telemetry:
    description: "Disable telemetry"
    default: "1"
  haiku-model:
    description: "Anthropic default haiku model"
    default: "${{ github.env.ANTHROPIC_DEFAULT_HAIKU_MODEL || 'claude-haiku-4-5-20251001' }}"
  sonnet-model:
    description: "Anthropic default sonnet model"
    default: "${{ github.env.ANTHROPIC_DEFAULT_SONNET_MODEL || 'claude-sonnet-4-20250514' }}"
  opus-model:
    description: "Anthropic default opus model"
    default: "${{ github.env.ANTHROPIC_DEFAULT_OPUS_MODEL || 'claude-opus-4-20250514' }}"
  model:
    description: "Anthropic model"
    default: "${{ github.env.ANTHROPIC_DEFAULT_SONNET_MODEL || 'claude-sonnet-4-20250514' }}"
  subagent-model:
    description: "Claude code subagent model"
    default: "${{ github.env.CLAUDE_CODE_SUBAGENT_MODEL || 'claude-haiku-4-5-20251001' }}"
  claude-debug:
    description: "Claude debug"
    default: "${{ github.env.CLAUDE_DEBUG || false }}"
runs:
  using: composite
  steps:
    - id: turn_budget
      shell: bash
      run: |
        max="${{ inputs.max-turns }}"
        if ! [[ "$max" =~ ^[0-9]+$ ]]; then
          echo "::error::max-turns must be a non-negative integer, got: $max"
          exit 1
        fi
        budget=$(( max * 80 / 100 ))
        investigate=$(( budget * 20 / 100 ))
        verify=$(( budget * 20 / 100 ))
        main=$(( budget - investigate - verify ))
        echo "budget=$budget" >> "$GITHUB_OUTPUT"
        echo "investigate=$investigate" >> "$GITHUB_OUTPUT"
        echo "main=$main" >> "$GITHUB_OUTPUT"
        echo "verify=$verify" >> "$GITHUB_OUTPUT"

    - name: Run Claude Code
      uses: anthropics/claude-code-action@v1
      env:
        DISABLE_TELEMETRY: ${{ inputs.disable-telemetry }}
        API_TIMEOUT_MS: ${{ inputs.api-timeout }}
        CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: ${{ inputs.disable-telemetry }}
        ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ inputs.haiku-model }}
        ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ inputs.sonnet-model }}
        ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ inputs.opus-model }}
        CLAUDE_CODE_SUBAGENT_MODEL: ${{ inputs.subagent-model }}
        ANTHROPIC_BASE_URL: ${{ inputs.api-url }}
        ANTHROPIC_API_KEY: ${{ inputs.api-key }}
        ANTHROPIC_AUTH_TOKEN: ${{ inputs.api-key }}
      with:
        anthropic_api_key: ${{ inputs.api-key }}
        allowed_bots: ${{ inputs.allowed-bots }}
        track_progress: ${{ inputs.track-progress }}
        show_full_output: ${{ inputs.claude-debug || false }}
        claude_args: |-
          --model ${{ inputs.model }}
          --max-turns ${{ inputs.max-turns }}
          --allowedTools '${{ inputs.allowed-tools }}'${{ inputs.system-prompt != '' && format(' --system-prompt "{0}"', inputs.system-prompt) || '' }}
        prompt: |-
          ${{ inputs.prompt }}.

          AGENT TURN LIMIT — maximum ${{ steps.turn_budget.outputs.budget }} turns (do not exceed):
            - You have at most ${{ steps.turn_budget.outputs.budget }} turns total.
            - Phase allocation (do not exceed):
              • ≤${{ steps.turn_budget.outputs.investigate }} turns — investigate only (read logs, reproduce, search codebase).
              • ≤${{ steps.turn_budget.outputs.main }} turns — implement (edit files, run fixes, commit).
              • ≤${{ steps.turn_budget.outputs.verify }} turns — verify only (run tests, lint, confirm the fix).
            - Once a phase budget is used up, move to the next phase; do not keep exploring after investigate is done.
            - Prefer fewer tool calls per turn; avoid re-reading the same files.
            - If you cannot finish in time, STOP and report: what you did, what remains, and your best partial result.
        settings: |
          {
            "env": {
              "ANTHROPIC_API_KEY": "${{ inputs.api-key }}",
              "ANTHROPIC_AUTH_TOKEN": "${{ inputs.api-key }}"
            }
          }
