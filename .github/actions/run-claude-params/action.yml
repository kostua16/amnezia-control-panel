name: 'Run Claude with parameters'
description: 'claude-code-action wrapper with shared settings, model pin, default tools'

outputs:
  session_id:
    description: 'Session id from the successful Claude Code attempt'
    value: ${{ steps.select-outputs.outputs.session_id }}
  branch_name:
    description: 'Branch name created by the successful Claude Code attempt'
    value: ${{ steps.select-outputs.outputs.branch_name }}
  execution_file:
    description: 'Execution file path from the successful Claude Code attempt'
    value: ${{ steps.select-outputs.outputs.execution_file }}
  structured_output:
    description: 'Structured JSON output from the successful Claude Code attempt'
    value: ${{ steps.select-outputs.outputs.structured_output }}
  used_attempt:
    description: 'Successful Claude Code retry attempt number'
    value: ${{ steps.select-outputs.outputs.used_attempt }}
  last_attempt:
    description: 'Last Claude Code attempt that actually ran'
    value: ${{ steps.select-outputs.outputs.last_attempt }}
  last_attempt_outcome:
    description: 'Outcome of the last Claude Code attempt that actually ran'
    value: ${{ steps.select-outputs.outputs.last_attempt_outcome }}
  last_execution_file:
    description: 'Execution file path from the last Claude Code attempt that actually ran'
    value: ${{ steps.select-outputs.outputs.last_execution_file }}
  last_session_id:
    description: 'Session id from the last Claude Code attempt that actually ran'
    value: ${{ steps.select-outputs.outputs.last_session_id }}
  last_structured_output:
    description: 'Structured JSON output from the last Claude Code attempt that actually ran'
    value: ${{ steps.select-outputs.outputs.last_structured_output }}
  claude_failed:
    description: 'true when Claude failed hard or produced a soft-failure execution result'
    value: ${{ steps.claude-health.outputs.failed }}
  claude_failure_reason:
    description: 'Human-readable Claude failure reason'
    value: ${{ steps.claude-health.outputs.reason }}
  claude_soft_success:
    description: 'true when Claude succeeded but the underlying action reported a recoverable wrapper/probe failure'
    value: ${{ steps.claude-health.outputs.soft_success }}
  claude_soft_success_reason:
    description: 'Human-readable reason for a recoverable action-level soft success'
    value: ${{ steps.claude-health.outputs.soft_success_reason }}
  claude_num_turns:
    description: 'Claude num_turns from execution output, when available'
    value: ${{ steps.claude-health.outputs.num_turns }}
  claude_is_error:
    description: 'Claude is_error from execution output, when available'
    value: ${{ steps.claude-health.outputs.is_error }}
  claude_used_attempt:
    description: 'Claude attempt number selected by the runner'
    value: ${{ steps.claude-health.outputs.used_attempt }}
  claude_has_findings:
    description: 'true when the Claude log scanner found any known issue pattern'
    value: ${{ steps.scan-logs.outputs.has_findings }}
  claude_duration_ms:
    description: 'Claude execution duration in milliseconds'
    value: ${{ steps.scan-logs.outputs.duration_ms }}
  claude_duration_sec:
    description: 'Claude execution duration in seconds'
    value: ${{ steps.scan-logs.outputs.duration_sec }}
  claude_total_cost_usd:
    description: 'Claude total cost in USD'
    value: ${{ steps.scan-logs.outputs.total_cost_usd }}
  claude_model_used:
    description: 'Claude model used by the run'
    value: ${{ steps.scan-logs.outputs.model_used }}
  claude_turns_budget_pct:
    description: 'Percent of max turns used'
    value: ${{ steps.scan-logs.outputs.turns_budget_pct }}
  claude_cost_per_turn:
    description: 'Claude cost per turn'
    value: ${{ steps.scan-logs.outputs.cost_per_turn }}
  claude_duration_per_turn_ms:
    description: 'Claude duration per turn in milliseconds'
    value: ${{ steps.scan-logs.outputs.duration_per_turn_ms }}
  claude_num_tool_calls:
    description: 'Total Claude tool calls parsed from execution output'
    value: ${{ steps.scan-logs.outputs.num_tool_calls }}
  claude_tool_breakdown:
    description: 'Tool invocation counts as JSON'
    value: ${{ steps.scan-logs.outputs.tool_breakdown }}
  claude_num_failed_tool_calls:
    description: 'Failed Claude tool result count'
    value: ${{ steps.scan-logs.outputs.num_failed_tool_calls }}
  claude_failed_tool_samples:
    description: 'Capped failed Claude tool samples as JSON array'
    value: ${{ steps.scan-logs.outputs.failed_tool_samples }}
  claude_num_rejected_tool_calls:
    description: 'Rejected Claude tool call count'
    value: ${{ steps.scan-logs.outputs.num_rejected_tool_calls }}
  claude_rejected_tools_list:
    description: 'Rejected/disallowed Claude tools as JSON array'
    value: ${{ steps.scan-logs.outputs.rejected_tools_list }}
  claude_denial_rate:
    description: 'Rejected tool call percentage'
    value: ${{ steps.scan-logs.outputs.denial_rate }}
  claude_read_files_count:
    description: 'Unique files read by Claude Read tool'
    value: ${{ steps.scan-logs.outputs.read_files_count }}
  claude_read_files_list:
    description: 'Unique files read by Claude Read tool as JSON array'
    value: ${{ steps.scan-logs.outputs.read_files_list }}
  claude_edit_files_count:
    description: 'Unique files edited by Claude edit/write tools'
    value: ${{ steps.scan-logs.outputs.edit_files_count }}
  claude_edit_files_list:
    description: 'Unique files edited by Claude edit/write tools as JSON array'
    value: ${{ steps.scan-logs.outputs.edit_files_list }}
  claude_changed_files_count:
    description: 'Git changed file count after Claude run'
    value: ${{ steps.scan-logs.outputs.changed_files_count }}
  claude_changed_files_list:
    description: 'Git changed files after Claude run as JSON array'
    value: ${{ steps.scan-logs.outputs.changed_files_list }}
  claude_action_error:
    description: 'Action-level Claude failure error when available'
    value: ${{ steps.scan-logs.outputs.action_error }}
  claude_error_messages:
    description: 'Sanitized Claude error messages as JSON array'
    value: ${{ steps.scan-logs.outputs.error_messages }}
  claude_last_output:
    description: 'Sanitized capped Claude SDK output excerpt'
    value: ${{ steps.scan-logs.outputs.last_output }}
  claude_metrics_json:
    description: 'All parsed Claude metrics as compact JSON'
    value: ${{ steps.scan-logs.outputs.metrics_json }}

inputs:
  api-key:
    description: 'API key'
    required: true
  api-url:
    description: 'Anthropic API URL'
    default: 'https://api.anthropic.com'
  api-timeout:
    description: 'API timeout in milliseconds'
    default: '300000'
  prompt:
    description: 'Prompt for Claude'
    required: true
  max-turns:
    description: 'Maximum turns'
    default: '70'
  track-progress:
    description: 'Track progress'
    default: 'false'
  allowed-bots:
    description: 'Allowed bots'
    required: false
  allowed-tools:
    description: 'Allowed tools'
    default: 'Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(git:*),Bash(bun:*),Bash(npm:*),Bash(npx:*),Bash(gh:*),Bash(node:*),Bash(rtk:*)'
  system-prompt:
    description: 'Custom system prompt. When empty, Claude uses its built-in default. Note: literal { and } must be escaped as {{ and }}.'
    required: false
    default: ''
  json-schema:
    description: 'Optional JSON schema passed to Claude Code via --json-schema for structured output'
    required: false
    default: ''
  haiku-model:
    description: 'Anthropic default haiku model'
    default: 'claude-haiku-4-5-20251001'
  sonnet-model:
    description: 'Anthropic default sonnet model'
    default: 'claude-sonnet-4-5-20250929'
  opus-model:
    description: 'Anthropic default opus model'
    default: 'claude-opus-4-5-20251101'
  model:
    description: 'Anthropic model'
    default: 'claude-sonnet-4-5-sonnet'
  subagent-model:
    description: 'Claude code subagent model'
    default: 'claude-haiku-4-5-20251001'
  claude-debug:
    description: 'Claude debug'
    default: 'false'
  claude-full-output:
    description: 'Show full Claude SDK output. Defaults true for this private repo; public reusable workflows should default false.'
    default: 'true'
  effort-level:
    description: 'Claude Code reasoning effort level (low, medium, high, max). Empty uses default.'
    default: ''
  additional-permissions:
    description: "Additional GitHub permissions for the App token (e.g. 'issues: write')"
    default: ''
  plugins:
    description: 'Newline-separated list of Claude Code plugin names to install (e.g. code-review@claude-code-plugins)'
    default: ''
  plugin-marketplaces:
    description: 'Newline-separated list of Claude Code plugin marketplace Git URLs to install from'
    default: ''
  github-token:
    description: 'GitHub token for issue reporting and log download'
    default: '${{ github.token }}'
  allow-post-inline:
    description: 'When true, permit posting inline PR review comments via the allowlisted post-pr-inline-comment.sh helper and inject a one-line how-to into the task prompt. Enable on PR-review workflows.'
    default: 'false'
runs:
  using: composite
  steps:
    - id: turn_budget
      shell: bash
      run: |
        max="${{ inputs.max-turns }}"
        if ! [[ "$max" =~ ^[0-9]+$ ]]; then
          echo "::error::max-turns must be a non-negative integer, got: $max"
          exit 1
        fi
        hard_max=$max
        budget=$(( max * 80 / 100 ))
        investigate=$(( budget * 20 / 100 ))
        verify=$(( budget * 20 / 100 ))
        main=$(( budget - investigate - verify ))
        echo "hard_max=$hard_max" >> "$GITHUB_OUTPUT"
        echo "budget=$budget" >> "$GITHUB_OUTPUT"
        echo "investigate=$investigate" >> "$GITHUB_OUTPUT"
        echo "main=$main" >> "$GITHUB_OUTPUT"
        echo "verify=$verify" >> "$GITHUB_OUTPUT"

    - id: resolve-models
      shell: bash
      run: |
        resolve() {
          case "$1" in
            haiku)  echo '${{ inputs.haiku-model }}' ;;
            sonnet) echo '${{ inputs.sonnet-model }}' ;;
            opus)   echo '${{ inputs.opus-model }}' ;;
            *)      echo "$1" ;;
          esac
        }
        echo "model=$(resolve '${{ inputs.model }}')" >> "$GITHUB_OUTPUT"
        echo "subagent_model=$(resolve '${{ inputs.subagent-model }}')" >> "$GITHUB_OUTPUT"

    - id: resolve-track-progress
      shell: bash
      env:
        REQUESTED_TRACK_PROGRESS: ${{ inputs.track-progress }}
        EVENT_NAME: ${{ github.event_name }}
      run: |
        supported=false
        case "$EVENT_NAME" in
          pull_request|issues|issue_comment|pull_request_review_comment|pull_request_review)
            supported=true
            ;;
        esac

        value=false
        if [[ "$REQUESTED_TRACK_PROGRESS" == "true" && "$supported" == "true" ]]; then
          value=true
        elif [[ "$REQUESTED_TRACK_PROGRESS" == "true" ]]; then
          echo "track_progress requested but disabled for unsupported event: $EVENT_NAME"
        fi

        echo "value=$value" >> "$GITHUB_OUTPUT"

    - name: Resolve Bun executable
      id: resolve_bun
      shell: bash
      run: |
        bun_path="$(command -v bun)"
        if [[ -z "$bun_path" ]]; then
          echo "::error::Bun executable not found on PATH. Is oven-sh/setup-bun installed?"
          exit 1
        fi
        echo "bun-path=$bun_path" >> "$GITHUB_OUTPUT"

    - name: Resolve allowed tools
      id: resolve_allowed_tools
      shell: bash
      env:
        REQUESTED_ALLOWED_TOOLS: ${{ inputs.allowed-tools }}
        # PR-context signal resolved from the event itself so the guard only
        # strips the inline-comment tool when there is genuinely no PR to
        # comment on (covers pull_request events, workflow_dispatch with the
        # pr_number input, and issue_comment on a PR-linked issue).
        PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number || (github.event.issue.pull_request != null && github.event.issue.number) }}
        ALLOW_POST_INLINE: ${{ inputs.allow-post-inline }}
      run: |
        tools="$REQUESTED_ALLOWED_TOOLS"
        inline_comment_tool='mcp__github_inline_comment__create_inline_comment'

        if [[ -z "${PR_NUMBER:-}" && "$tools" == *"$inline_comment_tool"* ]]; then
          tools="$(
            printf '%s' "$tools" \
              | tr ',' '\n' \
              | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
              | grep -Fvx "$inline_comment_tool" \
              | paste -sd, -
          )"
          echo "Removed $inline_comment_tool from allowed tools because PR_NUMBER is unset."
        fi

        # Allowlisted helper that posts one inline PR comment via gh; works on
        # every trigger (including workflow_dispatch, where the inline-comment
        # MCP server is not initialized).
        if [[ "$ALLOW_POST_INLINE" == "true" ]]; then
          helper='Bash(./.github/workflows/scripts/post-pr-inline-comment.sh:*)'
          if [[ -n "$tools" ]]; then
            tools="$tools,$helper"
          else
            tools="$helper"
          fi
        fi

        echo "tools=$tools" >> "$GITHUB_OUTPUT"

    - name: Resolve inline-comment guidance
      id: resolve_inline_guidance
      shell: bash
      env:
        ALLOW_POST_INLINE: ${{ inputs.allow-post-inline }}
      run: |
        if [[ "$ALLOW_POST_INLINE" == "true" ]]; then
          printf 'inline_guidance=%s\n' 'Post actionable findings as inline review comments: prefer the `mcp__github_inline_comment__create_inline_comment` tool when it is available; otherwise use `./.github/workflows/scripts/post-pr-inline-comment.sh --pr <n> --path <file> --line <n> --body <text>` (same field names as the inline-comment tool, plus --pr; idempotent — re-running updates the existing comment at that path/line rather than duplicating; --start_line for multi-line spans; the head commit SHA is resolved automatically).' >> "$GITHUB_OUTPUT"
        else
          echo "inline_guidance=" >> "$GITHUB_OUTPUT"
        fi

    - name: Clear Claude execution output (attempt 1)
      shell: bash
      run: rm -f "${RUNNER_TEMP}/claude-execution-output.json"

    # --- Attempt 1 ---
    - name: Run Claude Code (attempt 1)
      id: claude-run-1
      continue-on-error: true
      uses: anthropics/claude-code-action@b2532c6eeaeae7a645f37943ed5a7e51870d1d90
      env:
        DISABLE_TELEMETRY: '1'
        API_TIMEOUT_MS: ${{ inputs.api-timeout }}
        CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
        ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ inputs.haiku-model }}
        ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ inputs.sonnet-model }}
        ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ inputs.opus-model }}
        CLAUDE_CODE_SUBAGENT_MODEL: ${{ steps.resolve-models.outputs.subagent_model }}
        CLAUDE_CODE_EFFORT_LEVEL: ${{ inputs.effort-level }}
        ANTHROPIC_BASE_URL: ${{ inputs.api-url }}
        ANTHROPIC_API_KEY: ${{ inputs.api-key }}
        ANTHROPIC_AUTH_TOKEN: ${{ inputs.api-key }}
      with:
        anthropic_api_key: ${{ inputs.api-key }}
        github_token: ${{ inputs.github-token }}
        path_to_bun_executable: ${{ steps.resolve_bun.outputs.bun-path }}
        allowed_bots: ${{ inputs.allowed-bots }}
        track_progress: ${{ steps.resolve-track-progress.outputs.value }}
        show_full_output: ${{ inputs.claude-full-output == 'true' || inputs.claude-debug == 'true' }}
        additional_permissions: ${{ inputs.additional-permissions }}
        plugins: ${{ inputs.plugins }}
        plugin_marketplaces: ${{ inputs.plugin-marketplaces }}
        claude_args: |-
          --model ${{ steps.resolve-models.outputs.model }}
          --max-turns ${{ inputs.max-turns }}
          --allowedTools '${{ steps.resolve_allowed_tools.outputs.tools }}'${{ inputs.system-prompt != '' && format(' --system-prompt "{0}"', inputs.system-prompt) || '' }}${{ inputs.json-schema != '' && format(' --json-schema {0}', toJSON(inputs.json-schema)) || '' }}
        prompt: |-
          ${{ inputs.prompt }}.

          ${{ steps.resolve_inline_guidance.outputs.inline_guidance }}

          AGENT TURN LIMIT — soft budget ${{ steps.turn_budget.outputs.budget }} turns; hard cap ${{ steps.turn_budget.outputs.hard_max }} turns:
            - Complete the main work within the soft working budget of ${{ steps.turn_budget.outputs.budget }} turns.
            - The hard execution cap is ${{ steps.turn_budget.outputs.hard_max }} turns.
            - Reserve the remaining buffer only for final verification, cleanup, or reporting.
            - Phase allocation uses the soft budget (do not exceed):
              • ≤${{ steps.turn_budget.outputs.investigate }} turns — investigate only (read logs, reproduce, search codebase).
              • ≤${{ steps.turn_budget.outputs.main }} turns — implement (edit files, run fixes, commit).
              • ≤${{ steps.turn_budget.outputs.verify }} turns — verify only (run tests, lint, confirm the fix).
            - Once a phase budget is used up, move to the next phase; do not keep exploring after investigate is done.
            - Prefer fewer tool calls per turn; avoid re-reading the same files.
            - If you cannot finish in time, STOP and report: what you did, what remains, and your best partial result.
        settings: |
          {
            "env": {
              "ANTHROPIC_API_KEY": "${{ inputs.api-key }}",
              "ANTHROPIC_AUTH_TOKEN": "${{ inputs.api-key }}"
            }
          }

    # Check whether a failed attempt is safe to retry.
    - name: Check retry condition (attempt 1)
      id: check-429-1
      if: ${{ steps.claude-run-1.outcome == 'failure' }}
      shell: bash
      env:
        API_URL: ${{ inputs.api-url }}
        API_KEY: ${{ inputs.api-key }}
        JSON_SCHEMA_ENABLED: ${{ inputs.json-schema != '' && 'true' || 'false' }}
        GH_TOKEN: ${{ inputs.github-token }}
        GITHUB_JOB_NAME: ${{ github.job }}
      run: |
        http_code=$(curl -s -o /dev/null -w '%{http_code}' \
          -X POST "${API_URL}/v1/messages" \
          -H "content-type: application/json" \
          -H "x-api-key: ${API_KEY}" \
          -H "anthropic-version: 2023-06-01" \
          -d '{"model":"${{ steps.resolve-models.outputs.model }}","max_tokens":1,"messages":[{"role":"user","content":"hi"}]}' \
          --max-time 30)

        # Job log lets the classifier see pre-execution failures (e.g. branch
        # setup dying on an unauthenticated git fetch) that never reach the
        # execution output file. Best-effort — an empty log keeps old behavior.
        LOG_FILE=$(mktemp "${RUNNER_TEMP:-/tmp}/claude-retry-log-XXXXXX.log")
        JOB_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" \
          --jq '.jobs[] | select(.name == env.GITHUB_JOB_NAME or (.name | startswith(env.GITHUB_JOB_NAME + " ("))) | .id' \
          2>/dev/null | head -1 || true)
        if [[ -n "$JOB_ID" ]]; then
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${JOB_ID}/logs" > "$LOG_FILE" 2>/dev/null || true
        fi

        node .github/workflows/scripts/classify-claude-retry.cjs \
          --http-code "$http_code" \
          --execution-file "${RUNNER_TEMP}/claude-execution-output.json" \
          --log-file "$LOG_FILE" \
          --json-schema-enabled "$JSON_SCHEMA_ENABLED" \
          --attempt "1" \
          --github-output "$GITHUB_OUTPUT"
        rm -f "$LOG_FILE"

    - name: Rate limit wait (attempt 1 → 2)
      if: ${{ steps.check-429-1.outputs.is_rate_limited == 'true' }}
      shell: bash
      run: sleep 120

    - name: Clear Claude execution output (attempt 2)
      if: ${{ steps.check-429-1.outputs.should_retry == 'true' }}
      shell: bash
      run: rm -f "${RUNNER_TEMP}/claude-execution-output.json"

    # --- Attempt 2 ---
    - name: Run Claude Code (attempt 2)
      id: claude-run-2
      if: ${{ steps.check-429-1.outputs.should_retry == 'true' }}
      continue-on-error: true
      uses: anthropics/claude-code-action@b2532c6eeaeae7a645f37943ed5a7e51870d1d90
      env:
        DISABLE_TELEMETRY: '1'
        API_TIMEOUT_MS: ${{ inputs.api-timeout }}
        CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
        ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ inputs.haiku-model }}
        ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ inputs.sonnet-model }}
        ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ inputs.opus-model }}
        CLAUDE_CODE_SUBAGENT_MODEL: ${{ steps.resolve-models.outputs.subagent_model }}
        CLAUDE_CODE_EFFORT_LEVEL: ${{ inputs.effort-level }}
        ANTHROPIC_BASE_URL: ${{ inputs.api-url }}
        ANTHROPIC_API_KEY: ${{ inputs.api-key }}
        ANTHROPIC_AUTH_TOKEN: ${{ inputs.api-key }}
      with:
        anthropic_api_key: ${{ inputs.api-key }}
        github_token: ${{ inputs.github-token }}
        path_to_bun_executable: ${{ steps.resolve_bun.outputs.bun-path }}
        allowed_bots: ${{ inputs.allowed-bots }}
        track_progress: ${{ steps.resolve-track-progress.outputs.value }}
        show_full_output: ${{ inputs.claude-full-output == 'true' || inputs.claude-debug == 'true' }}
        additional_permissions: ${{ inputs.additional-permissions }}
        plugins: ${{ inputs.plugins }}
        plugin_marketplaces: ${{ inputs.plugin-marketplaces }}
        claude_args: |-
          --model ${{ steps.resolve-models.outputs.model }}
          --max-turns ${{ inputs.max-turns }}
          --allowedTools '${{ steps.resolve_allowed_tools.outputs.tools }}'${{ inputs.system-prompt != '' && format(' --system-prompt "{0}"', inputs.system-prompt) || '' }}${{ inputs.json-schema != '' && format(' --json-schema {0}', toJSON(inputs.json-schema)) || '' }}
        prompt: |-
          ${{ inputs.prompt }}.

          ${{ steps.resolve_inline_guidance.outputs.inline_guidance }}

          AGENT TURN LIMIT — soft budget ${{ steps.turn_budget.outputs.budget }} turns; hard cap ${{ steps.turn_budget.outputs.hard_max }} turns:
            - Complete the main work within the soft working budget of ${{ steps.turn_budget.outputs.budget }} turns.
            - The hard execution cap is ${{ steps.turn_budget.outputs.hard_max }} turns.
            - Reserve the remaining buffer only for final verification, cleanup, or reporting.
            - Phase allocation uses the soft budget (do not exceed):
              • ≤${{ steps.turn_budget.outputs.investigate }} turns — investigate only (read logs, reproduce, search codebase).
              • ≤${{ steps.turn_budget.outputs.main }} turns — implement (edit files, run fixes, commit).
              • ≤${{ steps.turn_budget.outputs.verify }} turns — verify only (run tests, lint, confirm the fix).
            - Once a phase budget is used up, move to the next phase; do not keep exploring after investigate is done.
            - Prefer fewer tool calls per turn; avoid re-reading the same files.
            - If you cannot finish in time, STOP and report: what you did, what remains, and your best partial result.
        settings: |
          {
            "env": {
              "ANTHROPIC_API_KEY": "${{ inputs.api-key }}",
              "ANTHROPIC_AUTH_TOKEN": "${{ inputs.api-key }}"
            }
          }

    - name: Check retry condition (attempt 2)
      id: check-429-2
      if: ${{ steps.claude-run-2.outcome == 'failure' }}
      shell: bash
      env:
        API_URL: ${{ inputs.api-url }}
        API_KEY: ${{ inputs.api-key }}
        JSON_SCHEMA_ENABLED: ${{ inputs.json-schema != '' && 'true' || 'false' }}
        GH_TOKEN: ${{ inputs.github-token }}
        GITHUB_JOB_NAME: ${{ github.job }}
      run: |
        http_code=$(curl -s -o /dev/null -w '%{http_code}' \
          -X POST "${API_URL}/v1/messages" \
          -H "content-type: application/json" \
          -H "x-api-key: ${API_KEY}" \
          -H "anthropic-version: 2023-06-01" \
          -d '{"model":"${{ steps.resolve-models.outputs.model }}","max_tokens":1,"messages":[{"role":"user","content":"hi"}]}' \
          --max-time 30)

        # Same pre-execution-failure visibility as check-429-1.
        LOG_FILE=$(mktemp "${RUNNER_TEMP:-/tmp}/claude-retry-log-XXXXXX.log")
        JOB_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" \
          --jq '.jobs[] | select(.name == env.GITHUB_JOB_NAME or (.name | startswith(env.GITHUB_JOB_NAME + " ("))) | .id' \
          2>/dev/null | head -1 || true)
        if [[ -n "$JOB_ID" ]]; then
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${JOB_ID}/logs" > "$LOG_FILE" 2>/dev/null || true
        fi

        node .github/workflows/scripts/classify-claude-retry.cjs \
          --http-code "$http_code" \
          --execution-file "${RUNNER_TEMP}/claude-execution-output.json" \
          --log-file "$LOG_FILE" \
          --json-schema-enabled "$JSON_SCHEMA_ENABLED" \
          --attempt "2" \
          --github-output "$GITHUB_OUTPUT"
        rm -f "$LOG_FILE"

    - name: Rate limit wait (attempt 2 → 3)
      if: ${{ steps.check-429-2.outputs.is_rate_limited == 'true' }}
      shell: bash
      run: sleep 120

    - name: Clear Claude execution output (attempt 3)
      if: ${{ steps.check-429-2.outputs.should_retry == 'true' }}
      shell: bash
      run: rm -f "${RUNNER_TEMP}/claude-execution-output.json"

    # --- Attempt 3 (final) ---
    - name: Run Claude Code (attempt 3)
      id: claude-run-3
      if: ${{ steps.check-429-2.outputs.should_retry == 'true' }}
      uses: anthropics/claude-code-action@b2532c6eeaeae7a645f37943ed5a7e51870d1d90
      env:
        DISABLE_TELEMETRY: '1'
        API_TIMEOUT_MS: ${{ inputs.api-timeout }}
        CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
        ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ inputs.haiku-model }}
        ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ inputs.sonnet-model }}
        ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ inputs.opus-model }}
        CLAUDE_CODE_SUBAGENT_MODEL: ${{ steps.resolve-models.outputs.subagent_model }}
        CLAUDE_CODE_EFFORT_LEVEL: ${{ inputs.effort-level }}
        ANTHROPIC_BASE_URL: ${{ inputs.api-url }}
        ANTHROPIC_API_KEY: ${{ inputs.api-key }}
        ANTHROPIC_AUTH_TOKEN: ${{ inputs.api-key }}
      with:
        anthropic_api_key: ${{ inputs.api-key }}
        github_token: ${{ inputs.github-token }}
        path_to_bun_executable: ${{ steps.resolve_bun.outputs.bun-path }}
        allowed_bots: ${{ inputs.allowed-bots }}
        track_progress: ${{ steps.resolve-track-progress.outputs.value }}
        show_full_output: ${{ inputs.claude-full-output == 'true' || inputs.claude-debug == 'true' }}
        additional_permissions: ${{ inputs.additional-permissions }}
        plugins: ${{ inputs.plugins }}
        plugin_marketplaces: ${{ inputs.plugin-marketplaces }}
        claude_args: |-
          --model ${{ steps.resolve-models.outputs.model }}
          --max-turns ${{ inputs.max-turns }}
          --allowedTools '${{ steps.resolve_allowed_tools.outputs.tools }}'${{ inputs.system-prompt != '' && format(' --system-prompt "{0}"', inputs.system-prompt) || '' }}${{ inputs.json-schema != '' && format(' --json-schema {0}', toJSON(inputs.json-schema)) || '' }}
        prompt: |-
          ${{ inputs.prompt }}.

          ${{ steps.resolve_inline_guidance.outputs.inline_guidance }}

          AGENT TURN LIMIT — soft budget ${{ steps.turn_budget.outputs.budget }} turns; hard cap ${{ steps.turn_budget.outputs.hard_max }} turns:
            - Complete the main work within the soft working budget of ${{ steps.turn_budget.outputs.budget }} turns.
            - The hard execution cap is ${{ steps.turn_budget.outputs.hard_max }} turns.
            - Reserve the remaining buffer only for final verification, cleanup, or reporting.
            - Phase allocation uses the soft budget (do not exceed):
              • ≤${{ steps.turn_budget.outputs.investigate }} turns — investigate only (read logs, reproduce, search codebase).
              • ≤${{ steps.turn_budget.outputs.main }} turns — implement (edit files, run fixes, commit).
              • ≤${{ steps.turn_budget.outputs.verify }} turns — verify only (run tests, lint, confirm the fix).
            - Once a phase budget is used up, move to the next phase; do not keep exploring after investigate is done.
            - Prefer fewer tool calls per turn; avoid re-reading the same files.
            - If you cannot finish in time, STOP and report: what you did, what remains, and your best partial result.
        settings: |
          {
            "env": {
              "ANTHROPIC_API_KEY": "${{ inputs.api-key }}",
              "ANTHROPIC_AUTH_TOKEN": "${{ inputs.api-key }}"
            }
          }

    - name: Select Claude outputs
      id: select-outputs
      if: always()
      shell: bash
      env:
        RUN1_SESSION_ID: ${{ steps.claude-run-1.outputs.session_id || '' }}
        RUN1_BRANCH_NAME: ${{ steps.claude-run-1.outputs.branch_name || '' }}
        RUN1_EXECUTION_FILE: ${{ steps.claude-run-1.outputs.execution_file || '' }}
        RUN1_STRUCTURED_OUTPUT: ${{ steps.claude-run-1.outputs.structured_output || '' }}
        RUN2_SESSION_ID: ${{ steps.claude-run-2.outputs.session_id || '' }}
        RUN2_BRANCH_NAME: ${{ steps.claude-run-2.outputs.branch_name || '' }}
        RUN2_EXECUTION_FILE: ${{ steps.claude-run-2.outputs.execution_file || '' }}
        RUN2_STRUCTURED_OUTPUT: ${{ steps.claude-run-2.outputs.structured_output || '' }}
        RUN3_SESSION_ID: ${{ steps.claude-run-3.outputs.session_id || '' }}
        RUN3_BRANCH_NAME: ${{ steps.claude-run-3.outputs.branch_name || '' }}
        RUN3_EXECUTION_FILE: ${{ steps.claude-run-3.outputs.execution_file || '' }}
        RUN3_STRUCTURED_OUTPUT: ${{ steps.claude-run-3.outputs.structured_output || '' }}
      run: |
        emit_multiline() {
          local key="$1"
          local value="$2"
          local delim
          delim="EOF-$(openssl rand -hex 8)"
          echo "$key<<$delim"
          printf '%s\n' "$value"
          echo "$delim"
        }

        if [[ "${{ steps.claude-run-3.outcome }}" == "success" ]]; then
          prefix="RUN3"
          attempt="3"
        elif [[ "${{ steps.claude-run-2.outcome }}" == "success" ]]; then
          prefix="RUN2"
          attempt="2"
        elif [[ "${{ steps.claude-run-1.outcome }}" == "success" ]]; then
          prefix="RUN1"
          attempt="1"
        else
          prefix=""
          attempt=""
        fi

        last_prefix=""
        last_attempt=""
        last_outcome=""
        if [[ "${{ steps.claude-run-3.outcome }}" != "" && "${{ steps.claude-run-3.outcome }}" != "skipped" ]]; then
          last_prefix="RUN3"; last_attempt="3"; last_outcome="${{ steps.claude-run-3.outcome }}"
        elif [[ "${{ steps.claude-run-2.outcome }}" != "" && "${{ steps.claude-run-2.outcome }}" != "skipped" ]]; then
          last_prefix="RUN2"; last_attempt="2"; last_outcome="${{ steps.claude-run-2.outcome }}"
        elif [[ "${{ steps.claude-run-1.outcome }}" != "" && "${{ steps.claude-run-1.outcome }}" != "skipped" ]]; then
          last_prefix="RUN1"; last_attempt="1"; last_outcome="${{ steps.claude-run-1.outcome }}"
        fi

        {
          if [[ -n "$prefix" ]]; then
            session_id_var="${prefix}_SESSION_ID"
            branch_name_var="${prefix}_BRANCH_NAME"
            execution_file_var="${prefix}_EXECUTION_FILE"
            structured_output_var="${prefix}_STRUCTURED_OUTPUT"

            echo "session_id=${!session_id_var}"
            echo "branch_name=${!branch_name_var}"
            echo "execution_file=${!execution_file_var}"
            emit_multiline "structured_output" "${!structured_output_var}"
            echo "used_attempt=$attempt"
          else
            echo "session_id="
            echo "branch_name="
            echo "execution_file="
            emit_multiline "structured_output" ""
            echo "used_attempt="
          fi

          if [[ -n "$last_prefix" ]]; then
            last_session_id_var="${last_prefix}_SESSION_ID"
            last_execution_file_var="${last_prefix}_EXECUTION_FILE"
            last_structured_output_var="${last_prefix}_STRUCTURED_OUTPUT"

            echo "last_attempt=$last_attempt"
            echo "last_attempt_outcome=$last_outcome"
            echo "last_execution_file=${!last_execution_file_var}"
            echo "last_session_id=${!last_session_id_var}"
            emit_multiline "last_structured_output" "${!last_structured_output_var}"
          else
            echo "last_attempt="
            echo "last_attempt_outcome="
            echo "last_execution_file="
            echo "last_session_id="
            emit_multiline "last_structured_output" ""
          fi
        } >> "$GITHUB_OUTPUT"

    # Every attempt with progress tracking posts its own "Claude Code is
    # working…" comment; failed attempts never edit theirs into a result, so
    # a 3-attempt failure leaves three identical in-progress banners pointing
    # at one dead run. Delete any comment for THIS run still showing the
    # working banner (a successful attempt has already edited its comment
    # into the final report, so it never matches).
    - name: Clean stale tracking comments
      if: >-
        always() &&
        steps.resolve-track-progress.outputs.value == 'true' &&
        (github.event.issue.number || github.event.pull_request.number)
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TARGET_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
      run: |
        run_url_suffix="actions/runs/${GITHUB_RUN_ID}"
        gh api "repos/${GITHUB_REPOSITORY}/issues/${TARGET_NUMBER}/comments" --paginate \
          --jq '.[] | select((.body | contains("Claude Code is working")) and (.body | contains("'"$run_url_suffix"'"))) | .id' \
          2>/dev/null |
        while read -r comment_id; do
          if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" >/dev/null 2>&1; then
            echo "deleted stale tracking comment ${comment_id}"
          else
            echo "warning: failed to delete tracking comment ${comment_id}"
          fi
        done

    - name: collect-file-stats
      id: collect-file-stats
      if: always()
      shell: bash
      run: |
        changed_files="$(
          {
            git diff --name-only HEAD 2>/dev/null || true
            git ls-files --others --exclude-standard 2>/dev/null || true
          } | sed '/^$/d' | sort -u
        )"
        changed_count="0"
        if [[ -n "$changed_files" ]]; then
          changed_count="$(printf '%s\n' "$changed_files" | wc -l | tr -d ' ')"
        fi
        {
          echo "changed_files_count=$changed_count"
          delim="EOF-$(openssl rand -hex 8)"
          echo "changed_files_list<<$delim"
          printf '%s\n' "$changed_files"
          echo "$delim"
        } >> "$GITHUB_OUTPUT"

    # --- Scan Claude logs for known error patterns ---
    - name: scan-claude-logs
      id: scan-logs
      if: always()
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_JOB_NAME: ${{ github.job }}
        MAX_TURNS_INPUT: ${{ inputs.max-turns }}
        LAST_ATTEMPT: ${{ steps.select-outputs.outputs.last_attempt }}
        LAST_ATTEMPT_OUTCOME: ${{ steps.select-outputs.outputs.last_attempt_outcome }}
        LAST_EXECUTION_FILE: ${{ steps.select-outputs.outputs.last_execution_file }}
        CHANGED_FILES_LIST: ${{ steps.collect-file-stats.outputs.changed_files_list }}
      run: |
        ATTEMPT="${LAST_ATTEMPT:-0}"
        CONCLUSION="${LAST_ATTEMPT_OUTCOME:-skipped}"
        EXEC_JSON_PATH="${LAST_EXECUTION_FILE:-}"
        if [[ -z "$EXEC_JSON_PATH" || ! -f "$EXEC_JSON_PATH" ]]; then
          EXEC_JSON_PATH="${RUNNER_TEMP}/claude-execution-output.json"
        fi

        # Download current job logs
        LOG_FILE=$(mktemp "${RUNNER_TEMP:-/tmp}/claude-job-XXXXXX.log")
        JOB_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" \
          --jq '.jobs[] | select(.name == env.GITHUB_JOB_NAME or (.name | startswith(env.GITHUB_JOB_NAME + " ("))) | .id' \
          2>/dev/null | head -1 || true)
        if [[ -n "$JOB_ID" ]]; then
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${JOB_ID}/logs" > "$LOG_FILE" 2>/dev/null || true
        fi

        if [[ ! -s "$LOG_FILE" ]]; then
          echo "Could not download job logs — continuing with execution JSON only."
        fi

        CHANGED_FILES_FILE=$(mktemp "${RUNNER_TEMP:-/tmp}/claude-changed-files-XXXXXX.txt")
        printf '%s\n' "$CHANGED_FILES_LIST" > "$CHANGED_FILES_FILE"

        node .github/workflows/scripts/scan-claude-logs.cjs \
          --execution-file "$EXEC_JSON_PATH" \
          --log-file "$LOG_FILE" \
          --changed-files-file "$CHANGED_FILES_FILE" \
          --max-turns "$MAX_TURNS_INPUT" \
          --attempt "$ATTEMPT" \
          --outcome "$CONCLUSION" \
          --run-id "$GITHUB_RUN_ID" \
          --workflow "$GITHUB_JOB_NAME" \
          --github-output "$GITHUB_OUTPUT" \
          --issues-dir "${RUNNER_TEMP:-/tmp}"

        rm -f "$LOG_FILE" "$CHANGED_FILES_FILE"

    # --- Report findings to rolling GitHub issue ---
    - name: ensure-claude-health-labels
      if: always() && steps.scan-logs.outputs.has_findings == 'true'
      uses: ./.github/actions/ensure-workflow-labels
      with:
        github-token: ${{ inputs.github-token }}
        policy-file: .github/workflows/policy.json
        names: ci-failure,claude-health

    - name: report-claude-issues
      if: always()
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
      env:
        ISSUES_FILE: ${{ steps.scan-logs.outputs.claude_issues_file }}
        HAS_FINDINGS: ${{ steps.scan-logs.outputs.has_findings }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const { renderClaudeExecutionSection } = require('./.github/workflows/scripts/render-claude-report.cjs');
          const issuesFile = process.env.ISSUES_FILE;
          const hasFindings = process.env.HAS_FINDINGS === 'true';

          const { owner, repo } = context.repo;

          async function syncCriticalLabel(issueNumber, hasError) {
            try {
              if (hasError) {
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: issueNumber, labels: ['claude-health-critical']
                });
                return;
              }

              await github.rest.issues.removeLabel({
                owner, repo, issue_number: issueNumber, name: 'claude-health-critical'
              });
            } catch (e) {
              if (!hasError && e.status === 404) return;
              const action = hasError ? 'add' : 'remove';
              core.warning(`Failed to ${action} critical label: ${e.message}`);
            }
          }

          // Find existing rolling issue
          let issueNumber = null;
          try {
            const issues = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'claude-health', per_page: 10
            });
            const tracker = issues.data.find(i => i.title === '[claude-health] CI Claude Issue Tracker');
            if (tracker) issueNumber = tracker.number;
          } catch (e) {
            core.warning(`Failed to search for tracker issue: ${e.message}`);
          }

          if (!hasFindings) {
            if (issueNumber) {
              await syncCriticalLabel(issueNumber, false);
              core.info(`Cleared stale critical label on tracker issue #${issueNumber}.`);
            } else {
              core.info('No findings and no tracker issue — skipping report.');
            }
            return;
          }

          if (!issuesFile || !fs.existsSync(issuesFile)) {
            core.warning('Claude findings were reported but no issues file was found.');
            return;
          }

          const data = JSON.parse(fs.readFileSync(issuesFile, 'utf8'));
          if (!data.findings || data.findings.length === 0) {
            core.info('No findings in issues file — skipping report.');
            return;
          }

          // Create if not found
          if (!issueNumber) {
            try {
              const created = await github.rest.issues.create({
                owner, repo,
                title: '[claude-health] CI Claude Issue Tracker',
                body: [
                  '# Claude CI Issue Tracker',
                  '',
                  'This is a **rolling issue** that collects categorized failure reports from Claude CI runs.',
                  'Each failed run appends a comment with its findings.',
                  '',
                  'Labels:',
                  '- `claude-health` — this tracker',
                  '- `claude-health-critical` — present while the latest scan has an error-severity finding',
                  '- `ci-failure` — general CI failure tag',
                ].join('\n'),
                labels: ['ci-failure', 'claude-health']
              });
              issueNumber = created.data.number;
              core.info(`Created tracker issue #${issueNumber}`);
            } catch (e) {
              core.warning(`Failed to create tracker issue: ${e.message}`);
              return;
            }
          }

          // Build comment body
          const hasError = data.findings.some(f => f.severity === 'error');
          const statusEmoji = data.conclusion === 'failure' ? ':x: FAILED' : ':white_check_mark: SUCCESS';
          const timestamp = new Date().toISOString();

          let table = '| Category | Severity | Detail |\n|----------|----------|--------|\n';
          for (const f of data.findings) {
            const sevIcon = f.severity === 'error' ? ':red_circle:' : f.severity === 'warning' ? ':warning:' : ':information_source:';
            const detail = (f.detail || '').substring(0, 150).replace(/\|/g, '\\|').replace(/\n/g, ' ');
            table += `| ${f.category} | ${sevIcon} ${f.severity} | ${detail} |\n`;
          }

          const metricsSection = renderClaudeExecutionSection({
            claudeMetricsJson: JSON.stringify(data.metrics || {}),
            claudeStepOutcome: data.conclusion,
            claudeUsedAttempt: String(data.attempt || ''),
            maxTurns: data.max_turns,
          }, { heading: '### Claude Execution Metrics' }).trim();

          const comment = [
            `## Run ${data.run_id} — ${data.workflow} — ${statusEmoji}`,
            '',
            table,
            metricsSection,
            '',
            `_Attempt: ${data.attempt}/3 | Turns: ${data.num_turns}/${data.max_turns} | ${timestamp}_`,
            `_Run: https://github.com/${owner}/${repo}/actions/runs/${data.run_id}_`,
          ].join('\n');

          try {
            await github.rest.issues.createComment({
              owner, repo, issue_number: issueNumber, body: comment
            });
            core.info(`Posted findings to issue #${issueNumber}`);
          } catch (e) {
            core.warning(`Failed to post comment: ${e.message}`);
          }

          await syncCriticalLabel(issueNumber, hasError);

          // Clean up temp file
          try { fs.unlinkSync(issuesFile); } catch (_) {}

    # --- Normalize Claude health for downstream consumers ---
    - name: Normalize Claude health
      id: claude-health
      if: always()
      shell: bash
      env:
        LAST_ATTEMPT: ${{ steps.select-outputs.outputs.last_attempt }}
        LAST_ATTEMPT_OUTCOME: ${{ steps.select-outputs.outputs.last_attempt_outcome }}
        ATTEMPT1_OUTCOME: ${{ steps.claude-run-1.outcome }}
        ATTEMPT2_OUTCOME: ${{ steps.claude-run-2.outcome || '' }}
        ATTEMPT3_OUTCOME: ${{ steps.claude-run-3.outcome || '' }}
        CHECK1_SOFT_SUCCESS: ${{ steps.check-429-1.outputs.soft_success || 'false' }}
        CHECK1_SOFT_SUCCESS_REASON: ${{ steps.check-429-1.outputs.soft_success_reason || '' }}
        CHECK2_SOFT_SUCCESS: ${{ steps.check-429-2.outputs.soft_success || 'false' }}
        CHECK2_SOFT_SUCCESS_REASON: ${{ steps.check-429-2.outputs.soft_success_reason || '' }}
        SCAN_NUM_TURNS: ${{ steps.scan-logs.outputs.num_turns }}
        SCAN_IS_ERROR: ${{ steps.scan-logs.outputs.is_error }}
        SCAN_HAS_ERROR_FINDINGS: ${{ steps.scan-logs.outputs.has_error_findings }}
        SCAN_FINDINGS_SUMMARY: ${{ steps.scan-logs.outputs.findings_summary }}
        SCAN_FAILURE_REASON: ${{ steps.scan-logs.outputs.failure_reason }}
        SCAN_ACTION_ERROR: ${{ steps.scan-logs.outputs.action_error }}
        SCAN_DURATION_MS: ${{ steps.scan-logs.outputs.duration_ms }}
        MAX_TURNS_INPUT: ${{ inputs.max-turns }}
      run: |
        reason_with_context() {
          local reason="$1"
          local context=""
          if [[ "$SCAN_NUM_TURNS" != "" && "$SCAN_NUM_TURNS" != "null" ]]; then
            context=" after ${SCAN_NUM_TURNS} turn(s)"
          fi
          if [[ "$SCAN_DURATION_MS" != "" ]]; then
            local seconds=$((SCAN_DURATION_MS / 1000))
            if [[ -n "$context" ]]; then
              context="${context}, ${seconds}s"
            else
              context=" after ${seconds}s"
            fi
          fi
          printf '%s%s\n' "$reason" "$context"
        }

        # Rule 1: No Claude attempt ran
        if [[ -z "$LAST_ATTEMPT" || "$LAST_ATTEMPT" == "" ]]; then
          echo "failed=true" >> "$GITHUB_OUTPUT"
          echo "reason=claude step did not run" >> "$GITHUB_OUTPUT"
          echo "num_turns=null" >> "$GITHUB_OUTPUT"
          echo "is_error=null" >> "$GITHUB_OUTPUT"
          echo "used_attempt=0" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        OUTCOME="$LAST_ATTEMPT_OUTCOME"
        if [[ -z "$OUTCOME" ]]; then
          OUTCOME_VAR="ATTEMPT${LAST_ATTEMPT}_OUTCOME"
          OUTCOME="${!OUTCOME_VAR}"
        fi

        echo "num_turns=$SCAN_NUM_TURNS" >> "$GITHUB_OUTPUT"
        echo "is_error=$SCAN_IS_ERROR" >> "$GITHUB_OUTPUT"
        echo "used_attempt=$LAST_ATTEMPT" >> "$GITHUB_OUTPUT"
        echo "soft_success=false" >> "$GITHUB_OUTPUT"
        echo "soft_success_reason=" >> "$GITHUB_OUTPUT"

        SOFT_SUCCESS_VAR="CHECK${LAST_ATTEMPT}_SOFT_SUCCESS"
        SOFT_SUCCESS_REASON_VAR="CHECK${LAST_ATTEMPT}_SOFT_SUCCESS_REASON"
        SOFT_SUCCESS="${!SOFT_SUCCESS_VAR}"
        SOFT_SUCCESS="${SOFT_SUCCESS:-false}"
        SOFT_SUCCESS_REASON="${!SOFT_SUCCESS_REASON_VAR}"
        SOFT_SUCCESS_REASON="${SOFT_SUCCESS_REASON:-}"

        # Rule 2a: The action failed after Claude produced a successful result.
        # Keep this fail-closed: require turns, is_error=false, and no error findings.
        if [[ "$OUTCOME" == "failure" && "$SOFT_SUCCESS" == "true" && "$SCAN_IS_ERROR" == "false" && "$SCAN_NUM_TURNS" != "" && "$SCAN_NUM_TURNS" != "null" && "$SCAN_NUM_TURNS" != "0" && "$SCAN_HAS_ERROR_FINDINGS" != "true" ]]; then
          echo "failed=false" >> "$GITHUB_OUTPUT"
          echo "reason=" >> "$GITHUB_OUTPUT"
          echo "soft_success=true" >> "$GITHUB_OUTPUT"
          echo "soft_success_reason=$SOFT_SUCCESS_REASON" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Rule 2: Final attempt outcome is failure
        if [[ "$OUTCOME" == "failure" ]]; then
          echo "failed=true" >> "$GITHUB_OUTPUT"
          if [[ -n "$SCAN_ACTION_ERROR" ]]; then
            echo "reason=$(reason_with_context "$SCAN_ACTION_ERROR")" >> "$GITHUB_OUTPUT"
          elif [[ -n "$SCAN_FAILURE_REASON" ]]; then
            echo "reason=$(reason_with_context "$SCAN_FAILURE_REASON")" >> "$GITHUB_OUTPUT"
          else
            echo "reason=$(reason_with_context "claude-code-action step failed")" >> "$GITHUB_OUTPUT"
          fi
          exit 0
        fi

        # Rule 3: Execution output missing or unreadable after success
        if [[ "$SCAN_NUM_TURNS" == "null" && "$SCAN_IS_ERROR" == "null" ]]; then
          echo "failed=true" >> "$GITHUB_OUTPUT"
          echo "reason=$(reason_with_context "execution output unreadable: missing or empty")" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Rule 4: is_error + turn limit
        if [[ "$SCAN_IS_ERROR" == "true" && "$SCAN_NUM_TURNS" != "null" && "$SCAN_NUM_TURNS" -ge "$MAX_TURNS_INPUT" ]]; then
          echo "failed=true" >> "$GITHUB_OUTPUT"
          echo "reason=turn limit hit with error (turns: $SCAN_NUM_TURNS/$MAX_TURNS_INPUT)" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Rule 5: is_error
        if [[ "$SCAN_IS_ERROR" == "true" ]]; then
          echo "failed=true" >> "$GITHUB_OUTPUT"
          echo "reason=$(reason_with_context "claude reported is_error=true")" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Rule 6: zero turns
        if [[ "$SCAN_NUM_TURNS" == "0" ]]; then
          echo "failed=true" >> "$GITHUB_OUTPUT"
          if [[ -n "$SCAN_ACTION_ERROR" ]]; then
            echo "reason=$(reason_with_context "$SCAN_ACTION_ERROR")" >> "$GITHUB_OUTPUT"
          else
            echo "reason=$(reason_with_context "claude completed 0 turns")" >> "$GITHUB_OUTPUT"
          fi
          exit 0
        fi

        # Rule 7: scan found error-severity findings
        if [[ "$SCAN_HAS_ERROR_FINDINGS" == "true" ]]; then
          echo "failed=true" >> "$GITHUB_OUTPUT"
          if [[ -n "$SCAN_FAILURE_REASON" ]]; then
            echo "reason=$(reason_with_context "$SCAN_FAILURE_REASON")" >> "$GITHUB_OUTPUT"
          else
            echo "reason=claude log scanner found: $SCAN_FINDINGS_SUMMARY" >> "$GITHUB_OUTPUT"
          fi
          exit 0
        fi

        echo "failed=false" >> "$GITHUB_OUTPUT"
        echo "reason=" >> "$GITHUB_OUTPUT"

    # Belt-and-suspenders: fail job if an early attempt failed and was not retryable
    # (later attempts are skipped, so no Claude step naturally fails the job).
    - name: Fail on non-retryable error
      if: ${{ (steps.claude-run-1.outcome == 'failure' && steps.check-429-1.outputs.should_retry != 'true' && steps.check-429-1.outputs.soft_success != 'true') || (steps.claude-run-2.outcome == 'failure' && steps.check-429-2.outputs.should_retry != 'true' && steps.check-429-2.outputs.soft_success != 'true') }}
      shell: bash
      run: |
        echo "::error::Claude Code failed with a non-retryable error. Not retrying."
        exit 1
