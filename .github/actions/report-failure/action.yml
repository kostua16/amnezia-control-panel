name: 'Report Failure'
description: 'Collect failure logs and create issue or comment with details'

inputs:
  mode:
    description: '"issue" creates a new issue, "comment" comments on existing issue'
    default: 'issue'
  issue-number:
    description: 'Issue number to comment on (mode=comment only)'
    required: false
  auto-fix-run-url:
    description: 'URL of the auto-fix workflow run'
    required: true
  triggering-run-url:
    description: 'URL of the CI run that triggered auto-fix (mode=issue only)'
    required: false
  branch:
    description: 'Branch name (mode=issue only)'
    required: false
  pr-number:
    description: 'Associated PR number (optional, for title)'
    required: false
  issue-title:
    description: 'Custom title for issue mode'
    required: false
  issue-body:
    description: 'Custom introductory body for issue or comment mode'
    required: false
  labels:
    description: 'Comma-separated labels to apply'
    required: false
  ensure-labels:
    description: 'Comma-separated policy-backed labels to ensure before reporting'
    required: false
  dispatch-triage:
    description: 'Whether to dispatch triage after creating an issue'
    default: 'true'
  retry-command:
    description: 'Retry command hint for comment mode'
    default: '/fix'
  github-token:
    description: 'GitHub token for label, log, issue/comment, and workflow-dispatch operations'
    required: false
    default: '${{ github.token }}'
  claude-step-outcome:
    description: 'Outcome of the Claude step (success/failure/cancelled/skipped)'
    required: false
  claude-turns:
    description: 'Number of turns Claude completed'
    required: false
  claude-is-error:
    description: 'Whether Claude reported is_error=true'
    required: false
  claude-used-attempt:
    description: 'Claude attempt number selected by the runner'
    required: false
  claude-failure-reason:
    description: 'Pre-computed human-readable Claude failure reason'
    required: false
  claude-duration-ms:
    description: 'Claude execution duration in milliseconds'
    required: false
  claude-duration-sec:
    description: 'Claude execution duration in seconds'
    required: false
  claude-total-cost:
    description: 'Claude total cost in USD'
    required: false
  claude-model:
    description: 'Claude model used by the run'
    required: false
  claude-turns-budget-pct:
    description: 'Percent of max turns used'
    required: false
  claude-cost-per-turn:
    description: 'Claude cost per turn'
    required: false
  claude-duration-per-turn-ms:
    description: 'Claude duration per turn in milliseconds'
    required: false
  claude-num-tool-calls:
    description: 'Total Claude tool calls'
    required: false
  claude-tool-breakdown:
    description: 'Tool invocation counts as JSON'
    required: false
  claude-num-failed-tool-calls:
    description: 'Failed Claude tool result count'
    required: false
  claude-num-rejected-tool-calls:
    description: 'Rejected Claude tool call count'
    required: false
  claude-rejected-tools-list:
    description: 'Rejected/disallowed Claude tools as JSON array'
    required: false
  claude-denial-rate:
    description: 'Rejected tool call percentage'
    required: false
  claude-read-files-count:
    description: 'Unique files read by Claude Read tool'
    required: false
  claude-read-files-list:
    description: 'Unique files read by Claude Read tool as JSON array'
    required: false
  claude-edit-files-count:
    description: 'Unique files edited by Claude edit/write tools'
    required: false
  claude-edit-files-list:
    description: 'Unique files edited by Claude edit/write tools as JSON array'
    required: false
  claude-changed-files-count:
    description: 'Git changed file count after Claude run'
    required: false
  claude-changed-files-list:
    description: 'Git changed files after Claude run as JSON array'
    required: false
  claude-action-error:
    description: 'Action-level Claude failure error when available'
    required: false
  claude-error-messages:
    description: 'Sanitized Claude error messages as JSON array'
    required: false
  claude-last-output:
    description: 'Sanitized capped Claude SDK output excerpt'
    required: false
  claude-metrics-json:
    description: 'All parsed Claude metrics as compact JSON'
    required: false

runs:
  using: composite
  steps:
    - name: Resolve labels
      id: labels
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        LABEL_NAMES: ${{ inputs.ensure-labels }}
        LABELS: ${{ inputs.labels }}
      run: |
        set -euo pipefail

        EFFECTIVE_LABELS="$LABEL_NAMES"
        if [ -z "$EFFECTIVE_LABELS" ]; then
          if [ -n "$LABELS" ]; then
            EFFECTIVE_LABELS="$LABELS"
          elif [ "$MODE" = "comment" ]; then
            EFFECTIVE_LABELS="auto-fix-failed"
          else
            EFFECTIVE_LABELS="auto-fix,ci-failure,auto-fix-failed"
          fi
        fi

        echo "effective_labels=$EFFECTIVE_LABELS" >> "$GITHUB_OUTPUT"

    - name: Ensure labels exist
      uses: ./.github/actions/ensure-workflow-labels
      with:
        github-token: ${{ inputs.github-token }}
        policy-file: .github/workflows/policy.json
        names: ${{ steps.labels.outputs.effective_labels }}

    - name: Collect failure details
      id: collect
      uses: actions/github-script@v8
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const { parseClaudeExecution } = require('./.github/workflows/scripts/parse-claude-execution.cjs');
          const jobs = await github.rest.actions.listJobsForWorkflowRun({
            owner: context.repo.owner,
            repo: context.repo.repo,
            run_id: context.runId
          });
          const failedJobs = jobs.data.jobs.filter(j => j.conclusion === 'failure');
          const failedSteps = [];
          const logSnippets = [];
          let detectedClaudeMetrics = null;
          for (const job of failedJobs) {
            const steps = (job.steps || []).filter(s => s.conclusion === 'failure');
            for (const step of steps) {
              failedSteps.push(`${job.name} / ${step.name}`);
            }
            try {
              const logsResp = await github.rest.actions.downloadJobLogsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                job_id: job.id
              });
              const raw = typeof logsResp.data === 'string' ? logsResp.data : String(logsResp.data);
              logSnippets.push({ name: job.name, log: raw.slice(-3000) });
              const parsed = parseClaudeExecution({
                logText: raw,
                outcome: job.conclusion || 'failure',
              });
              const hasClaudeSignal = parsed.actionError ||
                parsed.errorMessages.length > 0 ||
                parsed.numTurns !== null ||
                parsed.modelUsed ||
                parsed.lastOutput;
              if (!detectedClaudeMetrics && hasClaudeSignal) {
                detectedClaudeMetrics = parsed;
              }
            } catch (e) {
              logSnippets.push({ name: job.name, log: `(log unavailable: ${e.message})` });
            }
          }
          core.setOutput('failed_steps', JSON.stringify(failedSteps));
          core.setOutput('log_snippets', JSON.stringify(logSnippets));
          core.setOutput('detected_claude_metrics', JSON.stringify(detectedClaudeMetrics || {}));

    - name: Create issue or comment
      uses: actions/github-script@v8
      env:
        MODE: ${{ inputs.mode }}
        ISSUE_NUMBER: ${{ inputs.issue-number }}
        AUTO_FIX_RUN_URL: ${{ inputs.auto-fix-run-url }}
        CI_RUN_URL: ${{ inputs.triggering-run-url }}
        BRANCH: ${{ inputs.branch }}
        PR_NUMBER: ${{ inputs.pr-number }}
        ISSUE_TITLE: ${{ inputs.issue-title }}
        ISSUE_BODY: ${{ inputs.issue-body }}
        LABELS: ${{ inputs.labels }}
        EFFECTIVE_LABELS: ${{ steps.labels.outputs.effective_labels }}
        DISPATCH_TRIAGE: ${{ inputs.dispatch-triage }}
        RETRY_COMMAND: ${{ inputs.retry-command }}
        FAILED_STEPS: ${{ steps.collect.outputs.failed_steps }}
        LOG_SNIPPETS: ${{ steps.collect.outputs.log_snippets }}
        DETECTED_CLAUDE_METRICS: ${{ steps.collect.outputs.detected_claude_metrics }}
        CLAUDE_STEP_OUTCOME: ${{ inputs.claude-step-outcome }}
        CLAUDE_TURNS: ${{ inputs.claude-turns }}
        CLAUDE_IS_ERROR: ${{ inputs.claude-is-error }}
        CLAUDE_USED_ATTEMPT: ${{ inputs.claude-used-attempt }}
        CLAUDE_FAILURE_REASON: ${{ inputs.claude-failure-reason }}
        CLAUDE_DURATION_MS: ${{ inputs.claude-duration-ms }}
        CLAUDE_DURATION_SEC: ${{ inputs.claude-duration-sec }}
        CLAUDE_TOTAL_COST: ${{ inputs.claude-total-cost }}
        CLAUDE_MODEL: ${{ inputs.claude-model }}
        CLAUDE_TURNS_BUDGET_PCT: ${{ inputs.claude-turns-budget-pct }}
        CLAUDE_COST_PER_TURN: ${{ inputs.claude-cost-per-turn }}
        CLAUDE_DURATION_PER_TURN_MS: ${{ inputs.claude-duration-per-turn-ms }}
        CLAUDE_NUM_TOOL_CALLS: ${{ inputs.claude-num-tool-calls }}
        CLAUDE_TOOL_BREAKDOWN: ${{ inputs.claude-tool-breakdown }}
        CLAUDE_NUM_FAILED_TOOL_CALLS: ${{ inputs.claude-num-failed-tool-calls }}
        CLAUDE_NUM_REJECTED_TOOL_CALLS: ${{ inputs.claude-num-rejected-tool-calls }}
        CLAUDE_REJECTED_TOOLS_LIST: ${{ inputs.claude-rejected-tools-list }}
        CLAUDE_DENIAL_RATE: ${{ inputs.claude-denial-rate }}
        CLAUDE_READ_FILES_COUNT: ${{ inputs.claude-read-files-count }}
        CLAUDE_READ_FILES_LIST: ${{ inputs.claude-read-files-list }}
        CLAUDE_EDIT_FILES_COUNT: ${{ inputs.claude-edit-files-count }}
        CLAUDE_EDIT_FILES_LIST: ${{ inputs.claude-edit-files-list }}
        CLAUDE_CHANGED_FILES_COUNT: ${{ inputs.claude-changed-files-count }}
        CLAUDE_CHANGED_FILES_LIST: ${{ inputs.claude-changed-files-list }}
        CLAUDE_ACTION_ERROR: ${{ inputs.claude-action-error }}
        CLAUDE_ERROR_MESSAGES: ${{ inputs.claude-error-messages }}
        CLAUDE_LAST_OUTPUT: ${{ inputs.claude-last-output }}
        CLAUDE_METRICS_JSON: ${{ inputs.claude-metrics-json }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const {
            mergeClaudeMetrics,
            renderClaudeExecutionSection,
          } = require('./.github/workflows/scripts/render-claude-report.cjs');
          const mode = process.env.MODE;
          const autoFixRunUrl = process.env.AUTO_FIX_RUN_URL;
          const ciRunUrl = process.env.CI_RUN_URL || '';
          const branch = process.env.BRANCH || '';
          const prNumber = process.env.PR_NUMBER || '';
          const customTitle = process.env.ISSUE_TITLE || '';
          const customBody = process.env.ISSUE_BODY || '';
          const labelList = (process.env.LABELS || '')
            .split(',')
            .map(value => value.trim())
            .filter(Boolean);
          const dispatchTriage = process.env.DISPATCH_TRIAGE !== 'false';
          const retryCommand = process.env.RETRY_COMMAND || '/fix';
          const failedSteps = JSON.parse(process.env.FAILED_STEPS || '[]');
          const logSnippets = JSON.parse(process.env.LOG_SNIPPETS || '[]');
          const labels = (process.env.EFFECTIVE_LABELS || '').split(',').map(l => l.trim()).filter(Boolean);

          const stepsSection = failedSteps.length > 0
            ? failedSteps.map(s => `- ${s}`).join('\n')
            : '_No failed step details available_';

          const logsSection = logSnippets.length > 0
            ? logSnippets.map(({ name, log }) =>
                `<details><summary>${name}</summary>\n\n\`\`\`\n${log}\n\`\`\`\n</details>`
              ).join('\n\n')
            : '_No logs available_';

          const mergedClaudeMetrics = mergeClaudeMetrics(
            process.env.CLAUDE_METRICS_JSON,
            process.env.DETECTED_CLAUDE_METRICS,
          );
          const claudeInput = {
            claudeMetricsJson: JSON.stringify(mergedClaudeMetrics),
          };
          const envToMetric = {
            CLAUDE_STEP_OUTCOME: 'claudeStepOutcome',
            CLAUDE_TURNS: 'claudeTurns',
            CLAUDE_IS_ERROR: 'claudeIsError',
            CLAUDE_USED_ATTEMPT: 'claudeUsedAttempt',
            CLAUDE_FAILURE_REASON: 'claudeFailureReason',
            CLAUDE_DURATION_MS: 'claudeDurationMs',
            CLAUDE_DURATION_SEC: 'claudeDurationSec',
            CLAUDE_TOTAL_COST: 'claudeTotalCostUsd',
            CLAUDE_MODEL: 'claudeModelUsed',
            CLAUDE_TURNS_BUDGET_PCT: 'claudeTurnsBudgetPct',
            CLAUDE_COST_PER_TURN: 'claudeCostPerTurn',
            CLAUDE_DURATION_PER_TURN_MS: 'claudeDurationPerTurnMs',
            CLAUDE_NUM_TOOL_CALLS: 'claudeNumToolCalls',
            CLAUDE_TOOL_BREAKDOWN: 'claudeToolBreakdown',
            CLAUDE_NUM_FAILED_TOOL_CALLS: 'claudeNumFailedToolCalls',
            CLAUDE_NUM_REJECTED_TOOL_CALLS: 'claudeNumRejectedToolCalls',
            CLAUDE_REJECTED_TOOLS_LIST: 'claudeRejectedToolsList',
            CLAUDE_DENIAL_RATE: 'claudeDenialRate',
            CLAUDE_READ_FILES_COUNT: 'claudeReadFilesCount',
            CLAUDE_READ_FILES_LIST: 'claudeReadFilesList',
            CLAUDE_EDIT_FILES_COUNT: 'claudeEditFilesCount',
            CLAUDE_EDIT_FILES_LIST: 'claudeEditFilesList',
            CLAUDE_CHANGED_FILES_COUNT: 'claudeChangedFilesCount',
            CLAUDE_CHANGED_FILES_LIST: 'claudeChangedFilesList',
            CLAUDE_ACTION_ERROR: 'claudeActionError',
            CLAUDE_ERROR_MESSAGES: 'claudeErrorMessages',
            CLAUDE_LAST_OUTPUT: 'claudeLastOutput',
          };
          for (const [envName, metricName] of Object.entries(envToMetric)) {
            if (process.env[envName]) claudeInput[metricName] = process.env[envName];
          }
          const claudeSection = renderClaudeExecutionSection(claudeInput);

          if (mode === 'comment') {
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const intro = customBody || [
              '## Auto-fix Workflow Failed',
              '',
              'The `/fix` workflow run failed and could not produce a fix PR.',
              '',
              `**Run:** ${autoFixRunUrl}`,
            ].join('\n');
            const body = [
              intro,
              claudeSection,
              '### Failed Steps',
              stepsSection,
              '',
              '### Log Tails',
              logsSection,
              '',
              '---',
              `To retry, comment \`${retryCommand}\` on this issue.`
            ].join('\n');

            await github.rest.issues.addLabels({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issueNumber, labels
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issueNumber, body
            });
          } else {
            const title = customTitle || (
              prNumber
                ? `[auto-fix] Failed for #${prNumber} on ${branch}`
                : `[auto-fix] Failed on ${branch}`
            );

            const intro = customBody || (() => {
              const tableRows = [`| **Auto-fix run** | ${autoFixRunUrl} |`];
              if (ciRunUrl) tableRows.push(`| **Triggering CI run** | ${ciRunUrl} |`);
              if (branch) tableRows.push(`| **Branch** | \`${branch}\` |`);
              if (prNumber) tableRows.push(`| **PR** | #${prNumber} |`);
              return [
                '## Auto-fix Workflow Failure',
                '',
                'The auto-fix workflow itself failed and could not create a fix PR.',
                '',
                '| | |',
                '|---|---|',
                ...tableRows,
              ].join('\n');
            })();

            const body = [
              intro,
              claudeSection,
              '### Failed Steps',
              stepsSection,
              '',
              '## Log Tails',
              '',
              logsSection,
            ].join('\n');

            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title, body, labels
            });

            // Trigger triage workflow since issues opened by GITHUB_TOKEN
            // don't fire the issues:opened event
            if (dispatchTriage) {
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner, repo: context.repo.repo,
                  workflow_id: 'triage.yml', ref: 'main',
                  inputs: { issue_number: String(issue.number) }
                });
              } catch (e) {
                core.warning(`Failed to dispatch triage: ${e.message}`);
              }
            }
          }
