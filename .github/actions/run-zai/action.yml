name: "Run ZAI"
description: "claude-code-action wrapper with shared settings, model pin, default tools"

inputs:
  api-key:
    description: "API key"
    required: true
  prompt:
    description: "Prompt for ZAI"
    required: true
  max-turns:
    description: "Maximum turns"
    default: "70"
  track-progress:
    description: "Track progress"
    default: "false"
  allowed-bots:
    description: "Allowed bots"
    required: false
  allowed-tools:
    description: "Allowed tools"
    default: "Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(git:*),Bash(bun:*),Bash(npm:*),Bash(npx:*),Bash(gh:*),Bash(node:*)"
  system-prompt:
    description: "Custom system prompt. When empty, Claude uses its built-in default. Note: literal { and } must be escaped as {{ and }}."
    required: false
    default: ""
  model:
    description: "Override default model (glm-5)"
    required: false
    default: "sonnet"
  agent-model:
    description: "Override default agent model (glm-5)"
    required: false
    default: "haiku"
  claude-debug:
    description: "Claude debug"
    required: false
    default: "false"
  haiku-model:
    description: "Override default haiku model (glm-4.7)"
    required: false
    default: "glm-4.7"
  sonnet-model:
    description: "Override default sonnet model (glm-5)"
    required: false
    default: "glm-5"
  opus-model:
    description: "Override default opus model (glm-5.1)"
    required: false
    default: "glm-5.1"
runs:
  using: composite
  steps:
    - id: resolve-models
      shell: bash
      run: |
        resolve() {
          case "$1" in
            haiku)  echo '${{ inputs.haiku-model }}' ;;
            sonnet) echo '${{ inputs.sonnet-model }}' ;;
            opus)   echo '${{ inputs.opus-model }}' ;;
            *)      echo "$1" ;;
          esac
        }
        echo "model=$(resolve '${{ inputs.model }}')" >> "$GITHUB_OUTPUT"
        echo "agent_model=$(resolve '${{ inputs.agent-model }}')" >> "$GITHUB_OUTPUT"

    - name: Run ZAI
      uses: ./.github/actions/run-claude-params
      with:
        api-key: ${{ inputs.api-key }}
        api-url: 'https://api.z.ai/api/anthropic'
        prompt: ${{ inputs.prompt }}
        max-turns: ${{ inputs.max-turns }}
        track-progress: ${{ inputs.track-progress }}
        allowed-bots: ${{ inputs.allowed-bots }}
        allowed-tools: ${{ inputs.allowed-tools }}
        system-prompt: ${{ inputs.system-prompt }}
        haiku-model: ${{ inputs.haiku-model }}
        sonnet-model: ${{ inputs.sonnet-model }}
        opus-model: ${{ inputs.opus-model }}
        model: ${{ steps.resolve-models.outputs.model }}
        subagent-model: ${{ steps.resolve-models.outputs.agent_model }}
        claude-debug: ${{ inputs.claude-debug }}
