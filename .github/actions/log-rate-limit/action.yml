name: 'Log GitHub API Rate Limit'
description: 'Record the remaining GitHub REST quota for a token as one greppable RATE_LIMIT log line so exhaustion can be attributed to a workflow/job. Never fails the job; GET /rate_limit does not consume quota.'

inputs:
  github-token:
    description: 'Token whose quota is reported (the token the job actually uses for API calls)'
    required: true
  label:
    description: 'Call-site label added to the log line (defaults to the job id)'
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Log GitHub API rate limit
      shell: bash
      continue-on-error: true
      env:
        RATE_LIMIT_TOKEN: ${{ inputs.github-token }}
        RATE_LIMIT_LABEL: ${{ inputs.label }}
      run: |
        set -uo pipefail

        api="${GITHUB_API_URL:-https://api.github.com}"
        headers_file="${RUNNER_TEMP:-/tmp}/rate-limit-headers.txt"
        body_file="${RUNNER_TEMP:-/tmp}/rate-limit-body.json"

        if ! curl -fsS --max-time 10 \
          -H "Authorization: Bearer ${RATE_LIMIT_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          -D "$headers_file" -o "$body_file" "${api}/rate_limit"; then
          echo "::warning::Unable to read the GitHub API rate limit (${RATE_LIMIT_LABEL:-$GITHUB_JOB})"
          exit 0
        fi

        header() {
          awk -F': *' -v key="$1" 'tolower($1) == key { gsub(/\r/, "", $2); print $2; exit }' "$headers_file"
        }

        limit="$(header x-ratelimit-limit)"
        remaining="$(header x-ratelimit-remaining)"
        reset="$(header x-ratelimit-reset)"
        reset_iso="$(date -u -d "@${reset}" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || echo "${reset}")"

        graphql=""
        if command -v jq >/dev/null 2>&1; then
          graphql="$(jq -r '.resources.graphql | "\(.remaining)/\(.limit)"' "$body_file" 2>/dev/null || true)"
        fi

        echo "RATE_LIMIT workflow=\"${GITHUB_WORKFLOW}\" job=${GITHUB_JOB} label=${RATE_LIMIT_LABEL:-${GITHUB_JOB}} run=${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT} event=${GITHUB_EVENT_NAME} core_remaining=${remaining}/${limit} core_reset=${reset_iso} graphql=${graphql:-n/a}"
