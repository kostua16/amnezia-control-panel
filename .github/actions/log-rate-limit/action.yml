name: 'Log GitHub API Rate Limit'
description: 'Log the remaining GitHub REST quota of a token as one greppable RATE_LIMIT line (now, and optionally again when the job ends) so exhaustion can be attributed to a workflow/job. Never fails the job; GET /rate_limit does not consume quota.'

inputs:
  github-token:
    description: 'Token whose quota is reported (the token the job actually uses for API calls)'
    required: true
  label:
    description: 'Call-site label added to the log line (defaults to the job id)'
    default: ''
  report-at-job-end:
    description: 'When true, also log the quota in the post step at the end of the job (even if the job failed or was cancelled)'
    default: 'false'
  rest-counter:
    description: 'Count GitHub API requests from opted-in Node steps and gh on PATH'
    default: 'false'
  defer-gh-counter:
    description: 'Let setup-environment install the CLI observer after gh is configured'
    default: 'false'

outputs:
  core-remaining:
    description: 'Remaining core (REST) quota of the token at the time of the reading; empty when it could not be read'
  rest-counter-preload:
    description: 'Path to the job-local preload, or empty when disabled'
  rest-counter-enabled:
    description: 'True when requested and job-local counter storage is available'

runs:
  using: node24
  main: main.cjs
  post: post.cjs
  post-if: always()
