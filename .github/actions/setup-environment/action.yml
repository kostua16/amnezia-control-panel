name: "Setup Environment"
description: "Setup Node.js, optionally install deps and GSD"

inputs:
  node-version:
    description: "Node.js version"
    default: "22.x"
  install-deps:
    description: "Run npm ci with cache"
    default: "false"
  generate-prisma:
    description: "Run npx prisma generate"
    default: "false"
  install-gsd:
    description: "Install GSD framework with cache"
    default: "false"
  install-rtk:
    description: "Install RTK (Rust Token Killer) with cache and init hooks"
    default: "false"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.install-deps == 'true' && 'npm' || '' }}
        package-manager-cache: false

    - if: inputs.install-deps == 'true'
      id: npm-deps-cache
      uses: actions/cache@v5
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-node${{ inputs.node-version }}-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          node-modules-${{ runner.os }}-node${{ inputs.node-version }}-

    - if: inputs.install-deps == 'true' && steps.npm-deps-cache.outputs.cache-hit != 'true'
      run: npm ci
      shell: bash

    - if: inputs.generate-prisma == 'true'
      run: npx prisma generate
      shell: bash

    - if: inputs.install-gsd == 'true'
      id: gsd-cache
      uses: actions/cache@v5
      with:
        path: |
          .claude/skills/gsd-*
          .claude/commands/gsd/*
          .claude/get-shit-done/*
          .claude/hooks/*
        key: gsd-v3-${{ hashFiles('.claude/package.json') }}
        restore-keys: gsd-v3-

    - if: inputs.install-gsd == 'true' && steps.gsd-cache.outputs.cache-hit != 'true'
      run: npx get-shit-done-cc@latest --claude --local
      shell: bash

    - if: inputs.install-rtk == 'true'
      id: rtk-cache
      uses: actions/cache@v5
      with:
        path: ~/.local/bin/rtk
        key: rtk-${{ runner.os }}-latest

    - if: inputs.install-rtk == 'true' && steps.rtk-cache.outputs.cache-hit != 'true'
      run: curl -fsSL https://raw.githubusercontent.com/rtk-ai/rtk/refs/heads/master/install.sh | sh
      shell: bash

    - if: inputs.install-rtk == 'true'
      run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      shell: bash

    - if: inputs.install-rtk == 'true'
      run: mkdir -p "$HOME/.claude" && rtk init -g --auto-patch
      shell: bash
