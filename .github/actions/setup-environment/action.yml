name: 'Setup Environment'
description: 'Setup Node.js, GitHub CLI, Bun, optionally install deps and GSD'

inputs:
  github-token:
    description: 'GitHub token for gh authentication'
    required: true
  node-version:
    description: 'Node.js version'
    default: '24.x'
  gh-version:
    description: 'GitHub CLI version'
    default: '2.93.0'
  bun-version:
    description: 'Bun version'
    default: '1.3.14'
  setup-node:
    description: 'Install or restore Node.js with actions/setup-node'
    default: 'true'
  setup-bun:
    description: 'Install or restore Bun with oven-sh/setup-bun'
    default: 'true'
  install-deps:
    description: 'Run npm ci with cache'
    default: 'false'
  generate-prisma:
    description: 'Run npx prisma generate'
    default: 'false'
  cache-nextjs:
    description: 'Restore and save the Next.js build cache'
    default: 'false'
  install-gsd:
    description: 'Install or verify GSD (@opengsd/gsd-core) in .claude'
    default: 'false'
  install-rtk:
    description: 'Install RTK (Rust Token Killer) binary with cache; project hooks are committed'
    default: 'false'
  require-gh-auth:
    description: 'Fail the action when setup-gh authentication or verification fails'
    default: 'true'
  gsd-version:
    description: 'Pinned @opengsd/gsd-core version used when project-local GSD assets are missing'
    default: '1.2.0'
  gsd-global:
    description: 'Install GSD (@opengsd/gsd-core) globally'
    default: 'false'
  rtk-version:
    description: 'Pinned RTK version used for workflow bootstrap'
    default: '0.35.0'
  # IMPORTANT: rtk-install-sha256 must match the install script at the pinned rtk-version.
  # Bump both together — changing version without updating the SHA will break install verification.
  rtk-install-sha256:
    description: 'SHA-256 for the pinned RTK install script'
    default: '9989e60e33a353e9e6802fab1fd410b96d1dd228b34e52402c32f3c8c2dd8c66'
  install-uv:
    description: 'Install or verify uv for Python tool/plugin runtime support (e.g. serena MCP)'
    default: 'false'
  uv-version:
    description: 'Pinned uv version used when plugin flows require Python runtime'
    default: '0.11.21'
  install-actionlint:
    description: 'Install a pinned, checksum-verified actionlint for workflows whose steps or agents lint workflow YAML (not preinstalled on ubuntu-latest)'
    default: 'false'
  actionlint-version:
    description: 'Pinned actionlint version installed when install-actionlint is true'
    default: '1.7.12'
  # IMPORTANT: actionlint-sha256 must match the linux_amd64 tarball at the pinned
  # actionlint-version (see the release's actionlint_<version>_checksums.txt).
  # Bump both together — changing version without updating the SHA will break install verification.
  actionlint-sha256:
    description: 'SHA-256 for the pinned actionlint linux_amd64 tarball'
    default: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'

runs:
  using: 'composite'
  steps:
    # Quota snapshot before anything calls GitHub (so a RATE_LIMIT line exists even when
    # setup-gh token validation later fails with "API rate limit exceeded") and again from the
    # action's post step when the job ends, whatever its outcome. Composite actions cannot define
    # post steps themselves; the nested node action's post step is what runs at job end.
    - uses: ./.github/actions/log-rate-limit
      with:
        github-token: ${{ inputs.github-token }}
        label: setup-environment
        report-at-job-end: 'true'

    - if: inputs.setup-node == 'true'
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: ${{ inputs.node-version }}
        # node_modules is cached directly below (keyed on package-lock.json), so a
        # second npm download cache would only duplicate the repo's 10 GB cache quota.
        package-manager-cache: false

    - if: inputs.setup-bun == 'true'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: ${{ inputs.bun-version }}

    - if: inputs.install-uv == 'true'
      # astral-sh/setup-uv v6 tag pinned to commit SHA (Node.js 24 runtime; v4 triggers
      # the June-16-2026 Node.js 20 deprecation and the SHA-pin governance check)
      uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
      with:
        version: ${{ inputs.uv-version }}

    - name: Debug PATH before setup-gh
      if: runner.debug == '1'
      shell: bash
      run: |
        set -euo pipefail
        echo "PATH(before setup-gh)=$PATH"
        command -v gh >/dev/null 2>&1 && echo "gh(before setup-gh)=$(command -v gh)" || echo "gh(before setup-gh)=<not found>"

    # Runners occasionally hit transient i/o timeouts reaching
    # api.github.com while setup-gh validates the token (e.g. "dial tcp
    # ...:443: i/o timeout"), killing the whole job. Make the first attempt
    # non-fatal so one retry can absorb the blip before require-gh-auth decides.
    - id: setup_gh
      uses: kostua16/setup-gh@55cc7662a66e327280ca51930c27d09e4f7113db
      continue-on-error: true
      with:
        gh-version: ${{ inputs.gh-version }}
        cli-token: ${{ inputs.github-token }}
        token: ${{ inputs.github-token }}
        switch-account: 'true'
        skip-matching-version: 'false'

    # Wait before retrying so multi-second transient outages (TCP i/o timeouts,
    # DNS, resets) can clear instead of immediately re-dialing. The gate is
    # intentionally broad (any setup_gh failure): we cannot cheaply tell a
    # transient blip from a permanent one such as a bad token, and matching on
    # error strings would drop retry coverage for transient shapes we have not
    # seen yet. A permanent failure pays one ~10s sleep before the job aborts
    # anyway (require-gh-auth), which is acceptable.
    - name: Backoff before gh retry
      if: steps.setup_gh.outcome == 'failure'
      shell: bash
      run: sleep 10

    - id: setup_gh_retry
      name: Retry setup-gh (transient network)
      if: steps.setup_gh.outcome == 'failure'
      uses: kostua16/setup-gh@55cc7662a66e327280ca51930c27d09e4f7113db
      continue-on-error: ${{ inputs.require-gh-auth != 'true' }}
      with:
        # Composite actions cannot share a step-input block, so these inputs are
        # duplicated from setup_gh above — keep the two in sync when editing.
        gh-version: ${{ inputs.gh-version }}
        cli-token: ${{ inputs.github-token }}
        token: ${{ inputs.github-token }}
        switch-account: 'true'
        skip-matching-version: 'false'

    - name: Debug PATH after setup-gh
      if: runner.debug == '1'
      shell: bash
      run: |
        set -euo pipefail
        echo "PATH(after setup-gh)=$PATH"
        command -v gh >/dev/null 2>&1 && echo "gh(after setup-gh)=$(command -v gh)" || echo "gh(after setup-gh)=<not found>"

    - name: Verify gh authenticated
      if: inputs.require-gh-auth == 'true'
      shell: bash
      run: |
        set -euo pipefail

        if ! command -v gh >/dev/null 2>&1; then
          echo "gh is not on PATH after setup-gh. Aborting." >&2
          exit 1
        fi

        gh --version

        host="${GITHUB_SERVER_URL#https://}"
        if [[ "${{ steps.setup_gh.outputs.auth }}" != "true" && "${{ steps.setup_gh_retry.outputs.auth }}" != "true" ]]; then
          echo "gh authentication was not configured for ${host}. Aborting." >&2
          exit 1
        fi

        # `gh api user` fails for GitHub App / integration tokens used by
        # several workflows, while `gh auth status` succeeds but includes token
        # metadata that we do not want in logs.
        # tolerate non-zero exit — auth was already verified by setup-gh above
        auth_status="$(gh auth status -h "$host" 2>&1)" || true
        printf '%s\n' "$auth_status" | sed \
          -e '/^[[:space:]]*Token:/d' \
          -e '/^[[:space:]]*Token scopes:/d' \
          -e '/^[[:space:]]*-[[:space:]]*Token:/d' \
          -e '/^[[:space:]]*-[[:space:]]*Token scopes:/d'

    - if: inputs.install-deps == 'true'
      id: npm-deps-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-node${{ inputs.node-version }}-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          node-modules-${{ runner.os }}-node${{ inputs.node-version }}-

    - if: inputs.install-deps == 'true' && steps.npm-deps-cache.outputs.cache-hit != 'true'
      run: npm ci
      shell: bash

    - if: inputs.generate-prisma == 'true'
      run: npx prisma generate
      shell: bash

    - if: inputs.cache-nextjs == 'true'
      name: Cache Next.js
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ github.workspace }}/.next/cache
        key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
        restore-keys: |
          ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

    - if: inputs.install-gsd == 'true'
      run: |
        if [ -f .claude/commands/gsd/quick.md ] && [ -f .claude/get-shit-done/bin/gsd-tools.cjs ]; then
          echo "Using project-local GSD install from committed .claude assets"
        else
          if [ "${{ inputs.gsd-global }}" = 'true' ]; then
            npx @opengsd/gsd-core@${{ inputs.gsd-version }} --claude --global
          else
            npx @opengsd/gsd-core@${{ inputs.gsd-version }} --claude --local
          fi
        fi
      shell: bash

    - if: inputs.install-rtk == 'true'
      id: rtk-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.local/bin
        key: rtk-${{ runner.os }}-${{ runner.arch }}-${{ inputs.rtk-version }}-${{ inputs.rtk-install-sha256 }}

    - if: inputs.install-rtk == 'true'
      run: |
        verify_sha256() {
          if command -v sha256sum >/dev/null 2>&1; then
            printf '%s  %s\n' "${{ inputs.rtk-install-sha256 }}" /tmp/rtk-install.sh | sha256sum -c -
            return
          fi

          printf '%s  %s\n' "${{ inputs.rtk-install-sha256 }}" /tmp/rtk-install.sh | shasum -a 256 -c -
        }

        mkdir -p "$HOME/.local/bin"

        if [ -f "$HOME/.local/bin/rtk" ]; then
          chmod +x "$HOME/.local/bin/rtk"
        fi

        if [ ! -x "$HOME/.local/bin/rtk" ]; then
          curl -fsSL -o /tmp/rtk-install.sh \
            "https://raw.githubusercontent.com/rtk-ai/rtk/refs/tags/v${{ inputs.rtk-version }}/install.sh"
          verify_sha256
          sh /tmp/rtk-install.sh
        fi

        "$HOME/.local/bin/rtk" --version
      shell: bash

    - if: inputs.install-rtk == 'true'
      run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      shell: bash

    - if: inputs.install-rtk == 'true'
      run: |
        # RTK configuration is committed in project mode (CLAUDE.md +
        # .claude/settings.json). Do not patch the runner's global Claude
        # profile; claude-code-action restores project .claude from the trusted
        # base branch before Claude starts.
        "$HOME/.local/bin/rtk" init --show
      shell: bash

    - name: Install actionlint
      if: inputs.install-actionlint == 'true'
      shell: bash
      env:
        ACTIONLINT_VERSION: ${{ inputs.actionlint-version }}
        ACTIONLINT_SHA256: ${{ inputs.actionlint-sha256 }}
      run: |
        set -euo pipefail

        if [ "${RUNNER_OS}" != "Linux" ] || [ "${RUNNER_ARCH}" != "X64" ]; then
          echo "::error::install-actionlint supports Linux x64 runners only (got ${RUNNER_OS}/${RUNNER_ARCH})"
          exit 1
        fi

        tarball="$RUNNER_TEMP/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
        bin_dir="$RUNNER_TEMP/actionlint-bin"
        mkdir -p "$bin_dir"

        curl -fsSL --retry 3 -o "$tarball" \
          "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
        printf '%s  %s\n' "$ACTIONLINT_SHA256" "$tarball" | sha256sum -c -
        tar -xzf "$tarball" -C "$bin_dir" actionlint

        echo "$bin_dir" >> "$GITHUB_PATH"
        "$bin_dir/actionlint" -version
