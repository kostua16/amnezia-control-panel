name: 'Setup Environment'
description: 'Setup Node.js, GitHub CLI, Bun, optionally install deps and GSD'

inputs:
  github-token:
    description: 'GitHub token for gh authentication'
    required: true
  node-version:
    description: 'Node.js version'
    default: '22.x'
  gh-version:
    description: 'GitHub CLI version'
    default: '2.93.0'
  bun-version:
    description: 'Bun version'
    default: '1.3.14'
  install-deps:
    description: 'Run npm ci with cache'
    default: 'false'
  generate-prisma:
    description: 'Run npx prisma generate'
    default: 'false'
  install-gsd:
    description: 'Install or verify the checked-in ClaudeKit/GSD framework'
    default: 'false'
  install-rtk:
    description: 'Install RTK (Rust Token Killer) with cache and init hooks'
    default: 'false'
  gsd-version:
    description: 'Pinned get-shit-done-cc version used when the local .claude bundle is missing'
    default: '2.19.0'
  rtk-version:
    description: 'Pinned RTK version used for workflow bootstrap'
    default: '0.35.0'
  rtk-install-sha256:
    description: 'SHA-256 for the pinned RTK install script'
    default: '9989e60e33a353e9e6802fab1fd410b96d1dd228b34e52402c32f3c8c2dd8c66'

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.install-deps == 'true' && 'npm' || '' }}
        package-manager-cache: false

    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - id: setup_gh
      continue-on-error: true
      uses: actions4gh/setup-gh@44a12005484c53be5bf51bebe8c985b4be8ba8de # v1.0.2
      with:
        gh-version: ${{ inputs.gh-version }}
        cli-token: ${{ inputs.github-token }}
        token: ''

    - name: Ensure gh authenticated
      shell: bash
      env:
        GH_LOGIN_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail

        if ! command -v gh >/dev/null 2>&1; then
          echo "gh is not on PATH after setup-gh. Aborting." >&2
          exit 1
        fi

        gh --version

        host="${GITHUB_SERVER_URL#https://}"
        if ! gh auth status -h "$host" >/dev/null 2>&1; then
          printf '%s' "$GH_LOGIN_TOKEN" | gh auth login -h "$host" --with-token
        fi

    - if: inputs.install-deps == 'true'
      id: npm-deps-cache
      uses: actions/cache@v5
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-node${{ inputs.node-version }}-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          node-modules-${{ runner.os }}-node${{ inputs.node-version }}-

    - if: inputs.install-deps == 'true' && steps.npm-deps-cache.outputs.cache-hit != 'true'
      run: npm ci
      shell: bash

    - if: inputs.generate-prisma == 'true'
      run: npx prisma generate
      shell: bash

    - if: inputs.install-gsd == 'true'
      run: |
        if [ -f .claude/metadata.json ]; then
          echo "Using checked-in ClaudeKit bundle from .claude/metadata.json"
        else
          npx get-shit-done-cc@${{ inputs.gsd-version }} --claude --local
        fi
      shell: bash

    - if: inputs.install-rtk == 'true'
      id: rtk-cache
      uses: actions/cache@v5
      with:
        path: ~/.local/bin
        key: rtk-${{ runner.os }}-${{ runner.arch }}-${{ inputs.rtk-version }}-${{ inputs.rtk-install-sha256 }}

    - if: inputs.install-rtk == 'true'
      run: |
        verify_sha256() {
          if command -v sha256sum >/dev/null 2>&1; then
            printf '%s  %s\n' "${{ inputs.rtk-install-sha256 }}" /tmp/rtk-install.sh | sha256sum -c -
            return
          fi

          printf '%s  %s\n' "${{ inputs.rtk-install-sha256 }}" /tmp/rtk-install.sh | shasum -a 256 -c -
        }

        mkdir -p "$HOME/.local/bin"

        if [ -f "$HOME/.local/bin/rtk" ]; then
          chmod +x "$HOME/.local/bin/rtk"
        fi

        if [ ! -x "$HOME/.local/bin/rtk" ]; then
          curl -fsSL -o /tmp/rtk-install.sh \
            "https://raw.githubusercontent.com/rtk-ai/rtk/refs/tags/v${{ inputs.rtk-version }}/install.sh"
          verify_sha256
          sh /tmp/rtk-install.sh
        fi

        "$HOME/.local/bin/rtk" --version
      shell: bash

    - if: inputs.install-rtk == 'true'
      run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      shell: bash

    - if: inputs.install-rtk == 'true'
      run: mkdir -p "$HOME/.claude" && "$HOME/.local/bin/rtk" init -g --auto-patch
      shell: bash
