name: 'Setup Environment'
description: 'Setup Node.js, optionally install deps and GSD'

inputs:
  node-version:
    description: 'Node.js version'
    default: '22.x'
  install-deps:
    description: 'Run npm ci with cache'
    default: 'false'
  generate-prisma:
    description: 'Run npx prisma generate'
    default: 'false'
  install-gsd:
    description: 'Install or verify the checked-in ClaudeKit/GSD framework'
    default: 'false'
  install-rtk:
    description: 'Install RTK (Rust Token Killer) with cache and init hooks'
    default: 'false'
  gsd-version:
    description: 'Pinned get-shit-done-cc version used when the local .claude bundle is missing'
    default: '2.19.0'
  rtk-version:
    description: 'Pinned RTK version used for workflow bootstrap'
    default: '0.35.0'
  rtk-install-sha256:
    description: 'SHA-256 for the pinned RTK install script'
    default: '9989e60e33a353e9e6802fab1fd410b96d1dd228b34e52402c32f3c8c2dd8c66'

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.install-deps == 'true' && 'npm' || '' }}
        package-manager-cache: false

    - if: inputs.install-deps == 'true'
      id: npm-deps-cache
      uses: actions/cache@v5
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-node${{ inputs.node-version }}-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          node-modules-${{ runner.os }}-node${{ inputs.node-version }}-

    - if: inputs.install-deps == 'true' && steps.npm-deps-cache.outputs.cache-hit != 'true'
      run: npm ci
      shell: bash

    - if: inputs.generate-prisma == 'true'
      run: npx prisma generate
      shell: bash

    - if: inputs.install-gsd == 'true'
      run: |
        if [ -f .claude/metadata.json ]; then
          echo "Using checked-in ClaudeKit bundle from .claude/metadata.json"
        else
          npx get-shit-done-cc@${{ inputs.gsd-version }} --claude --local
        fi
      shell: bash

    - if: inputs.install-rtk == 'true'
      id: rtk-cache
      uses: actions/cache@v5
      with:
        path: ~/.local/bin/rtk
        key: rtk-${{ runner.os }}-${{ inputs.rtk-version }}-${{ inputs.rtk-install-sha256 }}

    - if: inputs.install-rtk == 'true' && steps.rtk-cache.outputs.cache-hit != 'true'
      run: |
        curl -fsSL -o /tmp/rtk-install.sh \
          "https://raw.githubusercontent.com/rtk-ai/rtk/refs/tags/v${{ inputs.rtk-version }}/install.sh"
        echo "${{ inputs.rtk-install-sha256 }}  /tmp/rtk-install.sh" | sha256sum -c -
        sh /tmp/rtk-install.sh
      shell: bash

    - if: inputs.install-rtk == 'true'
      run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      shell: bash

    - if: inputs.install-rtk == 'true'
      run: mkdir -p "$HOME/.claude" && rtk init -g --auto-patch
      shell: bash
