name: 'Setup Environment'
description: 'Setup Node.js, GitHub CLI, Bun, optionally install deps and GSD'

inputs:
  github-token:
    description: 'GitHub token for gh authentication'
    required: true
  node-version:
    description: 'Node.js version'
    default: '22.x'
  gh-version:
    description: 'GitHub CLI version'
    default: '2.93.0'
  bun-version:
    description: 'Bun version'
    default: '1.3.14'
  setup-node:
    description: 'Install or restore Node.js with actions/setup-node'
    default: 'true'
  setup-bun:
    description: 'Install or restore Bun with oven-sh/setup-bun'
    default: 'true'
  install-deps:
    description: 'Run npm ci with cache'
    default: 'false'
  minimum-disk-space-mb:
    description: 'Prune temp/docker/local-cache data when available disk drops below this threshold'
    default: '2048'
  local-cache-entries-to-keep:
    description: 'Maximum number of repo-local maxnowack/local-cache entries to keep when pruning'
    default: '8'
  generate-prisma:
    description: 'Run npx prisma generate'
    default: 'false'
  cache-nextjs:
    description: 'Restore and save the Next.js build cache'
    default: 'false'
  install-gsd:
    description: 'Install or verify GSD (@opengsd/gsd-core) in .claude'
    default: 'false'
  install-rtk:
    description: 'Install RTK (Rust Token Killer) binary with cache; project hooks are committed'
    default: 'false'
  require-gh-auth:
    description: 'Fail the action when setup-gh authentication or verification fails'
    default: 'true'
  gsd-version:
    description: 'Pinned @opengsd/gsd-core version used when project-local GSD assets are missing'
    default: '1.2.0'
  gsd-global:
    description: 'Install GSD (@opengsd/gsd-core) globally'
    default: 'false'
  rtk-version:
    description: 'Pinned RTK version used for workflow bootstrap'
    default: '0.35.0'
  # IMPORTANT: rtk-install-sha256 must match the install script at the pinned rtk-version.
  # Bump both together — changing version without updating the SHA will break install verification.
  rtk-install-sha256:
    description: 'SHA-256 for the pinned RTK install script'
    default: '9989e60e33a353e9e6802fab1fd410b96d1dd228b34e52402c32f3c8c2dd8c66'

runs:
  using: 'composite'
  steps:
    - name: Ensure minimum disk space
      shell: bash
      run: |
        set -euo pipefail
        REQUIRED_MB="${{ inputs.minimum-disk-space-mb }}"
        LOCAL_CACHE_KEEP="${{ inputs.local-cache-entries-to-keep }}"

        get_available_mb() {
          local available_kb
          available_kb=$(df --output=avail / | tail -1 | tr -d ' ')
          echo $((available_kb / 1024))
        }

        cleanup_general() {
          npm cache clean --force 2>/dev/null || true
          rm -rf "$RUNNER_TEMP"/* 2>/dev/null || true
          docker system prune -af --volumes 2>/dev/null || true
        }

        prune_local_cache() {
          local tool_cache_root repo_cache_root remaining_cache_count last_remaining_index available_mb
          tool_cache_root="${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}"
          repo_cache_root="${tool_cache_root}/${GITHUB_REPOSITORY}"

          if [[ ! "$LOCAL_CACHE_KEEP" =~ ^[0-9]+$ ]] || [ "$LOCAL_CACHE_KEEP" -lt 1 ]; then
            echo "Skipping local-cache pruning because local-cache-entries-to-keep is invalid: ${LOCAL_CACHE_KEEP}"
            return
          fi

          if [ ! -d "$repo_cache_root" ]; then
            echo "No repo-local cache directory found at ${repo_cache_root}"
            return
          fi

          mapfile -t cache_dirs < <(find "$repo_cache_root" -mindepth 1 -maxdepth 1 -type d -exec ls -dt {} + 2>/dev/null || true)
          remaining_cache_count=${#cache_dirs[@]}
          if [ "$remaining_cache_count" -eq 0 ]; then
            echo "No repo-local cache entries found at ${repo_cache_root}"
            return
          fi

          if [ "$remaining_cache_count" -le "$LOCAL_CACHE_KEEP" ]; then
            echo "Repo-local cache entries within limit (${remaining_cache_count} <= ${LOCAL_CACHE_KEEP})"
          else
            echo "Pruning repo-local cache entries in ${repo_cache_root} (keeping newest ${LOCAL_CACHE_KEEP})"
            for ((i = LOCAL_CACHE_KEEP; i < remaining_cache_count; i++)); do
              echo "Removing stale local-cache entry: ${cache_dirs[$i]}"
              rm -rf -- "${cache_dirs[$i]}" || true
            done
            remaining_cache_count=$LOCAL_CACHE_KEEP
          fi

          available_mb=$(get_available_mb)
          if [ "$available_mb" -ge "$REQUIRED_MB" ]; then
            return
          fi

          last_remaining_index=$((remaining_cache_count - 1))
          if [ "$last_remaining_index" -lt 0 ]; then
            echo "No repo-local cache entries remain for emergency pruning"
            return
          fi

          echo "Disk still below threshold after standard local-cache pruning (${available_mb} MB < ${REQUIRED_MB} MB). Removing oldest remaining repo-local cache entries."
          for ((i = last_remaining_index; i >= 0; i--)); do
            available_mb=$(get_available_mb)
            if [ "$available_mb" -ge "$REQUIRED_MB" ]; then
              break
            fi
            echo "Removing emergency local-cache entry: ${cache_dirs[$i]}"
            rm -rf -- "${cache_dirs[$i]}" || true
          done

          available_mb=$(get_available_mb)
          if [ "$available_mb" -lt "$REQUIRED_MB" ]; then
            echo "Disk space remains below threshold after emergency local-cache pruning: ${available_mb} MB < ${REQUIRED_MB} MB"
          fi
        }

        available_mb=$(get_available_mb)
        echo "Available disk space: ${available_mb} MB"

        if [ "$available_mb" -lt "$REQUIRED_MB" ]; then
          echo "Low disk space (${available_mb} MB < ${REQUIRED_MB} MB). Cleaning..."
          cleanup_general
          prune_local_cache

          available_mb=$(get_available_mb)
          echo "Available disk space after cleanup: ${available_mb} MB"
        fi

    - if: inputs.setup-node == 'true'
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: ${{ inputs.node-version }}
        # Disabled because GitHub/Azure npm cache restores from self-hosted
        # runners were slow and unreliable (4 GB restores in runs 26592710713
        # and 26592710847). Keep setup-node caching off until FalconDev cache
        # server is deployed.
        # cache: ${{ inputs.install-deps == 'true' && 'npm' || '' }}
        package-manager-cache: false

    - if: inputs.setup-bun == 'true'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Debug PATH before setup-gh
      if: runner.debug == '1'
      shell: bash
      run: |
        set -euo pipefail
        echo "PATH(before setup-gh)=$PATH"
        command -v gh >/dev/null 2>&1 && echo "gh(before setup-gh)=$(command -v gh)" || echo "gh(before setup-gh)=<not found>"

    - id: setup_gh
      uses: kostua16/setup-gh@bd07f8bef16d6973adb48d8d3f22f99125a95058
      continue-on-error: ${{ inputs.require-gh-auth != 'true' }}
      with:
        gh-version: ${{ inputs.gh-version }}
        cli-token: ${{ inputs.github-token }}
        token: ${{ inputs.github-token }}
        switch-account: 'true'
        skip-matching-version: 'false'

    - name: Debug PATH after setup-gh
      if: runner.debug == '1'
      shell: bash
      run: |
        set -euo pipefail
        echo "PATH(after setup-gh)=$PATH"
        command -v gh >/dev/null 2>&1 && echo "gh(after setup-gh)=$(command -v gh)" || echo "gh(after setup-gh)=<not found>"

    - name: Verify gh authenticated
      if: inputs.require-gh-auth == 'true'
      shell: bash
      run: |
        set -euo pipefail

        if ! command -v gh >/dev/null 2>&1; then
          echo "gh is not on PATH after setup-gh. Aborting." >&2
          exit 1
        fi

        gh --version

        host="${GITHUB_SERVER_URL#https://}"
        if [[ "${{ steps.setup_gh.outputs.auth }}" != "true" ]]; then
          echo "gh authentication was not configured for ${host}. Aborting." >&2
          exit 1
        fi

        # `gh api user` fails for GitHub App / integration tokens used by
        # several workflows, while `gh auth status` succeeds but includes token
        # metadata that we do not want in logs.
        # tolerate non-zero exit — auth was already verified by setup-gh above
        auth_status="$(gh auth status -h "$host" 2>&1)" || true
        printf '%s\n' "$auth_status" | sed \
          -e '/^[[:space:]]*Token:/d' \
          -e '/^[[:space:]]*Token scopes:/d' \
          -e '/^[[:space:]]*-[[:space:]]*Token:/d' \
          -e '/^[[:space:]]*-[[:space:]]*Token scopes:/d'

    # Previous GitHub-hosted cache retained for audit only. It restored from
    # remote GitHub/Azure storage too slowly on self-hosted runners.
    # - if: inputs.install-deps == 'true'
    #   id: npm-deps-cache
    #   uses: actions/cache@v5
    #   with:
    #     path: node_modules
    #     key: node-modules-${{ runner.os }}-node${{ inputs.node-version }}-${{ hashFiles('package-lock.json') }}
    #     restore-keys: |
    #       node-modules-${{ runner.os }}-node${{ inputs.node-version }}-
    - if: inputs.install-deps == 'true'
      id: npm-deps-cache
      uses: maxnowack/local-cache@cca2f9dd0a74be90ac2adbe639270f564c8c3975
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-node${{ inputs.node-version }}-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          node-modules-${{ runner.os }}-node${{ inputs.node-version }}-

    - if: inputs.install-deps == 'true' && steps.npm-deps-cache.outputs.cache-hit != 'true'
      run: npm ci
      shell: bash

    - if: inputs.generate-prisma == 'true'
      run: npx prisma generate
      shell: bash

    # Previous GitHub-hosted cache retained for audit only. It restored from
    # remote GitHub/Azure storage too slowly on self-hosted runners.
    # - name: Cache Next.js
    #   uses: actions/cache@v5
    #   with:
    #     path: ${{ github.workspace }}/.next/cache
    #     key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
    #     restore-keys: |
    #       ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
    - if: inputs.cache-nextjs == 'true'
      name: Cache Next.js
      uses: maxnowack/local-cache@cca2f9dd0a74be90ac2adbe639270f564c8c3975
      with:
        path: ${{ github.workspace }}/.next/cache
        key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
        restore-keys: |
          ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

    - if: inputs.install-gsd == 'true'
      run: |
        if [ -f .claude/commands/gsd/quick.md ] && [ -f .claude/get-shit-done/bin/gsd-tools.cjs ]; then
          echo "Using project-local GSD install from committed .claude assets"
        else
          if [ "${{ inputs.gsd-global }}" = 'true' ]; then
            npx @opengsd/gsd-core@${{ inputs.gsd-version }} --claude --global
          else
            npx @opengsd/gsd-core@${{ inputs.gsd-version }} --claude --local
          fi
        fi
      shell: bash

    # Previous GitHub-hosted cache retained for audit only. It restored from
    # remote GitHub/Azure storage too slowly on self-hosted runners.
    # - if: inputs.install-rtk == 'true'
    #   id: rtk-cache
    #   uses: actions/cache@v5
    #   with:
    #     path: ~/.local/bin
    #     key: rtk-${{ runner.os }}-${{ runner.arch }}-${{ inputs.rtk-version }}-${{ inputs.rtk-install-sha256 }}
    - if: inputs.install-rtk == 'true'
      id: rtk-cache
      uses: maxnowack/local-cache@cca2f9dd0a74be90ac2adbe639270f564c8c3975
      with:
        path: ~/.local/bin
        key: rtk-${{ runner.os }}-${{ runner.arch }}-${{ inputs.rtk-version }}-${{ inputs.rtk-install-sha256 }}

    - if: inputs.install-rtk == 'true'
      run: |
        verify_sha256() {
          if command -v sha256sum >/dev/null 2>&1; then
            printf '%s  %s\n' "${{ inputs.rtk-install-sha256 }}" /tmp/rtk-install.sh | sha256sum -c -
            return
          fi

          printf '%s  %s\n' "${{ inputs.rtk-install-sha256 }}" /tmp/rtk-install.sh | shasum -a 256 -c -
        }

        mkdir -p "$HOME/.local/bin"

        if [ -f "$HOME/.local/bin/rtk" ]; then
          chmod +x "$HOME/.local/bin/rtk"
        fi

        if [ ! -x "$HOME/.local/bin/rtk" ]; then
          curl -fsSL -o /tmp/rtk-install.sh \
            "https://raw.githubusercontent.com/rtk-ai/rtk/refs/tags/v${{ inputs.rtk-version }}/install.sh"
          verify_sha256
          sh /tmp/rtk-install.sh
        fi

        "$HOME/.local/bin/rtk" --version
      shell: bash

    - if: inputs.install-rtk == 'true'
      run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      shell: bash

    - if: inputs.install-rtk == 'true'
      run: |
        # RTK configuration is committed in project mode (CLAUDE.md +
        # .claude/settings.json). Do not patch the runner's global Claude
        # profile; claude-code-action restores project .claude from the trusted
        # base branch before Claude starts.
        "$HOME/.local/bin/rtk" init --show
      shell: bash
