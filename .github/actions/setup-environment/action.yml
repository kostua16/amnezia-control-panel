name: 'Setup Environment'
description: 'Setup Node.js, GitHub CLI, Bun, optionally install deps and GSD'

inputs:
  github-token:
    description: 'GitHub token for gh authentication'
    required: true
  node-version:
    description: 'Node.js version'
    default: '22.x'
  gh-version:
    description: 'GitHub CLI version'
    default: '2.93.0'
  bun-version:
    description: 'Bun version'
    default: '1.3.14'
  install-deps:
    description: 'Run npm ci with cache'
    default: 'false'
  generate-prisma:
    description: 'Run npx prisma generate'
    default: 'false'
  cache-nextjs:
    description: 'Restore and save the Next.js build cache'
    default: 'false'
  install-gsd:
    description: 'Install or verify GSD (@opengsd/get-shit-done-redux) in .claude'
    default: 'false'
  install-rtk:
    description: 'Install RTK (Rust Token Killer) with cache and init hooks'
    default: 'false'
  gsd-version:
    description: 'Pinned @opengsd/get-shit-done-redux version used when .claude/gsd-install-state.json is missing'
    default: '1.1.0'
  rtk-version:
    description: 'Pinned RTK version used for workflow bootstrap'
    default: '0.35.0'
  # IMPORTANT: rtk-install-sha256 must match the install script at the pinned rtk-version.
  # Bump both together — changing version without updating the SHA will break install verification.
  rtk-install-sha256:
    description: 'SHA-256 for the pinned RTK install script'
    default: '9989e60e33a353e9e6802fab1fd410b96d1dd228b34e52402c32f3c8c2dd8c66'

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}
        # Disabled because GitHub/Azure npm cache restores from self-hosted
        # runners were slow and unreliable (4 GB restores in runs 26592710713
        # and 26592710847). Keep setup-node caching off until FalconDev cache
        # server is deployed.
        # cache: ${{ inputs.install-deps == 'true' && 'npm' || '' }}
        package-manager-cache: false

    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Debug PATH before setup-gh
      if: runner.debug == '1'
      shell: bash
      run: |
        set -euo pipefail
        echo "PATH(before setup-gh)=$PATH"
        command -v gh >/dev/null 2>&1 && echo "gh(before setup-gh)=$(command -v gh)" || echo "gh(before setup-gh)=<not found>"

    - id: setup_gh
      uses: kostua16/setup-gh@v1
      with:
        gh-version: ${{ inputs.gh-version }}
        cli-token: ${{ inputs.github-token }}
        token: ${{ inputs.github-token }}

    - name: Debug PATH after setup-gh
      if: runner.debug == '1'
      shell: bash
      run: |
        set -euo pipefail
        echo "PATH(after setup-gh)=$PATH"
        command -v gh >/dev/null 2>&1 && echo "gh(after setup-gh)=$(command -v gh)" || echo "gh(after setup-gh)=<not found>"

    - name: Ensure gh authenticated
      shell: bash
      env:
        GH_LOGIN_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail

        if ! command -v gh >/dev/null 2>&1; then
          echo "gh is not on PATH after setup-gh. Aborting." >&2
          exit 1
        fi

        gh --version

        host="${GITHUB_SERVER_URL#https://}"
        if ! gh auth status -h "$host" >/dev/null 2>&1; then
          printf '%s' "$GH_LOGIN_TOKEN" | gh auth login -h "$host" --with-token
        fi

    # Previous GitHub-hosted cache retained for audit only. It restored from
    # remote GitHub/Azure storage too slowly on self-hosted runners.
    # - if: inputs.install-deps == 'true'
    #   id: npm-deps-cache
    #   uses: actions/cache@v5
    #   with:
    #     path: node_modules
    #     key: node-modules-${{ runner.os }}-node${{ inputs.node-version }}-${{ hashFiles('package-lock.json') }}
    #     restore-keys: |
    #       node-modules-${{ runner.os }}-node${{ inputs.node-version }}-
    - if: inputs.install-deps == 'true'
      id: npm-deps-cache
      uses: maxnowack/local-cache@v3
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-node${{ inputs.node-version }}-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          node-modules-${{ runner.os }}-node${{ inputs.node-version }}-

    - if: inputs.install-deps == 'true' && steps.npm-deps-cache.outputs.cache-hit != 'true'
      run: npm ci
      shell: bash

    - if: inputs.generate-prisma == 'true'
      run: npx prisma generate
      shell: bash

    # Previous GitHub-hosted cache retained for audit only. It restored from
    # remote GitHub/Azure storage too slowly on self-hosted runners.
    # - name: Cache Next.js
    #   uses: actions/cache@v5
    #   with:
    #     path: ${{ github.workspace }}/.next/cache
    #     key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
    #     restore-keys: |
    #       ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
    - if: inputs.cache-nextjs == 'true'
      name: Cache Next.js
      uses: maxnowack/local-cache@v3
      with:
        path: ${{ github.workspace }}/.next/cache
        key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
        restore-keys: |
          ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

    - if: inputs.install-gsd == 'true'
      run: |
        if [ -f .claude/gsd-install-state.json ]; then
          echo "Using existing GSD install (.claude/gsd-install-state.json)"
        else
          npx @opengsd/get-shit-done-redux@${{ inputs.gsd-version }} --claude --local
        fi
      shell: bash

    # Previous GitHub-hosted cache retained for audit only. It restored from
    # remote GitHub/Azure storage too slowly on self-hosted runners.
    # - if: inputs.install-rtk == 'true'
    #   id: rtk-cache
    #   uses: actions/cache@v5
    #   with:
    #     path: ~/.local/bin
    #     key: rtk-${{ runner.os }}-${{ runner.arch }}-${{ inputs.rtk-version }}-${{ inputs.rtk-install-sha256 }}
    - if: inputs.install-rtk == 'true'
      id: rtk-cache
      uses: maxnowack/local-cache@v3
      with:
        path: ~/.local/bin
        key: rtk-${{ runner.os }}-${{ runner.arch }}-${{ inputs.rtk-version }}-${{ inputs.rtk-install-sha256 }}

    - if: inputs.install-rtk == 'true'
      run: |
        verify_sha256() {
          if command -v sha256sum >/dev/null 2>&1; then
            printf '%s  %s\n' "${{ inputs.rtk-install-sha256 }}" /tmp/rtk-install.sh | sha256sum -c -
            return
          fi

          printf '%s  %s\n' "${{ inputs.rtk-install-sha256 }}" /tmp/rtk-install.sh | shasum -a 256 -c -
        }

        mkdir -p "$HOME/.local/bin"

        if [ -f "$HOME/.local/bin/rtk" ]; then
          chmod +x "$HOME/.local/bin/rtk"
        fi

        if [ ! -x "$HOME/.local/bin/rtk" ]; then
          curl -fsSL -o /tmp/rtk-install.sh \
            "https://raw.githubusercontent.com/rtk-ai/rtk/refs/tags/v${{ inputs.rtk-version }}/install.sh"
          verify_sha256
          sh /tmp/rtk-install.sh
        fi

        "$HOME/.local/bin/rtk" --version
      shell: bash

    - if: inputs.install-rtk == 'true'
      run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      shell: bash

    - if: inputs.install-rtk == 'true'
      run: mkdir -p "$HOME/.claude" && "$HOME/.local/bin/rtk" init -g --auto-patch
      shell: bash
