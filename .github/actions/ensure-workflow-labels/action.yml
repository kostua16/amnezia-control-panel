name: 'Ensure Workflow Labels'
description: 'Ensure policy-backed GitHub labels exist'

inputs:
  github-token:
    description: 'GitHub token for gh label operations'
    required: true
  policy-file:
    description: 'Path to the workflow policy file'
    required: false
    default: '.github/workflows/policy.json'
  names:
    description: 'Optional comma-separated labels to ensure'
    required: false
    default: ''
  mode:
    description: >-
      diff (default) reads the existing labels once and creates or updates only
      the labels that differ from the policy; legacy runs `gh label create
      --force` for every label (rollback switch).
    required: false
    default: 'diff'
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        POLICY_FILE: ${{ inputs.policy-file }}
        LABEL_NAMES: ${{ inputs.names }}
        LABEL_MODE: ${{ inputs.mode }}
      run: |
        set -euo pipefail

        args=(node .github/workflows/scripts/ensure-workflow-labels.cjs --policy-file "$POLICY_FILE" --mode "$LABEL_MODE")
        if [[ -n "$LABEL_NAMES" ]]; then
          args+=(--names "$LABEL_NAMES")
        fi

        "${args[@]}"
