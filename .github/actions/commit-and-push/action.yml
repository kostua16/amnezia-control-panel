name: 'Commit and Push'
description: 'git add + commit + push with retry (3 attempts, 5s backoff)'

inputs:
  branch-name:
    description: 'Target branch to push to'
    required: true
  commit-message:
    description: 'Commit message'
    default: 'fix(ci): auto-fix CI failures'

outputs:
  pushed:
    description: "'true' if a commit was created or the branch was already ahead and pushed"
    value: ${{ steps.push.outputs.pushed }}

runs:
  using: composite
  steps:
    - name: Commit and push with retry
      id: push
      shell: bash
      env:
        BRANCH: ${{ inputs.branch-name }}
        MSG: ${{ inputs.commit-message }}
      run: |
        git add -A
        commit_created=false
        if ! git diff --cached --quiet; then
          git commit -m "$MSG"
          commit_created=true
        else
          echo "No staged changes to commit"
        fi

        git fetch origin "$BRANCH" --depth=1 || true
        if git rev-parse --verify "origin/$BRANCH" >/dev/null 2>&1; then
          ahead_count=$(git rev-list --count "origin/$BRANCH..HEAD")
        elif git rev-parse --verify origin/HEAD >/dev/null 2>&1; then
          ahead_count=$(git rev-list --count "origin/HEAD..HEAD")
        elif git rev-parse --verify origin/main >/dev/null 2>&1; then
          ahead_count=$(git rev-list --count "origin/main..HEAD")
        elif [ "$commit_created" = true ]; then
          ahead_count=$(git rev-list --count HEAD)
        else
          ahead_count=0
        fi

        if [ "$ahead_count" -eq 0 ]; then
          echo "Branch is not ahead of origin/$BRANCH — skipping push"
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        PUSHED=false
        for i in 1 2 3; do
          if git push origin "HEAD:$BRANCH"; then
            echo "Push succeeded on attempt $i"
            PUSHED=true
            break
          else
            echo "Push failed on attempt $i, retrying in 5s..."
            sleep 5
          fi
        done
        if [ "$PUSHED" = false ]; then
          echo "::error::Push failed after 3 attempts"
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          exit 1
        fi
        echo "pushed=true" >> "$GITHUB_OUTPUT"
