name: 'Commit and Push'
description: 'git add + commit + push with retry (3 attempts, 5s backoff)'

inputs:
  branch-name:
    description: 'Target branch to push to'
    required: true
  commit-message:
    description: 'Commit message'
    default: 'fix(ci): auto-fix CI failures'
  github-token:
    description: 'GitHub token used for the final push; pass GH_PAT for automation branches that must trigger downstream workflows'
    required: false
    default: ''

outputs:
  pushed:
    description: "'true' if a commit was created or the branch was already ahead and pushed"
    value: ${{ steps.push.outputs.pushed }}
  failure-reason:
    description: 'Stable reason for a failed push, such as workflow-permission or non-fast-forward'
    value: ${{ steps.push.outputs.failure_reason }}

runs:
  using: composite
  steps:
    - uses: kostua16/setup-git-credentials@737171e199777ddcc7239325bc693e15183be6a1
      if: ${{ inputs.github-token != '' }}
      with:
        token: ${{ inputs.github-token }}

    - name: Commit and push with retry
      id: push
      shell: bash
      env:
        BRANCH: ${{ inputs.branch-name }}
        MSG: ${{ inputs.commit-message }}
        GITHUB_TOKEN_VALUE: ${{ inputs.github-token }}
      run: |
        set -o pipefail

        classify_push_failure() {
          local log_file="$1"
          if grep -Eqi 'without .*`?workflows?`? (permission|scope)' "$log_file"; then
            printf '%s\n' workflow-permission
          elif grep -Eqi 'non-fast-forward|fetch first|stale info' "$log_file"; then
            printf '%s\n' non-fast-forward
          else
            printf '%s\n' push-failed
          fi
        }

        print_push_diagnostics() {
          local token_present=no
          local askpass_present=no
          local extraheader_keys

          if [ -n "$GITHUB_TOKEN_VALUE" ]; then
            token_present=yes
          fi
          if [ -n "${GIT_ASKPASS:-}" ]; then
            askpass_present=yes
          fi

          echo "::group::Sanitized push auth diagnostics"
          echo "github-token input present: $token_present"
          echo "GIT_ASKPASS configured: $askpass_present"
          echo "target branch: $BRANCH"
          echo "remote origin url: $(git remote get-url origin | sed -E 's#//[^/@]+@#//[redacted]@#')"

          extraheader_keys="$(git config --name-only --get-regexp '^http\..*\.extraheader$|^http\.extraheader$' 2>/dev/null || true)"
          if [ -n "$extraheader_keys" ]; then
            echo "visible git http extraheader keys:"
            printf '%s\n' "$extraheader_keys" | sed 's/^/- /'
          else
            echo "visible git http extraheader keys: none"
          fi
          echo "::endgroup::"
        }

        if [ -n "$GITHUB_TOKEN_VALUE" ]; then
          askpass_path="${RUNNER_TEMP:-/tmp}/commit-and-push-askpass.sh"
          printf '%s\n' '#!/usr/bin/env bash' \
            'case "${1:-}" in' \
            '  *Username*) printf "%s\n" x-access-token ;;' \
            '  *Password*) printf "%s\n" "${GITHUB_GIT_PASSWORD:-}" ;;' \
            '  *) printf "%s\n" "${GITHUB_GIT_PASSWORD:-}" ;;' \
            'esac' > "$askpass_path"
          chmod 0700 "$askpass_path"
          export GIT_ASKPASS="$askpass_path"
          export GIT_TERMINAL_PROMPT=0
          export GITHUB_GIT_PASSWORD="$GITHUB_TOKEN_VALUE"
        fi

        git add -A
        commit_created=false
        if ! git diff --cached --quiet; then
          git commit -m "$MSG"
          commit_created=true
        else
          echo "No staged changes to commit"
        fi

        git fetch origin "$BRANCH" --depth=1 || true
        if git rev-parse --verify "origin/$BRANCH" >/dev/null 2>&1; then
          ahead_count=$(git rev-list --count "origin/$BRANCH..HEAD")
        elif git rev-parse --verify origin/HEAD >/dev/null 2>&1; then
          ahead_count=$(git rev-list --count "origin/HEAD..HEAD")
        elif git rev-parse --verify origin/main >/dev/null 2>&1; then
          ahead_count=$(git rev-list --count "origin/main..HEAD")
        elif [ "$commit_created" = true ]; then
          ahead_count=$(git rev-list --count HEAD)
        else
          ahead_count=0
        fi

        if [ "$ahead_count" -eq 0 ]; then
          echo "Branch is not ahead of origin/$BRANCH — skipping push"
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        PUSHED=false
        failure_reason=push-failed
        for i in 1 2 3; do
          if [ -n "$GITHUB_TOKEN_VALUE" ]; then
            push_command=(
              git
              -c http.https://github.com/.extraheader=
              -c http.extraheader=
              -c credential.helper=
              push origin "HEAD:$BRANCH"
            )
          else
            push_command=(git push origin "HEAD:$BRANCH")
          fi
          push_log="${RUNNER_TEMP:-/tmp}/commit-and-push-${i}.log"
          if "${push_command[@]}" 2>&1 | tee "$push_log"; then
            echo "Push succeeded on attempt $i"
            PUSHED=true
            break
          else
            failure_reason="$(classify_push_failure "$push_log")"
            if [ "$failure_reason" = workflow-permission ]; then
              echo "::error::GitHub rejected the active push credential for workflow-file updates. Verify commit-and-push used the intended GH_PAT and that the token/App installation is current with workflow-file write access."
              break
            fi
            echo "Push failed on attempt $i, retrying in 5s..."
            sleep 5
          fi
        done
        if [ "$PUSHED" = false ]; then
          print_push_diagnostics
          echo "::error::Push failed after 3 attempts"
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          echo "failure_reason=$failure_reason" >> "$GITHUB_OUTPUT"
          exit 1
        fi
        echo "pushed=true" >> "$GITHUB_OUTPUT"
        echo "failure_reason=" >> "$GITHUB_OUTPUT"
