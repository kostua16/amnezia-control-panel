services:
  app:
    build: .
    container_name: amnezia-control-panel
    restart: unless-stopped
    ports:
      - "${PORT:-3333}:3333"
    environment:
      - NODE_ENV=production
      - PORT=3333
      - HOSTNAME=0.0.0.0
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required — generate one with: openssl rand -hex 32}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      - DATABASE_URL=file:/app/data/prisma/dev.db
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3333}
    volumes:
      # Persist the SQLite database across container restarts
      - db-data:/app/data/prisma
      # Persist GeoIP data (avoids re-download on each restart)
      - geoip-data:/app/data/geoip
      # Persist logs
      - log-data:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3333/"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  db-data:
    driver: local
  geoip-data:
    driver: local
  log-data:
    driver: local
